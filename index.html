{id:393,part:"H",level:"Senior",category:"Architecture",q:"Explain Selenium WebDriver architecture — how does it communicate with the browser?",a:`<h4>Selenium WebDriver Architecture</h4><pre><code>Test Script (Java) → WebDriver API → Browser Driver (ChromeDriver)\n                                        ↓\n                                   HTTP Commands (W3C Protocol)\n                                        ↓\n                                   Real Browser (Chrome)</code></pre><table><tr><th>Component</th><th>Role</th></tr><tr><td>WebDriver API</td><td>Language bindings (Java, Python, etc.)</td></tr><tr><td>JSON Wire / W3C Protocol</td><td>HTTP commands sent to driver</td></tr><tr><td>Browser Driver</td><td>Translates commands to browser actions</td></tr><tr><td>Real Browser</td><td>Executes actions, returns responses</td></tr></table><p><strong>Selenium 4:</strong> Uses W3C WebDriver Protocol (replaces JSON Wire Protocol).</p>`},
{id:394,part:"H",level:"Senior",category:"Architecture",q:"Selenium vs Playwright — when to choose which?",a:`<table><tr><th>Feature</th><th>Selenium</th><th>Playwright</th></tr><tr><td>Protocol</td><td>W3C WebDriver</td><td>CDP / custom</td></tr><tr><td>Auto-wait</td><td>❌ Manual waits</td><td>✅ Built-in</td></tr><tr><td>Speed</td><td>Slower (HTTP)</td><td>Faster (WebSocket)</td></tr><tr><td>Browsers</td><td>All major + Edge legacy</td><td>Chromium, Firefox, WebKit</td></tr><tr><td>iFrames</td><td>switchTo().frame()</td><td>frameLocator()</td></tr><tr><td>Network mock</td><td>❌ Not built-in</td><td>✅ route()</td></tr><tr><td>Parallel</td><td>Selenium Grid</td><td>Built-in contexts</td></tr><tr><td>Community</td><td>Huge, mature</td><td>Growing fast</td></tr><tr><td>Best for</td><td>Legacy apps, wide browser support</td><td>Modern apps, speed</td></tr></table>`},
{id:395,part:"H",level:"Senior",category:"Waits",q:"Explain all types of waits in Selenium — Implicit, Explicit, Fluent.",a:`<pre><code>// 1. Implicit Wait — global, fixed timeout\ndriver.manage().timeouts().implicitlyWait(Duration.ofSeconds(10));\n\n// 2. Explicit Wait — specific condition\nWebDriverWait wait = new WebDriverWait(driver, Duration.ofSeconds(15));\nWebElement el = wait.until(\n    ExpectedConditions.visibilityOfElementLocated(By.id("result")));\n\n// 3. Fluent Wait — polling + ignore exceptions\nWait&lt;WebDriver&gt; fluentWait = new FluentWait&lt;&gt;(driver)\n    .withTimeout(Duration.ofSeconds(30))\n    .pollingEvery(Duration.ofMillis(500))\n    .ignoring(NoSuchElementException.class);\n\nWebElement el = fluentWait.until(d -&gt;\n    d.findElement(By.id("dynamic-content")));</code></pre><div class="important"><span class="tip-icon">❗</span><div><strong>Never mix</strong> implicit and explicit waits — leads to unpredictable timeouts.</div></div>`},
{id:396,part:"H",level:"Senior",category:"Grid",q:"Selenium Grid 4 architecture — Hub, Node, Distributor, Router.",a:`<pre><code>// Selenium Grid 4 Components:\n// Router → receives requests\n// Distributor → assigns sessions to nodes\n// Session Map → tracks active sessions\n// Node → runs browser instances\n\n// Start Grid (standalone)\njava -jar selenium-server-4.x.jar standalone\n\n// Start Hub + Node separately\njava -jar selenium-server-4.x.jar hub\njava -jar selenium-server-4.x.jar node --hub http://hub:4444\n\n// Remote WebDriver\nWebDriver driver = new RemoteWebDriver(\n    new URL("http://grid-hub:4444"),\n    new ChromeOptions());</code></pre><p><strong>Docker Grid:</strong></p><pre><code># docker-compose.yml\nservices:\n  hub:\n    image: selenium/hub:4.x\n  chrome:\n    image: selenium/node-chrome:4.x\n    depends_on: [hub]\n    environment:\n      - SE_EVENT_BUS_HOST=hub</code></pre>`},
{id:397,part:"H",level:"Senior",category:"POM",q:"Implement a robust Page Object Model with PageFactory.",a:`<pre><code>public class LoginPage {\n    private WebDriver driver;\n\n    @FindBy(id = "username") private WebElement usernameField;\n    @FindBy(id = "password") private WebElement passwordField;\n    @FindBy(css = "button[type='submit']") private WebElement loginBtn;\n    @FindBy(css = ".error-message") private WebElement errorMsg;\n\n    public LoginPage(WebDriver driver) {\n        this.driver = driver;\n        PageFactory.initElements(driver, this);\n    }\n\n    public DashboardPage login(String user, String pass) {\n        usernameField.clear();\n        usernameField.sendKeys(user);\n        passwordField.clear();\n        passwordField.sendKeys(pass);\n        loginBtn.click();\n        return new DashboardPage(driver);\n    }\n\n    public String getErrorMessage() {\n        return new WebDriverWait(driver, Duration.ofSeconds(5))\n            .until(ExpectedConditions.visibilityOf(errorMsg))\n            .getText();\n    }\n}</code></pre>`},
{id:398,part:"H",level:"Senior",category:"Advanced",q:"JavaScript Executor — when and how to use it?",a:`<pre><code>JavascriptExecutor js = (JavascriptExecutor) driver;\n\n// Click when regular click fails\njs.executeScript("arguments[0].click();", element);\n\n// Scroll into view\njs.executeScript("arguments[0].scrollIntoView(true);", element);\n\n// Scroll to bottom\njs.executeScript("window.scrollTo(0, document.body.scrollHeight);");\n\n// Get page title\nString title = (String) js.executeScript("return document.title;");\n\n// Highlight element (debugging)\njs.executeScript(\n    "arguments[0].style.border='3px solid red';", element);\n\n// Set hidden input value\njs.executeScript(\n    "arguments[0].value = 'new value';", hiddenInput);\n\n// Wait for page load\njs.executeScript(\n    "return document.readyState").equals("complete");</code></pre>`},
{id:399,part:"H",level:"Senior",category:"Advanced",q:"Actions class — complex mouse and keyboard interactions.",a:`<pre><code>Actions actions = new Actions(driver);\n\n// Hover\nactions.moveToElement(menuItem).perform();\n\n// Drag and drop\nactions.dragAndDrop(source, target).perform();\n\n// Right-click (context menu)\nactions.contextClick(element).perform();\n\n// Double-click\nactions.doubleClick(element).perform();\n\n// Chain of actions\nactions.moveToElement(slider)\n    .clickAndHold()\n    .moveByOffset(100, 0)\n    .release()\n    .perform();\n\n// Key combinations\nactions.keyDown(Keys.CONTROL)\n    .sendKeys("a")\n    .keyUp(Keys.CONTROL)\n    .perform();</code></pre>`},
{id:400,part:"H",level:"Senior",category:"Selenium4",q:"Selenium 4 new features — what changed from Selenium 3?",a:`<table><tr><th>Feature</th><th>Selenium 3</th><th>Selenium 4</th></tr><tr><td>Protocol</td><td>JSON Wire</td><td>W3C WebDriver</td></tr><tr><td>Relative locators</td><td>❌</td><td>✅ above, below, near</td></tr><tr><td>Chrome DevTools</td><td>❌</td><td>✅ CDP integration</td></tr><tr><td>New tab/window</td><td>JS workaround</td><td>driver.switchTo().newWindow()</td></tr><tr><td>Element screenshot</td><td>Full page only</td><td>element.getScreenshotAs()</td></tr><tr><td>Grid</td><td>Hub/Node</td><td>Distributed + Docker</td></tr></table><pre><code>// Relative locators (Selenium 4)\nWebElement email = driver.findElement(By.id("email"));\nWebElement password = driver.findElement(\n    RelativeLocator.with(By.tagName("input"))\n        .below(email));</code></pre>`},
{id:401,part:"H",level:"Senior",category:"Selenium4",q:"Chrome DevTools Protocol (CDP) in Selenium 4.",a:`<pre><code>// Enable network interception\nDevTools devTools = ((ChromeDriver) driver).getDevTools();\ndevTools.createSession();\n\n// Mock geolocation\ndevTools.send(Emulation.setGeolocationOverride(\n    Optional.of(13.08), Optional.of(80.27), Optional.of(1)));\n\n// Network conditions (throttle)\ndevTools.send(Network.emulateNetworkConditions(\n    false, 100, 5000, 2000,\n    Optional.of(ConnectionType.CELLULAR3G)));\n\n// Console logs\ndevTools.send(Log.enable());\ndevTools.addListener(Log.entryAdded(), entry -&gt; {\n    System.out.println(entry.getText());\n});\n\n// Performance metrics\ndevTools.send(Performance.enable(Optional.empty()));\nList&lt;Metric&gt; metrics = devTools.send(Performance.getMetrics());</code></pre>`},
{id:402,part:"H",level:"Senior",category:"Exceptions",q:"Common Selenium exceptions and how to handle them.",a:`<table><tr><th>Exception</th><th>Cause</th><th>Solution</th></tr><tr><td>NoSuchElementException</td><td>Element not in DOM</td><td>Use Explicit Wait</td></tr><tr><td>StaleElementReferenceException</td><td>Element re-rendered</td><td>Re-find the element</td></tr><tr><td>ElementNotInteractableException</td><td>Hidden/overlapped</td><td>Scroll or wait for visibility</td></tr><tr><td>TimeoutException</td><td>Wait condition not met</td><td>Increase timeout or fix locator</td></tr><tr><td>NoAlertPresentException</td><td>No alert open</td><td>Wait for alert</td></tr><tr><td>SessionNotCreatedException</td><td>Driver/browser mismatch</td><td>Update ChromeDriver</td></tr><tr><td>InvalidSelectorException</td><td>Bad XPath/CSS</td><td>Fix locator syntax</td></tr></table>`},
{id:403,part:"H",level:"Senior",category:"Patterns",q:"Thread-safe WebDriver for parallel execution.",a:`<pre><code>public class DriverManager {\n    private static final ThreadLocal&lt;WebDriver&gt; driver =\n        new ThreadLocal&lt;&gt;();\n\n    public static WebDriver getDriver() {\n        return driver.get();\n    }\n\n    public static void setDriver(WebDriver d) {\n        driver.set(d);\n    }\n\n    public static void quit() {\n        if (driver.get() != null) {\n            driver.get().quit();\n            driver.remove();\n        }\n    }\n}\n\n// In BaseTest\n@BeforeMethod\npublic void setup() {\n    DriverManager.setDriver(new ChromeDriver());\n}\n\n@AfterMethod\npublic void tearDown() {\n    DriverManager.quit();\n}</code></pre>`},
{id:404,part:"H",level:"Senior",category:"Advanced",q:"Handling multiple windows and tabs.",a:`<pre><code>// Get current window\nString mainWindow = driver.getWindowHandle();\n\n// Click link that opens new tab\ndriver.findElement(By.linkText("Open New")).click();\n\n// Switch to new window\nSet&lt;String&gt; handles = driver.getWindowHandles();\nfor (String handle : handles) {\n    if (!handle.equals(mainWindow)) {\n        driver.switchTo().window(handle);\n        break;\n    }\n}\n\n// Selenium 4 — open new tab/window directly\ndriver.switchTo().newWindow(WindowType.TAB);\ndriver.get("https://example.com");\n\n// Switch back\ndriver.switchTo().window(mainWindow);\n\n// Close current, switch back\ndriver.close();\ndriver.switchTo().window(mainWindow);</code></pre>`},
{id:405,part:"H",level:"Senior",category:"Advanced",q:"File upload and download strategies.",a:`<pre><code>// Upload — sendKeys to input[type='file']\nWebElement upload = driver.findElement(By.id("file-input"));\nupload.sendKeys("/path/to/file.pdf");\n\n// Upload via Robot class (native dialog)\nRobot robot = new Robot();\nStringSelection path = new StringSelection("/path/to/file.pdf");\nToolkit.getDefaultToolkit().getSystemClipboard()\n    .setContents(path, null);\nrobot.keyPress(KeyEvent.VK_CONTROL);\nrobot.keyPress(KeyEvent.VK_V);\nrobot.keyRelease(KeyEvent.VK_V);\nrobot.keyRelease(KeyEvent.VK_CONTROL);\nrobot.keyPress(KeyEvent.VK_ENTER);\n\n// Download — set Chrome prefs\nChromeOptions options = new ChromeOptions();\nMap&lt;String, Object&gt; prefs = new HashMap&lt;&gt;();\nprefs.put("download.default_directory", "/downloads");\nprefs.put("download.prompt_for_download", false);\noptions.setExperimentalOption("prefs", prefs);</code></pre>`},
{id:406,part:"H",level:"Senior",category:"Advanced",q:"How do you handle Shadow DOM elements?",a:`<pre><code>// Selenium 4 — getShadowRoot()\nWebElement host = driver.findElement(By.cssSelector("my-component"));\nSearchContext shadow = host.getShadowRoot();\nWebElement innerBtn = shadow.findElement(By.cssSelector("button"));\ninnerBtn.click();\n\n// JavaScript fallback (Selenium 3)\nJavascriptExecutor js = (JavascriptExecutor) driver;\nWebElement el = (WebElement) js.executeScript(\n    "return document.querySelector('my-component')" +\n    ".shadowRoot.querySelector('button')");\nel.click();</code></pre>`},
{id:407,part:"H",level:"Senior",category:"Testing",q:"Data-driven testing with Selenium + TestNG DataProvider.",a:`<pre><code>@DataProvider(name = "loginData")\npublic Object[][] credentials() {\n    return new Object[][] {\n        {"admin", "admin123", true},\n        {"user", "wrong", false},\n        {"", "", false},\n        {"admin", "", false}\n    };\n}\n\n@Test(dataProvider = "loginData")\npublic void testLogin(String user, String pass, boolean expected) {\n    LoginPage login = new LoginPage(driver);\n    login.enterUsername(user);\n    login.enterPassword(pass);\n    login.clickSubmit();\n\n    if (expected) {\n        assertTrue(new DashboardPage(driver).isDisplayed());\n    } else {\n        assertTrue(login.isErrorDisplayed());\n    }\n}</code></pre>`},
{id:408,part:"H",level:"Senior",category:"Patterns",q:"Implementing the Screenplay pattern over Page Objects.",a:`<pre><code>// Traditional POM\nloginPage.enterUsername("admin");\nloginPage.enterPassword("pass");\nloginPage.clickLogin();\n\n// Screenplay pattern (behavior-driven)\nactor.attemptsTo(\n    Navigate.to(LoginPage.URL),\n    Enter.theValue("admin").into(LoginPage.USERNAME),\n    Enter.theValue("pass").into(LoginPage.PASSWORD),\n    Click.on(LoginPage.LOGIN_BUTTON)\n);\n\n// Benefits:\n// 1. Reads like English\n// 2. Tasks are reusable across tests\n// 3. Better separation of concerns\n// 4. Easier to maintain at scale</code></pre>`},
{id:409,part:"H",level:"Senior",category:"Reporting",q:"Integrating ExtentReports with Selenium + TestNG.",a:`<pre><code>public class ExtentManager {\n    private static ExtentReports extent;\n    private static ThreadLocal&lt;ExtentTest&gt; test = new ThreadLocal&lt;&gt;();\n\n    public static void initReport() {\n        extent = new ExtentReports();\n        extent.attachReporter(new ExtentSparkReporter("report.html"));\n    }\n\n    public static ExtentTest getTest() { return test.get(); }\n\n    public static void createTest(String name) {\n        test.set(extent.createTest(name));\n    }\n\n    public static void flush() { extent.flush(); }\n}\n\n// Listener\npublic class TestListener implements ITestListener {\n    @Override\n    public void onTestSuccess(ITestResult result) {\n        ExtentManager.getTest().pass("Test passed");\n    }\n    @Override\n    public void onTestFailure(ITestResult result) {\n        ExtentManager.getTest().fail(result.getThrowable());\n        // Attach screenshot\n    }\n}</code></pre>`},
{id:410,part:"H",level:"Senior",category:"Advanced",q:"Headless browser testing — pros, cons, configuration.",a:`<pre><code>// Chrome headless\nChromeOptions options = new ChromeOptions();\noptions.addArguments("--headless=new"); // Selenium 4\noptions.addArguments("--window-size=1920,1080");\noptions.addArguments("--disable-gpu");\noptions.addArguments("--no-sandbox");\nWebDriver driver = new ChromeDriver(options);\n\n// Firefox headless\nFirefoxOptions ffOptions = new FirefoxOptions();\nffOptions.addArguments("--headless");\nWebDriver driver = new FirefoxDriver(ffOptions);</code></pre><table><tr><th>Pros</th><th>Cons</th></tr><tr><td>Faster execution</td><td>Can't see what happens</td></tr><tr><td>No GPU needed</td><td>Some rendering differences</td></tr><tr><td>CI/CD friendly</td><td>Harder to debug</td></tr><tr><td>Less resources</td><td>Some JS may behave differently</td></tr></table>`},
{id:411,part:"H",level:"Senior",category:"Advanced",q:"WebDriverManager — automatic driver management.",a:`<pre><code>// Old way — manual driver setup\nSystem.setProperty("webdriver.chrome.driver",\n    "/path/to/chromedriver");\nWebDriver driver = new ChromeDriver();\n\n// New way — WebDriverManager (Boni Garcia)\n// pom.xml: io.github.bonigarcia:webdrivermanager\nWebDriverManager.chromedriver().setup();\nWebDriver driver = new ChromeDriver();\n\n// Selenium 4.6+ — built-in Selenium Manager\n// No setup needed! Just:\nWebDriver driver = new ChromeDriver();\n// Selenium Manager auto-downloads the correct driver</code></pre><div class="tip"><span class="tip-icon">💡</span><div>Since Selenium 4.6+, Selenium Manager handles driver downloads automatically. No more manual setup!</div></div>`},
{id:412,part:"H",level:"Senior",category:"Framework",q:"Build a complete Selenium framework from scratch — key components.",a:`<pre><code>selenium-framework/\n├── pom.xml\n├── src/test/java/\n│   ├── base/\n│   │   ├── BaseTest.java          // Driver init, teardown\n│   │   └── DriverFactory.java     // ThreadLocal drivers\n│   ├── pages/\n│   │   ├── BasePage.java          // Common actions\n│   │   ├── LoginPage.java\n│   │   └── DashboardPage.java\n│   ├── tests/\n│   │   ├── LoginTest.java\n│   │   └── CheckoutTest.java\n│   ├── utils/\n│   │   ├── ConfigReader.java\n│   │   ├── WaitHelper.java\n│   │   ├── ScreenshotUtils.java\n│   │   └── RetryAnalyzer.java\n│   └── listeners/\n│       ├── TestListener.java\n│       └── ExtentReportListener.java\n├── testng.xml\n├── config.properties\n└── testdata/\n    └── testdata-qa.json</code></pre>`},
{id:413,part:"H",level:"Senior",category:"Advanced",q:"How do you handle dynamic web tables in Selenium?",a:`<pre><code>// Get all rows\nList&lt;WebElement&gt; rows = driver.findElements(\n    By.cssSelector("table#data tbody tr"));\n\n// Get specific cell (row 2, col 3)\nString cell = driver.findElement(\n    By.cssSelector("table#data tr:nth-child(2) td:nth-child(3)"))\n    .getText();\n\n// Iterate and find row by value\nfor (WebElement row : rows) {\n    List&lt;WebElement&gt; cols = row.findElements(By.tagName("td"));\n    if (cols.get(1).getText().equals("Boobala")) {\n        cols.get(4).findElement(By.tagName("button")).click();\n        break;\n    }\n}\n\n// Get entire table as List of Maps\nList&lt;Map&lt;String, String&gt;&gt; tableData = new ArrayList&lt;&gt;();\nList&lt;WebElement&gt; headers = driver.findElements(\n    By.cssSelector("table#data th"));</code></pre>`},
{id:414,part:"H",level:"Senior",category:"Locators",q:"XPath vs CSS selectors — performance and best practices.",a:`<table><tr><th></th><th>CSS Selector</th><th>XPath</th></tr><tr><td>Speed</td><td>Faster</td><td>Slightly slower</td></tr><tr><td>Text match</td><td>❌ Not supported</td><td>✅ text(), contains()</td></tr><tr><td>Traversal</td><td>Child only (>)</td><td>Parent, sibling, ancestor</td></tr><tr><td>Readability</td><td>Simple</td><td>Complex but powerful</td></tr><tr><td>Shadow DOM</td><td>✅ Works</td><td>❌ Doesn't work</td></tr></table><pre><code>// CSS examples\n"#login"            // by ID\n".btn-primary"      // by class\n"input[name='user']" // by attribute\n"div > span"        // direct child\n\n// XPath examples\n"//input[@id='user']"\n"//button[text()='Login']"\n"//div[contains(@class,'error')]"\n"//input[@id='pass']/parent::div"</code></pre>`},
{id:415,part:"H",level:"Senior",category:"Advanced",q:"How to handle StaleElementReferenceException robustly?",a:`<pre><code>// Strategy 1: Re-find the element\npublic WebElement findWithRetry(By locator, int maxRetries) {\n    for (int i = 0; i &lt; maxRetries; i++) {\n        try {\n            return driver.findElement(locator);\n        } catch (StaleElementReferenceException e) {\n            // Element was detached, retry\n        }\n    }\n    throw new RuntimeException("Element still stale after " + maxRetries + " retries");\n}\n\n// Strategy 2: Wait for staleness then re-find\nwait.until(ExpectedConditions.stalenessOf(oldElement));\nWebElement fresh = driver.findElement(By.id("my-element"));\n\n// Strategy 3: Always use locators, never cache elements\n// ❌ Bad: WebElement btn = driver.findElement(...);\n//         navigate();\n//         btn.click(); // STALE!\n// ✅ Good: driver.findElement(By.id("btn")).click();</code></pre>`},
{id:416,part:"H",level:"Senior",category:"Grid",q:"Running Selenium tests in Docker containers.",a:`<pre><code># docker-compose.yml for Selenium Grid\nversion: '3'\nservices:\n  hub:\n    image: selenium/hub:4.x\n    ports: ["4444:4444"]\n  chrome:\n    image: selenium/node-chrome:4.x\n    depends_on: [hub]\n    environment:\n      - SE_EVENT_BUS_HOST=hub\n      - SE_EVENT_BUS_PUBLISH_PORT=4442\n      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443\n    shm_size: '2gb'\n  firefox:\n    image: selenium/node-firefox:4.x\n    depends_on: [hub]\n    environment:\n      - SE_EVENT_BUS_HOST=hub\n      - SE_EVENT_BUS_PUBLISH_PORT=4442\n      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443\n\n# Start: docker-compose up -d\n# Scale: docker-compose up -d --scale chrome=3</code></pre>`},
{id:417,part:"H",level:"Senior",category:"Advanced",q:"How do you capture network traffic with Selenium 4?",a:`<pre><code>DevTools devTools = ((ChromeDriver) driver).getDevTools();\ndevTools.createSession();\n\n// Enable network tracking\ndevTools.send(Network.enable(Optional.empty(),\n    Optional.empty(), Optional.empty()));\n\nList&lt;String&gt; requestUrls = new ArrayList&lt;&gt;();\n\n// Listen to requests\ndevTools.addListener(Network.requestWillBeSent(), request -&gt; {\n    requestUrls.add(request.getRequest().getUrl());\n    System.out.println("Request: " + request.getRequest().getUrl());\n});\n\n// Listen to responses\ndevTools.addListener(Network.responseReceived(), response -&gt; {\n    System.out.println("Status: " + response.getResponse().getStatus());\n});\n\ndriver.get("https://example.com");\n// requestUrls now contains all network requests</code></pre>`},

{id:418,part:"H",level:"Mid",category:"Basics",q:"How do you set up Selenium WebDriver in a Java project?",a:`<pre><code>// 1. Add Maven dependency\n&lt;dependency&gt;\n    &lt;groupId&gt;org.seleniumhq.selenium&lt;/groupId&gt;\n    &lt;artifactId&gt;selenium-java&lt;/artifactId&gt;\n    &lt;version&gt;4.20.0&lt;/version&gt;\n&lt;/dependency&gt;\n\n// 2. Create driver (Selenium 4.6+ — auto driver management)\nWebDriver driver = new ChromeDriver();\ndriver.get("https://example.com");\nSystem.out.println(driver.getTitle());\ndriver.quit();</code></pre>`},
{id:419,part:"H",level:"Mid",category:"Locators",q:"All 8 locator strategies in Selenium.",a:`<pre><code>driver.findElement(By.id("username"));          // By ID\ndriver.findElement(By.name("email"));            // By name\ndriver.findElement(By.className("btn-primary")); // By class\ndriver.findElement(By.tagName("input"));         // By tag\ndriver.findElement(By.linkText("Click Here"));   // Full link text\ndriver.findElement(By.partialLinkText("Click")); // Partial link\ndriver.findElement(By.cssSelector("#login"));    // CSS selector\ndriver.findElement(By.xpath("//input[@id='user']")); // XPath\n\n// Priority order:\n// 1. ID → 2. Name → 3. CSS → 4. XPath</code></pre>`},
{id:420,part:"H",level:"Mid",category:"Basics",q:"findElement vs findElements — what's the difference?",a:`<table><tr><th></th><th>findElement()</th><th>findElements()</th></tr><tr><td>Returns</td><td>Single WebElement</td><td>List&lt;WebElement&gt;</td></tr><tr><td>Not found</td><td>NoSuchElementException</td><td>Empty list (no exception)</td></tr><tr><td>Multiple matches</td><td>Returns first match</td><td>Returns all matches</td></tr></table><pre><code>// Check if element exists (no exception)\nboolean exists = driver.findElements(By.id("popup")).size() &gt; 0;\n\n// Count elements\nint count = driver.findElements(By.cssSelector(".item")).size();\n\n// Get all links\nList&lt;WebElement&gt; links = driver.findElements(By.tagName("a"));</code></pre>`},
{id:421,part:"H",level:"Mid",category:"Basics",q:"How do you handle alerts in Selenium?",a:`<pre><code>// Switch to alert\nAlert alert = driver.switchTo().alert();\n\n// Accept (OK)\nalert.accept();\n\n// Dismiss (Cancel)\nalert.dismiss();\n\n// Get alert text\nString text = alert.getText();\n\n// Enter text (prompt)\nalert.sendKeys("My Answer");\nalert.accept();\n\n// Wait for alert\nnew WebDriverWait(driver, Duration.ofSeconds(5))\n    .until(ExpectedConditions.alertIsPresent());</code></pre>`},
{id:422,part:"H",level:"Mid",category:"Basics",q:"How do you handle dropdowns with Select class?",a:`<pre><code>WebElement dropdown = driver.findElement(By.id("country"));\nSelect select = new Select(dropdown);\n\n// Select by visible text\nselect.selectByVisibleText("India");\n\n// Select by value attribute\nselect.selectByValue("IN");\n\n// Select by index (0-based)\nselect.selectByIndex(2);\n\n// Get selected option\nString selected = select.getFirstSelectedOption().getText();\n\n// Get all options\nList&lt;WebElement&gt; options = select.getOptions();\n\n// Check if multi-select\nboolean isMulti = select.isMultiple();\n\n// Deselect (multi-select only)\nselect.deselectAll();</code></pre>`},
{id:423,part:"H",level:"Mid",category:"Frames",q:"Switching between frames and iframes.",a:`<pre><code>// Switch by index\ndriver.switchTo().frame(0);\n\n// Switch by name or ID\ndriver.switchTo().frame("payment-frame");\n\n// Switch by WebElement\nWebElement iframe = driver.findElement(By.cssSelector("iframe.ad"));\ndriver.switchTo().frame(iframe);\n\n// ⚠️ Always switch back to main content\ndriver.switchTo().defaultContent();\n\n// Switch to parent frame\ndriver.switchTo().parentFrame();\n\n// Nested frames\ndriver.switchTo().frame("outer");\ndriver.switchTo().frame("inner");\n// ... interact ...\ndriver.switchTo().defaultContent();</code></pre>`},
{id:424,part:"H",level:"Mid",category:"Basics",q:"How do you take screenshots in Selenium?",a:`<pre><code>// Full page screenshot\nTakesScreenshot ts = (TakesScreenshot) driver;\nFile src = ts.getScreenshotAs(OutputType.FILE);\nFiles.copy(src.toPath(), Path.of("screenshot.png"));\n\n// Element screenshot (Selenium 4)\nWebElement element = driver.findElement(By.id("chart"));\nFile elemShot = element.getScreenshotAs(OutputType.FILE);\n\n// As Base64 (for reports)\nString base64 = ts.getScreenshotAs(OutputType.BASE64);\n\n// As byte array\nbyte[] bytes = ts.getScreenshotAs(OutputType.BYTES);</code></pre>`},
{id:425,part:"H",level:"Mid",category:"Basics",q:"How do you handle browser navigation?",a:`<pre><code>// Navigate to URL\ndriver.get("https://example.com");\ndriver.navigate().to("https://example.com");\n\n// Back / Forward / Refresh\ndriver.navigate().back();\ndriver.navigate().forward();\ndriver.navigate().refresh();\n\n// Get current URL\nString url = driver.getCurrentUrl();\n\n// Get page title\nString title = driver.getTitle();\n\n// Get page source\nString source = driver.getPageSource();\n\n// Maximize window\ndriver.manage().window().maximize();\n\n// Set window size\ndriver.manage().window().setSize(new Dimension(1920, 1080));</code></pre>`},
{id:426,part:"H",level:"Mid",category:"Basics",q:"Handling checkboxes and radio buttons.",a:`<pre><code>WebElement checkbox = driver.findElement(By.id("agree"));\n\n// Check if selected\nif (!checkbox.isSelected()) {\n    checkbox.click();\n}\n\n// Radio button\nWebElement radio = driver.findElement(\n    By.cssSelector("input[value='premium']"));\nradio.click();\n\n// Verify state\nassertTrue(checkbox.isSelected());\nassertTrue(radio.isSelected());\n\n// Check if enabled\nboolean enabled = checkbox.isEnabled();\n\n// Check if displayed\nboolean visible = checkbox.isDisplayed();</code></pre>`},
{id:427,part:"H",level:"Mid",category:"Basics",q:"How do you manage cookies in Selenium?",a:`<pre><code>// Get all cookies\nSet&lt;Cookie&gt; cookies = driver.manage().getCookies();\n\n// Get specific cookie\nCookie sessionCookie = driver.manage().getCookieNamed("session_id");\n\n// Add cookie\ndriver.manage().addCookie(new Cookie("test", "value"));\n\n// Delete specific cookie\ndriver.manage().deleteCookieNamed("session_id");\n\n// Delete all cookies\ndriver.manage().deleteAllCookies();\n\n// Cookie details\nString value = sessionCookie.getValue();\nString domain = sessionCookie.getDomain();\nDate expiry = sessionCookie.getExpiry();</code></pre>`},
{id:428,part:"H",level:"Mid",category:"Waits",q:"Common ExpectedConditions you should know.",a:`<pre><code>WebDriverWait wait = new WebDriverWait(driver, Duration.ofSeconds(10));\n\n// Element visible\nwait.until(ExpectedConditions.visibilityOfElementLocated(By.id("msg")));\n\n// Element clickable\nwait.until(ExpectedConditions.elementToBeClickable(By.id("btn")));\n\n// Text present\nwait.until(ExpectedConditions.textToBePresentInElementLocated(\n    By.id("status"), "Success"));\n\n// URL contains\nwait.until(ExpectedConditions.urlContains("/dashboard"));\n\n// Title contains\nwait.until(ExpectedConditions.titleContains("Home"));\n\n// Element invisible (loader gone)\nwait.until(ExpectedConditions.invisibilityOfElementLocated(\n    By.cssSelector(".spinner")));\n\n// Alert present\nwait.until(ExpectedConditions.alertIsPresent());</code></pre>`},
{id:429,part:"H",level:"Mid",category:"Config",q:"ChromeOptions — common configurations.",a:`<pre><code>ChromeOptions options = new ChromeOptions();\n\n// Headless\noptions.addArguments("--headless=new");\n\n// Window size\noptions.addArguments("--window-size=1920,1080");\n\n// Disable notifications\noptions.addArguments("--disable-notifications");\n\n// Incognito\noptions.addArguments("--incognito");\n\n// Disable extensions\noptions.addArguments("--disable-extensions");\n\n// Download directory\nMap&lt;String, Object&gt; prefs = new HashMap&lt;&gt;();\nprefs.put("download.default_directory", "/downloads");\noptions.setExperimentalOption("prefs", prefs);\n\nWebDriver driver = new ChromeDriver(options);</code></pre>`},
{id:430,part:"H",level:"Mid",category:"Basics",q:"getAttribute(), getText(), getCssValue() — getting element properties.",a:`<pre><code>WebElement el = driver.findElement(By.id("email"));\n\n// Get visible text\nString text = el.getText();\n\n// Get attribute value\nString placeholder = el.getAttribute("placeholder");\nString value = el.getAttribute("value");\nString href = el.getAttribute("href");\n\n// Get CSS property\nString color = el.getCssValue("color");\nString fontSize = el.getCssValue("font-size");\nString bgColor = el.getCssValue("background-color");\n\n// Get tag name\nString tag = el.getTagName(); // "input"\n\n// Get size and location\nDimension size = el.getSize();\nPoint location = el.getLocation();</code></pre>`},
{id:431,part:"H",level:"Mid",category:"Mouse",q:"Mouse hover and right-click actions.",a:`<pre><code>Actions actions = new Actions(driver);\n\n// Hover over element\nWebElement menu = driver.findElement(By.id("menu"));\nactions.moveToElement(menu).perform();\n\n// Then click submenu\nWebElement subMenu = driver.findElement(By.id("sub-item"));\nactions.moveToElement(subMenu).click().perform();\n\n// Right-click\nactions.contextClick(element).perform();\n\n// Double-click\nactions.doubleClick(element).perform();</code></pre>`},
{id:432,part:"H",level:"Mid",category:"Scroll",q:"Scrolling techniques in Selenium.",a:`<pre><code>JavascriptExecutor js = (JavascriptExecutor) driver;\n\n// Scroll to bottom\njs.executeScript("window.scrollTo(0, document.body.scrollHeight)");\n\n// Scroll to top\njs.executeScript("window.scrollTo(0, 0)");\n\n// Scroll to element\nWebElement el = driver.findElement(By.id("footer"));\njs.executeScript("arguments[0].scrollIntoView(true);", el);\n\n// Scroll by pixels\njs.executeScript("window.scrollBy(0, 500)");\n\n// Using Actions\nnew Actions(driver).scrollToElement(element).perform();\n\n// Selenium 4 — scroll with wheel\nnew Actions(driver)\n    .scrollByAmount(0, 500)\n    .perform();</code></pre>`},
{id:433,part:"H",level:"Mid",category:"Assertions",q:"Common assertions in Selenium tests.",a:`<pre><code>// Title\nassertEquals(driver.getTitle(), "Dashboard");\n\n// URL\nassertTrue(driver.getCurrentUrl().contains("/dashboard"));\n\n// Element text\nassertEquals(element.getText(), "Welcome, Boobala");\n\n// Element visible\nassertTrue(element.isDisplayed());\n\n// Element selected\nassertTrue(checkbox.isSelected());\n\n// Element enabled\nassertTrue(button.isEnabled());\n\n// List count\nassertEquals(driver.findElements(By.cssSelector(".item")).size(), 5);\n\n// Attribute\nassertEquals(element.getAttribute("class"), "active");</code></pre>`},
{id:434,part:"H",level:"Mid",category:"Basics",q:"driver.get() vs driver.navigate().to() — what's different?",a:`<table><tr><th></th><th>driver.get()</th><th>navigate().to()</th></tr><tr><td>Waits</td><td>Waits for page load</td><td>Waits for page load</td></tr><tr><td>History</td><td>No back/forward</td><td>Supports back/forward</td></tr><tr><td>Cookies</td><td>Same</td><td>Same</td></tr><tr><td>URL types</td><td>Full URLs</td><td>Full URLs</td></tr></table><p><strong>Key difference:</strong> <code>navigate()</code> maintains browser history, so you can use <code>back()</code> and <code>forward()</code>. In practice, they are interchangeable for loading pages.</p>`},
{id:435,part:"H",level:"Mid",category:"Basics",q:"close() vs quit() — when to use which?",a:`<table><tr><th></th><th>close()</th><th>quit()</th></tr><tr><td>Closes</td><td>Current tab/window</td><td>All windows + driver session</td></tr><tr><td>Driver alive?</td><td>Yes (if other windows open)</td><td>No — session ends</td></tr><tr><td>Use when</td><td>Closing one popup window</td><td>End of test (teardown)</td></tr></table><pre><code>// Close popup, stay on main\ndriver.switchTo().window(popup);\ndriver.close();\ndriver.switchTo().window(main);\n\n// End everything\ndriver.quit(); // Always in @AfterMethod!</code></pre>`},
{id:436,part:"H",level:"Mid",category:"Waits",q:"Thread.sleep() vs WebDriverWait — why never use Thread.sleep()?",a:`<table><tr><th></th><th>Thread.sleep()</th><th>WebDriverWait</th></tr><tr><td>Wait type</td><td>Fixed (unconditional)</td><td>Dynamic (conditional)</td></tr><tr><td>Wastes time?</td><td>Yes — always waits full duration</td><td>No — stops as soon as condition met</td></tr><tr><td>Reliable?</td><td>No — still may fail</td><td>Yes — polls until ready</td></tr><tr><td>Best practice?</td><td>❌ NEVER in tests</td><td>✅ Always preferred</td></tr></table><pre><code>// ❌ Bad\nThread.sleep(5000); // waits 5s even if ready in 0.5s\ndriver.findElement(By.id("btn")).click();\n\n// ✅ Good\nnew WebDriverWait(driver, Duration.ofSeconds(5))\n    .until(ExpectedConditions.elementToBeClickable(By.id("btn")))\n    .click();</code></pre>`},
{id:437,part:"H",level:"Mid",category:"Config",q:"How do you run Selenium tests in different environments?",a:`<pre><code>// config.properties\nbase.url=https://qa.example.com\nbrowser=chrome\n\n// ConfigReader.java\npublic class ConfigReader {\n    private static Properties props = new Properties();\n    static {\n        try {\n            props.load(new FileInputStream("config.properties"));\n        } catch (IOException e) { throw new RuntimeException(e); }\n    }\n    public static String get(String key) {\n        return System.getProperty(key, props.getProperty(key));\n    }\n}\n\n// Usage\nString baseUrl = ConfigReader.get("base.url");\n\n// Override via command line\nmvn test -Dbase.url=https://staging.example.com</code></pre>`}

{id:438,part:"I",level:"Senior",category:"Scenario",q:"Scenario: You're testing an e-commerce checkout. Write test cases for the complete flow.",a:`<h4>E-Commerce Checkout — Test Scenarios</h4><table><tr><th>#</th><th>Scenario</th><th>Expected Result</th></tr><tr><td>1</td><td>Add item to cart → checkout → pay</td><td>Order confirmed, email sent</td></tr><tr><td>2</td><td>Apply valid coupon code</td><td>Discount applied, total updated</td></tr><tr><td>3</td><td>Apply expired coupon</td><td>Error: "Coupon expired"</td></tr><tr><td>4</td><td>Checkout with empty cart</td><td>Button disabled or error shown</td></tr><tr><td>5</td><td>Remove item during checkout</td><td>Cart + total updated, flow continues</td></tr><tr><td>6</td><td>Payment fails (insufficient funds)</td><td>Error shown, order NOT created</td></tr><tr><td>7</td><td>Network disconnects mid-payment</td><td>No duplicate charge, retry option</td></tr><tr><td>8</td><td>Back button after payment success</td><td>No re-submission, shows order page</td></tr><tr><td>9</td><td>Change shipping address after adding items</td><td>Shipping cost recalculated</td></tr><tr><td>10</td><td>Concurrent purchase of last item in stock</td><td>One succeeds, other gets "Out of stock"</td></tr></table>`},
{id:439,part:"I",level:"Senior",category:"Scenario",q:"Scenario: Payment gateway integration — what edge cases would you test?",a:`<table><tr><th>Category</th><th>Test Case</th><th>Expected</th></tr><tr><td>Happy path</td><td>Valid card, sufficient balance</td><td>Payment success</td></tr><tr><td>Card validation</td><td>Expired card</td><td>Decline with clear message</td></tr><tr><td>Card validation</td><td>Invalid CVV</td><td>Decline</td></tr><tr><td>Card validation</td><td>Card number with spaces/dashes</td><td>Auto-format or accept</td></tr><tr><td>3D Secure</td><td>OTP sent → correct OTP</td><td>Payment succeeds</td></tr><tr><td>3D Secure</td><td>OTP sent → wrong OTP 3 times</td><td>Payment blocked</td></tr><tr><td>Timeout</td><td>Gateway response takes >30s</td><td>Timeout error, no charge</td></tr><tr><td>Duplicate</td><td>Double-click pay button</td><td>Only ONE charge processed</td></tr><tr><td>Refund</td><td>Cancel order after payment</td><td>Refund initiated, status updated</td></tr><tr><td>Currency</td><td>Multi-currency support</td><td>Correct conversion rate</td></tr></table>`},
{id:440,part:"I",level:"Senior",category:"Scenario",q:"Scenario: OTP-based login — write comprehensive test cases.",a:`<table><tr><th>#</th><th>Scenario</th><th>Expected</th></tr><tr><td>1</td><td>Valid phone → receive OTP → enter correctly</td><td>Login success</td></tr><tr><td>2</td><td>Enter wrong OTP</td><td>Error: "Invalid OTP"</td></tr><tr><td>3</td><td>Enter wrong OTP 5 times</td><td>Account locked for 30 min</td></tr><tr><td>4</td><td>OTP expires after 2 minutes</td><td>"OTP expired, resend"</td></tr><tr><td>5</td><td>Click "Resend OTP"</td><td>New OTP sent, old one invalid</td></tr><tr><td>6</td><td>Resend OTP rate limit (3 times)</td><td>"Too many attempts, try later"</td></tr><tr><td>7</td><td>Phone number not registered</td><td>"Account not found" or auto-register</td></tr><tr><td>8</td><td>Enter phone with country code</td><td>Accepts +91 or without</td></tr><tr><td>9</td><td>Copy-paste OTP from SMS</td><td>Auto-fills all digits</td></tr><tr><td>10</td><td>OTP received on different device</td><td>Works (not device-bound)</td></tr></table>`},
{id:441,part:"I",level:"Senior",category:"Scenario",q:"Scenario: Insurance plan purchase flow — what would you test end-to-end?",a:`<h4>Insurance Purchase E2E (Onsurity context)</h4><table><tr><th>Phase</th><th>Test Scenarios</th></tr><tr><td><strong>Landing</strong></td><td>Page load, plan cards visible, pricing correct</td></tr><tr><td><strong>Member selection</strong></td><td>Self, spouse, children — age validation, max members</td></tr><tr><td><strong>Plan selection</strong></td><td>Coverage amounts, premium calculation, plan comparison</td></tr><tr><td><strong>KYC</strong></td><td>Aadhaar/PAN validation, document upload, OCR accuracy</td></tr><tr><td><strong>Payment</strong></td><td>Card/UPI/Netbanking, auto-pay mandate setup</td></tr><tr><td><strong>Post-purchase</strong></td><td>Policy PDF generated, email/SMS confirmation, DB records</td></tr><tr><td><strong>Edge cases</strong></td><td>Mid-flow logout, browser refresh, back button, duplicate purchase</td></tr></table><p><strong>DB Validations:</strong> insurance_owner, subscriptions (OSHS- prefix), mandate_status = ACTIVE</p>`},
{id:442,part:"I",level:"Senior",category:"Strategy",q:"How do you decide what to automate vs what to keep manual?",a:`<table><tr><th>Automate ✅</th><th>Keep Manual ✋</th></tr><tr><td>Regression tests (run every sprint)</td><td>Exploratory testing</td></tr><tr><td>Smoke tests (deploy verification)</td><td>Usability/UX evaluation</td></tr><tr><td>Data-driven tests (100+ combos)</td><td>Ad-hoc testing</td></tr><tr><td>Cross-browser checks</td><td>Visual layout inspection</td></tr><tr><td>API response validation</td><td>First-time feature testing</td></tr><tr><td>DB integrity checks</td><td>Accessibility audits</td></tr></table><h4>Decision Matrix</h4><p><strong>ROI formula:</strong> If (frequency × effort saved) > (automation cost + maintenance), automate it.</p><p><strong>Rule of thumb:</strong> If a test runs more than 3 times, automate it.</p>`},
{id:443,part:"I",level:"Senior",category:"Scenario",q:"Scenario: Search functionality — write test cases for an e-commerce search.",a:`<table><tr><th>#</th><th>Scenario</th><th>Expected</th></tr><tr><td>1</td><td>Search "laptop"</td><td>Relevant results displayed</td></tr><tr><td>2</td><td>Search with typo "laaptop"</td><td>"Did you mean laptop?" or fuzzy match</td></tr><tr><td>3</td><td>Search empty string</td><td>Validation or show all products</td></tr><tr><td>4</td><td>Search with special chars <code>&lt;script&gt;</code></td><td>No XSS, sanitized input</td></tr><tr><td>5</td><td>Search "asdfghjkl" (no results)</td><td>"No results found" + suggestions</td></tr><tr><td>6</td><td>Search with SQL injection <code>' OR 1=1</code></td><td>No SQL execution, sanitized</td></tr><tr><td>7</td><td>Search result pagination (100+ results)</td><td>Pages load correctly, count matches</td></tr><tr><td>8</td><td>Filter + sort after search</td><td>Filters applied to search results only</td></tr><tr><td>9</td><td>Search performance (1M products)</td><td>Results within 2 seconds</td></tr><tr><td>10</td><td>Search suggestions (autocomplete)</td><td>Dropdown appears after 2+ chars</td></tr></table>`},
{id:444,part:"I",level:"Senior",category:"BugReport",q:"How do you write an effective bug report? Give a real example.",a:`<h4>Bug Report Template</h4><table><tr><th>Field</th><th>Example</th></tr><tr><td><strong>Title</strong></td><td>Payment fails with "Network Error" when using UPI on Android 14</td></tr><tr><td><strong>Severity</strong></td><td>Critical (P1)</td></tr><tr><td><strong>Environment</strong></td><td>QA, Android 14, Chrome 125, UPI payment</td></tr><tr><td><strong>Steps</strong></td><td>1. Login → 2. Select plan → 3. Choose UPI → 4. Enter UPI ID → 5. Click Pay</td></tr><tr><td><strong>Expected</strong></td><td>Payment processes, redirects to success page</td></tr><tr><td><strong>Actual</strong></td><td>"Network Error" toast, stuck on payment page, no charge on UPI app</td></tr><tr><td><strong>Frequency</strong></td><td>100% reproducible</td></tr><tr><td><strong>Attachments</strong></td><td>Screenshot, video, network HAR, console logs</td></tr><tr><td><strong>Workaround</strong></td><td>Use card payment instead (works fine)</td></tr></table>`},
{id:445,part:"I",level:"Senior",category:"Strategy",q:"How do you estimate testing effort for a new feature?",a:`<h4>Test Estimation Techniques</h4><table><tr><th>Technique</th><th>When to Use</th></tr><tr><td><strong>Work Breakdown</strong></td><td>Break into tasks → estimate each</td></tr><tr><td><strong>3-Point Estimate</strong></td><td>(Optimistic + 4×Most Likely + Pessimistic) / 6</td></tr><tr><td><strong>Historical Data</strong></td><td>Similar feature took X days last sprint</td></tr><tr><td><strong>Test Point Analysis</strong></td><td>Complexity × data variations × risk</td></tr></table><h4>Example: Login Feature</h4><table><tr><th>Task</th><th>Hours</th></tr><tr><td>Test case design</td><td>4</td></tr><tr><td>Test data setup</td><td>2</td></tr><tr><td>Functional execution</td><td>6</td></tr><tr><td>Cross-browser (3 browsers)</td><td>4</td></tr><tr><td>Bug verification + re-test</td><td>4</td></tr><tr><td><strong>Total</strong></td><td><strong>20 hours</strong></td></tr></table>`},
{id:446,part:"I",level:"Senior",category:"Scenario",q:"Scenario: Production incident — user reports 'can't login'. How do you investigate?",a:`<h4>Incident Investigation Checklist</h4><ol><li><strong>Reproduce:</strong> Try login on same device/browser/OS</li><li><strong>Scope:</strong> One user or all users? One region?</li><li><strong>Check logs:</strong> Server errors, API response codes</li><li><strong>Check infrastructure:</strong> Is auth service up? DB connections?</li><li><strong>Recent changes:</strong> Any deployment in last 24h?</li><li><strong>Check 3rd party:</strong> OTP provider, SSO, OAuth down?</li><li><strong>Network:</strong> DNS, SSL cert expired?</li><li><strong>Data:</strong> User account locked? Password expired?</li></ol><h4>Communication</h4><table><tr><th>To</th><th>What</th></tr><tr><td>User</td><td>"We're investigating, ETA 30 min"</td></tr><tr><td>Team</td><td>Slack incident channel with timeline</td></tr><tr><td>Manager</td><td>Impact assessment + root cause</td></tr></table>`},
{id:447,part:"I",level:"Senior",category:"Scenario",q:"Scenario: Mobile app — what unique test scenarios apply vs web?",a:`<table><tr><th>Category</th><th>Mobile-Specific Scenarios</th></tr><tr><td><strong>Interruptions</strong></td><td>Incoming call during checkout, alarm, notification</td></tr><tr><td><strong>Network</strong></td><td>Switch WiFi → 4G, airplane mode, slow 2G</td></tr><tr><td><strong>Background</strong></td><td>App backgrounded for 5 min → resume, device sleep</td></tr><tr><td><strong>Gestures</strong></td><td>Swipe, pinch-zoom, long press, double-tap</td></tr><tr><td><strong>Orientation</strong></td><td>Portrait → landscape mid-form, layout intact</td></tr><tr><td><strong>Storage</strong></td><td>Low storage, app data cleared, cache cleared</td></tr><tr><td><strong>Permissions</strong></td><td>Deny camera/location, then required flow</td></tr><tr><td><strong>Updates</strong></td><td>Old app version, force update prompt</td></tr><tr><td><strong>Deep links</strong></td><td>Open link → correct screen, even if logged out</td></tr><tr><td><strong>Install/Uninstall</strong></td><td>Fresh install, upgrade, uninstall → reinstall data</td></tr></table>`},
{id:448,part:"I",level:"Senior",category:"Strategy",q:"Risk-based testing — how do you prioritize test cases?",a:`<h4>Risk Matrix</h4><table><tr><th></th><th>Low Impact</th><th>High Impact</th></tr><tr><td><strong>High Probability</strong></td><td>Medium priority</td><td>🔴 Test FIRST</td></tr><tr><td><strong>Low Probability</strong></td><td>Test last / skip</td><td>Medium priority</td></tr></table><h4>Risk Factors</h4><ol><li><strong>Business impact:</strong> Payment > Profile > Settings</li><li><strong>Usage frequency:</strong> Login (daily) > Export (monthly)</li><li><strong>Complexity:</strong> New code > refactored code > stable code</li><li><strong>Integration points:</strong> 3rd party APIs = higher risk</li><li><strong>Regulatory:</strong> HIPAA, PCI compliance = must test</li></ol><p><strong>Result:</strong> Test critical + high-risk first. Smoke suite covers top 20% that affects 80% of users.</p>`},
{id:449,part:"I",level:"Senior",category:"Scenario",q:"Scenario: File upload feature — what would you test?",a:`<table><tr><th>#</th><th>Scenario</th><th>Expected</th></tr><tr><td>1</td><td>Upload valid PDF (2MB)</td><td>Success, file preview shown</td></tr><tr><td>2</td><td>Upload .exe file</td><td>Rejected: "File type not allowed"</td></tr><tr><td>3</td><td>Upload file > max size (10MB)</td><td>"File too large" error</td></tr><tr><td>4</td><td>Upload 0-byte empty file</td><td>Rejected or meaningful error</td></tr><tr><td>5</td><td>Upload file with special chars in name</td><td>File renamed or sanitized</td></tr><tr><td>6</td><td>Upload same file twice</td><td>Replace or version, no duplicates</td></tr><tr><td>7</td><td>Upload during slow network</td><td>Progress bar, retry on failure</td></tr><tr><td>8</td><td>Rename .exe to .pdf and upload</td><td>Server-side MIME check → reject</td></tr><tr><td>9</td><td>Concurrent uploads (5 files)</td><td>All succeed, queue if needed</td></tr><tr><td>10</td><td>Upload then immediately delete</td><td>File removed from storage</td></tr></table>`},
{id:450,part:"I",level:"Senior",category:"Strategy",q:"Exploratory testing — how do you structure a session?",a:`<h4>Session-Based Exploratory Testing</h4><table><tr><th>Element</th><th>Details</th></tr><tr><td><strong>Charter</strong></td><td>"Explore the checkout flow with focus on error handling when payment fails"</td></tr><tr><td><strong>Time box</strong></td><td>45-60 minutes</td></tr><tr><td><strong>Scope</strong></td><td>Checkout page, payment APIs, error modals</td></tr><tr><td><strong>Environment</strong></td><td>QA, Chrome, mobile viewport</td></tr></table><h4>Session Notes Template</h4><pre><code>Charter: Checkout error handling\nDuration: 50 min\nTester: Boobala\n\nBugs Found: 3\n- BUG-1: Double charge on retry (Critical)\n- BUG-2: Error modal doesn't close on mobile\n- BUG-3: "Try again" button does nothing after 3rd attempt\n\nAreas Not Tested: UPI flow, multi-currency\nRisks Identified: No idempotency key on payment API</code></pre>`},
{id:451,part:"I",level:"Senior",category:"Scenario",q:"Scenario: API returns 200 but UI shows error. How do you debug?",a:`<h4>Debugging Checklist</h4><ol><li><strong>Check API response body:</strong> Is the JSON structure correct? Any error field inside 200?</li><li><strong>Check response data types:</strong> API returns string "null" instead of null?</li><li><strong>Check frontend mapping:</strong> Is the UI reading the correct field name?</li><li><strong>Check CORS:</strong> Browser blocking response despite 200?</li><li><strong>Check caching:</strong> Browser serving stale cached response?</li><li><strong>Check environment:</strong> UI pointing to wrong API endpoint?</li><li><strong>Check timing:</strong> Response arrives after component unmounted?</li></ol><p><strong>Tools:</strong> Browser DevTools → Network tab → Preview/Response → Console for JS errors</p><div class="tip"><span class="tip-icon">\ud83d\udca1</span><div>Common culprit: API returns <code>{"status": "error", "message": "..."}</code> with HTTP 200. Frontend only checks HTTP status, not body.</div></div>`},
{id:452,part:"I",level:"Senior",category:"Scenario",q:"Scenario: Testing a notification system — push, email, SMS.",a:`<table><tr><th>Channel</th><th>Test Scenarios</th></tr><tr><td><strong>Push</strong></td><td>Received when app is foreground, background, killed. Tap opens correct screen. Notification permission denied → no crash.</td></tr><tr><td><strong>Email</strong></td><td>Sent within 5 min. Correct template, no broken images. Unsubscribe link works. HTML renders in Gmail, Outlook, Apple Mail.</td></tr><tr><td><strong>SMS</strong></td><td>Delivered within 30 sec. Correct phone number. Character limit. Link shortener works. DND numbers handled.</td></tr></table><h4>Cross-Channel Scenarios</h4><ul><li>User opts out of email → still gets push</li><li>Same event → no duplicate notifications</li><li>Timezone-aware: "Good morning" at 2 AM?</li><li>Template variables: "Hi {{name}}" → "Hi null"?</li></ul>`},
{id:453,part:"I",level:"Senior",category:"Strategy",q:"What is your test closure process? What metrics do you track?",a:`<h4>Test Closure Metrics</h4><table><tr><th>Metric</th><th>Target</th></tr><tr><td>Test case execution %</td><td>>95%</td></tr><tr><td>Pass rate</td><td>>90%</td></tr><tr><td>Defect leakage to prod</td><td>< 2 per release</td></tr><tr><td>Critical bugs open</td><td>0</td></tr><tr><td>Automation coverage</td><td>>70% regression</td></tr><tr><td>Requirements coverage</td><td>100%</td></tr></table><h4>Closure Checklist</h4><ol><li>All test cases executed (no blocked)</li><li>All critical/major bugs fixed & verified</li><li>Regression suite passed</li><li>Performance benchmarks met</li><li>Sign-off from QA Lead + PO</li><li>Test report shared with stakeholders</li></ol>`},
{id:454,part:"I",level:"Senior",category:"Scenario",q:"Scenario: Shopping cart — edge cases most testers miss.",a:`<table><tr><th>Category</th><th>Edge Case</th></tr><tr><td>Concurrency</td><td>Two tabs open → add items in both → cart shows correct total?</td></tr><tr><td>Price change</td><td>Item in cart for 2 hours → price changed → which price at checkout?</td></tr><tr><td>Stock</td><td>Item in cart → goes out of stock before checkout</td></tr><tr><td>Quantity</td><td>Add 999 quantity → inventory check, max limit?</td></tr><tr><td>Session</td><td>Add items → logout → login again → cart persists?</td></tr><tr><td>Guest</td><td>Guest cart → register → cart merges with account?</td></tr><tr><td>Coupon</td><td>Apply coupon → remove qualifying item → coupon still applied?</td></tr><tr><td>Tax</td><td>Change shipping state → tax recalculated correctly?</td></tr><tr><td>Currency</td><td>Switch language/region → prices in correct currency?</td></tr><tr><td>Performance</td><td>Cart with 50 items → page load time?</td></tr></table>`},
{id:455,part:"I",level:"Senior",category:"Strategy",q:"How do you handle a situation where devs say 'it works on my machine'?",a:`<h4>Resolution Strategy</h4><ol><li><strong>Document your environment:</strong> OS, browser, version, screen resolution, network</li><li><strong>Share evidence:</strong> Screenshot, video recording, console logs, HAR file</li><li><strong>Reproduce together:</strong> Screen share with the developer</li><li><strong>Check environment diff:</strong><ul><li>Different API endpoint?</li><li>Different DB data?</li><li>Different feature flags?</li><li>Cache/cookies difference?</li></ul></li><li><strong>Try dev's environment:</strong> Ask them to reproduce on YOUR machine</li><li><strong>Check deployment:</strong> Are you both on same build version?</li></ol><div class="tip"><span class="tip-icon">\ud83d\udca1</span><div>Always include <strong>exact build number</strong> and <strong>exact steps</strong> in your bug report. "It doesn't work" is NOT a bug report.</div></div>`},
{id:456,part:"I",level:"Senior",category:"Scenario",q:"Scenario: Pagination — what test cases would you write?",a:`<table><tr><th>#</th><th>Scenario</th><th>Expected</th></tr><tr><td>1</td><td>Page 1 loads with default page size (10)</td><td>10 items shown, "Page 1 of N"</td></tr><tr><td>2</td><td>Click "Next" on last page</td><td>Button disabled or hidden</td></tr><tr><td>3</td><td>Click "Previous" on page 1</td><td>Button disabled</td></tr><tr><td>4</td><td>Jump to page 5 directly</td><td>Correct items shown</td></tr><tr><td>5</td><td>Change page size (10 → 50)</td><td>Reset to page 1, show 50 items</td></tr><tr><td>6</td><td>Total items = 0</td><td>"No records found" message</td></tr><tr><td>7</td><td>Total items = 1</td><td>No pagination controls shown</td></tr><tr><td>8</td><td>Delete item on current page</td><td>List refreshes, count updates</td></tr><tr><td>9</td><td>URL reflects page number</td><td>?page=3 → shows page 3 on refresh</td></tr><tr><td>10</td><td>Sort + filter + pagination combined</td><td>All work together correctly</td></tr></table>`},
{id:457,part:"I",level:"Senior",category:"Scenario",q:"Scenario: Date picker — test cases for date/time selection.",a:`<table><tr><th>#</th><th>Scenario</th><th>Expected</th></tr><tr><td>1</td><td>Select today's date</td><td>Works, no validation error</td></tr><tr><td>2</td><td>Select past date (if not allowed)</td><td>Past dates disabled/greyed out</td></tr><tr><td>3</td><td>Select Feb 29 on non-leap year</td><td>Date doesn't exist in picker</td></tr><tr><td>4</td><td>Select Dec 31 → Jan 1 (year boundary)</td><td>Year changes correctly</td></tr><tr><td>5</td><td>Type date manually vs picker</td><td>Both should validate the same</td></tr><tr><td>6</td><td>Different date formats (DD/MM vs MM/DD)</td><td>Based on locale setting</td></tr><tr><td>7</td><td>Start date > End date</td><td>Validation error</td></tr><tr><td>8</td><td>Timezone difference</td><td>UTC vs local time correct</td></tr><tr><td>9</td><td>Clear date field</td><td>Field resets, no stale data</td></tr><tr><td>10</td><td>Keyboard navigation (arrows, Enter)</td><td>Accessible, works without mouse</td></tr></table>`},
{id:458,part:"I",level:"Senior",category:"Scenario",q:"Scenario: User registration form — comprehensive test matrix.",a:`<table><tr><th>Field</th><th>Valid</th><th>Invalid</th><th>Edge Case</th></tr><tr><td>Name</td><td>"Boobala K"</td><td>Empty, only spaces</td><td>Unicode: "こんにちは", 100 chars</td></tr><tr><td>Email</td><td>"b@test.com"</td><td>"not-email", "b@", "@test.com"</td><td>"b+tag@gmail.com" (valid!)</td></tr><tr><td>Phone</td><td>"9876543210"</td><td>"123", "abc", "0000000000"</td><td>"+91 98765 43210" (formatted)</td></tr><tr><td>Password</td><td>"Str0ng!Pass"</td><td>"123", "password", "aaaa"</td><td>Paste from clipboard, 128 chars</td></tr><tr><td>DOB</td><td>"1990-01-15"</td><td>Future date, "1800-01-01"</td><td>Feb 29, user is exactly 18 today</td></tr><tr><td>Agree checkbox</td><td>Checked</td><td>Unchecked</td><td>Terms link opens in new tab</td></tr></table><p><strong>Cross-field:</strong> Password ≠ email, password ≠ name, confirm password matches</p>`},

// ═══════ MID LEVEL (5-7 yr) ═══════
{id:459,part:"I",level:"Mid",category:"Scenario",q:"Scenario: Login page — write basic test cases.",a:`<table><tr><th>#</th><th>Scenario</th><th>Expected</th></tr><tr><td>1</td><td>Valid username + valid password</td><td>Login success → dashboard</td></tr><tr><td>2</td><td>Valid username + wrong password</td><td>"Invalid credentials" error</td></tr><tr><td>3</td><td>Empty username + empty password</td><td>Validation: "Fields required"</td></tr><tr><td>4</td><td>SQL injection in username</td><td>No SQL execution, sanitized</td></tr><tr><td>5</td><td>Password field masked (dots/stars)</td><td>Characters not visible</td></tr><tr><td>6</td><td>"Remember me" checkbox</td><td>Auto-fills on next visit</td></tr><tr><td>7</td><td>"Forgot password" link</td><td>Redirects to reset page</td></tr><tr><td>8</td><td>Login with Caps Lock on</td><td>Warning shown to user</td></tr></table>`},
{id:460,part:"I",level:"Mid",category:"Scenario",q:"Scenario: Form validation — what do you test on every input field?",a:`<h4>Universal Input Field Checklist</h4><ol><li><strong>Required:</strong> Submit with field empty → error shown</li><li><strong>Max length:</strong> Enter more than max → truncated or error</li><li><strong>Min length:</strong> Enter less than min → error</li><li><strong>Valid format:</strong> Email, phone, zip code format</li><li><strong>Special characters:</strong> < > " ' & — handled correctly</li><li><strong>Leading/trailing spaces:</strong> Trimmed or flagged</li><li><strong>Copy-paste:</strong> Pasted data validated same as typed</li><li><strong>Tab order:</strong> Tab moves to next field logically</li><li><strong>Error messages:</strong> Meaningful, not generic "Invalid input"</li><li><strong>Error clears:</strong> Fix error → error message disappears</li></ol>`},
{id:461,part:"I",level:"Mid",category:"Basics",q:"What is the difference between smoke testing and sanity testing?",a:`<table><tr><th></th><th>Smoke Testing</th><th>Sanity Testing</th></tr><tr><td>When</td><td>After new build deployed</td><td>After specific bug fix</td></tr><tr><td>Scope</td><td>Broad — all major features</td><td>Narrow — only affected area</td></tr><tr><td>Depth</td><td>Shallow (surface-level)</td><td>Deeper in specific area</td></tr><tr><td>Goal</td><td>"Is the build stable enough to test?"</td><td>"Is this fix correct?"</td></tr><tr><td>Also called</td><td>Build Verification Test</td><td>Confidence testing</td></tr><tr><td>Example</td><td>Login, home page, search work</td><td>Fixed: login with special chars</td></tr></table>`},
{id:462,part:"I",level:"Mid",category:"Basics",q:"Alpha testing vs Beta testing — who does what?",a:`<table><tr><th></th><th>Alpha Testing</th><th>Beta Testing</th></tr><tr><td>Done by</td><td>Internal team (QA + devs)</td><td>Real users / external</td></tr><tr><td>Environment</td><td>Dev/QA environment</td><td>Production-like / real devices</td></tr><tr><td>Goal</td><td>Find bugs before release</td><td>Real-world feedback</td></tr><tr><td>Feedback</td><td>Bug reports</td><td>User experience, crashes</td></tr><tr><td>When</td><td>Before beta</td><td>Before GA (general availability)</td></tr></table>`},
{id:463,part:"I",level:"Mid",category:"Scenario",q:"Scenario: Testing a dropdown/select field.",a:`<table><tr><th>#</th><th>Scenario</th><th>Expected</th></tr><tr><td>1</td><td>Default value shown</td><td>"Select an option" placeholder</td></tr><tr><td>2</td><td>Select each option</td><td>Value stored correctly</td></tr><tr><td>3</td><td>Submit without selecting</td><td>Validation error if required</td></tr><tr><td>4</td><td>Options sorted correctly</td><td>Alphabetical or logical order</td></tr><tr><td>5</td><td>Dropdown with 100+ items</td><td>Scrollable, search/filter if present</td></tr><tr><td>6</td><td>Dependent dropdown (Country → State)</td><td>State list updates on country change</td></tr><tr><td>7</td><td>Keyboard navigation</td><td>Arrow keys + Enter to select</td></tr></table>`},
{id:464,part:"I",level:"Mid",category:"Basics",q:"What is a test case vs test scenario? Give examples.",a:`<table><tr><th></th><th>Test Scenario</th><th>Test Case</th></tr><tr><td>Level</td><td>High-level (what to test)</td><td>Detailed (how to test)</td></tr><tr><td>Contains</td><td>One-line description</td><td>Steps, data, expected result</td></tr><tr><td>Example</td><td>"Verify user login"</td><td>"Enter 'admin', 'pass123' → click Login → Dashboard loads"</td></tr></table><h4>Scenario: User Login</h4><ul><li><strong>TC-01:</strong> Login with valid credentials</li><li><strong>TC-02:</strong> Login with invalid password</li><li><strong>TC-03:</strong> Login with empty fields</li><li><strong>TC-04:</strong> Login with locked account</li></ul>`},
{id:465,part:"I",level:"Mid",category:"Scenario",q:"Scenario: Testing an email field — what do you check?",a:`<table><tr><th>Input</th><th>Valid?</th><th>Why</th></tr><tr><td>user@example.com</td><td>✅</td><td>Standard format</td></tr><tr><td>user@example</td><td>❌</td><td>No TLD</td></tr><tr><td>@example.com</td><td>❌</td><td>No local part</td></tr><tr><td>user@.com</td><td>❌</td><td>No domain name</td></tr><tr><td>user+tag@gmail.com</td><td>✅</td><td>Plus addressing is valid</td></tr><tr><td>user@exam ple.com</td><td>❌</td><td>Space not allowed</td></tr><tr><td>user@example.co.in</td><td>✅</td><td>Multi-level TLD</td></tr><tr><td>(empty)</td><td>❌</td><td>Required field</td></tr><tr><td>very.long.email...@example.com</td><td>✅*</td><td>Check max length (254 chars)</td></tr></table>`},
{id:466,part:"I",level:"Mid",category:"Scenario",q:"Scenario: Testing a password field — strength and validation.",a:`<table><tr><th>#</th><th>Scenario</th><th>Expected</th></tr><tr><td>1</td><td>Minimum 8 characters</td><td>"1234567" → too short error</td></tr><tr><td>2</td><td>Must include uppercase</td><td>"password1!" → no uppercase error</td></tr><tr><td>3</td><td>Must include number</td><td>"Password!" → no number error</td></tr><tr><td>4</td><td>Must include special char</td><td>"Password1" → no special char error</td></tr><tr><td>5</td><td>Show/hide toggle</td><td>Eye icon toggles visibility</td></tr><tr><td>6</td><td>Copy from password field</td><td>Should be disabled</td></tr><tr><td>7</td><td>Paste into password field</td><td>Should be allowed</td></tr><tr><td>8</td><td>Confirm password mismatch</td><td>"Passwords don't match" error</td></tr><tr><td>9</td><td>Strength indicator</td><td>Weak/Medium/Strong visual</td></tr></table>`},
{id:467,part:"I",level:"Mid",category:"Basics",q:"What is retesting vs regression testing?",a:`<table><tr><th></th><th>Retesting</th><th>Regression Testing</th></tr><tr><td>Purpose</td><td>Verify the bug fix</td><td>Ensure no side effects</td></tr><tr><td>Scope</td><td>Only the fixed area</td><td>Entire affected module + related</td></tr><tr><td>Test cases</td><td>Same failing test case</td><td>Previously passing test cases</td></tr><tr><td>Mandatory?</td><td>Yes, for every bug fix</td><td>Yes, for every release</td></tr><tr><td>Example</td><td>Bug: Login fails → Fixed → Retest login</td><td>After login fix, test: registration, profile, logout</td></tr></table>`},
{id:468,part:"I",level:"Mid",category:"Basics",q:"What is the defect life cycle?",a:`<pre><code>New → Open → Assigned → In Progress → Fixed → Retest\n   ↓                                          ↓\n Rejected                              Pass: Closed\n   ↓                                    Fail: Reopened\n Deferred                                     ↓\n                                        Back to Fixed</code></pre><table><tr><th>Status</th><th>Who</th><th>Action</th></tr><tr><td>New</td><td>QA</td><td>Logs the bug</td></tr><tr><td>Open</td><td>Lead</td><td>Reviews, assigns</td></tr><tr><td>In Progress</td><td>Dev</td><td>Working on fix</td></tr><tr><td>Fixed</td><td>Dev</td><td>Code deployed to QA</td></tr><tr><td>Retest</td><td>QA</td><td>Verifies the fix</td></tr><tr><td>Closed</td><td>QA</td><td>Fix confirmed</td></tr><tr><td>Reopened</td><td>QA</td><td>Fix doesn't work</td></tr></table>`},
{id:469,part:"I",level:"Mid",category:"Scenario",q:"Scenario: Testing a table/list view with sorting and filtering.",a:`<table><tr><th>#</th><th>Scenario</th><th>Expected</th></tr><tr><td>1</td><td>Sort by name ascending</td><td>A → Z order</td></tr><tr><td>2</td><td>Sort by name descending</td><td>Z → A order</td></tr><tr><td>3</td><td>Sort by date (newest first)</td><td>Latest date on top</td></tr><tr><td>4</td><td>Filter by status = "Active"</td><td>Only active records shown</td></tr><tr><td>5</td><td>Filter + Sort combined</td><td>Both applied correctly</td></tr><tr><td>6</td><td>Clear filters</td><td>All records shown again</td></tr><tr><td>7</td><td>Empty state after filter</td><td>"No records match" message</td></tr><tr><td>8</td><td>Column headers clickable</td><td>Toggle sort on click</td></tr></table>`},
{id:470,part:"I",level:"Mid",category:"Scenario",q:"Scenario: Testing image upload functionality.",a:`<table><tr><th>#</th><th>Scenario</th><th>Expected</th></tr><tr><td>1</td><td>Upload valid JPEG (500KB)</td><td>Preview shown, saved</td></tr><tr><td>2</td><td>Upload PNG, GIF, WebP</td><td>All accepted formats work</td></tr><tr><td>3</td><td>Upload BMP, TIFF (unsupported)</td><td>"Format not supported" error</td></tr><tr><td>4</td><td>Image > 5MB</td><td>"File too large" error</td></tr><tr><td>5</td><td>Image dimensions 5000x5000</td><td>Auto-resized or error</td></tr><tr><td>6</td><td>Upload → cancel mid-upload</td><td>Upload cancelled, no partial file</td></tr><tr><td>7</td><td>Replace existing image</td><td>Old image removed, new shown</td></tr><tr><td>8</td><td>Image preview loads correctly</td><td>Thumbnail accurate, not distorted</td></tr></table>`},
{id:471,part:"I",level:"Mid",category:"Basics",q:"Positive vs negative testing — give examples.",a:`<table><tr><th></th><th>Positive Testing</th><th>Negative Testing</th></tr><tr><td>Goal</td><td>Verify it works correctly</td><td>Verify it handles errors</td></tr><tr><td>Input</td><td>Valid, expected data</td><td>Invalid, unexpected data</td></tr><tr><td>Example 1</td><td>Login with correct password</td><td>Login with wrong password</td></tr><tr><td>Example 2</td><td>Upload valid PDF</td><td>Upload .exe file</td></tr><tr><td>Example 3</td><td>Enter valid phone number</td><td>Enter "abc" in phone field</td></tr><tr><td>Example 4</td><td>Add item to cart</td><td>Add 0 quantity to cart</td></tr></table><p><strong>Both are equally important!</strong> Positive testing ensures features work. Negative testing ensures the app doesn't crash.</p>`},
{id:472,part:"I",level:"Mid",category:"Scenario",q:"Scenario: Testing a modal/popup dialog.",a:`<table><tr><th>#</th><th>Scenario</th><th>Expected</th></tr><tr><td>1</td><td>Modal opens on button click</td><td>Overlay + modal visible</td></tr><tr><td>2</td><td>Click outside modal</td><td>Modal closes (or stays based on design)</td></tr><tr><td>3</td><td>Press Escape key</td><td>Modal closes</td></tr><tr><td>4</td><td>Click X close button</td><td>Modal closes</td></tr><tr><td>5</td><td>Scroll within modal (long content)</td><td>Modal scrolls, background stays fixed</td></tr><tr><td>6</td><td>Tab focus stays within modal</td><td>Focus doesn't go to background elements</td></tr><tr><td>7</td><td>Submit form inside modal</td><td>Data saved, modal closes</td></tr><tr><td>8</td><td>Open modal → resize browser</td><td>Modal stays centered, responsive</td></tr></table>`},
{id:473,part:"I",level:"Mid",category:"Scenario",q:"Scenario: Testing a toggle/switch control.",a:`<table><tr><th>#</th><th>Scenario</th><th>Expected</th></tr><tr><td>1</td><td>Default state (on/off)</td><td>Matches saved preference</td></tr><tr><td>2</td><td>Click to toggle ON</td><td>Visual changes, state saved</td></tr><tr><td>3</td><td>Click to toggle OFF</td><td>Visual reverts, state saved</td></tr><tr><td>4</td><td>Rapid toggle (click 10 times fast)</td><td>Final state is correct, no glitch</td></tr><tr><td>5</td><td>Refresh page after toggle</td><td>State persists</td></tr><tr><td>6</td><td>Toggle disabled state</td><td>Greyed out, click does nothing</td></tr><tr><td>7</td><td>Toggle triggers API call</td><td>Success/error feedback shown</td></tr></table>`},
{id:474,part:"I",level:"Mid",category:"Basics",q:"What are the different levels of testing?",a:`<pre><code>Unit Testing → Integration Testing → System Testing → UAT\n    (Dev)          (Dev/QA)            (QA)          (Business)</code></pre><table><tr><th>Level</th><th>Who</th><th>What</th><th>Example</th></tr><tr><td><strong>Unit</strong></td><td>Developer</td><td>Individual methods/functions</td><td>calculateTotal() returns correct sum</td></tr><tr><td><strong>Integration</strong></td><td>Dev + QA</td><td>Components working together</td><td>Login → Dashboard data loads</td></tr><tr><td><strong>System</strong></td><td>QA</td><td>End-to-end complete flows</td><td>Full checkout: browse → pay → confirm</td></tr><tr><td><strong>UAT</strong></td><td>Business</td><td>Meets business requirements</td><td>PO verifies the feature matches spec</td></tr></table>`},
{id:475,part:"I",level:"Mid",category:"Scenario",q:"Scenario: Cross-browser testing — what to check?",a:`<table><tr><th>Category</th><th>Check</th></tr><tr><td><strong>Layout</strong></td><td>Elements aligned, no overlap, responsive</td></tr><tr><td><strong>Fonts</strong></td><td>Correct font rendered, fallback works</td></tr><tr><td><strong>Images</strong></td><td>All images load, correct resolution</td></tr><tr><td><strong>Forms</strong></td><td>Date picker, dropdowns, file upload work</td></tr><tr><td><strong>CSS</strong></td><td>Gradients, shadows, animations render</td></tr><tr><td><strong>JavaScript</strong></td><td>All interactions work (modals, accordions)</td></tr><tr><td><strong>Scrolling</strong></td><td>Smooth scroll, sticky headers work</td></tr></table><h4>Browser Priority</h4><ol><li>Chrome (65% market share)</li><li>Safari (18% — especially mobile)</li><li>Firefox (3%)</li><li>Edge (5%)</li></ol>`},
{id:476,part:"I",level:"Mid",category:"Scenario",q:"Scenario: Testing a 'Delete' functionality.",a:`<table><tr><th>#</th><th>Scenario</th><th>Expected</th></tr><tr><td>1</td><td>Click Delete → confirm</td><td>Item removed from list and DB</td></tr><tr><td>2</td><td>Click Delete → cancel</td><td>Item NOT deleted</td></tr><tr><td>3</td><td>Delete last item in list</td><td>Empty state message shown</td></tr><tr><td>4</td><td>Delete item with dependencies</td><td>Warning: "This will also delete X"</td></tr><tr><td>5</td><td>Undo delete (if supported)</td><td>Item restored within time window</td></tr><tr><td>6</td><td>Bulk delete (select 5 → delete)</td><td>All 5 removed, count updates</td></tr><tr><td>7</td><td>Delete → refresh page</td><td>Item still gone (not cached)</td></tr></table>`},
{id:477,part:"I",level:"Mid",category:"Scenario",q:"Scenario: Testing a multi-step wizard/form.",a:`<table><tr><th>#</th><th>Scenario</th><th>Expected</th></tr><tr><td>1</td><td>Complete Step 1 → Next</td><td>Step 2 loads, Step 1 data saved</td></tr><tr><td>2</td><td>Click Back from Step 2</td><td>Step 1 data still populated</td></tr><tr><td>3</td><td>Skip required field in Step 1 → Next</td><td>Validation stops navigation</td></tr><tr><td>4</td><td>Progress indicator shows current step</td><td>Step 2 of 4 highlighted</td></tr><tr><td>5</td><td>Refresh on Step 3</td><td>Data persisted or user warned</td></tr><tr><td>6</td><td>Complete all steps → Submit</td><td>Summary shown, data saved correctly</td></tr><tr><td>7</td><td>Browser back button on Step 2</td><td>Goes to Step 1 (not previous page)</td></tr></table>`},
{id:478,part:"I",level:"Mid",category:"Basics",q:"What is traceability matrix? Why is it important?",a:`<h4>Requirements Traceability Matrix (RTM)</h4><table><tr><th>Requirement ID</th><th>Test Case ID</th><th>Status</th><th>Defect ID</th></tr><tr><td>REQ-001: User login</td><td>TC-001, TC-002</td><td>✅ Pass</td><td>—</td></tr><tr><td>REQ-002: OTP verify</td><td>TC-003, TC-004</td><td>❌ Fail</td><td>BUG-101</td></tr><tr><td>REQ-003: Dashboard</td><td>TC-005</td><td>✅ Pass</td><td>—</td></tr></table><h4>Why Important?</h4><ul><li>Ensures 100% requirement coverage</li><li>Identifies gaps — requirements without tests</li><li>Tracks testing progress per requirement</li><li>Audit trail for compliance</li></ul>`}
);
