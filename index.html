{id:151,part:"D",category:"Joins",q:"Explain INNER, LEFT, RIGHT, FULL OUTER, and CROSS joins.",a:`<table><tr><th>Join</th><th>Returns</th><th>Use Case</th></tr><tr><td>INNER JOIN</td><td>Matching rows from both tables</td><td>Get orders WITH customers</td></tr><tr><td>LEFT JOIN</td><td>All left + matching right (NULL if no match)</td><td>Find customers WITHOUT orders</td></tr><tr><td>RIGHT JOIN</td><td>All right + matching left</td><td>Rarely used (rewrite as LEFT)</td></tr><tr><td>FULL OUTER</td><td>All rows from both (NULL where no match)</td><td>Reconciliation / data migration</td></tr><tr><td>CROSS JOIN</td><td>Cartesian product (every combination)</td><td>Generate test data combinations</td></tr></table><pre><code>-- Anti-join: Find customers with NO orders\nSELECT c.name FROM customers c\nLEFT JOIN orders o ON c.id = o.customer_id\nWHERE o.id IS NULL;</code></pre>`},
{id:152,part:"D",category:"Joins",q:"Self Join — find employee-manager pairs and hierarchies.",a:`<pre><code>-- Self Join: Employee with their Manager name\nSELECT e.name AS employee, m.name AS manager\nFROM employees e\nLEFT JOIN employees m ON e.manager_id = m.id;\n\n-- Find employees who earn more than their manager\nSELECT e.name, e.salary AS emp_salary, m.salary AS mgr_salary\nFROM employees e\nJOIN employees m ON e.manager_id = m.id\nWHERE e.salary > m.salary;</code></pre>`},
{id:153,part:"D",category:"Subqueries",q:"Correlated vs Non-correlated subqueries. Performance impact?",a:`<pre><code>-- Non-correlated: Runs ONCE, result cached\nSELECT * FROM employees\nWHERE salary > (SELECT AVG(salary) FROM employees);\n\n-- Correlated: Runs ONCE PER ROW (slow on large tables!)\nSELECT e.name, e.salary\nFROM employees e\nWHERE e.salary > (\n    SELECT AVG(salary) FROM employees WHERE dept_id = e.dept_id\n);</code></pre><div class="important"><span class="tip-icon">❗</span><div>Correlated subqueries execute for <strong>every row</strong> in the outer query. Rewrite as JOIN or CTE for better performance.</div></div>`},
{id:154,part:"D",category:"Subqueries",q:"CTE (Common Table Expression) — recursive CTE for hierarchies.",a:`<pre><code>-- Reusable CTE\nWITH active_users AS (\n    SELECT user_id, COUNT(*) as order_count\n    FROM orders WHERE status = 'COMPLETED'\n    GROUP BY user_id\n)\nSELECT u.name, a.order_count\nFROM users u JOIN active_users a ON u.id = a.user_id;\n\n-- Recursive CTE: Organization hierarchy\nWITH RECURSIVE org_tree AS (\n    SELECT id, name, manager_id, 1 AS level\n    FROM employees WHERE manager_id IS NULL\n    UNION ALL\n    SELECT e.id, e.name, e.manager_id, t.level + 1\n    FROM employees e JOIN org_tree t ON e.manager_id = t.id\n)\nSELECT * FROM org_tree;</code></pre>`},
{id:155,part:"D",category:"Window",q:"ROW_NUMBER vs RANK vs DENSE_RANK — handling ties.",a:`<pre><code>SELECT name, salary,\n    ROW_NUMBER() OVER (ORDER BY salary DESC) as row_num,\n    RANK()       OVER (ORDER BY salary DESC) as rank_val,\n    DENSE_RANK() OVER (ORDER BY salary DESC) as dense_rank_val\nFROM employees;</code></pre><table><tr><th>Name</th><th>Salary</th><th>ROW_NUMBER</th><th>RANK</th><th>DENSE_RANK</th></tr><tr><td>Alice</td><td>5000</td><td>1</td><td>1</td><td>1</td></tr><tr><td>Bob</td><td>5000</td><td>2</td><td>1</td><td>1</td></tr><tr><td>Charlie</td><td>4000</td><td>3</td><td>3</td><td>2</td></tr><tr><td>David</td><td>3000</td><td>4</td><td>4</td><td>3</td></tr></table><p><strong>DENSE_RANK</strong> for "Nth highest" problems. <strong>ROW_NUMBER</strong> for pagination.</p>`},
{id:156,part:"D",category:"Window",q:"LAG and LEAD — compare rows with previous/next.",a:`<pre><code>-- Month-over-month revenue comparison\nSELECT month, revenue,\n    LAG(revenue, 1) OVER (ORDER BY month) AS prev_month,\n    revenue - LAG(revenue, 1) OVER (ORDER BY month) AS growth\nFROM monthly_revenue;\n\n-- Detect gaps in sequential IDs\nSELECT id, LEAD(id) OVER (ORDER BY id) - id AS gap\nFROM orders;</code></pre>`},
{id:157,part:"D",category:"Window",q:"Running totals and moving averages with window functions.",a:`<pre><code>-- Running total\nSELECT date, amount,\n    SUM(amount) OVER (ORDER BY date) AS running_total\nFROM sales;\n\n-- 7-day moving average\nSELECT date, amount,\n    AVG(amount) OVER (\n        ORDER BY date ROWS BETWEEN 6 PRECEDING AND CURRENT ROW\n    ) AS moving_avg_7d\nFROM daily_metrics;\n\n-- Percentage of department total\nSELECT dept, salary,\n    salary * 100.0 / SUM(salary) OVER (PARTITION BY dept) AS pct\nFROM employees;</code></pre>`},
{id:158,part:"D",category:"Classic",q:"Find Nth highest salary — multiple approaches.",a:`<pre><code>-- Approach 1: DENSE_RANK (handles ties) ✅\nSELECT salary FROM (\n    SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC) AS rnk\n    FROM employees\n) ranked WHERE rnk = N;\n\n-- Approach 2: OFFSET/LIMIT\nSELECT DISTINCT salary FROM employees\nORDER BY salary DESC LIMIT 1 OFFSET N-1;\n\n-- Approach 3: Subquery (2nd highest only)\nSELECT MAX(salary) FROM employees\nWHERE salary &lt; (SELECT MAX(salary) FROM employees);</code></pre>`},
{id:159,part:"D",category:"Classic",q:"Find and delete duplicate records keeping one.",a:`<pre><code>-- Find duplicates\nSELECT email, COUNT(*) FROM users\nGROUP BY email HAVING COUNT(*) > 1;\n\n-- Delete duplicates keeping lowest ID (MySQL)\nDELETE u1 FROM users u1\nJOIN users u2 ON u1.email = u2.email AND u1.id > u2.id;\n\n-- Using CTE (PostgreSQL/SQL Server)\nWITH ranked AS (\n    SELECT id, ROW_NUMBER() OVER (PARTITION BY email ORDER BY id) AS rn\n    FROM users\n)\nDELETE FROM users WHERE id IN (SELECT id FROM ranked WHERE rn > 1);</code></pre>`},
{id:160,part:"D",category:"Classic",q:"Gaps and Islands — find consecutive login streaks.",a:`<pre><code>-- Find users with 3+ consecutive login days\nWITH login_groups AS (\n    SELECT user_id, login_date,\n        login_date - INTERVAL ROW_NUMBER() OVER (\n            PARTITION BY user_id ORDER BY login_date\n        ) DAY AS grp\n    FROM user_logins\n)\nSELECT user_id, MIN(login_date) AS streak_start,\n    MAX(login_date) AS streak_end,\n    COUNT(*) AS consecutive_days\nFROM login_groups\nGROUP BY user_id, grp\nHAVING COUNT(*) >= 3;</code></pre><p><strong>The trick:</strong> Subtracting ROW_NUMBER from date creates a constant group identifier for consecutive dates.</p>`},
{id:161,part:"D",category:"Classic",q:"Employees earning more than department average.",a:`<pre><code>-- Using window function\nSELECT name, dept, salary, dept_avg FROM (\n    SELECT name, dept, salary,\n        AVG(salary) OVER (PARTITION BY dept) AS dept_avg\n    FROM employees\n) sub WHERE salary > dept_avg;\n\n-- Using correlated subquery\nSELECT name, dept, salary\nFROM employees e\nWHERE salary > (SELECT AVG(salary) FROM employees WHERE dept = e.dept);</code></pre>`},
{id:162,part:"D",category:"Optimization",q:"EXPLAIN plan — how to diagnose slow queries.",a:`<pre><code>EXPLAIN ANALYZE SELECT * FROM orders\nWHERE customer_id = 123 AND status = 'ACTIVE';\n\n-- Key things to look for:\n-- type: ALL (full scan ❌) vs ref/eq_ref (index ✅)\n-- rows: estimated rows scanned\n-- Extra: "Using filesort" or "Using temporary" = slow\n-- key: which index being used (NULL = no index)</code></pre><h4>Optimization Checklist</h4><ul><li>Avoid <code>SELECT *</code></li><li>Add indexes on WHERE, JOIN, ORDER BY columns</li><li>Avoid functions on indexed columns in WHERE</li><li>Use <code>EXISTS</code> instead of <code>IN</code> for large subqueries</li><li>Filter early with WHERE before JOIN</li></ul>`},
{id:163,part:"D",category:"Optimization",q:"Clustered vs Non-clustered indexes. Composite index rules.",a:`<table><tr><th></th><th>Clustered</th><th>Non-Clustered</th></tr><tr><td>Storage</td><td>Physical row order</td><td>Separate structure</td></tr><tr><td>Count</td><td>1 per table</td><td>Multiple</td></tr><tr><td>Speed</td><td>Fastest for ranges</td><td>Fast for lookups</td></tr></table><pre><code>-- Composite index: LEFT-PREFIX rule\nCREATE INDEX idx_dept ON employees(dept, status, name);\n-- ✅ WHERE dept = 'QA'\n-- ✅ WHERE dept = 'QA' AND status = 'ACTIVE'\n-- ❌ WHERE status = 'ACTIVE' (skips dept = no index!)</code></pre>`},
{id:164,part:"D",category:"ACID",q:"ACID properties — how do you test transactions?",a:`<table><tr><th>Property</th><th>Meaning</th><th>How to Test</th></tr><tr><td><strong>Atomicity</strong></td><td>All or nothing</td><td>Force failure mid-txn → verify no partial data</td></tr><tr><td><strong>Consistency</strong></td><td>Valid state transitions</td><td>Verify constraints hold after writes</td></tr><tr><td><strong>Isolation</strong></td><td>No interference</td><td>Parallel writes → check for dirty reads</td></tr><tr><td><strong>Durability</strong></td><td>Committed = permanent</td><td>Commit → kill server → verify data exists</td></tr></table>`},
{id:165,part:"D",category:"ACID",q:"Transaction isolation levels — dirty, phantom, non-repeatable reads.",a:`<table><tr><th>Level</th><th>Dirty Read</th><th>Non-Repeatable</th><th>Phantom</th></tr><tr><td>READ UNCOMMITTED</td><td>✅</td><td>✅</td><td>✅</td></tr><tr><td>READ COMMITTED</td><td>❌</td><td>✅</td><td>✅</td></tr><tr><td>REPEATABLE READ</td><td>❌</td><td>❌</td><td>✅</td></tr><tr><td>SERIALIZABLE</td><td>❌</td><td>❌</td><td>❌</td></tr></table>`},
{id:166,part:"D",category:"Testing",q:"How do you validate API responses against database records?",a:`<pre><code>// 1. Call API\nResponse response = given().get("/api/users/123");\nUserDTO apiUser = response.as(UserDTO.class);\n\n// 2. Query DB directly\nResultSet rs = stmt.executeQuery("SELECT * FROM users WHERE id = 123");\n\n// 3. Compare\nassertEquals(apiUser.getName(), rs.getString("name"));\nassertEquals(apiUser.getEmail(), rs.getString("email"));\nassertEquals(apiUser.getStatus(), rs.getString("status"));</code></pre>`},
{id:167,part:"D",category:"Testing",q:"Data migration testing — how to verify correctness?",a:`<h4>Validation Strategy</h4><ol><li><strong>Row count:</strong> <code>SELECT COUNT(*) FROM source</code> vs target</li><li><strong>Checksum:</strong> <code>SELECT MD5(GROUP_CONCAT(col))</code></li><li><strong>Sample verification:</strong> Random 100 rows, compare all columns</li><li><strong>Boundary records:</strong> First/last, NULLs, edge cases</li><li><strong>FK integrity:</strong> All references still valid</li></ol><pre><code>-- Find records in source but NOT in target\nSELECT s.id FROM source_db.users s\nLEFT JOIN target_db.users t ON s.id = t.id\nWHERE t.id IS NULL;</code></pre>`},
{id:168,part:"D",category:"Advanced",q:"Stored Procedures vs Functions — testing approach.",a:`<table><tr><th></th><th>Stored Procedure</th><th>Function</th></tr><tr><td>Returns</td><td>Multiple result sets</td><td>Single value or table</td></tr><tr><td>DML</td><td>✅ INSERT/UPDATE/DELETE</td><td>❌ No (most RDBMS)</td></tr><tr><td>Transaction</td><td>Can manage</td><td>Cannot</td></tr></table><pre><code>CALL process_payment(123, 500.00, @result, @message);\nSELECT @result, @message;\n-- Verify: @result = 'SUCCESS'\n-- Verify: account balance decreased\n-- Verify: transaction_log has new entry</code></pre>`},
{id:169,part:"D",category:"Advanced",q:"Views vs Materialized Views — performance implications.",a:`<table><tr><th></th><th>View</th><th>Materialized View</th></tr><tr><td>Storage</td><td>Virtual (re-runs each time)</td><td>Physically stored</td></tr><tr><td>Performance</td><td>Same as query</td><td>Fast (pre-computed)</td></tr><tr><td>Freshness</td><td>Always current</td><td>Stale until refreshed</td></tr><tr><td>Use case</td><td>Simplify queries</td><td>Dashboard reports</td></tr></table>`},
{id:170,part:"D",category:"Advanced",q:"Triggers — how do you test audit logging triggers?",a:`<pre><code>-- Audit trigger\nCREATE TRIGGER audit_users AFTER UPDATE ON users\nFOR EACH ROW\nINSERT INTO audit_log (table_name, record_id, old_val, new_val)\nVALUES ('users', OLD.id, OLD.email, NEW.email);\n\n-- Test:\n-- 1. UPDATE users SET email = 'new@test.com' WHERE id = 1;\n-- 2. SELECT * FROM audit_log WHERE record_id = 1;\n-- 3. Verify old/new values and timestamp</code></pre>`},
{id:171,part:"D",category:"NULL",q:"NULL handling — traps and best practices.",a:`<pre><code>SELECT * FROM users WHERE phone = NULL;  -- ❌ Returns nothing!\nSELECT * FROM users WHERE phone IS NULL; -- ✅ Correct\n\n-- NULL in aggregates: ignored by AVG, SUM, COUNT(col)\n-- COUNT(*) counts ALL rows including NULL\n\n-- COALESCE: default for NULL\nSELECT name, COALESCE(phone, 'N/A') FROM users;\n\n-- NOT IN with NULL trap!\nSELECT * FROM orders WHERE status NOT IN ('CANCELLED', NULL);\n-- Returns NOTHING! NOT IN with NULL = always false</code></pre>`},
{id:172,part:"D",category:"Queries",q:"UNION vs UNION ALL vs INTERSECT vs EXCEPT.",a:`<table><tr><th>Operator</th><th>Duplicates</th><th>Performance</th></tr><tr><td>UNION</td><td>Removes</td><td>Slower (sorts)</td></tr><tr><td>UNION ALL</td><td>Keeps</td><td>Faster</td></tr><tr><td>INTERSECT</td><td>Common rows only</td><td>Medium</td></tr><tr><td>EXCEPT</td><td>In first NOT second</td><td>Medium</td></tr></table><pre><code>-- Data reconciliation\nSELECT id, email FROM production.users\nEXCEPT\nSELECT id, email FROM staging.users;</code></pre>`},
{id:173,part:"D",category:"Queries",q:"GROUP BY with HAVING — filter aggregated results.",a:`<pre><code>SELECT dept, COUNT(*) as emp_count, AVG(salary) as avg_sal\nFROM employees\nGROUP BY dept\nHAVING COUNT(*) > 5 AND AVG(salary) > 50000;\n\n-- WHERE filters ROWS before grouping\n-- HAVING filters GROUPS after grouping\n-- ❌ WHERE COUNT(*) > 5\n-- ✅ HAVING COUNT(*) > 5</code></pre>`},
{id:174,part:"D",category:"Queries",q:"CASE WHEN — conditional logic in SQL.",a:`<pre><code>SELECT test_name,\n    CASE\n        WHEN pass_rate >= 95 THEN '🟢 Stable'\n        WHEN pass_rate >= 80 THEN '🟡 Flaky'\n        ELSE '🔴 Broken'\n    END AS health\nFROM test_metrics;\n\n-- Pivot: Rows to Columns\nSELECT\n    COUNT(CASE WHEN status = 'PASS' THEN 1 END) AS passed,\n    COUNT(CASE WHEN status = 'FAIL' THEN 1 END) AS failed\nFROM test_results;</code></pre>`},
{id:175,part:"D",category:"Queries",q:"EXISTS vs IN — performance difference.",a:`<table><tr><th></th><th>IN</th><th>EXISTS</th></tr><tr><td>Large subquery</td><td>❌ Slow</td><td>✅ Fast (stops early)</td></tr><tr><td>Small subquery</td><td>✅ Fast</td><td>Similar</td></tr><tr><td>NULL handling</td><td>⚠️ NOT IN fails</td><td>✅ Safe</td></tr></table>`},
{id:176,part:"D",category:"Queries",q:"Pivot — transform rows to columns.",a:`<pre><code>SELECT product,\n    SUM(CASE WHEN MONTH(date) = 1 THEN amount ELSE 0 END) AS Jan,\n    SUM(CASE WHEN MONTH(date) = 2 THEN amount ELSE 0 END) AS Feb,\n    SUM(CASE WHEN MONTH(date) = 3 THEN amount ELSE 0 END) AS Mar\nFROM sales GROUP BY product;</code></pre>`},
{id:177,part:"D",category:"Queries",q:"String and date functions for QA data validation.",a:`<pre><code>-- String validation\nSELECT email FROM users\nWHERE email NOT REGEXP '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\\\.[A-Za-z]{2,}$';\n\n-- Phone length check\nSELECT phone FROM members WHERE LENGTH(REPLACE(phone, ' ', '')) != 10;\n\n-- Records from last 30 days\nSELECT * FROM orders WHERE created_at >= NOW() - INTERVAL 30 DAY;\n\n-- Age calculation\nSELECT name, TIMESTAMPDIFF(YEAR, dob, CURDATE()) AS age FROM members;</code></pre>`},
{id:178,part:"D",category:"MongoDB",q:"MongoDB vs SQL — key differences for QA.",a:`<table><tr><th></th><th>SQL</th><th>MongoDB</th></tr><tr><td>Structure</td><td>Tables, rows</td><td>Collections, documents</td></tr><tr><td>Schema</td><td>Fixed</td><td>Flexible</td></tr><tr><td>Joins</td><td>Native</td><td>$lookup (slower)</td></tr><tr><td>Transactions</td><td>Full ACID</td><td>Multi-doc ACID (4.0+)</td></tr><tr><td>Scaling</td><td>Vertical</td><td>Horizontal (sharding)</td></tr></table><pre><code>// MongoDB queries\ndb.users.find({ status: "ACTIVE" });\ndb.orders.aggregate([\n    { $group: { _id: "$status", count: { $sum: 1 } } }\n]);</code></pre>`},
{id:179,part:"D",category:"MongoDB",q:"MongoDB aggregation pipeline for QA validation.",a:`<pre><code>db.subscriptions.aggregate([\n    { $match: { purchased_by: "OSHP-12345" } },\n    { $lookup: {\n        from: "insurance_owner",\n        localField: "purchased_by",\n        foreignField: "oshp_id", as: "owner"\n    }},\n    { $unwind: "$owner" },\n    { $project: { plan: "$plan_name", owner_name: "$owner.name" }}\n]);</code></pre>`},
{id:180,part:"D",category:"Design",q:"Database indexing strategy for a QA test database.",a:`<pre><code>-- Index selection checklist for QA:\n-- 1. Columns in WHERE clauses (high selectivity first)\n-- 2. JOIN columns (always index FK columns)\n-- 3. ORDER BY columns (avoid filesort)\n-- 4. Covering indexes (include SELECT columns)\n\n-- Monitor index usage\nSELECT * FROM sys.schema_unused_indexes;\nSELECT * FROM sys.schema_index_statistics\nORDER BY rows_selected DESC;</code></pre><div class="tip"><span class="tip-icon">💡</span><div>Over-indexing hurts write performance. For QA test databases, index only what your queries actually filter on.</div></div>`},

// ──────────── PART E: CI/CD ────────────
{id:181,part:"E",category:"Pipeline",q:"What is CI/CD? How do CI, CD (Delivery), and CD (Deployment) differ?",a:`<table><tr><th>Stage</th><th>What Happens</th><th>Automated?</th></tr><tr><td><strong>CI</strong> (Continuous Integration)</td><td>Build + Unit Test on every commit</td><td>✅ Fully</td></tr><tr><td><strong>CD</strong> (Continuous Delivery)</td><td>CI + deploy to staging, manual prod approval</td><td>✅ to staging</td></tr><tr><td><strong>CD</strong> (Continuous Deployment)</td><td>Every passing change goes to prod</td><td>✅ Fully</td></tr></table>`},
{id:182,part:"E",category:"Pipeline",q:"How would you design a CI/CD pipeline for a QA project?",a:`<pre><code>Commit → Build (Maven) → Unit Test → Deploy Staging → E2E (Playwright)\n                                                          ↓\n                                                    Quality Gate\n                                                    (Coverage ≥80%,\n                                                     0 Critical bugs)\n                                                          ↓ ✅\n                                                    Deploy Prod\n                                                    (Manual Gate)</code></pre>`},
{id:183,part:"E",category:"Pipeline",q:"Quality Gates — what criteria should block a deployment?",a:`<table><tr><th>Gate</th><th>Threshold</th><th>Tool</th></tr><tr><td>Unit test pass rate</td><td>100%</td><td>TestNG</td></tr><tr><td>Code coverage</td><td>≥ 80%</td><td>JaCoCo</td></tr><tr><td>Critical bugs</td><td>0</td><td>SonarQube</td></tr><tr><td>Security vulnerabilities</td><td>0 High</td><td>Snyk / OWASP</td></tr><tr><td>E2E smoke tests</td><td>100%</td><td>Playwright</td></tr></table>`},
{id:184,part:"E",category:"GitHub Actions",q:"GitHub Actions — workflow structure, triggers, caching.",a:`<pre><code>name: CI Pipeline\non:\n  push: { branches: [main, develop] }\n  pull_request: { branches: [main] }\n  schedule: [{ cron: '0 6 * * 1-5' }]\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-java@v4\n        with: { java-version: '17' }\n      - name: Cache Maven\n        uses: actions/cache@v4\n        with:\n          path: ~/.m2/repository\n          key: \${{ runner.os }}-maven-\${{ hashFiles('pom.xml') }}\n      - run: mvn test</code></pre>`},
{id:185,part:"E",category:"GitHub Actions",q:"Matrix strategy — run tests across browsers/environments.",a:`<pre><code>strategy:\n  fail-fast: false\n  matrix:\n    browser: [chromium, firefox, webkit]\n    env: [qa, staging]\n    exclude:\n      - browser: webkit\n        env: staging</code></pre><div class="tip"><span class="tip-icon">💡</span><div><code>fail-fast: false</code> ensures all browser results are collected even if one fails.</div></div>`},
{id:186,part:"E",category:"GitHub Actions",q:"Artifacts, secrets, and environment variables.",a:`<pre><code>- name: Upload Reports\n  if: always()\n  uses: actions/upload-artifact@v4\n  with:\n    name: test-reports\n    path: target/extent-reports/\n\n- name: Deploy\n  env:\n    DB_PASSWORD: \${{ secrets.QA_DB_PASSWORD }}\n  run: ./deploy.sh</code></pre>`},
{id:187,part:"E",category:"Docker",q:"Docker multi-stage builds for test automation.",a:`<pre><code># Stage 1: Build\nFROM maven:3.9-eclipse-temurin-17 AS builder\nCOPY pom.xml .\nRUN mvn dependency:go-offline\nCOPY src/ src/\nRUN mvn compile -DskipTests\n\n# Stage 2: Run (smaller image)\nFROM mcr.microsoft.com/playwright/java:v1.49.0\nCOPY --from=builder /app/target/ target/\nENTRYPOINT ["mvn", "test", "-Dheadless=true"]</code></pre>`},
{id:188,part:"E",category:"Docker",q:"Docker Compose for QA test environments.",a:`<pre><code>services:\n  app:\n    image: myapp:latest\n    ports: ['8080:8080']\n    depends_on: [db]\n  db:\n    image: mysql:8.0\n    environment:\n      MYSQL_ROOT_PASSWORD: test123\n  tests:\n    build: ./tests\n    depends_on: [app]\n    command: mvn test -Denv=docker</code></pre>`},
{id:189,part:"E",category:"Deployment",q:"Blue-Green vs Canary vs Rolling deployment strategies.",a:`<table><tr><th>Strategy</th><th>How</th><th>Rollback</th><th>Risk</th></tr><tr><td><strong>Blue-Green</strong></td><td>Two envs, switch at LB</td><td>Instant</td><td>Low</td></tr><tr><td><strong>Canary</strong></td><td>Gradual traffic (5%→100%)</td><td>Fast</td><td>Very Low</td></tr><tr><td><strong>Rolling</strong></td><td>Replace one by one</td><td>Slow</td><td>Medium</td></tr></table>`},
{id:190,part:"E",category:"Deployment",q:"How do you handle rollback in CI/CD?",a:`<pre><code># GitOps rollback\ngit revert HEAD && git push\n\n# Kubernetes rollback\nkubectl rollout undo deployment/myapp\n\n# Health-check triggered\nSTATUS=$(curl -s -o /dev/null -w '%{http_code}' $URL/health)\nif [ "$STATUS" != "200" ]; then\n  kubectl rollout undo deployment/myapp\nfi</code></pre>`},
{id:191,part:"E",category:"Kubernetes",q:"Kubernetes basics for QA — Pods, Deployments, Services.",a:`<table><tr><th>Resource</th><th>What</th><th>QA Use</th></tr><tr><td><strong>Pod</strong></td><td>Smallest unit (1+ containers)</td><td>Where app runs</td></tr><tr><td><strong>Deployment</strong></td><td>Manages replicas + updates</td><td>Desired state</td></tr><tr><td><strong>Service</strong></td><td>Stable network endpoint</td><td>How tests reach app</td></tr><tr><td><strong>ConfigMap</strong></td><td>External config</td><td>Env-specific test config</td></tr><tr><td><strong>Secret</strong></td><td>Encrypted data</td><td>DB passwords</td></tr></table>`},
{id:192,part:"E",category:"Testing",q:"How do you integrate test automation into CI/CD?",a:`<table><tr><th>Stage</th><th>Tests</th><th>Trigger</th><th>Duration</th></tr><tr><td>Pre-commit</td><td>Lint, unit</td><td>git push</td><td>&lt; 2 min</td></tr><tr><td>PR Pipeline</td><td>Unit + API smoke</td><td>Pull request</td><td>&lt; 10 min</td></tr><tr><td>Post-merge</td><td>Full integration</td><td>Merge to main</td><td>&lt; 30 min</td></tr><tr><td>Nightly</td><td>Full E2E + cross-browser</td><td>Scheduled</td><td>&lt; 60 min</td></tr></table>`},
{id:193,part:"E",category:"Testing",q:"How do you handle flaky tests in CI/CD?",a:`<table><tr><th>Cause</th><th>Fix</th></tr><tr><td>Race condition</td><td>Explicit waits, not Thread.sleep()</td></tr><tr><td>Test data collision</td><td>Unique data per run</td></tr><tr><td>Environment instability</td><td>Health checks in @BeforeSuite</td></tr><tr><td>Shared mutable state</td><td>Isolate tests, fresh setup</td></tr></table>`},
{id:194,part:"E",category:"Testing",q:"Shift-Left Testing — how to implement in CI/CD?",a:`<table><tr><th>Stage</th><th>Shift-Left Practice</th></tr><tr><td>Design</td><td>QA in sprint planning</td></tr><tr><td>Development</td><td>TDD, static analysis</td></tr><tr><td>Pre-commit</td><td>Pre-commit hooks: lint, type check</td></tr><tr><td>PR</td><td>Automated tests on every PR</td></tr><tr><td>Build</td><td>Security scans (SAST/DAST)</td></tr></table>`},
{id:195,part:"E",category:"Jenkins",q:"Jenkins vs GitHub Actions — when to use each?",a:`<table><tr><th></th><th>Jenkins</th><th>GitHub Actions</th></tr><tr><td>Hosting</td><td>Self-hosted</td><td>Cloud-hosted</td></tr><tr><td>Config</td><td>Jenkinsfile (Groovy)</td><td>YAML</td></tr><tr><td>Scaling</td><td>Manual agents</td><td>Auto-scaling</td></tr><tr><td>Best for</td><td>Enterprise, on-prem</td><td>GitHub-native, cloud</td></tr></table>`},
{id:196,part:"E",category:"Jenkins",q:"Jenkinsfile — declarative pipeline structure.",a:`<pre><code>pipeline {\n    agent { docker { image 'maven:3.9-temurin-17' } }\n    stages {\n        stage('Build') { steps { sh 'mvn compile' } }\n        stage('Test') {\n            parallel {\n                stage('Unit') { steps { sh 'mvn test -Dgroups=unit' } }\n                stage('API')  { steps { sh 'mvn test -Dgroups=api' } }\n            }\n        }\n    }\n    post {\n        always { junit 'target/surefire-reports/*.xml' }\n        failure { slackSend message: "Build failed" }\n    }\n}</code></pre>`},
{id:197,part:"E",category:"Security",q:"How do you handle secrets in CI/CD pipelines?",a:`<ol><li><strong>NEVER</strong> hardcode secrets</li><li><strong>NEVER</strong> log secrets</li><li>Use vault: GitHub Secrets, AWS Secrets Manager, HashiCorp Vault</li><li>Rotate every 90 days</li><li>Least privilege per service</li></ol>`},
{id:198,part:"E",category:"Monitoring",q:"Post-deployment monitoring — how to verify a deployment?",a:`<pre><code># Verification pipeline\ncurl -f $PROD_URL/health || exit 1\nmvn test -Dgroups=smoke -Denv=prod\nERROR_RATE=$(curl -s $GRAFANA_API/error-rate)\nif [ "$ERROR_RATE" -gt 5 ]; then\n  kubectl rollout undo deployment/myapp\nfi</code></pre>`},
{id:199,part:"E",category:"Advanced",q:"GitOps — what is it and how does it relate to CI/CD?",a:`<table><tr><th>Traditional CI/CD</th><th>GitOps</th></tr><tr><td>Pipeline pushes to cluster</td><td>Agent pulls from Git</td></tr><tr><td>Imperative</td><td>Declarative</td></tr><tr><td>Pipeline has credentials</td><td>Only agent has credentials</td></tr><tr><td>Rollback: redeploy</td><td>Rollback: git revert</td></tr></table>`},
{id:200,part:"E",category:"Advanced",q:"Ephemeral environments — preview environments per PR.",a:`<pre><code># Create preview env per PR\nPREVIEW_URL="pr-$PR_NUMBER.preview.myapp.com"\nkubectl create namespace pr-$PR_NUMBER\nhelm install preview ./chart -n pr-$PR_NUMBER\n\n# Comment on PR with URL\n# 🚀 Preview: https://pr-42.preview.myapp.com\n\n# Auto-cleanup on PR close</code></pre><p><strong>Benefit:</strong> Each PR gets isolated environment. Reviewers test actual changes before merge.</p>`},

// ──────────── PART F: Playwright ────────────
{id:201,part:"F",category:"Core",q:"Playwright vs Selenium vs Cypress — why Playwright for Java?",a:`<table><tr><th></th><th>Playwright</th><th>Selenium</th><th>Cypress</th></tr><tr><td>Languages</td><td>Java, JS, Python, C#</td><td>Java, JS, Python, C#, Ruby</td><td>JS/TS only</td></tr><tr><td>Auto-waiting</td><td>✅ Built-in</td><td>❌ Manual waits</td><td>✅ Built-in</td></tr><tr><td>Multi-tab</td><td>✅ Native</td><td>❌ Workaround</td><td>❌ No support</td></tr><tr><td>Network intercept</td><td>✅ page.route()</td><td>❌ External tools</td><td>✅ cy.intercept()</td></tr><tr><td>Trace Viewer</td><td>✅ Full recording</td><td>❌ Screenshots only</td><td>✅ Dashboard</td></tr><tr><td>Headless</td><td>✅ All browsers</td><td>✅ All browsers</td><td>⚠️ Limited</td></tr><tr><td>Speed</td><td>⚡ Fastest</td><td>Slowest</td><td>Fast</td></tr></table><div class="tip"><span class="tip-icon">💡</span><div><strong>Why Playwright for Java QA:</strong> Auto-waits eliminate flakiness, multi-browser testing from one API, built-in tracing for CI debugging, and native network mocking for isolated tests.</div></div>`},
{id:202,part:"F",category:"Core",q:"Playwright architecture — Browser, BrowserContext, Page hierarchy.",a:`<pre><code>// Hierarchy: Playwright → Browser → BrowserContext → Page\nPlaywright playwright = Playwright.create();\nBrowser browser = playwright.chromium().launch();\n\n// BrowserContext = isolated session (like incognito)\nBrowserContext context = browser.newContext();\nPage page = context.newPage();\n\n// Multi-user testing: 2 contexts in same test\nBrowserContext adminCtx = browser.newContext();\nBrowserContext userCtx = browser.newContext();\nPage adminPage = adminCtx.newPage();\nPage userPage = userCtx.newPage();</code></pre><p><strong>Key:</strong> BrowserContext is lightweight (no new browser process). Each context has its own cookies, storage, and cache — perfect for parallel test isolation.</p>`},
{id:203,part:"F",category:"Locators",q:"Locator strategies — why getByRole() is preferred over CSS/XPath.",a:`<table><tr><th>Strategy</th><th>Example</th><th>Resilience</th><th>Use When</th></tr><tr><td><code>getByRole()</code></td><td><code>getByRole(BUTTON, new Options().setName("Submit"))</code></td><td>⭐⭐⭐⭐⭐</td><td>Always first choice</td></tr><tr><td><code>getByText()</code></td><td><code>getByText("Sign In")</code></td><td>⭐⭐⭐⭐</td><td>Visible text</td></tr><tr><td><code>getByLabel()</code></td><td><code>getByLabel("Email")</code></td><td>⭐⭐⭐⭐</td><td>Form fields</td></tr><tr><td><code>getByTestId()</code></td><td><code>getByTestId("submit-btn")</code></td><td>⭐⭐⭐</td><td>Custom data attributes</td></tr><tr><td>CSS selector</td><td><code>locator(".btn-primary")</code></td><td>⭐⭐</td><td>When above fail</td></tr><tr><td>XPath</td><td><code>locator("//button")</code></td><td>⭐</td><td>Last resort</td></tr></table><div class="important"><span class="tip-icon">❗</span><div><code>getByRole()</code> mirrors how screen readers see the page. It survives CSS refactors, layout changes, and i18n updates — unlike CSS/XPath.</div></div>`},
{id:204,part:"F",category:"Locators",q:"Locator chaining and filtering — complex element selection.",a:`<pre><code>// Chain locators for precision\npage.locator(".product-card")\n    .filter(new Locator.FilterOptions().setHasText("Premium"))\n    .getByRole(AriaRole.BUTTON, new Options().setName("Buy"))\n    .click();\n\n// nth() for indexed selection\npage.locator(".row").nth(2).getByRole(AriaRole.LINK).click();\n\n// has() — filter parent by child content\npage.locator("article")\n    .filter(new FilterOptions().setHas(page.getByText("Playwright")))\n    .click();\n\n// Combining multiple conditions\npage.locator("button")\n    .filter(new FilterOptions()\n        .setHasText("Submit")\n        .setHasNot(page.locator(".disabled")))\n    .click();</code></pre>`},
{id:205,part:"F",category:"Waits",q:"Auto-waiting mechanism — actionability checks explained.",a:`<h4>Playwright's Auto-Wait Checks Before Actions</h4><table><tr><th>Check</th><th>What It Verifies</th><th>Example</th></tr><tr><td>Attached</td><td>Element is in DOM</td><td>Not removed by JS</td></tr><tr><td>Visible</td><td>Has non-zero size, not hidden</td><td>Not display:none</td></tr><tr><td>Stable</td><td>Not animating</td><td>No ongoing CSS transitions</td></tr><tr><td>Receives Events</td><td>Not covered by overlay</td><td>No modal blocking</td></tr><tr><td>Enabled</td><td>Not disabled</td><td>Button not disabled</td></tr></table><pre><code>// ❌ NEVER do this\nThread.sleep(3000);\npage.locator("#submit").click();\n\n// ✅ Playwright auto-waits for all checks\npage.locator("#submit").click(); // Waits automatically\n\n// ✅ When you need custom waiting\npage.locator("#submit").waitFor(new WaitForOptions()\n    .setState(WaitForSelectorState.VISIBLE)\n    .setTimeout(10000));</code></pre>`},
{id:206,part:"F",category:"Waits",q:"Web-first assertions vs traditional assertions.",a:`<pre><code>// ❌ Traditional: snapshot assertion (flaky!)\nassertEquals("Success", page.locator("#message").textContent());\n// Can fail if element hasn't updated yet\n\n// ✅ Web-first: auto-retrying assertion\nassertThat(page.locator("#message")).hasText("Success");\n// Retries for up to 5 seconds (configurable)\n\n// Other web-first assertions\nassertThat(page.locator("#btn")).isVisible();\nassertThat(page.locator("#btn")).isEnabled();\nassertThat(page.locator("#btn")).hasAttribute("data-active", "true");\nassertThat(page.locator("table tr")).hasCount(10);\nassertThat(page).hasURL(Pattern.compile(".*/dashboard"));\nassertThat(page).hasTitle("Dashboard");</code></pre>`},
{id:207,part:"F",category:"Network",q:"Network interception — mock APIs and test error states.",a:`<pre><code>// Mock API response\npage.route("**/api/users", route -> {\n    route.fulfill(new Route.FulfillOptions()\n        .setStatus(200)\n        .setContentType("application/json")\n        .setBody("[{\\"name\\":\\"Mock User\\"}]"));\n});\n\n// Test error handling: simulate 500\npage.route("**/api/payment", route -> {\n    route.fulfill(new Route.FulfillOptions().setStatus(500)\n        .setBody("{\\"error\\":\\"Server Error\\"}"));\n});\n\n// Intercept and modify request\npage.route("**/api/orders", route -> {\n    Map&lt;String,String&gt; headers = new HashMap&lt;&gt;(route.request().headers());\n    headers.put("X-Test-Mode", "true");\n    route.resume(new Route.ResumeOptions().setHeaders(headers));\n});\n\n// Wait for specific API call\nResponse response = page.waitForResponse(\n    r -> r.url().contains("/api/checkout") && r.status() == 200,\n    () -> page.getByRole(AriaRole.BUTTON, new Options().setName("Pay")).click()\n);</code></pre>`},
{id:208,part:"F",category:"Network",q:"Request/Response logging and API validation in E2E tests.",a:`<pre><code>// Log all network requests\npage.onRequest(request -> System.out.println(\n    ">> " + request.method() + " " + request.url()));\npage.onResponse(response -> System.out.println(\n    "&lt;&lt; " + response.status() + " " + response.url()));\n\n// Validate API response within E2E test\nResponse apiResponse = page.waitForResponse(\n    r -> r.url().contains("/api/user/profile"),\n    () -> page.navigate("/dashboard")\n);\nassertEquals(200, apiResponse.status());\nJsonObject body = JsonParser.parseString(apiResponse.text()).getAsJsonObject();\nassertEquals("active", body.get("status").getAsString());</code></pre>`},
{id:209,part:"F",category:"Auth",q:"Authentication — storageState for reusing login sessions.",a:`<pre><code>// Step 1: Login once and save session\nBrowserContext context = browser.newContext();\nPage page = context.newPage();\npage.navigate("/login");\npage.getByLabel("Phone").fill("9876543210");\npage.getByLabel("OTP").fill("3548");\npage.getByRole(AriaRole.BUTTON, new Options().setName("Login")).click();\n// Save cookies + localStorage\ncontext.storageState(new BrowserContext.StorageStateOptions()\n    .setPath(Paths.get("auth.json")));\n\n// Step 2: Reuse in all tests (skip login!)\nBrowserContext authedCtx = browser.newContext(\n    new Browser.NewContextOptions()\n        .setStorageStatePath(Paths.get("auth.json")));\nPage dashboard = authedCtx.newPage();\ndashboard.navigate("/dashboard"); // Already logged in!</code></pre><div class="tip"><span class="tip-icon">💡</span><div>Save auth state in @BeforeSuite once. All tests skip login → <strong>10-15 seconds saved per test</strong>.</div></div>`},
{id:210,part:"F",category:"Tracing",q:"Trace Viewer — debugging CI failures with full recordings.",a:`<pre><code>// Enable tracing\ncontext.tracing().start(new Tracing.StartOptions()\n    .setScreenshots(true)\n    .setSnapshots(true)\n    .setSources(true));\n\n// ... run your test ...\n\n// Save trace on failure\ncontext.tracing().stop(new Tracing.StopOptions()\n    .setPath(Paths.get("trace.zip")));\n\n// View: npx playwright show-trace trace.zip\n// Shows: DOM snapshots, network waterfall, console logs,\n//        source code, and action timeline</code></pre><p><strong>CI integration:</strong> Upload <code>trace.zip</code> as GitHub Actions artifact. Download and view locally when tests fail in CI.</p>`},
{id:211,part:"F",category:"Tracing",q:"Screenshots and videos — capture on failure only.",a:`<pre><code>// In TestNG @AfterMethod\n@AfterMethod\npublic void tearDown(ITestResult result) {\n    if (result.getStatus() == ITestResult.FAILURE) {\n        byte[] screenshot = page.screenshot(new Page.ScreenshotOptions()\n            .setFullPage(true));\n        // Attach to Extent Report\n        test.addScreenCaptureFromBase64String(\n            Base64.getEncoder().encodeToString(screenshot));\n    }\n}\n\n// Video recording: set in context options\nBrowserContext context = browser.newContext(\n    new Browser.NewContextOptions()\n        .setRecordVideoDir(Paths.get("videos/"))\n        .setRecordVideoSize(1280, 720));</code></pre>`},
{id:212,part:"F",category:"POM",q:"Page Object Model — scalable architecture for large apps.",a:`<pre><code>// BasePage: common functionality\npublic abstract class BasePage {\n    protected final Page page;\n    public BasePage(Page page) { this.page = page; }\n\n    protected void waitAndClick(Locator locator) {\n        locator.click(); // Auto-waits built-in\n    }\n    protected void fillField(String label, String value) {\n        page.getByLabel(label).fill(value);\n    }\n}\n\n// LoginPage: specific page\npublic class LoginPage extends BasePage {\n    public LoginPage(Page page) { super(page); }\n\n    public DashboardPage loginWithOTP(String phone, String otp) {\n        fillField("Phone", phone);\n        fillField("OTP", otp);\n        page.getByRole(AriaRole.BUTTON,\n            new Options().setName("Login")).click();\n        return new DashboardPage(page); // Fluent API\n    }\n}</code></pre>`},
{id:213,part:"F",category:"POM",q:"Component-based POM — reusable UI components.",a:`<pre><code>// Reusable component: Navigation Bar\npublic class NavBar {\n    private final Page page;\n    public NavBar(Page page) { this.page = page; }\n\n    public void navigateTo(String section) {\n        page.getByRole(AriaRole.NAVIGATION)\n            .getByRole(AriaRole.LINK, new Options().setName(section))\n            .click();\n    }\n    public void logout() {\n        page.getByRole(AriaRole.BUTTON, new Options().setName("Profile")).click();\n        page.getByText("Logout").click();\n    }\n}\n\n// Use in Page Objects via composition\npublic class DashboardPage extends BasePage {\n    public final NavBar nav;\n    public DashboardPage(Page page) {\n        super(page);\n        this.nav = new NavBar(page); // Composition over inheritance\n    }\n}</code></pre>`},
{id:214,part:"F",category:"Parallel",q:"Parallel execution with TestNG + Playwright — ThreadLocal pattern.",a:`<pre><code>// ThreadLocal ensures each thread gets its own Page/Context\npublic class PlaywrightManager {\n    private static final ThreadLocal&lt;Page&gt; pageThread = new ThreadLocal&lt;&gt;();\n    private static final ThreadLocal&lt;BrowserContext&gt; ctxThread = new ThreadLocal&lt;&gt;();\n\n    public static void init(Browser browser) {\n        BrowserContext ctx = browser.newContext();\n        ctxThread.set(ctx);\n        pageThread.set(ctx.newPage());\n    }\n    public static Page getPage() { return pageThread.get(); }\n    public static void cleanup() {\n        pageThread.get().close();\n        ctxThread.get().close();\n        pageThread.remove();\n        ctxThread.remove();\n    }\n}</code></pre><pre><code>&lt;!-- testng.xml: parallel by class --&gt;\n&lt;suite parallel="classes" thread-count="5"&gt;</code></pre>`},
{id:215,part:"F",category:"Parallel",q:"Scaling from 5 to 20 parallel threads — what breaks?",a:`<table><tr><th>Problem</th><th>Symptom</th><th>Solution</th></tr><tr><td>Port conflicts</td><td>Address in use errors</td><td>Dynamic port allocation</td></tr><tr><td>Shared test data</td><td>Random assertion failures</td><td>Unique data per thread</td></tr><tr><td>Database locks</td><td>Timeout/deadlock</td><td>Connection pooling (HikariCP)</td></tr><tr><td>Memory exhaustion</td><td>OOM errors</td><td>Share Browser, isolate via Context</td></tr><tr><td>Flaky selectors</td><td>StaleElement-like errors</td><td>Strict mode locators</td></tr></table><div class="important"><span class="tip-icon">❗</span><div><strong>Key insight:</strong> Launch ONE browser, create MANY contexts. BrowserContext is lightweight (~2MB vs ~150MB per browser).</div></div>`},
{id:216,part:"F",category:"IFrames",q:"Handling iFrames, popups, and new tabs.",a:`<pre><code>// iFrame handling\nFrameLocator frame = page.frameLocator("#payment-iframe");\nframe.getByLabel("Card Number").fill("5506900480000008");\nframe.getByLabel("Expiry").fill("05/30");\nframe.getByLabel("CVV").fill("123");\n\n// Popup / new tab handling\nPage popup = page.waitForPopup(() -> {\n    page.getByText("Open in new tab").click();\n});\npopup.waitForLoadState();\nassertThat(popup).hasURL(Pattern.compile(".*/terms"));\n\n// Dialog handling (alert, confirm, prompt)\npage.onDialog(dialog -> {\n    assertEquals("Are you sure?", dialog.message());\n    dialog.accept();\n});\npage.getByRole(AriaRole.BUTTON, new Options().setName("Delete")).click();</code></pre>`},
{id:217,part:"F",category:"Advanced",q:"File uploads, downloads, and clipboard operations.",a:`<pre><code>// File upload\npage.getByLabel("Upload Document").setInputFiles(Paths.get("test.pdf"));\n\n// Multiple files\npage.locator("input[type='file']").setInputFiles(\n    new Path[]{Paths.get("doc1.pdf"), Paths.get("doc2.pdf")});\n\n// File download\nDownload download = page.waitForDownload(() -> {\n    page.getByText("Export CSV").click();\n});\nassertEquals("report.csv", download.suggestedFilename());\ndownload.saveAs(Paths.get("downloads/report.csv"));\n\n// Clipboard\npage.evaluate("() => navigator.clipboard.writeText('test data')");</code></pre>`},
{id:218,part:"F",category:"Advanced",q:"CDP (Chrome DevTools Protocol) — advanced browser control.",a:`<pre><code>// Access CDP session\nCDPSession cdp = ((BrowserContext) context).newCDPSession(page);\n\n// Emulate network conditions (3G)\ncdp.send("Network.emulateNetworkConditions", Map.of(\n    "offline", false,\n    "downloadThroughput", 750 * 1024 / 8,\n    "uploadThroughput", 250 * 1024 / 8,\n    "latency", 100\n));\n\n// Emulate geolocation\ncontext.setGeolocation(new Geolocation(12.9716, 77.5946)); // Bangalore\n\n// Block specific resources (faster tests)\npage.route("**/*.{png,jpg,jpeg}", route -> route.abort());</code></pre>`},
{id:219,part:"F",category:"Advanced",q:"Visual regression testing with Playwright screenshots.",a:`<pre><code>// Full page comparison\nassertThat(page).hasScreenshot("dashboard.png", new HasScreenshotOptions()\n    .setMaxDiffPixels(100));\n\n// Element-level comparison\nassertThat(page.locator(".chart-container")).hasScreenshot("chart.png");\n\n// Masking dynamic elements\nassertThat(page).hasScreenshot("page.png", new HasScreenshotOptions()\n    .setMask(List.of(page.locator(".timestamp"), page.locator(".avatar"))));\n\n// Update baselines: npx playwright test --update-snapshots</code></pre>`},
{id:220,part:"F",category:"Mobile",q:"Mobile testing with Playwright — device emulation.",a:`<pre><code>// Emulate iPhone 14\nBrowserContext context = browser.newContext(\n    new Browser.NewContextOptions()\n        .setDeviceScaleFactor(3)\n        .setViewportSize(390, 844)\n        .setUserAgent("Mozilla/5.0 (iPhone; CPU iPhone OS 16_0...)")\n        .setIsMobile(true)\n        .setHasTouch(true)\n);\n\n// Or use built-in device descriptors\n// Playwright.devices().get("iPhone 14")\n\n// Touch gestures\npage.locator("#carousel").tap();\npage.touchscreen().tap(200, 300);</code></pre>`},
{id:221,part:"F",category:"Performance",q:"Performance testing with Playwright — measuring Core Web Vitals.",a:`<pre><code>// Measure page load performance\nlong startTime = System.currentTimeMillis();\npage.navigate("/dashboard");\npage.waitForLoadState(LoadState.NETWORKIDLE);\nlong loadTime = System.currentTimeMillis() - startTime;\nassertTrue(loadTime &lt; 3000, "Page load > 3s SLA");\n\n// Measure Core Web Vitals via JS\nMap&lt;String, Object&gt; metrics = (Map) page.evaluate("() => {\n    return {\n        lcp: performance.getEntriesByType('largest-contentful-paint')[0]?.startTime,\n        fcp: performance.getEntriesByType('paint').find(p => p.name === 'first-contentful-paint')?.startTime,\n        cls: performance.getEntriesByType('layout-shift').reduce((sum, e) => sum + e.value, 0)\n    };\n}");</code></pre>`},
{id:222,part:"F",category:"Debugging",q:"Debugging techniques — headed mode, pause, slowMo.",a:`<pre><code>// Launch with UI for debugging\nBrowser browser = playwright.chromium().launch(\n    new BrowserType.LaunchOptions()\n        .setHeadless(false)\n        .setSlowMo(500) // 500ms delay between actions\n);\n\n// Pause execution — opens Playwright Inspector\npage.pause(); // Interactive debugging\n\n// Console log capture\npage.onConsoleMessage(msg -> {\n    if (msg.type().equals("error"))\n        System.err.println("Browser error: " + msg.text());\n});\n\n// Page error capture\npage.onPageError(error -> {\n    System.err.println("Uncaught exception: " + error);\n});</code></pre>`},
{id:223,part:"F",category:"BestPractice",q:"Playwright best practices — what NOT to do.",a:`<table><tr><th>❌ Don't</th><th>✅ Do</th><th>Why</th></tr><tr><td><code>Thread.sleep(3000)</code></td><td><code>assertThat(el).isVisible()</code></td><td>Auto-waiting handles timing</td></tr><tr><td>XPath for everything</td><td><code>getByRole()</code>, <code>getByLabel()</code></td><td>Resilient to DOM changes</td></tr><tr><td>New Browser per test</td><td>New BrowserContext per test</td><td>Context is 50x lighter</td></tr><tr><td>Hard-coded URLs</td><td>Config-based base URL</td><td>Multi-env support</td></tr><tr><td>Ignore failed screenshots</td><td>Attach trace on failure</td><td>Debug CI failures</td></tr><tr><td>Login in every test</td><td>storageState reuse</td><td>Save 10-15s per test</td></tr></table>`},
{id:224,part:"F",category:"BestPractice",q:"Test data management with Playwright — dynamic vs static.",a:`<pre><code>// Dynamic: generate unique data per run\nString phone = "98" + System.currentTimeMillis() % 100000000;\nString email = "test_" + UUID.randomUUID().toString().substring(0,8) + "@test.com";\n\n// Static: load from JSON (environment-specific)\n// testdata-stu-onpremqa.json\n{\n    "otp": "3548",\n    "card": "5506900480000008",\n    "expiry": "05/30",\n    "cvv": "123"\n}\n\n// API-driven setup (fastest)\n// 1. Create member via Partner API\n// 2. Run UI test with pre-created member\n// 3. No manual registration needed</code></pre>`},
{id:225,part:"F",category:"Integration",q:"Playwright + TestNG integration — listeners and reporting.",a:`<pre><code>// TestNG Listener for Playwright lifecycle\npublic class PlaywrightListener implements ITestListener {\n    @Override\n    public void onTestFailure(ITestResult result) {\n        Page page = PlaywrightManager.getPage();\n        // Screenshot\n        byte[] screenshot = page.screenshot(\n            new ScreenshotOptions().setFullPage(true));\n        // Trace\n        PlaywrightManager.getContext().tracing().stop(\n            new StopOptions().setPath(Paths.get(\n                "traces/" + result.getName() + ".zip")));\n        // Attach to Extent Report\n        ExtentReportManager.getTest()\n            .addScreenCaptureFromBase64String(\n                Base64.getEncoder().encodeToString(screenshot));\n    }\n}</code></pre>`},

// ──────────── PART G: API Testing ────────────
{id:226,part:"G",category:"REST Assured",q:"REST Assured architecture — RequestSpecification and ResponseSpecification.",a:`<pre><code>// Reusable RequestSpecification\nRequestSpecification baseSpec = new RequestSpecBuilder()\n    .setBaseUri("https://api.onsurity.com")\n    .setContentType(ContentType.JSON)\n    .addHeader("Authorization", "Bearer " + token)\n    .addFilter(new RequestLoggingFilter())\n    .addFilter(new ResponseLoggingFilter())\n    .build();\n\n// Reusable ResponseSpecification\nResponseSpecification successSpec = new ResponseSpecBuilder()\n    .expectStatusCode(200)\n    .expectContentType(ContentType.JSON)\n    .expectResponseTime(lessThan(3000L))\n    .build();\n\n// Use in tests\ngiven().spec(baseSpec)\n    .when().get("/api/users/123")\n    .then().spec(successSpec)\n    .body("name", equalTo("Boobala"));</code></pre>`},
{id:227,part:"G",category:"REST Assured",q:"Serialization/Deserialization — POJO-based API testing.",a:`<pre><code>// POJO class\npublic class UserRequest {\n    private String name;\n    private String email;\n    private String role;\n    // getters, setters, builder\n}\n\n// Serialize: Java Object → JSON body\nUserRequest user = UserRequest.builder()\n    .name("Boobala").email("b@test.com").role("QA").build();\n\ngiven().spec(baseSpec)\n    .body(user)  // Jackson auto-serializes\n    .when().post("/api/users")\n    .then().statusCode(201);\n\n// Deserialize: JSON response → Java Object\nUserResponse created = given().spec(baseSpec)\n    .when().get("/api/users/123")\n    .then().extract().as(UserResponse.class);\nassertEquals("Boobala", created.getName());</code></pre><p><strong>Benefits:</strong> Compile-time type safety, IDE autocomplete, no manual JSON string building.</p>`},
{id:228,part:"G",category:"REST Assured",q:"JSON Schema validation — contract testing with REST Assured.",a:`<pre><code>// schema.json in src/test/resources\n{\n    "type": "object",\n    "required": ["id", "name", "email", "status"],\n    "properties": {\n        "id": { "type": "integer" },\n        "name": { "type": "string", "minLength": 1 },\n        "email": { "type": "string", "format": "email" },\n        "status": { "enum": ["ACTIVE", "INACTIVE"] }\n    }\n}\n\n// Validate in test\ngiven().spec(baseSpec)\n    .when().get("/api/users/123")\n    .then().statusCode(200)\n    .body(matchesJsonSchemaInClasspath("schema.json"));</code></pre><div class="tip"><span class="tip-icon">💡</span><div>JSON Schema validation catches structural regressions automatically — missing fields, wrong types, unexpected values — without writing individual assertions.</div></div>`},
{id:229,part:"G",category:"REST Assured",q:"API chaining — passing data between requests.",a:`<pre><code>// Chain: Create user → Get user → Update user → Delete user\n// Step 1: Create\nint userId = given().spec(baseSpec)\n    .body(newUser)\n    .when().post("/api/users")\n    .then().statusCode(201)\n    .extract().path("id");\n\n// Step 2: Get (using dynamic ID)\ngiven().spec(baseSpec)\n    .pathParam("id", userId)\n    .when().get("/api/users/{id}")\n    .then().statusCode(200)\n    .body("name", equalTo(newUser.getName()));\n\n// Step 3: Update\ngiven().spec(baseSpec)\n    .body(Map.of("role", "LEAD"))\n    .when().put("/api/users/" + userId)\n    .then().statusCode(200);\n\n// Step 4: Delete\ngiven().spec(baseSpec)\n    .when().delete("/api/users/" + userId)\n    .then().statusCode(204);</code></pre>`},
{id:230,part:"G",category:"REST Assured",q:"OAuth2 and token management in API tests.",a:`<pre><code>// Token utility — fetch and cache token\npublic class AuthHelper {\n    private static String token;\n    private static long expiresAt;\n\n    public static synchronized String getToken() {\n        if (token == null || System.currentTimeMillis() > expiresAt) {\n            Response res = given()\n                .contentType("application/x-www-form-urlencoded")\n                .formParam("grant_type", "client_credentials")\n                .formParam("client_id", Config.get("client_id"))\n                .formParam("client_secret", Config.get("client_secret"))\n                .post(Config.get("auth_url"));\n            token = res.path("access_token");\n            expiresAt = System.currentTimeMillis() + res.path("expires_in") * 1000L;\n        }\n        return token;\n    }\n}\n\n// Usage\ngiven().auth().oauth2(AuthHelper.getToken())\n    .when().get("/api/protected")\n    .then().statusCode(200);</code></pre>`},
{id:231,part:"G",category:"REST Assured",q:"API logging and custom filters for debugging.",a:`<pre><code>// ExtentReport API Filter — log every request/response\npublic class ExtentReportApiFilter implements Filter {\n    @Override\n    public Response filter(FilterableRequestSpecification reqSpec,\n                          FilterableResponseSpecification resSpec,\n                          FilterContext ctx) {\n        Response response = ctx.next(reqSpec, resSpec);\n        ExtentTest test = ExtentReportManager.getTest();\n        test.info("API: " + reqSpec.getMethod() + " " + reqSpec.getURI());\n        test.info("Status: " + response.getStatusCode());\n        test.info("Body: " + response.getBody().asPrettyString());\n        return response;\n    }\n}\n\n// Conditional logging\ngiven().spec(baseSpec)\n    .filter(new AllureRestAssured()) // Allure report\n    .log().ifValidationFails()       // Log only on failure\n    .when().get("/api/users")\n    .then().log().ifError();</code></pre>`},
{id:232,part:"G",category:"Negative",q:"Negative API testing — error handling and edge cases.",a:`<table><tr><th>Scenario</th><th>Expected</th><th>Test Approach</th></tr><tr><td>Missing required field</td><td>400 Bad Request</td><td>Omit field from POJO</td></tr><tr><td>Invalid data type</td><td>400/422</td><td>String in integer field</td></tr><tr><td>Unauthorized</td><td>401</td><td>No token / expired token</td></tr><tr><td>Forbidden</td><td>403</td><td>Valid token, wrong role</td></tr><tr><td>Not found</td><td>404</td><td>Non-existent ID</td></tr><tr><td>Duplicate</td><td>409 Conflict</td><td>Create same resource twice</td></tr><tr><td>Rate limited</td><td>429</td><td>Rapid-fire requests</td></tr><tr><td>Large payload</td><td>413</td><td>Exceed max body size</td></tr></table><pre><code>// Example: test 401 with expired token\ngiven().auth().oauth2("expired_token_xyz")\n    .when().get("/api/users")\n    .then().statusCode(401)\n    .body("error", equalTo("Token expired"));</code></pre>`},
{id:233,part:"G",category:"Negative",q:"Boundary value and data-driven API testing.",a:`<pre><code>// Data-driven with TestNG @DataProvider\n@DataProvider(name = "invalidPhones")\npublic Object[][] invalidPhones() {\n    return new Object[][] {\n        {"", 400, "Phone required"},\n        {"123", 400, "Phone too short"},\n        {"12345678901234", 400, "Phone too long"},\n        {"abcdefghij", 400, "Invalid phone format"},\n        {null, 400, "Phone required"}\n    };\n}\n\n@Test(dataProvider = "invalidPhones")\npublic void testInvalidPhone(String phone, int status, String error) {\n    given().spec(baseSpec)\n        .body(Map.of("phone", phone == null ? "" : phone))\n        .when().post("/api/register")\n        .then().statusCode(status)\n        .body("message", containsString(error));\n}</code></pre>`},
{id:234,part:"G",category:"Postman",q:"Postman advanced features — pre-request scripts and chaining.",a:`<pre><code>// Pre-request Script: Auto-generate auth token\npm.sendRequest({\n    url: pm.environment.get("auth_url"),\n    method: 'POST',\n    body: {\n        mode: 'urlencoded',\n        urlencoded: [\n            {key: 'grant_type', value: 'client_credentials'},\n            {key: 'client_id', value: pm.environment.get('client_id')}\n        ]\n    }\n}, (err, res) => {\n    pm.environment.set("access_token", res.json().access_token);\n});\n\n// Test Script: Validate and chain\npm.test("Status is 200", () => pm.response.to.have.status(200));\npm.test("Has user ID", () => {\n    let userId = pm.response.json().id;\n    pm.environment.set("user_id", userId); // Chain to next request\n});</code></pre>`},
{id:235,part:"G",category:"Postman",q:"Newman — running Postman collections in CI/CD.",a:`<pre><code># Run collection with environment\nnewman run collection.json \\\n    -e qa-environment.json \\\n    --reporters cli,htmlextra \\\n    --reporter-htmlextra-export report.html \\\n    --iteration-count 3 \\\n    --delay-request 500\n\n# GitHub Actions integration\n- name: Run API Tests\n  run: |\n    npx newman run tests/api-collection.json \\\n      -e tests/qa-env.json \\\n      --reporters cli,junit \\\n      --reporter-junit-export results.xml\n\n- name: Publish Results\n  uses: dorny/test-reporter@v1\n  with:\n    name: API Tests\n    path: results.xml\n    reporter: java-junit</code></pre>`},
{id:236,part:"G",category:"Postman",q:"Postman vs REST Assured — when to use each?",a:`<table><tr><th></th><th>Postman</th><th>REST Assured</th></tr><tr><td>Type</td><td>GUI tool</td><td>Java library</td></tr><tr><td>Best for</td><td>Exploration, documentation</td><td>Automated regression</td></tr><tr><td>CI/CD</td><td>Newman CLI</td><td>Maven/TestNG native</td></tr><tr><td>Programming</td><td>JavaScript (limited)</td><td>Full Java power</td></tr><tr><td>Data-driven</td><td>CSV/JSON files</td><td>TestNG @DataProvider</td></tr><tr><td>DB validation</td><td>❌ Not possible</td><td>✅ JDBC in same test</td></tr><tr><td>Versioning</td><td>Postman collections</td><td>Git with code</td></tr></table><p><strong>Strategy:</strong> Use Postman for API exploration/debugging, REST Assured for automated regression suites.</p>`},
{id:237,part:"G",category:"Design",q:"API test framework architecture — layers and patterns.",a:`<pre><code>src/test/java/\n├── config/          # Environment configs\n│   └── ConfigManager.java\n├── models/          # POJOs for request/response\n│   ├── UserRequest.java\n│   └── UserResponse.java\n├── specs/           # Request/Response specs\n│   └── ApiSpecs.java\n├── helpers/         # Auth, data builders\n│   ├── AuthHelper.java\n│   └── TestDataBuilder.java\n├── filters/         # Logging, reporting\n│   └── ExtentReportApiFilter.java\n├── tests/           # Test classes\n│   ├── UserApiTest.java\n│   └── PaymentApiTest.java\n└── testdata/        # JSON test data\n    └── testdata-payment-qa.json</code></pre>`},
{id:238,part:"G",category:"Design",q:"API response time validation — SLA compliance testing.",a:`<pre><code>// Validate response time in REST Assured\ngiven().spec(baseSpec)\n    .when().get("/api/users")\n    .then().statusCode(200)\n    .time(lessThan(2000L)); // Must respond within 2 seconds\n\n// Custom SLA validation per endpoint\nMap&lt;String, Long&gt; slaMap = Map.of(\n    "/api/login", 1000L,\n    "/api/users", 2000L,\n    "/api/reports", 5000L\n);\n\nlong responseTime = given().spec(baseSpec)\n    .when().get(endpoint)\n    .then().extract().time();\nassertTrue(responseTime &lt; slaMap.get(endpoint),\n    endpoint + " exceeded SLA: " + responseTime + "ms");</code></pre>`},
{id:239,part:"G",category:"Design",q:"File upload/download API testing.",a:`<pre><code>// File upload (multipart)\ngiven().spec(baseSpec)\n    .multiPart("file", new File("test-data/report.pdf"))\n    .multiPart("description", "QA Report")\n    .when().post("/api/upload")\n    .then().statusCode(201)\n    .body("filename", equalTo("report.pdf"));\n\n// File download and verify\nbyte[] fileContent = given().spec(baseSpec)\n    .when().get("/api/download/report.pdf")\n    .then().statusCode(200)\n    .header("Content-Type", "application/pdf")\n    .extract().asByteArray();\nassertTrue(fileContent.length > 0);</code></pre>`},
{id:240,part:"G",category:"Advanced",q:"API versioning testing — backward compatibility.",a:`<pre><code>// Test both API versions respond correctly\n@Test\npublic void testV1BackwardCompatibility() {\n    // V1 response format\n    given().basePath("/api/v1")\n        .when().get("/users/123")\n        .then().statusCode(200)\n        .body("user_name", equalTo("Boobala")); // snake_case\n}\n\n@Test\npublic void testV2NewFormat() {\n    // V2 response format (different structure)\n    given().basePath("/api/v2")\n        .when().get("/users/123")\n        .then().statusCode(200)\n        .body("userName", equalTo("Boobala"))  // camelCase\n        .body("metadata.version", equalTo("2.0"));\n}</code></pre>`},
{id:241,part:"G",category:"Advanced",q:"GraphQL API testing with REST Assured.",a:`<pre><code>// GraphQL query via REST Assured\nString query = "{ user(id: 123) { name email orders { id amount } } }";\n\ngiven().spec(baseSpec)\n    .body(Map.of("query", query))\n    .when().post("/graphql")\n    .then().statusCode(200)\n    .body("data.user.name", equalTo("Boobala"))\n    .body("data.user.orders", hasSize(greaterThan(0)))\n    .body("errors", nullValue()); // No GraphQL errors\n\n// Mutation\nString mutation = "mutation { createUser(name: \\"Test\\") { id } }";\ngiven().spec(baseSpec)\n    .body(Map.of("query", mutation))\n    .when().post("/graphql")\n    .then().statusCode(200)\n    .body("data.createUser.id", notNullValue());</code></pre>`},
{id:242,part:"G",category:"Advanced",q:"Contract testing with Pact — consumer-driven contracts.",a:`<pre><code>// Consumer test (QA team defines contract)\n@Pact(consumer = "frontend", provider = "user-service")\npublic RequestResponsePact createPact(PactDslWithProvider builder) {\n    return builder\n        .given("user 123 exists")\n        .uponReceiving("get user by id")\n            .path("/api/users/123").method("GET")\n        .willRespondWith()\n            .status(200)\n            .body(new PactDslJsonBody()\n                .integerType("id", 123)\n                .stringType("name", "Boobala")\n                .stringType("email"))\n        .toPact();\n}\n\n// Provider verifies contract\n@TestTemplate\n@ExtendWith(PactVerificationInvocationContextProvider.class)\nvoid pactVerification(PactVerificationContext context) {\n    context.verifyInteraction();\n}</code></pre>`},
{id:243,part:"G",category:"Advanced",q:"Retry and resilience testing — timeout, circuit breaker.",a:`<pre><code>// Test timeout behavior\ngiven().spec(baseSpec)\n    .config(RestAssured.config()\n        .httpClient(httpClientConfig()\n            .setParam("CONNECTION_MANAGER_TIMEOUT", 5000)\n            .setParam("SO_TIMEOUT", 5000)))\n    .when().get("/api/slow-endpoint")\n    .then().time(lessThan(6000L));\n\n// Test circuit breaker: rapid failures should trigger fallback\nfor (int i = 0; i &lt; 10; i++) {\n    given().spec(baseSpec).get("/api/flaky-service");\n}\n// After threshold failures, should return fallback response\ngiven().spec(baseSpec)\n    .when().get("/api/flaky-service")\n    .then().statusCode(503)\n    .body("fallback", equalTo(true));</code></pre>`},
{id:244,part:"G",category:"Security",q:"API security testing — OWASP Top 10 for APIs.",a:`<table><tr><th>OWASP API Risk</th><th>Test Approach</th></tr><tr><td>Broken Auth</td><td>Access resources without token / with other user's token</td></tr><tr><td>Broken Object Level Auth</td><td>Access user 2's data with user 1's token</td></tr><tr><td>Excessive Data Exposure</td><td>Check response doesn't include passwords, SSN</td></tr><tr><td>Rate Limiting</td><td>Send 1000 requests in 1 minute → expect 429</td></tr><tr><td>Mass Assignment</td><td>Send extra fields (role: admin) → verify ignored</td></tr><tr><td>Injection</td><td>SQL injection in query params</td></tr></table><pre><code>// Test BOLA: Access other user's data\ngiven().auth().oauth2(user1Token)\n    .when().get("/api/users/" + user2Id)\n    .then().statusCode(403); // Should be forbidden!\n\n// Test mass assignment\ngiven().spec(baseSpec)\n    .body(Map.of("name", "Test", "role", "ADMIN"))\n    .when().post("/api/users")\n    .then().body("role", not(equalTo("ADMIN")));</code></pre>`},
{id:245,part:"G",category:"Security",q:"SQL injection and XSS testing via API.",a:`<pre><code>// SQL Injection test payloads\nString[] sqlPayloads = {\n    "' OR '1'='1",\n    "'; DROP TABLE users;--",\n    "1 UNION SELECT * FROM users",\n    "admin'--"\n};\n\nfor (String payload : sqlPayloads) {\n    given().spec(baseSpec)\n        .queryParam("search", payload)\n        .when().get("/api/users/search")\n        .then().statusCode(anyOf(is(400), is(200)))\n        .body("$", not(hasSize(greaterThan(100)))); // No data dump\n}\n\n// XSS test\ngiven().spec(baseSpec)\n    .body(Map.of("name", "&lt;script&gt;alert('xss')&lt;/script&gt;"))\n    .when().post("/api/users")\n    .then().body("name", not(containsString("&lt;script&gt;")));</code></pre>`},
{id:246,part:"G",category:"Performance",q:"API load testing basics — k6 and Gatling overview.",a:`<pre><code>// k6 load test script (JavaScript)\nimport http from 'k6/http';\nimport { check, sleep } from 'k6';\n\nexport const options = {\n    stages: [\n        { duration: '30s', target: 50 },   // Ramp up\n        { duration: '1m',  target: 50 },   // Sustain\n        { duration: '30s', target: 0 },    // Ramp down\n    ],\n    thresholds: {\n        http_req_duration: ['p(95)&lt;2000'], // 95th percentile &lt; 2s\n        http_req_failed: ['rate&lt;0.01'],     // &lt;1% error rate\n    },\n};\n\nexport default function () {\n    let res = http.get('https://api.myapp.com/users');\n    check(res, { 'status is 200': (r) => r.status === 200 });\n    sleep(1);\n}</code></pre>`},
{id:247,part:"G",category:"Webhook",q:"Testing webhooks and async APIs.",a:`<pre><code>// Strategy for webhook testing:\n// 1. Trigger action that sends webhook\ngiven().spec(baseSpec)\n    .body(paymentRequest)\n    .when().post("/api/payments");\n\n// 2. Poll webhook receiver (or use callback URL)\nawait().atMost(30, SECONDS)\n    .pollInterval(2, SECONDS)\n    .until(() -> {\n        Response res = given().get(webhookReceiverUrl + "/latest");\n        return res.statusCode() == 200 &&\n               res.path("event").equals("payment.completed");\n    });\n\n// 3. Validate webhook payload\nResponse webhook = given().get(webhookReceiverUrl + "/latest");\nassertEquals("payment.completed", webhook.path("event"));\nassertNotNull(webhook.path("data.transaction_id"));</code></pre>`},
{id:248,part:"G",category:"Mock",q:"API mocking with WireMock for isolated testing.",a:`<pre><code>// Start WireMock server\nWireMockServer wireMock = new WireMockServer(8089);\nwireMock.start();\n\n// Stub an endpoint\nwireMock.stubFor(get(urlEqualTo("/api/users/123"))\n    .willReturn(aResponse()\n        .withStatus(200)\n        .withHeader("Content-Type", "application/json")\n        .withBody("{\\\"name\\\":\\\"Mock User\\\",\\\"status\\\":\\\"ACTIVE\\\"}}")));\n\n// Test against mock\ngiven().baseUri("http://localhost:8089")\n    .when().get("/api/users/123")\n    .then().statusCode(200)\n    .body("name", equalTo("Mock User"));\n\n// Verify the mock was called\nwireMock.verify(1, getRequestedFor(urlEqualTo("/api/users/123")));\nwireMock.stop();</code></pre>`},
{id:249,part:"G",category:"Mock",q:"Service virtualization — testing against unavailable dependencies.",a:`<table><tr><th></th><th>Mocking</th><th>Service Virtualization</th></tr><tr><td>Scope</td><td>Single endpoint</td><td>Full service behavior</td></tr><tr><td>Stateful</td><td>Usually no</td><td>Yes (remembers state)</td></tr><tr><td>Data</td><td>Fixed responses</td><td>Realistic data patterns</td></tr><tr><td>Tools</td><td>WireMock, MockServer</td><td>Hoverfly, Mountebank</td></tr><tr><td>Use when</td><td>Unit/integration tests</td><td>E2E with external deps</td></tr></table>`},
{id:250,part:"G",category:"BestPractice",q:"API testing best practices for senior QA leads.",a:`<table><tr><th>Practice</th><th>❌ Bad</th><th>✅ Good</th></tr><tr><td>Test independence</td><td>Tests depend on each other</td><td>Each test sets up own data</td></tr><tr><td>Assertions</td><td>Only check status code</td><td>Status + body + headers + time</td></tr><tr><td>Auth</td><td>Hardcoded tokens</td><td>Dynamic token management</td></tr><tr><td>Data</td><td>Hardcoded IDs</td><td>API-created dynamic data</td></tr><tr><td>Cleanup</td><td>Leave test data</td><td>Teardown via DELETE APIs</td></tr><tr><td>Environments</td><td>Hardcoded URLs</td><td>Config-driven (qa/staging/prod)</td></tr><tr><td>Logging</td><td>Log everything always</td><td>Log on failure only</td></tr></table>`}
