{id:786,part:"V",level:"Senior",category:"WebDriver",q:"WebDriver Methods — get, navigate, getTitle, getCurrentUrl, manage, quit explained",a:'<h4>🌐 WebDriver = Controls the Browser</h4><pre><code>import org.openqa.selenium.WebDriver;\nimport org.openqa.selenium.chrome.ChromeDriver;\n\nWebDriver driver = new ChromeDriver();</code></pre><h4>📍 Navigation Methods</h4><pre><code>// get(url) — opens URL, waits for page load\ndriver.get("https://app.onsurity.com");\n\n// navigate() — browser navigation\ndriver.navigate().to("https://google.com");  // same as get()\ndriver.navigate().back();      // browser back button\ndriver.navigate().forward();   // browser forward button\ndriver.navigate().refresh();   // F5 refresh\n\n// getTitle() — page title\nString title = driver.getTitle();  // "Onsurity - Employee Health"\n\n// getCurrentUrl() — current URL\nString url = driver.getCurrentUrl(); // "https://app.onsurity.com/login"\n\n// getPageSource() — full HTML source\nString html = driver.getPageSource();</code></pre><h4>🪟 Window Management</h4><pre><code>// manage().window() — window controls\ndriver.manage().window().maximize();    // maximize window\ndriver.manage().window().minimize();    // minimize\ndriver.manage().window().fullscreen();  // fullscreen\ndriver.manage().window().setSize(new Dimension(1920, 1080));\ndriver.manage().window().getSize();     // Dimension object\ndriver.manage().window().setPosition(new Point(0, 0));\n\n// getWindowHandle() — current window ID\nString mainWindow = driver.getWindowHandle();\n\n// getWindowHandles() — all open windows/tabs\nSet&lt;String&gt; allWindows = driver.getWindowHandles();\n\n// switchTo().window() — switch between windows\nfor (String handle : allWindows) {\n    if (!handle.equals(mainWindow)) {\n        driver.switchTo().window(handle);  // switch to new tab\n    }\n}</code></pre><h4>🍪 Cookie & Timeout Management</h4><pre><code>// Cookies\ndriver.manage().addCookie(new Cookie("token", "abc123"));\ndriver.manage().getCookieNamed("token");   // Cookie object\ndriver.manage().getCookies();               // Set&lt;Cookie&gt;\ndriver.manage().deleteCookieNamed("token");\ndriver.manage().deleteAllCookies();\n\n// Timeouts\ndriver.manage().timeouts().implicitlyWait(Duration.ofSeconds(10));\ndriver.manage().timeouts().pageLoadTimeout(Duration.ofSeconds(30));\ndriver.manage().timeouts().scriptTimeout(Duration.ofSeconds(15));\n\n// Close & Quit\ndriver.close();  // close CURRENT window/tab only\ndriver.quit();   // close ALL windows + end session ✅ always use in @AfterMethod</code></pre>'},
{id:787,part:"V",level:"Senior",category:"WebElement",q:"WebElement Methods — click, sendKeys, getText, getAttribute, isDisplayed with examples",a:'<h4>🎯 WebElement = Represents an HTML Element on the Page</h4><pre><code>WebElement element = driver.findElement(By.id("username"));</code></pre><h4>🖱️ Interaction Methods</h4><pre><code>// click() — clicks the element\nelement.click();\n\n// sendKeys(text) — types text into input field\nelement.sendKeys("testuser@onsurity.com");\nelement.sendKeys(Keys.ENTER);   // press Enter key\nelement.sendKeys(Keys.TAB);     // press Tab\nelement.sendKeys(Keys.chord(Keys.CONTROL, "a")); // Ctrl+A (select all)\n\n// clear() — clears input field content\nelement.clear();   // removes existing text\nelement.sendKeys("new text"); // then type new text\n\n// submit() — submits the form (if element is inside a form)\nelement.submit();  // same as clicking submit button</code></pre><h4>📖 Reading Element Properties</h4><pre><code>// getText() — visible text content\nWebElement heading = driver.findElement(By.tagName("h1"));\nString text = heading.getText();  // "Welcome to Onsurity"\n\n// getAttribute(name) — HTML attribute value\nelement.getAttribute("value");       // input field current value\nelement.getAttribute("href");        // link URL\nelement.getAttribute("class");       // CSS classes\nelement.getAttribute("placeholder"); // placeholder text\nelement.getAttribute("disabled");    // "true" or null\nelement.getAttribute("data-testid"); // custom data attributes\n\n// getCssValue(property) — computed CSS value\nelement.getCssValue("color");           // "rgba(0, 0, 0, 1)"\nelement.getCssValue("font-size");       // "14px"\nelement.getCssValue("background-color"); // "rgba(255, 255, 255, 1)"\n\n// getTagName() — HTML tag name\nelement.getTagName();  // "input", "div", "button"\n\n// getSize() — element dimensions\nDimension size = element.getSize();\nsize.getWidth();   // 200\nsize.getHeight();  // 40\n\n// getLocation() — position on page\nPoint loc = element.getLocation();\nloc.getX();  // 100\nloc.getY();  // 250\n\n// getRect() — size + location combined\nRectangle rect = element.getRect();</code></pre><h4>✅ State Check Methods</h4><pre><code>// isDisplayed() — visible on page?\nelement.isDisplayed();   // true/false (visibility)\n\n// isEnabled() — interactable? (not disabled)\nelement.isEnabled();     // true if clickable\n\n// isSelected() — checked/selected? (checkbox, radio, option)\nelement.isSelected();    // true if checked\n\n// SDET Pattern: wait + verify\nWebElement btn = driver.findElement(By.id("submit"));\nAssert.assertTrue(btn.isDisplayed(), "Submit button should be visible");\nAssert.assertTrue(btn.isEnabled(), "Submit button should be enabled");\nbtn.click();</code></pre>'},
{id:788,part:"V",level:"Senior",category:"Locators",q:"Locator Strategies — By.id, By.xpath, By.cssSelector, and all 8 locator types",a:'<h4>🔍 8 Locator Strategies (Ordered by Preference)</h4><table><tr><th>#</th><th>Locator</th><th>Syntax</th><th>Speed</th><th>Use When</th></tr><tr><td>1</td><td>By.id</td><td>By.id("login-btn")</td><td>Fastest ✅</td><td>Element has unique ID</td></tr><tr><td>2</td><td>By.name</td><td>By.name("username")</td><td>Fast</td><td>Form fields</td></tr><tr><td>3</td><td>By.cssSelector</td><td>By.cssSelector(".btn-primary")</td><td>Fast ✅</td><td>Most elements (preferred)</td></tr><tr><td>4</td><td>By.xpath</td><td>By.xpath("//div[@class=&apos;x&apos;]")</td><td>Slower</td><td>Complex relationships</td></tr><tr><td>5</td><td>By.className</td><td>By.className("active")</td><td>Fast</td><td>CSS class (single only)</td></tr><tr><td>6</td><td>By.tagName</td><td>By.tagName("input")</td><td>Fast</td><td>Tag type</td></tr><tr><td>7</td><td>By.linkText</td><td>By.linkText("Sign In")</td><td>Fast</td><td>Exact link text</td></tr><tr><td>8</td><td>By.partialLinkText</td><td>By.partialLinkText("Sign")</td><td>Fast</td><td>Partial link text</td></tr></table><h4>📋 CSS Selector Patterns</h4><pre><code>// By ID\nBy.cssSelector("#login-btn")          // #id\n\n// By class\nBy.cssSelector(".btn-primary")         // .class\nBy.cssSelector(".btn.active")          // multiple classes (AND)\n\n// By attribute\nBy.cssSelector("[data-testid=&apos;submit&apos;]")  // exact match\nBy.cssSelector("[placeholder*=&apos;phone&apos;]")  // contains\nBy.cssSelector("[class^=&apos;btn-&apos;]")         // starts with\nBy.cssSelector("[href$=&apos;.pdf&apos;]")          // ends with\n\n// By tag + class\nBy.cssSelector("button.primary")       // button with class\nBy.cssSelector("input[type=&apos;email&apos;]")   // input of type email\n\n// Hierarchy\nBy.cssSelector("div.form input")       // descendant\nBy.cssSelector("div.form > input")     // direct child\nBy.cssSelector("input + label")        // adjacent sibling\n\n// Nth child\nBy.cssSelector("tr:nth-child(3)")      // 3rd row\nBy.cssSelector("li:first-child")       // first item\nBy.cssSelector("li:last-child")        // last item</code></pre><h4>📋 XPath Patterns</h4><pre><code>// Absolute vs Relative\n"//input[@id=&apos;email&apos;]"                    // relative (preferred ✅)\n"/html/body/div/form/input"             // absolute (fragile ❌)\n\n// By attribute\n"//input[@type=&apos;text&apos;]"                   // attribute match\n"//button[@class=&apos;btn-primary&apos;]"          // class match\n"//*[@data-testid=&apos;submit&apos;]"              // any tag with attribute\n\n// By text content\n"//button[text()=&apos;Submit&apos;]"               // exact text\n"//button[contains(text(),&apos;Sign&apos;)]"       // contains text\n"//label[starts-with(text(),&apos;Email&apos;)]"    // starts with\n\n// Axes (relationships)\n"//input[@id=&apos;email&apos;]/parent::div"        // parent element\n"//div[@class=&apos;form&apos;]//input"             // any descendant\n"//label[text()=&apos;Email&apos;]/following-sibling::input"  // next sibling\n"//tr[3]/td[2]"                          // row 3, column 2\n\n// Multiple conditions\n"//input[@type=&apos;text&apos; and @name=&apos;phone&apos;]" // AND\n"//input[@type=&apos;text&apos; or @type=&apos;email&apos;]"  // OR\n"//div[not(@class=&apos;hidden&apos;)]"             // NOT</code></pre>'},
{id:789,part:"V",level:"Senior",category:"Waits",q:"Explicit, Implicit & Fluent Waits — WebDriverWait, ExpectedConditions explained",a:'<h4>⏳ Why Waits? Elements load asynchronously!</h4><table><tr><th>Wait Type</th><th>Scope</th><th>Best For</th><th>Recommendation</th></tr><tr><td>Implicit</td><td>All elements</td><td>Global default</td><td>Avoid ❌</td></tr><tr><td>Explicit</td><td>Specific element</td><td>Targeted waiting</td><td>Use this ✅</td></tr><tr><td>Fluent</td><td>Specific element</td><td>Custom polling</td><td>Advanced cases</td></tr><tr><td>Thread.sleep()</td><td>Hard pause</td><td>Never</td><td>Never ❌❌</td></tr></table><h4>✅ Explicit Wait (WebDriverWait) — PREFERRED</h4><pre><code>import org.openqa.selenium.support.ui.WebDriverWait;\nimport org.openqa.selenium.support.ui.ExpectedConditions;\n\nWebDriverWait wait = new WebDriverWait(driver, Duration.ofSeconds(10));\n\n// Wait for element to be visible\nWebElement el = wait.until(\n    ExpectedConditions.visibilityOfElementLocated(By.id("result")));\n\n// Wait for element to be clickable\nWebElement btn = wait.until(\n    ExpectedConditions.elementToBeClickable(By.cssSelector(".submit")));\nbtn.click();\n\n// Wait for text to appear\nwait.until(\n    ExpectedConditions.textToBePresentInElementLocated(\n        By.id("status"), "Success"));</code></pre><h4>📋 All ExpectedConditions</h4><table><tr><th>Condition</th><th>Waits Until</th></tr><tr><td>visibilityOfElementLocated(by)</td><td>element visible on page</td></tr><tr><td>elementToBeClickable(by)</td><td>element visible + enabled</td></tr><tr><td>presenceOfElementLocated(by)</td><td>element in DOM (may be hidden)</td></tr><tr><td>invisibilityOfElementLocated(by)</td><td>element hidden or removed</td></tr><tr><td>textToBePresentInElementLocated(by, text)</td><td>text appears in element</td></tr><tr><td>titleIs(title)</td><td>page title exact match</td></tr><tr><td>titleContains(text)</td><td>page title contains</td></tr><tr><td>urlContains(text)</td><td>URL contains string</td></tr><tr><td>urlToBe(url)</td><td>URL exact match</td></tr><tr><td>alertIsPresent()</td><td>JS alert/confirm appears</td></tr><tr><td>frameToBeAvailableAndSwitchToIt(by)</td><td>frame loads and switches</td></tr><tr><td>numberOfWindowsToBe(n)</td><td>n windows/tabs open</td></tr><tr><td>stalenessOf(element)</td><td>element detached from DOM</td></tr></table><h4>🔧 Fluent Wait (Custom Polling)</h4><pre><code>Wait&lt;WebDriver&gt; fluentWait = new FluentWait&lt;&gt;(driver)\n    .withTimeout(Duration.ofSeconds(30))\n    .pollingEvery(Duration.ofMillis(500))     // check every 500ms\n    .ignoring(NoSuchElementException.class)   // ignore during polling\n    .ignoring(StaleElementReferenceException.class);\n\nWebElement el = fluentWait.until(d -&gt;\n    d.findElement(By.id("dynamicElement")));</code></pre>'},
{id:790,part:"V",level:"Senior",category:"Actions",q:"Actions Class — hover, drag-drop, right-click, double-click, keyboard actions",a:'<h4>🎮 Actions = Complex User Interactions</h4><pre><code>import org.openqa.selenium.interactions.Actions;\nActions actions = new Actions(driver);</code></pre><h4>🖱️ Mouse Actions</h4><pre><code>WebElement menu = driver.findElement(By.id("menu"));\nWebElement subItem = driver.findElement(By.id("sub-item"));\nWebElement target = driver.findElement(By.id("drop-zone"));\n\n// moveToElement() — hover\nactions.moveToElement(menu).perform();  // hover over menu\n// Then click revealed sub-item:\nactions.moveToElement(menu).moveToElement(subItem).click().perform();\n\n// doubleClick()\nactions.doubleClick(element).perform();\n\n// contextClick() — right-click\nactions.contextClick(element).perform();\n\n// clickAndHold() + release() — drag and drop\nactions.clickAndHold(source)\n       .moveToElement(target)\n       .release()\n       .perform();\n\n// dragAndDrop() — shorthand\nactions.dragAndDrop(source, target).perform();\n\n// dragAndDropBy() — drag by offset\nactions.dragAndDropBy(slider, 100, 0).perform(); // drag right 100px\n\n// moveByOffset() — move to coordinates\nactions.moveByOffset(200, 300).click().perform();</code></pre><h4>⌨️ Keyboard Actions</h4><pre><code>// keyDown / keyUp — hold modifier keys\nactions.keyDown(Keys.SHIFT)\n       .click(element)\n       .keyUp(Keys.SHIFT)\n       .perform();  // Shift+Click (multi-select)\n\n// Ctrl+A, Ctrl+C, Ctrl+V\nactions.keyDown(Keys.CONTROL).sendKeys("a").keyUp(Keys.CONTROL).perform();\nactions.keyDown(Keys.CONTROL).sendKeys("c").keyUp(Keys.CONTROL).perform();\n\n// Chain multiple actions\nactions.moveToElement(menu)\n       .pause(Duration.ofMillis(500))  // wait 500ms\n       .click(subItem)\n       .perform();\n\n// ⚠️ Always call .perform() at the end!\n// Without perform(), nothing happens!</code></pre>'},
{id:791,part:"V",level:"Senior",category:"Select",q:"Select Dropdown, Alert, Frame, JavaScript Executor — handling special elements",a:'<h4>📋 Select Dropdown</h4><pre><code>import org.openqa.selenium.support.ui.Select;\n\nWebElement dropdown = driver.findElement(By.id("country"));\nSelect select = new Select(dropdown);\n\n// Select by visible text\nselect.selectByVisibleText("India");\n\n// Select by value attribute\nselect.selectByValue("IN");\n\n// Select by index (0-based)\nselect.selectByIndex(2);\n\n// Get selected option\nWebElement selected = select.getFirstSelectedOption();\nselected.getText();  // "India"\n\n// Get all options\nList&lt;WebElement&gt; options = select.getOptions();\noptions.forEach(o -&gt; System.out.println(o.getText()));\n\n// Multi-select\nif (select.isMultiple()) {\n    select.deselectAll();\n    select.selectByVisibleText("Option1");\n    select.selectByVisibleText("Option2");\n}</code></pre><h4>🚨 Alert / Confirm / Prompt</h4><pre><code>// Switch to alert\nAlert alert = driver.switchTo().alert();\n\nalert.getText();           // read alert message\nalert.accept();            // click OK\nalert.dismiss();           // click Cancel\nalert.sendKeys("input");   // type in prompt\n\n// Wait for alert first\nnew WebDriverWait(driver, Duration.ofSeconds(5))\n    .until(ExpectedConditions.alertIsPresent());</code></pre><h4>🖼️ Frame / iFrame</h4><pre><code>// Switch to frame\ndriver.switchTo().frame("frameName");        // by name\ndriver.switchTo().frame(0);                  // by index\ndriver.switchTo().frame(frameElement);       // by WebElement\n\n// Switch back to main page\ndriver.switchTo().defaultContent();          // back to top\ndriver.switchTo().parentFrame();             // up one level</code></pre><h4>⚡ JavaScriptExecutor</h4><pre><code>JavascriptExecutor js = (JavascriptExecutor) driver;\n\n// Scroll to element\njs.executeScript("arguments[0].scrollIntoView(true);", element);\n\n// Scroll to bottom\njs.executeScript("window.scrollTo(0, document.body.scrollHeight);");\n\n// Click via JS (bypasses overlay issues)\njs.executeScript("arguments[0].click();", element);\n\n// Set value directly (bypasses readonly)\njs.executeScript("arguments[0].value=&apos;newvalue&apos;;", inputField);\n\n// Get page ready state\nString state = (String) js.executeScript("return document.readyState;");\n\n// Execute async script\njs.executeAsyncScript("setTimeout(arguments[0], 2000);"); // wait 2s</code></pre>'},
{id:792,part:"V",level:"Senior",category:"Screenshots",q:"Screenshots, findElements, Page Object Model — essential Selenium patterns",a:'<h4>📸 Screenshots</h4><pre><code>import org.apache.commons.io.FileUtils;\nimport org.openqa.selenium.OutputType;\nimport org.openqa.selenium.TakesScreenshot;\n\n// Full page screenshot\nFile src = ((TakesScreenshot) driver).getScreenshotAs(OutputType.FILE);\nFileUtils.copyFile(src, new File("screenshot.png"));\n\n// As Base64 (for reports)\nString base64 = ((TakesScreenshot) driver).getScreenshotAs(OutputType.BASE64);\n\n// Element screenshot (Selenium 4+)\nWebElement el = driver.findElement(By.id("chart"));\nFile elShot = el.getScreenshotAs(OutputType.FILE);\nFileUtils.copyFile(elShot, new File("element.png"));</code></pre><h4>📋 findElements() — Multiple Elements</h4><pre><code>// findElement — returns 1st match, throws if not found\nWebElement one = driver.findElement(By.cssSelector(".item"));\n\n// findElements — returns List (empty if none found, NO exception)\nList&lt;WebElement&gt; items = driver.findElements(By.cssSelector(".item"));\nitems.size();  // count of matching elements\n\n// Check if element exists\nboolean exists = !driver.findElements(By.id("popup")).isEmpty();\n\n// Iterate and extract text\nList&lt;String&gt; texts = driver.findElements(By.cssSelector("td.price"))\n    .stream()\n    .map(WebElement::getText)\n    .collect(Collectors.toList());\n\n// Click specific item in list\nList&lt;WebElement&gt; rows = driver.findElements(By.cssSelector("tr"));\nrows.get(2).findElement(By.cssSelector("button")).click(); // 3rd row button</code></pre><h4>🏗️ Page Object Model (POM)</h4><pre><code>public class LoginPage {\n    private WebDriver driver;\n    private WebDriverWait wait;\n\n    // Locators\n    private By emailInput = By.id("email");\n    private By passwordInput = By.id("password");\n    private By loginButton = By.cssSelector("button[type=&apos;submit&apos;]");\n    private By errorMessage = By.cssSelector(".error-msg");\n\n    public LoginPage(WebDriver driver) {\n        this.driver = driver;\n        this.wait = new WebDriverWait(driver, Duration.ofSeconds(10));\n    }\n\n    // Actions\n    public void enterEmail(String email) {\n        wait.until(ExpectedConditions.visibilityOfElementLocated(emailInput))\n            .sendKeys(email);\n    }\n\n    public void enterPassword(String pwd) {\n        driver.findElement(passwordInput).sendKeys(pwd);\n    }\n\n    public DashboardPage clickLogin() {\n        driver.findElement(loginButton).click();\n        return new DashboardPage(driver);  // return next page\n    }\n\n    public String getErrorMessage() {\n        return wait.until(\n            ExpectedConditions.visibilityOfElementLocated(errorMessage))\n            .getText();\n    }\n}</code></pre>'}
);

{id:793,part:"W",level:"Senior",category:"Annotations",q:"TestNG Annotations — @Test, @BeforeMethod, @AfterMethod, @DataProvider lifecycle explained",a:'<h4>🔄 TestNG Execution Lifecycle (Order)</h4><pre><code>@BeforeSuite    → runs ONCE before all tests in suite\n  @BeforeTest   → runs before each &lt;test&gt; tag in XML\n    @BeforeClass  → runs once before first method in class\n      @BeforeMethod → runs before EACH @Test method ✅\n        @Test        → the actual test\n      @AfterMethod  → runs after EACH @Test method ✅\n    @AfterClass   → runs once after last method in class\n  @AfterTest    → runs after each &lt;test&gt; tag\n@AfterSuite     → runs ONCE after all tests</code></pre><h4>📝 All Annotations with Examples</h4><pre><code>public class LoginTests {\n\n    WebDriver driver;\n\n    @BeforeSuite\n    public void globalSetup() {\n        // DB connection, test data setup\n        System.out.println("Suite starting...");\n    }\n\n    @BeforeClass\n    public void classSetup() {\n        // One-time setup for this class\n        driver = new ChromeDriver();\n    }\n\n    @BeforeMethod\n    public void setUp() {\n        // Runs before EACH test — fresh state ✅\n        driver.get("https://app.onsurity.com/login");\n    }\n\n    @Test(priority = 1, description = "Verify login with valid credentials")\n    public void testValidLogin() {\n        // Test code here\n    }\n\n    @Test(priority = 2, enabled = false)  // disabled, will not run\n    public void testForgotPassword() { }\n\n    @AfterMethod\n    public void tearDown() {\n        // Runs after EACH test — cleanup ✅\n        driver.manage().deleteAllCookies();\n    }\n\n    @AfterClass\n    public void classTearDown() {\n        driver.quit();\n    }\n\n    @AfterSuite\n    public void globalTearDown() {\n        // DB cleanup, report generation\n    }\n}</code></pre><h4>📋 @Test Attributes</h4><table><tr><th>Attribute</th><th>Type</th><th>Example</th><th>Description</th></tr><tr><td>priority</td><td>int</td><td>@Test(priority = 1)</td><td>execution order (lower = first)</td></tr><tr><td>enabled</td><td>boolean</td><td>@Test(enabled = false)</td><td>skip this test</td></tr><tr><td>description</td><td>String</td><td>@Test(description = "...")</td><td>test documentation</td></tr><tr><td>groups</td><td>String[]</td><td>@Test(groups = {"smoke"})</td><td>test grouping</td></tr><tr><td>dependsOnMethods</td><td>String[]</td><td>@Test(dependsOnMethods = {"login"})</td><td>method dependency</td></tr><tr><td>dependsOnGroups</td><td>String[]</td><td>@Test(dependsOnGroups = {"setup"})</td><td>group dependency</td></tr><tr><td>timeOut</td><td>long</td><td>@Test(timeOut = 5000)</td><td>fail if exceeds ms</td></tr><tr><td>expectedExceptions</td><td>Class[]</td><td>@Test(expectedExceptions = NPE.class)</td><td>expect this exception</td></tr><tr><td>invocationCount</td><td>int</td><td>@Test(invocationCount = 3)</td><td>run N times</td></tr><tr><td>dataProvider</td><td>String</td><td>@Test(dataProvider = "loginData")</td><td>data-driven testing</td></tr></table>'},
{id:794,part:"W",level:"Senior",category:"Assertions",q:"TestNG Assertions — assertEquals, assertTrue, assertAll (soft assertions) with examples",a:'<h4>✅ Hard Assertions (Stop on First Failure)</h4><pre><code>import org.testng.Assert;\n\n// assertEquals(actual, expected, message)\nAssert.assertEquals(title, "Dashboard", "Wrong page title");\nAssert.assertEquals(count, 5, "Item count mismatch");\nAssert.assertEquals(price, 299.99, "Price mismatch");\n\n// assertTrue / assertFalse\nAssert.assertTrue(element.isDisplayed(), "Element should be visible");\nAssert.assertFalse(errorMsg.isDisplayed(), "Error should not show");\n\n// assertNull / assertNotNull\nAssert.assertNull(result, "Result should be null");\nAssert.assertNotNull(response.getBody(), "Response body is null!");\n\n// assertSame / assertNotSame (reference comparison)\nAssert.assertSame(obj1, obj2, "Should be same object");\n\n// assertEqualsNoOrder (arrays, ignore order)\nString[] actual = {"b", "a", "c"};\nString[] expected = {"a", "b", "c"};\nAssert.assertEqualsNoOrder(actual, expected);\n\n// assertThrows (Java 8+)\nAssert.assertThrows(IllegalArgumentException.class, () -&gt; {\n    service.validate(null);\n});\n\n// fail() — explicitly fail\nif (unexpectedCondition) {\n    Assert.fail("This should never happen: " + details);\n}</code></pre><h4>🔄 Soft Assertions (Continue After Failure) ✅</h4><pre><code>import org.testng.asserts.SoftAssert;\n\n@Test\npublic void verifyDashboard() {\n    SoftAssert soft = new SoftAssert();\n\n    soft.assertEquals(getTitle(), "Dashboard", "Title mismatch");\n    soft.assertTrue(logo.isDisplayed(), "Logo missing");\n    soft.assertEquals(userName, "QA User", "Wrong username");\n    soft.assertTrue(menuItems.size() &gt; 0, "No menu items");\n    soft.assertEquals(notifCount, 3, "Wrong notification count");\n\n    // ⚠️ MUST call assertAll() at the end!\n    // Without this, failures are SILENTLY ignored!\n    soft.assertAll();  // reports ALL failures at once\n}\n\n// Output: 2 of 5 assertions failed:\n//   Title mismatch: expected [Dashboard] but found [Login]\n//   Wrong username: expected [QA User] but found [Admin]</code></pre><h4>When to Use Which</h4><table><tr><th>Type</th><th>Stops on Fail?</th><th>Use When</th></tr><tr><td>Hard Assert</td><td>Yes ❌ (stops test)</td><td>Critical checks (login must work)</td></tr><tr><td>Soft Assert</td><td>No ✅ (continues)</td><td>UI validation (check all fields)</td></tr></table>'},
{id:795,part:"W",level:"Senior",category:"DataProvider",q:"@DataProvider — Data-driven testing with arrays, Excel, JSON with examples",a:'<h4>📊 @DataProvider = Supply Multiple Test Data Sets</h4><pre><code>// Basic DataProvider — returns Object[][]\n@DataProvider(name = "loginData")\npublic Object[][] getLoginData() {\n    return new Object[][] {\n        {"admin@onsurity.com", "Admin@123", true},     // valid\n        {"user@test.com", "wrong", false},              // invalid password\n        {"", "Admin@123", false},                       // empty email\n        {"admin@onsurity.com", "", false},               // empty password\n    };\n}\n\n@Test(dataProvider = "loginData")\npublic void testLogin(String email, String password, boolean expected) {\n    loginPage.enterEmail(email);\n    loginPage.enterPassword(password);\n    loginPage.clickLogin();\n\n    if (expected) {\n        Assert.assertTrue(dashboardPage.isDisplayed());\n    } else {\n        Assert.assertTrue(loginPage.isErrorDisplayed());\n    }\n}\n// This test runs 4 TIMES — once for each row!</code></pre><h4>📋 DataProvider from External Sources</h4><pre><code>// From JSON file\n@DataProvider(name = "jsonData")\npublic Object[][] fromJson() throws Exception {\n    String json = Files.readString(Path.of("testdata/login.json"));\n    JSONArray arr = new JSONArray(json);\n    Object[][] data = new Object[arr.length()][3];\n    for (int i = 0; i &lt; arr.length(); i++) {\n        JSONObject obj = arr.getJSONObject(i);\n        data[i][0] = obj.getString("email");\n        data[i][1] = obj.getString("password");\n        data[i][2] = obj.getBoolean("valid");\n    }\n    return data;\n}\n\n// From another class\n@DataProvider(name = "externalData")\npublic static Object[][] data() {  // must be static if in different class\n    return new Object[][] {{ "a", 1 }, { "b", 2 }};\n}\n\n@Test(dataProvider = "externalData", dataProviderClass = TestData.class)\npublic void test(String name, int val) { }\n\n// Parallel DataProvider\n@DataProvider(name = "parallelData", parallel = true)\npublic Object[][] parallelData() {\n    return new Object[][] {{ "data1" }, { "data2" }, { "data3" }};\n}  // each row runs in separate thread!</code></pre>'},
{id:796,part:"W",level:"Senior",category:"Groups",q:"TestNG Groups, Dependencies, Parallel, Listeners — advanced configuration",a:'<h4>🏷️ Groups — Categorize Tests</h4><pre><code>@Test(groups = {"smoke", "login"})\npublic void testLogin() { }\n\n@Test(groups = {"regression", "login"})\npublic void testLoginWithInvalidCreds() { }\n\n@Test(groups = {"smoke", "dashboard"})\npublic void testDashboardLoad() { }\n\n// Run only smoke tests via testng.xml:\n// &lt;groups&gt;&lt;run&gt;&lt;include name="smoke"/&gt;&lt;/run&gt;&lt;/groups&gt;</code></pre><h4>🔗 Dependencies</h4><pre><code>@Test\npublic void testLogin() { /* must pass first */ }\n\n@Test(dependsOnMethods = {"testLogin"})\npublic void testDashboard() {\n    // SKIPPED if testLogin fails\n}\n\n@Test(dependsOnMethods = {"testLogin"}, alwaysRun = true)\npublic void testLogout() {\n    // runs EVEN if testLogin fails\n}</code></pre><h4>⚡ Parallel Execution</h4><pre><code>&lt;!-- testng.xml --&gt;\n&lt;suite name="Suite" parallel="methods" thread-count="4"&gt;\n  &lt;test name="AllTests"&gt;\n    &lt;classes&gt;\n      &lt;class name="com.tests.LoginTest"/&gt;\n    &lt;/classes&gt;\n  &lt;/test&gt;\n&lt;/suite&gt;</code></pre><table><tr><th>parallel=</th><th>What Runs in Parallel</th></tr><tr><td>methods</td><td>@Test methods</td></tr><tr><td>classes</td><td>Test classes</td></tr><tr><td>tests</td><td>&lt;test&gt; tags</td></tr><tr><td>instances</td><td>Class instances</td></tr></table><h4>👂 Listeners</h4><pre><code>public class TestListener implements ITestListener {\n\n    @Override\n    public void onTestStart(ITestResult result) {\n        System.out.println("Starting: " + result.getName());\n    }\n\n    @Override\n    public void onTestSuccess(ITestResult result) {\n        System.out.println("PASSED: " + result.getName());\n    }\n\n    @Override\n    public void onTestFailure(ITestResult result) {\n        System.out.println("FAILED: " + result.getName());\n        // Take screenshot on failure\n        captureScreenshot(result.getName());\n    }\n\n    @Override\n    public void onTestSkipped(ITestResult result) {\n        System.out.println("SKIPPED: " + result.getName());\n    }\n}\n\n// Register: @Listeners(TestListener.class) on test class\n// Or in testng.xml: &lt;listeners&gt;&lt;listener class-name="..."/&gt;&lt;/listeners&gt;</code></pre><h4>🔁 Retry Failed Tests</h4><pre><code>public class RetryAnalyzer implements IRetryAnalyzer {\n    private int count = 0;\n    private static final int MAX_RETRY = 2;\n\n    @Override\n    public boolean retry(ITestResult result) {\n        if (count &lt; MAX_RETRY) {\n            count++;\n            return true;  // retry\n        }\n        return false;  // give up\n    }\n}\n\n@Test(retryAnalyzer = RetryAnalyzer.class)\npublic void flakyTest() { }</code></pre>'}
);

{id:797,part:"X",level:"Senior",category:"Page",q:"Playwright Page Methods — navigate, click, fill, type, waitFor, evaluate explained",a:'<h4>🎭 Playwright = Modern Browser Automation (Auto-waiting built-in!)</h4><pre><code>import com.microsoft.playwright.*;\n\nPlaywright pw = Playwright.create();\nBrowser browser = pw.chromium().launch(\n    new BrowserType.LaunchOptions().setHeadless(false));\nBrowserContext context = browser.newContext();\nPage page = context.newPage();</code></pre><h4>📍 Navigation</h4><pre><code>// navigate(url) — goes to URL, waits for load\npage.navigate("https://app.onsurity.com");\npage.navigate("https://app.onsurity.com",\n    new Page.NavigateOptions().setWaitUntil(WaitUntilState.NETWORKIDLE));\n\n// URL and title\npage.url();     // "https://app.onsurity.com/login"\npage.title();   // "Onsurity"\n\n// History navigation\npage.goBack();\npage.goForward();\npage.reload();</code></pre><h4>🖱️ Interaction Methods</h4><pre><code>// click(selector) — auto-waits for element, scrolls, clicks\npage.click("button#submit");\npage.click("text=Sign In");           // by text\npage.click("[data-testid=&apos;login&apos;]");  // by test ID\n\n// fill(selector, value) — clears + types (for input fields) ✅\npage.fill("input#email", "qa@onsurity.com");\npage.fill("input#password", "Secret123");\n\n// type(selector, text) — simulates keystroke by keystroke\npage.type("input#search", "health insurance", \n    new Page.TypeOptions().setDelay(50));  // 50ms between keys\n\n// press(selector, key) — press keyboard key\npage.press("input#search", "Enter");\npage.press("body", "Escape");\npage.press("input", "Control+a");  // select all\n\n// check / uncheck (checkbox, radio)\npage.check("input#agree");\npage.uncheck("input#newsletter");\npage.isChecked("input#agree");  // true\n\n// selectOption (dropdown)\npage.selectOption("select#country", "IN");              // by value\npage.selectOption("select#country", new SelectOption().setLabel("India")); // by label\n\n// setInputFiles (file upload)\npage.setInputFiles("input[type=&apos;file&apos;]", Path.of("doc.pdf"));\n\n// hover\npage.hover("nav.menu");\n\n// dblclick / right-click\npage.dblclick("td.cell");\npage.click("td.cell", new Page.ClickOptions().setButton(MouseButton.RIGHT));</code></pre><h4>📖 Reading Page Content</h4><pre><code>// textContent — all text (including hidden)\nString text = page.textContent("h1.title");  // "Welcome"\n\n// innerText — visible text only\nString visible = page.innerText("div.message");\n\n// innerHTML — HTML inside element\nString html = page.innerHTML("div.container");\n\n// inputValue — current value of input field\nString val = page.inputValue("input#email");\n\n// getAttribute\nString href = page.getAttribute("a.link", "href");\nString cls = page.getAttribute("div", "class");\n\n// isVisible / isEnabled / isChecked\nboolean vis = page.isVisible("div.modal");\nboolean en = page.isEnabled("button#submit");\nboolean chk = page.isChecked("input#agree");</code></pre>'},
{id:798,part:"X",level:"Senior",category:"Locator",q:"Playwright Locators — getByRole, getByText, getByTestId, locator chaining",a:'<h4>🎯 Locator API (Recommended over page.click(selector))</h4><pre><code>// Locators are lazy — they do not search until an action is performed</code></pre><h4>📋 Built-in Locator Methods</h4><pre><code>// getByRole — ARIA roles (most resilient ✅)\npage.getByRole(AriaRole.BUTTON, new Page.GetByRoleOptions().setName("Submit"));\npage.getByRole(AriaRole.HEADING, new Page.GetByRoleOptions().setName("Dashboard"));\npage.getByRole(AriaRole.LINK, new Page.GetByRoleOptions().setName("Sign Up"));\npage.getByRole(AriaRole.TEXTBOX, new Page.GetByRoleOptions().setName("Email"));\npage.getByRole(AriaRole.CHECKBOX, new Page.GetByRoleOptions().setName("Agree"));\n\n// getByText — visible text content\npage.getByText("Welcome to Onsurity");\npage.getByText("Sign In", new Page.GetByTextOptions().setExact(true));\n\n// getByLabel — form labels\npage.getByLabel("Email Address").fill("qa@onsurity.com");\npage.getByLabel("Password").fill("secret");\n\n// getByPlaceholder — placeholder text\npage.getByPlaceholder("Enter your email").fill("test@test.com");\npage.getByPlaceholder("Enter phone number").fill("9876543210");\n\n// getByTestId — data-testid attribute ✅ best for automation\npage.getByTestId("login-button").click();\npage.getByTestId("user-name").textContent();\n\n// getByAltText — image alt text\npage.getByAltText("Company Logo").isVisible();\n\n// getByTitle — title attribute\npage.getByTitle("Close dialog").click();</code></pre><h4>🔗 Locator Chaining & Filtering</h4><pre><code>// locator(selector) — CSS or XPath\npage.locator("div.card").first();       // first match\npage.locator("div.card").last();        // last match\npage.locator("div.card").nth(2);        // 3rd match (0-indexed)\npage.locator("div.card").count();       // total count\n\n// Chaining — narrow down results\npage.locator("div.form").locator("input#email").fill("test@test.com");\n\n// filter() — filter by text or child locator\npage.getByRole(AriaRole.LISTITEM)\n    .filter(new Locator.FilterOptions().setHasText("Premium Plan"))\n    .getByRole(AriaRole.BUTTON, new Page.GetByRoleOptions().setName("Buy"))\n    .click();\n\n// All elements\nList&lt;String&gt; texts = page.locator("ul.menu li").allTextContents();\nint count = page.locator("tr.data-row").count();\n\n// Iterate\nfor (Locator item : page.locator("li.product").all()) {\n    System.out.println(item.textContent());\n}</code></pre>'},
{id:799,part:"X",level:"Senior",category:"Assertions",q:"Playwright Assertions — expect, auto-retry assertions, and all assertion methods",a:'<h4>✅ Playwright Assertions (Auto-Retrying!)</h4><p>Unlike Selenium, Playwright assertions <strong>auto-retry</strong> until timeout (default 5s). No need for explicit waits!</p><pre><code>import static com.microsoft.playwright.assertions.PlaywrightAssertions.assertThat;</code></pre><h4>📋 Page Assertions</h4><pre><code>// Page title\nassertThat(page).hasTitle("Dashboard");\nassertThat(page).hasTitle(Pattern.compile(".*Dashboard.*"));\n\n// Page URL\nassertThat(page).hasURL("https://app.onsurity.com/dashboard");\nassertThat(page).hasURL(Pattern.compile(".*/dashboard"));</code></pre><h4>📋 Locator Assertions</h4><pre><code>Locator heading = page.locator("h1");\nLocator button = page.getByRole(AriaRole.BUTTON, \n    new Page.GetByRoleOptions().setName("Submit"));\nLocator input = page.locator("input#email");\nLocator list = page.locator("ul.items li");\n\n// ═══ VISIBILITY ═══\nassertThat(heading).isVisible();\nassertThat(heading).isHidden();        // not visible\nassertThat(heading).not().isVisible();  // negation\n\n// ═══ TEXT ═══\nassertThat(heading).hasText("Welcome");\nassertThat(heading).hasText(Pattern.compile("Welcome.*"));\nassertThat(heading).containsText("Welcome");  // partial match\n\n// ═══ STATE ═══\nassertThat(button).isEnabled();\nassertThat(button).isDisabled();\nassertThat(input).isEditable();\nassertThat(input).isFocused();\n\n// ═══ ATTRIBUTES ═══\nassertThat(input).hasAttribute("placeholder", "Enter email");\nassertThat(button).hasClass("btn-primary");\nassertThat(input).hasId("email");\nassertThat(input).hasValue("qa@onsurity.com");\nassertThat(input).isEmpty();  // no value\n\n// ═══ COUNT ═══\nassertThat(list).hasCount(5);  // exactly 5 items\n\n// ═══ CSS ═══\nassertThat(heading).hasCSS("color", "rgb(0, 0, 0)");\n\n// ═══ CUSTOM TIMEOUT ═══\nassertThat(heading).hasText("Loaded",\n    new LocatorAssertions.HasTextOptions().setTimeout(15000));  // 15s</code></pre><h4>🔧 Soft Assertions in Playwright</h4><pre><code>// Collect multiple failures without stopping\nSoftAssertions.create(soft -&gt; {\n    soft.assertThat(page.locator("h1")).hasText("Dashboard");\n    soft.assertThat(page.locator(".logo")).isVisible();\n    soft.assertThat(page.locator(".user-name")).hasText("QA User");\n});  // reports all failures at end</code></pre>'},
{id:800,part:"X",level:"Senior",category:"Waiting",q:"Playwright Auto-Waiting, waitFor, waitForSelector, waitForResponse patterns",a:'<h4>⏳ Playwright Auto-Waits by Default!</h4><p>Every action (click, fill, etc.) <strong>automatically waits</strong> for the element to be actionable. No explicit waits needed for most cases!</p><table><tr><th>Action</th><th>Auto-Waits For</th></tr><tr><td>click()</td><td>attached, visible, stable, enabled, no overlay</td></tr><tr><td>fill()</td><td>attached, visible, enabled, editable</td></tr><tr><td>check()</td><td>attached, visible, stable, enabled</td></tr><tr><td>textContent()</td><td>attached</td></tr><tr><td>isVisible()</td><td>does NOT wait (instant check)</td></tr></table><h4>📋 Explicit Wait Methods (When Needed)</h4><pre><code>// waitForSelector — wait for element in DOM\npage.waitForSelector("div.loaded", \n    new Page.WaitForSelectorOptions().setState(WaitForSelectorState.VISIBLE));\n\n// waitForSelector states:\n// VISIBLE — element is visible\n// HIDDEN — element is hidden or removed\n// ATTACHED — element is in DOM\n// DETACHED — element is removed from DOM\n\n// waitForLoadState — page load states\npage.waitForLoadState(LoadState.NETWORKIDLE);  // no network for 500ms\npage.waitForLoadState(LoadState.DOMCONTENTLOADED);\npage.waitForLoadState(LoadState.LOAD);  // window.onload\n\n// waitForURL — wait for navigation\npage.waitForURL("**/dashboard");    // glob pattern\npage.waitForURL(Pattern.compile(".*/dashboard"));\n\n// waitForTimeout — hard wait (avoid if possible)\npage.waitForTimeout(2000);  // 2 seconds</code></pre><h4>🌐 Wait for Network</h4><pre><code>// waitForResponse — wait for API response\nResponse response = page.waitForResponse(\n    r -&gt; r.url().contains("/api/login") &amp;&amp; r.status() == 200,\n    () -&gt; page.click("button#submit")  // trigger action\n);\nString body = response.text();\nint status = response.status();\n\n// waitForRequest — wait for API request\nRequest request = page.waitForRequest(\n    r -&gt; r.url().contains("/api/order"),\n    () -&gt; page.click("button#checkout")\n);\n\n// Intercept network (route)\npage.route("**/api/users", route -&gt; {\n    route.fulfill(new Route.FulfillOptions()\n        .setStatus(200)\n        .setBody("[{\\\"name\\\": \\\"Mock User\\\"}]"));\n});\n\n// Block resources (faster tests)\npage.route("**/*.{png,jpg,gif}", Route::abort);  // block images</code></pre>'},
{id:801,part:"X",level:"Senior",category:"Advanced",q:"Playwright Advanced — BrowserContext, screenshots, trace, dialog, frame handling",a:'<h4>🔲 Browser Context = Isolated Session</h4><pre><code>// Each context = separate cookies, storage, cache\nBrowserContext context1 = browser.newContext();\nBrowserContext context2 = browser.newContext();\n// context1 and context2 are completely isolated!\n\n// Context with options\nBrowserContext ctx = browser.newContext(\n    new Browser.NewContextOptions()\n        .setViewportSize(1920, 1080)\n        .setLocale("en-IN")\n        .setTimezoneId("Asia/Kolkata")\n        .setGeolocation(19.076, 72.877)    // Mumbai\n        .setPermissions(List.of("geolocation"))\n        .setStorageStatePath(Path.of("auth.json"))  // reuse login!\n);\n\n// Save storage state (skip login in future tests)\ncontext.storageState(\n    new BrowserContext.StorageStateOptions()\n        .setPath(Path.of("auth.json")));</code></pre><h4>📸 Screenshots & Videos</h4><pre><code>// Full page screenshot\npage.screenshot(new Page.ScreenshotOptions()\n    .setPath(Path.of("screenshot.png"))\n    .setFullPage(true));  // includes scrollable area\n\n// Element screenshot\npage.locator("div.chart").screenshot(\n    new Locator.ScreenshotOptions().setPath(Path.of("chart.png")));\n\n// Video recording\nBrowserContext ctx = browser.newContext(\n    new Browser.NewContextOptions()\n        .setRecordVideoDir(Path.of("videos/"))\n        .setRecordVideoSize(1280, 720));\nPage page = ctx.newPage();\n// ... test actions ...\nctx.close();  // video saved on close</code></pre><h4>🔍 Trace Viewer (Debug Tool)</h4><pre><code>// Start tracing\ncontext.tracing().start(new Tracing.StartOptions()\n    .setScreenshots(true)\n    .setSnapshots(true)\n    .setSources(true));\n\n// ... run test ...\n\n// Stop and save trace\ncontext.tracing().stop(new Tracing.StopOptions()\n    .setPath(Path.of("trace.zip")));\n\n// View: npx playwright show-trace trace.zip</code></pre><h4>💬 Dialog (Alert/Confirm/Prompt)</h4><pre><code>// Must register handler BEFORE triggering dialog\npage.onDialog(dialog -&gt; {\n    System.out.println("Dialog: " + dialog.message());\n    dialog.accept();        // click OK\n    // dialog.dismiss();    // click Cancel\n    // dialog.accept("input text"); // for prompts\n});\npage.click("button#delete");  // triggers dialog</code></pre><h4>🖼️ Frame Handling</h4><pre><code>// By name or URL\nFrame frame = page.frame("frameName");\nFrame frame = page.frameByUrl(Pattern.compile(".*iframe.*"));\n\n// Using frameLocator (recommended ✅)\npage.frameLocator("#payment-iframe")\n    .locator("input#card").fill("5506900480000008");\n\n// Nested frames\npage.frameLocator("#outer").frameLocator("#inner")\n    .locator("button").click();</code></pre>'}
);

{id:802,part:"Y",level:"Senior",category:"GivenWhenThen",q:"Rest Assured Given-When-Then — request building, headers, body, params with examples",a:'<h4>🌐 Rest Assured = BDD-Style API Testing for Java</h4><pre><code>import static io.restassured.RestAssured.*;\nimport static org.hamcrest.Matchers.*;</code></pre><h4>📋 Given-When-Then Structure</h4><pre><code>// GIVEN — setup request (headers, params, body, auth)\n// WHEN  — send request (GET, POST, PUT, DELETE)\n// THEN  — validate response (status, body, headers)\n\ngiven()\n    .baseUri("https://api.onsurity.com")\n    .header("Authorization", "Bearer " + token)\n    .header("Content-Type", "application/json")\n    .queryParam("page", 1)\n    .queryParam("limit", 10)\n.when()\n    .get("/api/v1/members")\n.then()\n    .statusCode(200)\n    .body("data.size()", greaterThan(0));</code></pre><h4>📝 Request Configuration</h4><pre><code>given()\n    // ═══ BASE URI ═══\n    .baseUri("https://api.onsurity.com")\n    .basePath("/api/v1")\n    .port(443)\n\n    // ═══ HEADERS ═══\n    .header("Authorization", "Bearer " + token)\n    .header("Content-Type", "application/json")\n    .header("Accept", "application/json")\n    .headers(Map.of("X-Custom", "value", "X-Trace", "123"))\n\n    // ═══ QUERY PARAMS (?key=value) ═══\n    .queryParam("status", "active")\n    .queryParam("page", 1)\n    .queryParams(Map.of("sort", "name", "order", "asc"))\n\n    // ═══ PATH PARAMS (/users/{id}) ═══\n    .pathParam("id", "USR-123")\n    // then: .get("/users/{id}")\n\n    // ═══ FORM PARAMS (application/x-www-form-urlencoded) ═══\n    .formParam("username", "admin")\n    .formParam("password", "secret")\n\n    // ═══ COOKIES ═══\n    .cookie("session", "abc123")\n    .cookies(Map.of("session", "abc", "theme", "dark"))\n\n    // ═══ REQUEST BODY ═══\n    .body("{\\\"name\\\": \\\"QA User\\\", \\\"email\\\": \\\"qa@onsurity.com\\\"}")\n    // Or from object (auto-serialize):\n    .body(new User("QA User", "qa@onsurity.com"))\n    // Or from Map:\n    .body(Map.of("name", "QA User", "email", "qa@onsurity.com"))\n\n    // ═══ CONTENT TYPE shorthand ═══\n    .contentType(ContentType.JSON)\n    .accept(ContentType.JSON)\n\n.when()\n    .post("/api/members");</code></pre>'},
{id:803,part:"Y",level:"Senior",category:"HTTP",q:"HTTP Methods — GET, POST, PUT, PATCH, DELETE with full request/response examples",a:'<h4>📋 All HTTP Methods in Rest Assured</h4><pre><code>// ═══ GET — Read/Fetch data ═══\nResponse getResp = given()\n    .header("Authorization", "Bearer " + token)\n.when()\n    .get("/api/members/OSHP-12345");\n\ngetResp.statusCode();         // 200\ngetResp.jsonPath().getString("name");  // "QA User"\n\n// ═══ POST — Create new resource ═══\nResponse postResp = given()\n    .contentType(ContentType.JSON)\n    .body("{\\\"phone\\\": \\\"9876543210\\\", \\\"name\\\": \\\"New User\\\"}")\n.when()\n    .post("/api/members");\n\npostResp.statusCode();        // 201\nString id = postResp.jsonPath().getString("id");  // "OSHP-67890"\n\n// ═══ PUT — Full update (replace entire resource) ═══\ngiven()\n    .contentType(ContentType.JSON)\n    .body("{\\\"name\\\": \\\"Updated\\\", \\\"phone\\\": \\\"9876543210\\\"}")\n.when()\n    .put("/api/members/" + id)\n.then()\n    .statusCode(200);\n\n// ═══ PATCH — Partial update (only changed fields) ═══\ngiven()\n    .contentType(ContentType.JSON)\n    .body("{\\\"name\\\": \\\"Patched Name\\\"}")\n.when()\n    .patch("/api/members/" + id)\n.then()\n    .statusCode(200);\n\n// ═══ DELETE — Remove resource ═══\ngiven()\n    .header("Authorization", "Bearer " + token)\n.when()\n    .delete("/api/members/" + id)\n.then()\n    .statusCode(204);  // No Content</code></pre><h4>HTTP Status Codes for SDET</h4><table><tr><th>Code</th><th>Name</th><th>Meaning</th></tr><tr><td>200</td><td>OK</td><td>Success (GET, PUT, PATCH)</td></tr><tr><td>201</td><td>Created</td><td>Resource created (POST)</td></tr><tr><td>204</td><td>No Content</td><td>Success, no body (DELETE)</td></tr><tr><td>400</td><td>Bad Request</td><td>Invalid input</td></tr><tr><td>401</td><td>Unauthorized</td><td>Missing/invalid auth</td></tr><tr><td>403</td><td>Forbidden</td><td>No permission</td></tr><tr><td>404</td><td>Not Found</td><td>Resource missing</td></tr><tr><td>409</td><td>Conflict</td><td>Duplicate resource</td></tr><tr><td>422</td><td>Unprocessable</td><td>Validation error</td></tr><tr><td>500</td><td>Server Error</td><td>Backend crash</td></tr></table>'},
{id:804,part:"Y",level:"Senior",category:"Validation",q:"Response Validation — statusCode, body, headers, Hamcrest matchers with examples",a:'<h4>✅ .then() — Response Validation Chain</h4><pre><code>given()\n    .header("Authorization", "Bearer " + token)\n.when()\n    .get("/api/members")\n.then()\n    // ═══ STATUS CODE ═══\n    .statusCode(200)\n    .statusCode(anyOf(is(200), is(201)))\n    .statusLine(containsString("OK"))\n\n    // ═══ RESPONSE BODY (JSON Path) ═══\n    .body("name", equalTo("QA User"))\n    .body("email", containsString("@onsurity.com"))\n    .body("age", greaterThan(18))\n    .body("status", is(oneOf("active", "pending")))\n    .body("roles", hasItem("admin"))\n    .body("roles", hasSize(3))\n    .body("roles", contains("admin", "user", "viewer"))  // order matters\n    .body("roles", containsInAnyOrder("viewer", "admin", "user"))  // any order\n    .body("data", not(empty()))\n    .body("data.size()", greaterThanOrEqualTo(1))\n\n    // ═══ NESTED JSON ═══\n    .body("data[0].name", equalTo("First User"))\n    .body("data.find{it.id == &apos;OSHP-123&apos;}.name", equalTo("Target User"))\n    .body("data.collect{it.name}", hasItem("QA User"))\n\n    // ═══ RESPONSE HEADERS ═══\n    .header("Content-Type", containsString("application/json"))\n    .header("X-Request-Id", notNullValue())\n\n    // ═══ RESPONSE TIME ═══\n    .time(lessThan(3000L))  // under 3 seconds\n\n    // ═══ CONTENT TYPE ═══\n    .contentType(ContentType.JSON);</code></pre><h4>📋 Hamcrest Matchers Quick Reference</h4><table><tr><th>Matcher</th><th>Example</th><th>Description</th></tr><tr><td>equalTo(x)</td><td>equalTo("QA")</td><td>exact match</td></tr><tr><td>is(x)</td><td>is(200)</td><td>same as equalTo</td></tr><tr><td>not(x)</td><td>not(equalTo("error"))</td><td>negation</td></tr><tr><td>nullValue()</td><td>nullValue()</td><td>is null</td></tr><tr><td>notNullValue()</td><td>notNullValue()</td><td>is not null</td></tr><tr><td>containsString(s)</td><td>containsString("user")</td><td>substring match</td></tr><tr><td>startsWith(s)</td><td>startsWith("OSHP-")</td><td>prefix match</td></tr><tr><td>endsWith(s)</td><td>endsWith(".com")</td><td>suffix match</td></tr><tr><td>greaterThan(n)</td><td>greaterThan(0)</td><td>number comparison</td></tr><tr><td>lessThan(n)</td><td>lessThan(100)</td><td>number comparison</td></tr><tr><td>hasItem(x)</td><td>hasItem("admin")</td><td>collection contains</td></tr><tr><td>hasSize(n)</td><td>hasSize(5)</td><td>collection size</td></tr><tr><td>empty()</td><td>not(empty())</td><td>empty collection</td></tr><tr><td>hasKey(k)</td><td>hasKey("name")</td><td>map has key</td></tr><tr><td>hasEntry(k,v)</td><td>hasEntry("name","QA")</td><td>map has entry</td></tr></table>'},
{id:805,part:"Y",level:"Senior",category:"Extract",q:"Response Extraction — jsonPath, xmlPath, as(), extract() with examples",a:'<h4>📤 Extracting Data from Response</h4><pre><code>// ═══ METHOD 1: Extract entire Response object ═══\nResponse response = given()\n    .header("Authorization", "Bearer " + token)\n.when()\n    .get("/api/members/OSHP-123")\n.then()\n    .statusCode(200)\n    .extract()\n    .response();\n\n// Read from Response\nint status = response.statusCode();         // 200\nString body = response.body().asString();   // raw JSON string\nString header = response.header("X-Request-Id");\nlong time = response.time();                // response time in ms</code></pre><h4>🔍 JsonPath — Navigate JSON Response</h4><pre><code>JsonPath json = response.jsonPath();\n\n// Simple values\nString name = json.getString("name");           // "QA User"\nint age = json.getInt("age");                   // 25\nboolean active = json.getBoolean("isActive");   // true\nfloat price = json.getFloat("premium");         // 299.99\n\n// Nested objects\nString city = json.getString("address.city");   // "Mumbai"\nString zip = json.getString("address.zip");     // "400001"\n\n// Arrays\nString first = json.getString("data[0].name");      // first item name\nString last = json.getString("data[-1].name");       // last item name\nList&lt;String&gt; names = json.getList("data.name");      // all names\nList&lt;Map&lt;String,Object&gt;&gt; data = json.getList("data"); // full list\nint count = json.getList("data").size();             // count\n\n// Groovy GPath (powerful!)\njson.getString("data.find{it.id == &apos;OSHP-123&apos;}.name");  // find by condition\njson.getList("data.findAll{it.status == &apos;active&apos;}.name"); // filter\njson.getInt("data.max{it.age}.age");                     // max value\njson.getInt("data.collect{it.amount}.sum()");             // sum</code></pre><h4>🔄 Deserialize to POJO</h4><pre><code>// as(Class) — deserialize JSON to Java object\nMember member = given()\n    .header("Authorization", "Bearer " + token)\n.when()\n    .get("/api/members/OSHP-123")\n.then()\n    .statusCode(200)\n    .extract()\n    .as(Member.class);\n\nmember.getName();    // "QA User"\nmember.getEmail();   // "qa@onsurity.com"\n\n// Extract single value directly\nString name = given()\n    .get("/api/members/OSHP-123")\n.then()\n    .extract()\n    .path("data.name");  // direct path extraction</code></pre>'},
{id:806,part:"Y",level:"Senior",category:"Auth",q:"Authentication, Schema Validation, Logging, File Upload — advanced patterns",a:'<h4>🔐 Authentication Methods</h4><pre><code>// Basic Auth\ngiven()\n    .auth().basic("username", "password")\n.when()\n    .get("/api/secure");\n\n// Bearer Token\ngiven()\n    .header("Authorization", "Bearer " + token)\n.when()\n    .get("/api/protected");\n\n// OAuth 2.0\ngiven()\n    .auth().oauth2(accessToken)\n.when()\n    .get("/api/resource");\n\n// Preemptive (send auth immediately, no challenge)\ngiven()\n    .auth().preemptive().basic("user", "pass")\n.when()\n    .get("/api/data");</code></pre><h4>📋 JSON Schema Validation</h4><pre><code>import static io.restassured.module.jsv.JsonSchemaValidator.*;\n\n// Validate response matches JSON schema\ngiven()\n    .get("/api/members/OSHP-123")\n.then()\n    .statusCode(200)\n    .body(matchesJsonSchemaInClasspath("schemas/member-schema.json"));\n\n// Schema file (member-schema.json):\n// {\n//   "type": "object",\n//   "required": ["id", "name", "email"],\n//   "properties": {\n//     "id": { "type": "string", "pattern": "^OSHP-" },\n//     "name": { "type": "string" },\n//     "email": { "type": "string", "format": "email" }\n//   }\n// }</code></pre><h4>📝 Request/Response Logging</h4><pre><code>// Log request details\ngiven()\n    .log().all()          // log EVERYTHING\n    .log().headers()      // only headers\n    .log().body()         // only body\n    .log().params()       // only params\n    .log().uri()          // only URL\n.when()\n    .get("/api/data")\n.then()\n    .log().all()          // log response\n    .log().ifError()      // only if status >= 400\n    .log().ifStatusCodeMatches(greaterThanOrEqualTo(400))\n    .log().body()         // only response body\n    .statusCode(200);</code></pre><h4>📁 File Upload/Download</h4><pre><code>// Upload\ngiven()\n    .multiPart("file", new File("report.pdf"))\n    .multiPart("description", "Monthly Report")\n.when()\n    .post("/api/upload")\n.then()\n    .statusCode(200);\n\n// Download\nbyte[] fileBytes = given()\n    .get("/api/download/report.pdf")\n.then()\n    .statusCode(200)\n    .extract()\n    .asByteArray();\nFiles.write(Path.of("downloaded.pdf"), fileBytes);</code></pre><h4>🏗️ RequestSpecification — Reusable Config</h4><pre><code>// Define once, reuse everywhere\nRequestSpecification baseSpec = new RequestSpecBuilder()\n    .setBaseUri("https://api.onsurity.com")\n    .setBasePath("/api/v1")\n    .addHeader("Authorization", "Bearer " + token)\n    .setContentType(ContentType.JSON)\n    .addFilter(new RequestLoggingFilter())\n    .addFilter(new ResponseLoggingFilter())\n    .build();\n\n// Use in tests\ngiven()\n    .spec(baseSpec)\n.when()\n    .get("/members")\n.then()\n    .statusCode(200);\n\n// ResponseSpecification — reusable validations\nResponseSpecification successSpec = new ResponseSpecBuilder()\n    .expectStatusCode(200)\n    .expectContentType(ContentType.JSON)\n    .expectResponseTime(lessThan(3000L))\n    .build();\n\ngiven().spec(baseSpec)\n    .get("/members")\n.then()\n    .spec(successSpec);  // applies all validations</code></pre>'}
);
