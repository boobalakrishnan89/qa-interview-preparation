{id:807,part:"Z",level:"Senior",category:"Step1-Setup",q:"Step 1: Project Setup — Maven, Dependencies, Playwright Installation from scratch",a:'<h4>🚀 Step 1: Create a New Maven Project</h4><pre><code>// Terminal Commands:\nmkdir playwright-framework\ncd playwright-framework\nmvn archetype:generate \\\n  -DgroupId=com.onsurity \\\n  -DartifactId=playwright-framework \\\n  -DarchetypeArtifactId=maven-archetype-quickstart \\\n  -DinteractiveMode=false</code></pre><h4>📦 pom.xml — Essential Dependencies</h4><pre><code>&lt;properties&gt;\n    &lt;maven.compiler.source&gt;17&lt;/maven.compiler.source&gt;\n    &lt;maven.compiler.target&gt;17&lt;/maven.compiler.target&gt;\n    &lt;playwright.version&gt;1.60.0&lt;/playwright.version&gt;\n    &lt;testng.version&gt;7.10.2&lt;/testng.version&gt;\n    &lt;log4j.version&gt;2.24.3&lt;/log4j.version&gt;\n    &lt;jackson.version&gt;2.18.2&lt;/jackson.version&gt;\n&lt;/properties&gt;\n\n&lt;dependencies&gt;\n    &lt;!-- Playwright — browser automation --&gt;\n    &lt;dependency&gt;\n        &lt;groupId&gt;com.microsoft.playwright&lt;/groupId&gt;\n        &lt;artifactId&gt;playwright&lt;/artifactId&gt;\n        &lt;version&gt;${playwright.version}&lt;/version&gt;\n    &lt;/dependency&gt;\n\n    &lt;!-- TestNG — test framework --&gt;\n    &lt;dependency&gt;\n        &lt;groupId&gt;org.testng&lt;/groupId&gt;\n        &lt;artifactId&gt;testng&lt;/artifactId&gt;\n        &lt;version&gt;${testng.version}&lt;/version&gt;\n    &lt;/dependency&gt;\n\n    &lt;!-- Log4j2 — logging --&gt;\n    &lt;dependency&gt;\n        &lt;groupId&gt;org.apache.logging.log4j&lt;/groupId&gt;\n        &lt;artifactId&gt;log4j-core&lt;/artifactId&gt;\n        &lt;version&gt;${log4j.version}&lt;/version&gt;\n    &lt;/dependency&gt;\n    &lt;dependency&gt;\n        &lt;groupId&gt;org.apache.logging.log4j&lt;/groupId&gt;\n        &lt;artifactId&gt;log4j-api&lt;/artifactId&gt;\n        &lt;version&gt;${log4j.version}&lt;/version&gt;\n    &lt;/dependency&gt;\n\n    &lt;!-- Jackson — JSON parsing --&gt;\n    &lt;dependency&gt;\n        &lt;groupId&gt;com.fasterxml.jackson.core&lt;/groupId&gt;\n        &lt;artifactId&gt;jackson-databind&lt;/artifactId&gt;\n        &lt;version&gt;${jackson.version}&lt;/version&gt;\n    &lt;/dependency&gt;\n&lt;/dependencies&gt;</code></pre><h4>🔧 Install Playwright Browsers</h4><pre><code>// After adding dependency, install browsers:\nmvn exec:java -e \\\n  -Dexec.mainClass=com.microsoft.playwright.CLI \\\n  -Dexec.args="install"\n\n// This downloads Chromium, Firefox, WebKit browsers\n// Stored in: ~/.cache/ms-playwright/</code></pre><h4>📁 Project Folder Structure (What We Will Build)</h4><pre><code>src/test/java/com/onsurity/\n├── base/\n│   ├── BaseTest.java        ← TestNG lifecycle (Step 3)\n│   └── BasePage.java        ← Reusable page methods (Step 4)\n├── factory/\n│   ├── BrowserFactory.java  ← Browser creation (Step 2)\n│   └── DriverFactory.java   ← Thread-safe driver (Step 2)\n├── config/\n│   └── ConfigManager.java   ← Environment config (Step 5)\n├── pages/\n│   ├── LoginPage.java       ← Page Object (Step 4)\n│   └── DashboardPage.java   ← Page Object (Step 4)\n├── tests/\n│   └── LoginTest.java       ← Test class (Step 6)\n├── utils/\n│   └── TestDataReader.java  ← JSON test data (Step 7)\n└── listeners/\n    └── TestListener.java    ← Screenshot on fail (Step 8)\n\nsrc/test/resources/\n├── config.properties        ← Default config (Step 5)\n├── config-qa.properties     ← QA environment (Step 5)\n├── testdata/login.json      ← Test data (Step 7)\n├── testng.xml               ← Suite configuration (Step 9)\n└── log4j2.xml               ← Logging config</code></pre><h4>💡 Interview Tip</h4><p>"I built a Playwright Java framework using Maven. The key dependencies are playwright for browser automation, TestNG for test management, Log4j2 for logging, and Jackson for JSON parsing. I install browsers via the Playwright CLI."</p>'},
{id:808,part:"Z",level:"Senior",category:"Step2-Driver",q:"Step 2: BrowserFactory + DriverFactory — Thread-safe browser management with ThreadLocal",a:'<h4>🏭 BrowserFactory — Creates Browser Instances</h4><pre><code>package com.onsurity.factory;\n\nimport com.microsoft.playwright.*;\nimport org.apache.logging.log4j.LogManager;\nimport org.apache.logging.log4j.Logger;\nimport java.nio.file.Paths;\n\npublic class BrowserFactory {\n    private static final Logger logger = LogManager.getLogger(BrowserFactory.class);\n\n    // Creates browser based on config\n    public static Browser createBrowser(Playwright playwright,\n                                         String browserType,\n                                         boolean headless) {\n        BrowserType.LaunchOptions options = new BrowserType.LaunchOptions()\n                .setHeadless(headless)\n                .setSlowMo(0);  // set &gt; 0 for debugging\n\n        switch (browserType.toLowerCase()) {\n            case "firefox":\n                return playwright.firefox().launch(options);\n            case "webkit":\n                return playwright.webkit().launch(options);\n            default: // chromium\n                return playwright.chromium().launch(options);\n        }\n    }\n\n    // Creates context with viewport + video recording\n    public static BrowserContext createContext(Browser browser) {\n        return browser.newContext(new Browser.NewContextOptions()\n                .setViewportSize(1920, 1080)\n                .setRecordVideoDir(Paths.get("target/videos/"))\n                .setRecordVideoSize(1280, 720));\n    }\n}</code></pre><h4>🔒 DriverFactory — Thread-Safe with ThreadLocal</h4><pre><code>package com.onsurity.factory;\n\nimport com.microsoft.playwright.*;\nimport org.apache.logging.log4j.LogManager;\nimport org.apache.logging.log4j.Logger;\nimport java.nio.file.Paths;\n\npublic class DriverFactory {\n    private static final Logger logger = LogManager.getLogger(DriverFactory.class);\n\n    // ThreadLocal = each thread gets its own Playwright/Browser/Page\n    // WHY? Parallel test execution requires isolation!\n    private static final ThreadLocal&lt;Playwright&gt; playwrightTL = new ThreadLocal&lt;&gt;();\n    private static final ThreadLocal&lt;Browser&gt; browserTL = new ThreadLocal&lt;&gt;();\n    private static final ThreadLocal&lt;BrowserContext&gt; contextTL = new ThreadLocal&lt;&gt;();\n    private static final ThreadLocal&lt;Page&gt; pageTL = new ThreadLocal&lt;&gt;();\n\n    // Initialize entire Playwright stack\n    public static void initDriver() {\n        Playwright pw = Playwright.create();\n        Browser browser = BrowserFactory.createBrowser(pw, "chromium", true);\n        BrowserContext context = BrowserFactory.createContext(browser);\n        Page page = context.newPage();\n\n        playwrightTL.set(pw);\n        browserTL.set(browser);\n        contextTL.set(context);\n        pageTL.set(page);\n\n        logger.info("[Thread-{}] Driver initialized", Thread.currentThread().getId());\n    }\n\n    // Teardown — close everything\n    public static void quitDriver() {\n        Page page = pageTL.get();\n        if (page != null) { page.close(); pageTL.remove(); }\n\n        BrowserContext ctx = contextTL.get();\n        if (ctx != null) { ctx.close(); contextTL.remove(); }\n\n        Browser browser = browserTL.get();\n        if (browser != null) { browser.close(); browserTL.remove(); }\n\n        Playwright pw = playwrightTL.get();\n        if (pw != null) { pw.close(); playwrightTL.remove(); }\n\n        logger.info("[Thread-{}] Driver quit", Thread.currentThread().getId());\n    }\n\n    // Accessors\n    public static Page getPage() { return pageTL.get(); }\n    public static BrowserContext getContext() { return contextTL.get(); }\n    public static Browser getBrowser() { return browserTL.get(); }\n\n    // Screenshot on failure\n    public static void captureScreenshot(String testName) {\n        Page page = getPage();\n        if (page != null) {\n            String path = "target/screenshots/" + testName + "_"\n                    + System.currentTimeMillis() + ".png";\n            page.screenshot(new Page.ScreenshotOptions()\n                    .setPath(Paths.get(path)).setFullPage(true));\n            logger.info("Screenshot: {}", path);\n        }\n    }\n}</code></pre><h4>💡 WHY ThreadLocal? (Interview Answer)</h4><table><tr><th>Without ThreadLocal</th><th>With ThreadLocal</th></tr><tr><td>All threads share 1 browser</td><td>Each thread has own browser</td></tr><tr><td>Tests interfere with each other</td><td>Complete isolation</td></tr><tr><td>Parallel execution breaks</td><td>Parallel execution works ✅</td></tr><tr><td>Cookies/state leak between tests</td><td>Each test has clean state</td></tr></table><p><strong>Interview Answer:</strong> "I use ThreadLocal for Playwright, Browser, BrowserContext, and Page. This ensures that when TestNG runs tests in parallel, each thread has its own isolated browser session. Without ThreadLocal, parallel tests would share state and fail intermittently."</p>'},
{id:809,part:"Z",level:"Senior",category:"Step3-Base",q:"Step 3: BaseTest — TestNG lifecycle with @BeforeSuite, @BeforeClass, @AfterMethod hooks",a:'<h4>🏗️ BaseTest — Foundation for ALL Test Classes</h4><pre><code>package com.onsurity.base;\n\nimport com.microsoft.playwright.*;\nimport com.onsurity.factory.DriverFactory;\nimport org.apache.logging.log4j.LogManager;\nimport org.apache.logging.log4j.Logger;\nimport org.testng.ITestResult;\nimport org.testng.annotations.*;\nimport java.util.concurrent.atomic.AtomicInteger;\n\npublic abstract class BaseTest {\n    protected static final Logger logger = LogManager.getLogger(BaseTest.class);\n    protected Page page;\n    protected BrowserContext context;\n\n    // Suite-level counters (thread-safe)\n    private static final AtomicInteger totalTests = new AtomicInteger(0);\n    private static final AtomicInteger passedTests = new AtomicInteger(0);\n    private static final AtomicInteger failedTests = new AtomicInteger(0);\n    private static long suiteStartTime;\n\n    // ═══ SUITE LEVEL — runs ONCE for entire suite ═══\n    @BeforeSuite(alwaysRun = true)\n    public void suiteSetup() {\n        suiteStartTime = System.currentTimeMillis();\n        logger.info("╔══════════════════════════════╗");\n        logger.info("║   TEST SUITE STARTING        ║");\n        logger.info("╚══════════════════════════════╝");\n    }\n\n    // ═══ CLASS LEVEL — runs once per test CLASS ═══\n    @BeforeClass(alwaysRun = true)\n    public void classSetup() {\n        DriverFactory.initDriver();         // creates browser\n        this.page = DriverFactory.getPage();\n        this.context = DriverFactory.getContext();\n        logger.info("Driver initialized for: {}",\n                this.getClass().getSimpleName());\n    }\n\n    // ═══ METHOD LEVEL — runs after EACH test method ═══\n    @AfterMethod(alwaysRun = true)\n    public void afterMethod(ITestResult result) {\n        totalTests.incrementAndGet();\n\n        if (result.getStatus() == ITestResult.FAILURE) {\n            failedTests.incrementAndGet();\n            logger.error("❌ FAILED: {}", result.getName());\n            // Screenshot on failure!\n            DriverFactory.captureScreenshot(result.getName());\n        } else if (result.getStatus() == ITestResult.SUCCESS) {\n            passedTests.incrementAndGet();\n            logger.info("✅ PASSED: {}", result.getName());\n        }\n    }\n\n    // ═══ CLASS TEARDOWN — runs once after all methods in class ═══\n    @AfterClass(alwaysRun = true)\n    public void classTeardown() {\n        DriverFactory.quitDriver();  // closes browser\n        logger.info("Driver quit for: {}",\n                this.getClass().getSimpleName());\n    }\n\n    // ═══ SUITE TEARDOWN — prints summary ═══\n    @AfterSuite(alwaysRun = true)\n    public void suiteTeardown() {\n        long duration = (System.currentTimeMillis() - suiteStartTime) / 1000;\n        logger.info("╔══════════════════════════════╗");\n        logger.info("║   EXECUTION SUMMARY          ║");\n        logger.info("║   Total : {}                 ║", totalTests.get());\n        logger.info("║   Passed: {} ✅              ║", passedTests.get());\n        logger.info("║   Failed: {} ❌              ║", failedTests.get());\n        logger.info("║   Time  : {}s                ║", duration);\n        logger.info("╚══════════════════════════════╝");\n    }\n\n    // ═══ Convenience Methods ═══\n    protected void navigateTo(String url) {\n        page.navigate(url);\n        page.waitForLoadState();\n    }\n}</code></pre><h4>📋 Lifecycle Flow (How It Runs)</h4><pre><code>@BeforeSuite          → "TEST SUITE STARTING" (once)\n  @BeforeClass        → DriverFactory.initDriver() (per class)\n    @Test testLogin   → actual test\n    @AfterMethod      → screenshot if failed\n    @Test testLogout  → actual test\n    @AfterMethod      → screenshot if failed\n  @AfterClass         → DriverFactory.quitDriver() (per class)\n@AfterSuite           → print execution summary (once)</code></pre><h4>💡 Interview: Why abstract?</h4><p>"BaseTest is <strong>abstract</strong> because it should never be instantiated directly. Every test class extends it and inherits the browser setup/teardown lifecycle. The <code>alwaysRun = true</code> ensures cleanup runs even when tests fail."</p>'},
{id:810,part:"Z",level:"Senior",category:"Step4-POM",q:"Step 4: Page Object Model — BasePage + LoginPage + DashboardPage with real examples",a:'<h4>📄 BasePage — Reusable Methods for ALL Pages</h4><pre><code>package com.onsurity.base;\n\nimport com.microsoft.playwright.*;\nimport com.microsoft.playwright.options.WaitForSelectorState;\nimport org.apache.logging.log4j.LogManager;\nimport org.apache.logging.log4j.Logger;\n\npublic abstract class BasePage {\n    protected final Page page;\n    protected final Logger logger;\n\n    public BasePage(Page page) {\n        this.page = page;\n        this.logger = LogManager.getLogger(this.getClass());\n    }\n\n    // ═══ INTERACTIONS ═══\n    protected void click(String selector) {\n        logger.debug("Click: {}", selector);\n        page.locator(selector).click();\n    }\n\n    protected void fill(String selector, String text) {\n        logger.debug("Fill: {} into {}", text, selector);\n        page.locator(selector).fill(text);\n    }\n\n    protected void type(String selector, String text) {\n        page.locator(selector).pressSequentially(text,\n            new Locator.PressSequentiallyOptions().setDelay(100));\n    }\n\n    protected String getText(String selector) {\n        return page.locator(selector).textContent();\n    }\n\n    // ═══ STATE CHECKS ═══\n    protected boolean isVisible(String selector) {\n        return page.locator(selector).isVisible();\n    }\n\n    protected boolean isEnabled(String selector) {\n        return page.locator(selector).isEnabled();\n    }\n\n    // ═══ WAITS ═══\n    protected void waitForElement(String selector) {\n        page.locator(selector).waitFor(new Locator.WaitForOptions()\n                .setState(WaitForSelectorState.VISIBLE)\n                .setTimeout(30000));\n    }\n\n    protected void waitForHidden(String selector) {\n        page.locator(selector).waitFor(new Locator.WaitForOptions()\n                .setState(WaitForSelectorState.HIDDEN)\n                .setTimeout(30000));\n    }\n\n    // ═══ SCREENSHOTS ═══\n    protected byte[] takeScreenshot() {\n        return page.screenshot(new Page.ScreenshotOptions().setFullPage(true));\n    }\n\n    // ═══ JAVASCRIPT ═══\n    protected void scrollToElement(String selector) {\n        page.locator(selector).scrollIntoViewIfNeeded();\n    }\n}</code></pre><h4>🔐 LoginPage — Concrete Page Object</h4><pre><code>package com.onsurity.pages;\n\nimport com.onsurity.base.BasePage;\nimport com.microsoft.playwright.Page;\nimport static com.microsoft.playwright.assertions.PlaywrightAssertions.assertThat;\n\npublic class LoginPage extends BasePage {\n\n    // ═══ LOCATORS (centralized!) ═══\n    private final String phoneInput = "input[type=&apos;tel&apos;]";\n    private final String otpInputs = "input[maxlength=&apos;1&apos;]";\n    private final String continueBtn = "button:has-text(&apos;Continue&apos;)";\n    private final String errorMsg = ".error-message";\n\n    public LoginPage(Page page) {\n        super(page);\n    }\n\n    // ═══ ACTIONS (return type = next page for fluent chaining) ═══\n    public LoginPage enterPhone(String phone) {\n        logger.info("Entering phone: {}", phone);\n        fill(phoneInput, phone);\n        return this;  // method chaining\n    }\n\n    public LoginPage clickContinue() {\n        click(continueBtn);\n        return this;\n    }\n\n    public LoginPage enterOtp(String otp) {\n        logger.info("Entering OTP: {}", otp);\n        var inputs = page.locator(otpInputs).all();\n        for (int i = 0; i &lt; otp.length() &amp;&amp; i &lt; inputs.size(); i++) {\n            inputs.get(i).fill(String.valueOf(otp.charAt(i)));\n        }\n        return this;\n    }\n\n    public DashboardPage loginWith(String phone, String otp) {\n        enterPhone(phone);\n        clickContinue();\n        enterOtp(otp);\n        clickContinue();\n        return new DashboardPage(page); // navigate to next page\n    }\n\n    // ═══ ASSERTIONS ═══\n    public LoginPage verifyErrorDisplayed(String expectedText) {\n        waitForElement(errorMsg);\n        assertThat(page.locator(errorMsg)).containsText(expectedText);\n        return this;\n    }\n}</code></pre><h4>📊 DashboardPage</h4><pre><code>public class DashboardPage extends BasePage {\n    private final String welcomeHeading = "h1";\n    private final String userNameLabel = ".user-name";\n    private final String logoutBtn = "button:has-text(&apos;Logout&apos;)";\n\n    public DashboardPage(Page page) { super(page); }\n\n    public boolean isLoaded() {\n        return isVisible(welcomeHeading);\n    }\n\n    public String getUserName() {\n        return getText(userNameLabel);\n    }\n\n    public LoginPage logout() {\n        click(logoutBtn);\n        return new LoginPage(page);\n    }\n}</code></pre><h4>💡 POM Design Principles (Interview Answer)</h4><table><tr><th>Principle</th><th>Why</th></tr><tr><td>Locators in Page class</td><td>Single place to update when UI changes</td></tr><tr><td>Actions return Page objects</td><td>Method chaining + navigation flow</td></tr><tr><td>Assertions in Page class</td><td>Encapsulate verification logic</td></tr><tr><td>No driver setup in Pages</td><td>Pages receive Page via constructor</td></tr></table>'},
{id:811,part:"Z",level:"Senior",category:"Step5-Config",q:"Step 5: ConfigManager — Multi-environment configuration with properties file hierarchy",a:'<h4>⚙️ ConfigManager — Singleton with Priority Resolution</h4><pre><code>package com.onsurity.config;\n\nimport java.io.*;\nimport java.util.Properties;\nimport org.apache.logging.log4j.*;\n\npublic class ConfigManager {\n    private static final Logger logger = LogManager.getLogger(ConfigManager.class);\n    private static ConfigManager instance;\n    private final Properties properties;\n    private final String activeEnv;\n\n    private ConfigManager() {\n        properties = new Properties();\n\n        // 1. Load default config\n        loadFile("src/test/resources/config.properties");\n\n        // 2. Determine environment\n        activeEnv = resolveEnv();\n\n        // 3. Load env-specific overrides\n        loadFileIfExists("src/test/resources/config-" + activeEnv + ".properties");\n\n        logger.info("Config loaded — env: {}", activeEnv);\n    }\n\n    public static synchronized ConfigManager getInstance() {\n        if (instance == null) instance = new ConfigManager();\n        return instance;\n    }\n\n    // ═══ RESOLUTION ORDER: System Prop → Env Var → Config File ═══\n    public String getProperty(String key, String defaultValue) {\n        // Priority 1: System property (-Dkey=value)\n        String sys = System.getProperty(key);\n        if (sys != null) return sys;\n\n        // Priority 2: Environment variable (key.name → KEY_NAME)\n        String envKey = key.toUpperCase().replace(".", "_");\n        String envVal = System.getenv(envKey);\n        if (envVal != null) return envVal;\n\n        // Priority 3: Config file\n        return properties.getProperty(key, defaultValue);\n    }\n\n    // ═══ CONVENIENCE GETTERS ═══\n    public String getBaseUrl()  { return getProperty("base.url", "http://localhost:3000"); }\n    public String getBrowser()  { return getProperty("browser", "chromium"); }\n    public boolean isHeadless() { return Boolean.parseBoolean(getProperty("headless", "true")); }\n    public int getTimeout()     { return Integer.parseInt(getProperty("timeout", "30000")); }\n    public String getEnv()      { return activeEnv; }\n\n    private String resolveEnv() {\n        String env = System.getProperty("env");\n        if (env == null) env = System.getenv("TEST_ENV");\n        if (env == null) env = properties.getProperty("env", "qa");\n        return env.toLowerCase();\n    }\n\n    private void loadFile(String path) { /* load properties */ }\n    private void loadFileIfExists(String path) { /* load if exists */ }\n}</code></pre><h4>📝 config.properties (Default)</h4><pre><code># Default configuration\nenv=qa\nbrowser=chromium\nheadless=true\ntimeout=30000\nviewport.width=1920\nviewport.height=1080\nretry.count=2\nscreenshot.on.failure=true\n\n# URLs\nbase.url=https://app.onpremqa.onsurity.org\napi.base.url=https://api.onpremqa.onsurity.org</code></pre><h4>📝 config-qa.properties (QA Overrides)</h4><pre><code># QA-specific overrides\nbase.url=https://app.onpremqa.onsurity.org\ntest.otp=3548\ntest.phone.valid=9876543210</code></pre><h4>🔀 How to Switch Environments</h4><pre><code># Via system property (highest priority)\nmvn test -Denv=staging\nmvn test -Denv=prod\n\n# Via environment variable\nexport TEST_ENV=staging &amp;&amp; mvn test\n\n# Default: reads "env" from config.properties</code></pre><h4>💡 Interview: Why Singleton?</h4><p>"ConfigManager is a Singleton because configuration should be loaded once and shared across all classes. The three-priority resolution (System property → Env var → Config file) allows overriding config at runtime without changing code — essential for CI/CD pipelines."</p>'},
{id:812,part:"Z",level:"Senior",category:"Step6-Test",q:"Step 6: Writing Your First Test — LoginTest with assertions, data-driven patterns",a:'<h4>🧪 First Test: LoginTest</h4><pre><code>package com.onsurity.tests;\n\nimport com.onsurity.base.BaseTest;\nimport com.onsurity.pages.LoginPage;\nimport com.onsurity.pages.DashboardPage;\nimport org.testng.Assert;\nimport org.testng.annotations.*;\nimport static com.microsoft.playwright.assertions.PlaywrightAssertions.assertThat;\n\npublic class LoginTest extends BaseTest {\n\n    private LoginPage loginPage;\n\n    @BeforeMethod\n    public void setup() {\n        navigateTo("https://app.onsurity.com/login");\n        loginPage = new LoginPage(page);\n    }\n\n    @Test(priority = 1, description = "Valid login navigates to dashboard")\n    public void testValidLogin() {\n        DashboardPage dashboard = loginPage.loginWith("9876543210", "3548");\n\n        Assert.assertTrue(dashboard.isLoaded(), "Dashboard should load");\n        assertThat(page).hasURL(java.util.regex.Pattern.compile(".*/dashboard.*"));\n    }\n\n    @Test(priority = 2, description = "Invalid phone shows error")\n    public void testInvalidPhone() {\n        loginPage.enterPhone("123")  // too short\n                 .clickContinue()\n                 .verifyErrorDisplayed("Invalid phone");\n    }\n\n    @Test(priority = 3, description = "Empty phone shows validation")\n    public void testEmptyPhone() {\n        loginPage.clickContinue();  // without entering phone\n        loginPage.verifyErrorDisplayed("Phone is required");\n    }\n}</code></pre><h4>📊 Data-Driven Test with @DataProvider</h4><pre><code>@DataProvider(name = "loginData")\npublic Object[][] loginTestData() {\n    return new Object[][] {\n        {"9876543210", "3548", true,  "valid credentials"},\n        {"9876543210", "0000", false, "wrong OTP"},\n        {"123",        "3548", false, "short phone"},\n        {"",           "3548", false, "empty phone"},\n    };\n}\n\n@Test(dataProvider = "loginData",\n      description = "Login with various inputs")\npublic void testLoginScenarios(String phone, String otp,\n                               boolean shouldPass, String scenario) {\n    logger.info("Testing: {}", scenario);\n\n    if (shouldPass) {\n        DashboardPage dash = loginPage.loginWith(phone, otp);\n        Assert.assertTrue(dash.isLoaded());\n    } else {\n        loginPage.enterPhone(phone).clickContinue();\n        // Should show error or remain on login page\n        assertThat(page).hasURL(java.util.regex.Pattern.compile(".*/login.*"));\n    }\n}</code></pre><h4>📋 Test Execution Flow</h4><pre><code>1. BaseTest.suiteSetup()     → log "SUITE STARTING"\n2. BaseTest.classSetup()     → DriverFactory.initDriver()\n3. LoginTest.setup()         → navigate to /login\n4. LoginTest.testValidLogin() → actual test\n5. BaseTest.afterMethod()    → log PASS/FAIL + screenshot\n6. LoginTest.setup()         → navigate to /login (fresh)\n7. LoginTest.testInvalidPhone() → actual test\n8. BaseTest.afterMethod()    → log PASS/FAIL + screenshot\n9. BaseTest.classTeardown()  → DriverFactory.quitDriver()\n10. BaseTest.suiteTeardown() → print summary</code></pre>'},
{id:813,part:"Z",level:"Senior",category:"Step7-Data",q:"Step 7: Test Data Management — JSON reader, environment-specific data, dynamic data",a:'<h4>📁 Test Data Strategy</h4><pre><code>src/test/resources/testdata/\n├── testdata-login-qa.json       ← QA environment data\n├── testdata-login-staging.json  ← Staging data\n└── testdata-checkout-qa.json    ← Module-specific data\n\n// Naming convention: testdata-{module}-{env}.json</code></pre><h4>📝 testdata-login-qa.json</h4><pre><code>{\n  "validUser": {\n    "phone": "9876543210",\n    "otp": "3548",\n    "name": "QA User"\n  },\n  "invalidUser": {\n    "phone": "123",\n    "otp": "0000"\n  },\n  "checkout": {\n    "cardNumber": "5506900480000008",\n    "cardExpiry": "05/30",\n    "cardCvv": "123",\n    "threeDsOtp": "123456"\n  }\n}</code></pre><h4>🔧 TestDataReader — Generic JSON Reader</h4><pre><code>package com.onsurity.utils;\n\nimport com.fasterxml.jackson.databind.*;\nimport com.onsurity.config.ConfigManager;\nimport java.io.File;\nimport java.util.Map;\n\npublic class TestDataReader {\n    private static final ObjectMapper mapper = new ObjectMapper();\n\n    // Read entire JSON file as Map\n    @SuppressWarnings("unchecked")\n    public static Map&lt;String, Object&gt; readTestData(String module) {\n        String env = ConfigManager.getInstance().getEnv();\n        String path = "src/test/resources/testdata/testdata-"\n                + module + "-" + env + ".json";\n        try {\n            return mapper.readValue(new File(path), Map.class);\n        } catch (Exception e) {\n            throw new RuntimeException("Failed to read: " + path, e);\n        }\n    }\n\n    // Read specific section\n    public static JsonNode getSection(String module, String section) {\n        String env = ConfigManager.getInstance().getEnv();\n        String path = "src/test/resources/testdata/testdata-"\n                + module + "-" + env + ".json";\n        try {\n            JsonNode root = mapper.readTree(new File(path));\n            return root.get(section);\n        } catch (Exception e) {\n            throw new RuntimeException("Failed to read: " + path, e);\n        }\n    }\n\n    // Read as POJO\n    public static &lt;T&gt; T readAs(String module, String section, Class&lt;T&gt; clazz) {\n        JsonNode node = getSection(module, section);\n        try {\n            return mapper.treeToValue(node, clazz);\n        } catch (Exception e) {\n            throw new RuntimeException("Failed to deserialize", e);\n        }\n    }\n}</code></pre><h4>📋 Using in Tests</h4><pre><code>// In your test class\nJsonNode data = TestDataReader.getSection("login", "validUser");\nString phone = data.get("phone").asText();  // "9876543210"\nString otp = data.get("otp").asText();      // "3548"\n\n// DataProvider from JSON\n@DataProvider(name = "jsonLoginData")\npublic Object[][] fromJson() {\n    JsonNode valid = TestDataReader.getSection("login", "validUser");\n    JsonNode invalid = TestDataReader.getSection("login", "invalidUser");\n    return new Object[][] {\n        {valid.get("phone").asText(), valid.get("otp").asText(), true},\n        {invalid.get("phone").asText(), invalid.get("otp").asText(), false}\n    };\n}</code></pre>'},
{id:814,part:"Z",level:"Senior",category:"Step8-Listener",q:"Step 8: TestNG Listeners — Screenshot on failure, retry logic, reporting hooks",a:'<h4>👂 TestListener — Auto Screenshot + Logging</h4><pre><code>package com.onsurity.listeners;\n\nimport com.onsurity.factory.DriverFactory;\nimport org.testng.ITestListener;\nimport org.testng.ITestResult;\nimport org.apache.logging.log4j.*;\n\npublic class TestListener implements ITestListener {\n    private static final Logger logger = LogManager.getLogger(TestListener.class);\n\n    @Override\n    public void onTestStart(ITestResult result) {\n        logger.info("▶ Starting: {}", result.getName());\n    }\n\n    @Override\n    public void onTestSuccess(ITestResult result) {\n        long duration = result.getEndMillis() - result.getStartMillis();\n        logger.info("✅ PASSED: {} ({}ms)", result.getName(), duration);\n    }\n\n    @Override\n    public void onTestFailure(ITestResult result) {\n        logger.error("❌ FAILED: {} — {}", result.getName(),\n                result.getThrowable().getMessage());\n\n        // Auto screenshot on failure!\n        DriverFactory.captureScreenshot(result.getName());\n    }\n\n    @Override\n    public void onTestSkipped(ITestResult result) {\n        logger.warn("⏭ SKIPPED: {} — {}", result.getName(),\n                result.getThrowable() != null ?\n                result.getThrowable().getMessage() : "dependency failed");\n    }\n}</code></pre><h4>🔁 RetryAnalyzer — Auto-Retry Flaky Tests</h4><pre><code>package com.onsurity.listeners;\n\nimport org.testng.IRetryAnalyzer;\nimport org.testng.ITestResult;\nimport org.apache.logging.log4j.*;\n\npublic class RetryAnalyzer implements IRetryAnalyzer {\n    private static final Logger logger = LogManager.getLogger(RetryAnalyzer.class);\n    private int retryCount = 0;\n    private static final int MAX_RETRY = 2; // retry up to 2 times\n\n    @Override\n    public boolean retry(ITestResult result) {\n        if (retryCount &lt; MAX_RETRY) {\n            retryCount++;\n            logger.warn("🔄 Retrying {} (attempt {}/{})",\n                    result.getName(), retryCount, MAX_RETRY);\n            return true;  // retry this test\n        }\n        return false;  // give up\n    }\n}\n\n// Usage: @Test(retryAnalyzer = RetryAnalyzer.class)\n// Or apply globally via testng.xml listener</code></pre><h4>📋 Register Listeners</h4><pre><code>&lt;!-- In testng.xml --&gt;\n&lt;suite name="Regression"&gt;\n    &lt;listeners&gt;\n        &lt;listener class-name="com.onsurity.listeners.TestListener"/&gt;\n    &lt;/listeners&gt;\n    &lt;test name="Login Tests"&gt;\n        &lt;classes&gt;\n            &lt;class name="com.onsurity.tests.LoginTest"/&gt;\n        &lt;/classes&gt;\n    &lt;/test&gt;\n&lt;/suite&gt;\n\n// Or on test class:\n@Listeners(TestListener.class)\npublic class LoginTest extends BaseTest { }</code></pre>'},
{id:815,part:"Z",level:"Senior",category:"Step9-Suite",q:"Step 9: testng.xml Suite Configuration — groups, parallel, cross-browser execution",a:'<h4>📋 testng.xml — Complete Suite Configuration</h4><pre><code>&lt;?xml version="1.0" encoding="UTF-8"?&gt;\n&lt;!DOCTYPE suite SYSTEM "https://testng.org/testng-1.0.dtd"&gt;\n\n&lt;suite name="Onsurity Regression Suite"\n       parallel="classes"\n       thread-count="3"\n       verbose="1"&gt;\n\n    &lt;listeners&gt;\n        &lt;listener class-name="com.onsurity.listeners.TestListener"/&gt;\n    &lt;/listeners&gt;\n\n    &lt;!-- ═══ SMOKE TESTS ═══ --&gt;\n    &lt;test name="Smoke Tests"&gt;\n        &lt;groups&gt;\n            &lt;run&gt;\n                &lt;include name="smoke"/&gt;\n            &lt;/run&gt;\n        &lt;/groups&gt;\n        &lt;classes&gt;\n            &lt;class name="com.onsurity.tests.LoginTest"/&gt;\n            &lt;class name="com.onsurity.tests.DashboardTest"/&gt;\n        &lt;/classes&gt;\n    &lt;/test&gt;\n\n    &lt;!-- ═══ FULL REGRESSION ═══ --&gt;\n    &lt;test name="Regression Tests"&gt;\n        &lt;classes&gt;\n            &lt;class name="com.onsurity.tests.LoginTest"/&gt;\n            &lt;class name="com.onsurity.tests.CheckoutTest"/&gt;\n            &lt;class name="com.onsurity.tests.ProfileTest"/&gt;\n        &lt;/classes&gt;\n    &lt;/test&gt;\n&lt;/suite&gt;</code></pre><h4>🌐 Cross-Browser Testing</h4><pre><code>&lt;!-- testng-crossbrowser.xml --&gt;\n&lt;suite name="Cross-Browser" parallel="tests" thread-count="3"&gt;\n\n    &lt;test name="Chrome Tests"&gt;\n        &lt;parameter name="browser" value="chromium"/&gt;\n        &lt;classes&gt;\n            &lt;class name="com.onsurity.tests.LoginTest"/&gt;\n        &lt;/classes&gt;\n    &lt;/test&gt;\n\n    &lt;test name="Firefox Tests"&gt;\n        &lt;parameter name="browser" value="firefox"/&gt;\n        &lt;classes&gt;\n            &lt;class name="com.onsurity.tests.LoginTest"/&gt;\n        &lt;/classes&gt;\n    &lt;/test&gt;\n\n    &lt;test name="WebKit Tests"&gt;\n        &lt;parameter name="browser" value="webkit"/&gt;\n        &lt;classes&gt;\n            &lt;class name="com.onsurity.tests.LoginTest"/&gt;\n        &lt;/classes&gt;\n    &lt;/test&gt;\n&lt;/suite&gt;</code></pre><h4>📋 Maven Commands</h4><pre><code># Run default suite\nmvn test\n\n# Run specific suite\nmvn test -DsuiteXmlFile=src/test/resources/testng-smoke.xml\n\n# Override browser + environment\nmvn test -Dbrowser=firefox -Denv=staging -Dheadless=true\n\n# Run specific test class\nmvn test -Dtest=LoginTest\n\n# Run specific method\nmvn test -Dtest=LoginTest#testValidLogin</code></pre>'},
{id:816,part:"Z",level:"Senior",category:"Step10-API",q:"Step 10: API + UI Integration — Pre-condition APIs, API validation in E2E tests",a:'<h4>🔗 Pattern: API for Setup → UI for Verification</h4><p>In real frameworks, we use APIs to set up test data faster than clicking through the UI.</p><pre><code>// ANTI-PATTERN ❌: Create user via UI (slow, fragile)\n// 1. Navigate to admin panel\n// 2. Click "Add User"\n// 3. Fill 10 form fields\n// 4. Submit and wait\n// Total: 30+ seconds\n\n// CORRECT PATTERN ✅: Create user via API (fast, reliable)\n// 1. POST /api/members → 2 seconds\n// 2. Navigate to dashboard → verify user exists\n// Total: 5 seconds</code></pre><h4>📋 API Helper Class</h4><pre><code>package com.onsurity.api;\n\nimport io.restassured.RestAssured;\nimport io.restassured.response.Response;\nimport static io.restassured.RestAssured.given;\n\npublic class MemberApiHelper {\n\n    private final String baseUrl;\n    private final String authToken;\n\n    public MemberApiHelper(String baseUrl, String authToken) {\n        this.baseUrl = baseUrl;\n        this.authToken = authToken;\n    }\n\n    // Create member via API (test pre-condition)\n    public String createMember(String phone, String name) {\n        Response resp = given()\n            .baseUri(baseUrl)\n            .header("Authorization", "Bearer " + authToken)\n            .contentType("application/json")\n            .body("{\\\"phone\\\": \\\"" + phone + "\\\", \\\"name\\\": \\\"" + name + "\\\"}")\n        .when()\n            .post("/api/v1/members")\n        .then()\n            .statusCode(201)\n            .extract().response();\n\n        return resp.jsonPath().getString("id"); // "OSHP-12345"\n    }\n\n    // Verify via API after UI action\n    public void verifyMemberActive(String memberId) {\n        given()\n            .baseUri(baseUrl)\n            .header("Authorization", "Bearer " + authToken)\n        .when()\n            .get("/api/v1/members/" + memberId)\n        .then()\n            .statusCode(200)\n            .body("status", org.hamcrest.Matchers.equalTo("active"));\n    }\n}</code></pre><h4>🧪 E2E Test with API + UI</h4><pre><code>public class MemberE2ETest extends BaseTest {\n\n    private MemberApiHelper api;\n\n    @BeforeClass\n    public void setupApi() {\n        super.classSetup();\n        api = new MemberApiHelper(\n            config.getApiBaseUrl(), config.getApiAuthToken());\n    }\n\n    @Test(description = "Create member via API, verify in UI")\n    public void testMemberCreation() {\n        // Step 1: Create via API (fast pre-condition)\n        String memberId = api.createMember("9876543210", "QA User");\n        logger.info("Created member: {}", memberId);\n\n        // Step 2: Verify in UI\n        navigateTo(config.getBaseUrl() + "/members/" + memberId);\n        assertThat(page.locator("h1")).hasText("QA User");\n        assertThat(page.locator(".member-id")).hasText(memberId);\n\n        // Step 3: Verify via API (double-check)\n        api.verifyMemberActive(memberId);\n    }\n}</code></pre><h4>💡 Interview: Why API + UI?</h4><table><tr><th>Approach</th><th>Speed</th><th>Reliability</th><th>Use For</th></tr><tr><td>UI Only</td><td>Slow</td><td>Fragile</td><td>UI-specific flows only</td></tr><tr><td>API Only</td><td>Fast</td><td>Reliable</td><td>Backend validation</td></tr><tr><td>API + UI ✅</td><td>Fast setup</td><td>Best coverage</td><td>E2E production tests</td></tr></table>'},
{id:817,part:"Z",level:"Senior",category:"Step11-CI",q:"Step 11: CI/CD Pipeline — GitHub Actions, Docker, reporting in CI",a:'<h4>🚀 GitHub Actions Workflow</h4><pre><code># .github/workflows/playwright-tests.yml\nname: Playwright Tests\n\non:\n  push:\n    branches: [main, develop]\n  pull_request:\n    branches: [main]\n  schedule:\n    - cron: &apos;0 6 * * 1-5&apos;  # Mon-Fri at 6 AM\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Java 17\n        uses: actions/setup-java@v4\n        with:\n          java-version: 17\n          distribution: temurin\n\n      - name: Cache Maven\n        uses: actions/cache@v4\n        with:\n          path: ~/.m2/repository\n          key: ${{ runner.os }}-maven-${{ hashFiles(&apos;pom.xml&apos;) }}\n\n      - name: Install Playwright Browsers\n        run: mvn exec:java -e\n             -Dexec.mainClass=com.microsoft.playwright.CLI\n             -Dexec.args="install --with-deps"\n\n      - name: Run Tests\n        run: mvn test -Denv=qa -Dheadless=true\n\n      - name: Upload Reports\n        if: always()  # even on failure\n        uses: actions/upload-artifact@v4\n        with:\n          name: test-reports\n          path: |\n            target/reports/\n            target/screenshots/\n            target/videos/\n          retention-days: 7</code></pre><h4>🐳 Dockerfile</h4><pre><code>FROM mcr.microsoft.com/playwright/java:v1.60.0-noble\n\nWORKDIR /app\nCOPY pom.xml .\nRUN mvn dependency:go-offline\n\nCOPY src/ src/\nCMD ["mvn", "test", "-Dheadless=true", "-Denv=qa"]</code></pre><h4>📋 CI Best Practices</h4><table><tr><th>Practice</th><th>Why</th></tr><tr><td>headless=true in CI</td><td>No GUI on CI runners</td></tr><tr><td>Upload screenshots</td><td>Debug failures remotely</td></tr><tr><td>Cache Maven repo</td><td>Faster builds (5min → 2min)</td></tr><tr><td>timeout-minutes: 30</td><td>Kill hung tests</td></tr><tr><td>schedule cron</td><td>Nightly regression</td></tr></table>'},
{id:818,part:"Z",level:"Senior",category:"Step12-Advanced",q:"Step 12: Advanced Patterns — Network Interception, Storage State, Trace Viewer debugging",a:'<h4>🌐 Network Interception — Mock APIs in UI Tests</h4><pre><code>// Block images (faster tests)\npage.route("**/*.{png,jpg,gif,svg}", route -&gt; route.abort());\n\n// Mock API response\npage.route("**/api/members", route -&gt; {\n    route.fulfill(new Route.FulfillOptions()\n        .setStatus(200)\n        .setContentType("application/json")\n        .setBody("[{\\\"id\\\":\\\"OSHP-MOCK\\\",\\\"name\\\":\\\"Mock User\\\"}]"));\n});\n\n// Wait for API response during UI action\nResponse apiResp = page.waitForResponse(\n    r -&gt; r.url().contains("/api/members") &amp;&amp; r.status() == 200,\n    () -&gt; page.click("button#loadMembers")  // trigger action\n);\nString body = apiResp.text();  // API response body</code></pre><h4>💾 Storage State — Skip Login in Every Test!</h4><pre><code>// Step 1: Login once, save state to file\nBrowserContext context = browser.newContext();\nPage page = context.newPage();\npage.navigate("https://app.onsurity.com/login");\n// ... perform login ...\n\n// Save cookies + localStorage\ncontext.storageState(new BrowserContext.StorageStateOptions()\n    .setPath(Paths.get("auth-state.json")));\ncontext.close();\n\n// Step 2: Reuse state in ALL subsequent tests (skip login!)\nBrowserContext authContext = browser.newContext(\n    new Browser.NewContextOptions()\n        .setStorageStatePath(Paths.get("auth-state.json")));\nPage authPage = authContext.newPage();\nauthPage.navigate("https://app.onsurity.com/dashboard");\n// Already logged in! No login needed! ✅</code></pre><h4>🔍 Trace Viewer — Time-Travel Debugging</h4><pre><code>// Start tracing BEFORE test\ncontext.tracing().start(new Tracing.StartOptions()\n    .setScreenshots(true)  // capture screenshots\n    .setSnapshots(true)    // capture DOM snapshots\n    .setSources(true));    // capture source files\n\n// ... run test actions ...\n\n// Stop and save on failure\ncontext.tracing().stop(new Tracing.StopOptions()\n    .setPath(Paths.get("target/traces/failed-test.zip")));\n\n// View trace (opens interactive UI):\n// npx playwright show-trace target/traces/failed-test.zip\n\n// What you see in Trace Viewer:\n// - Every action with timestamp\n// - Screenshots at each step\n// - DOM snapshot at each step\n// - Network requests/responses\n// - Console logs</code></pre><h4>💡 Interview: "How do you debug flaky tests?"</h4><p>"I use Playwright Trace Viewer. Before each test, I start tracing with screenshots and DOM snapshots. On failure, I save the trace zip file. I can then open it with <code>npx playwright show-trace</code> and step through every action, see the exact DOM state, network requests, and console errors at each point. It is like a time-travel debugger for browser tests."</p>'},
{id:819,part:"Z",level:"Senior",category:"Interview",q:"Interview Questions — Complete framework architecture walkthrough for SDET interviews",a:'<h4>🎯 "Describe your automation framework architecture"</h4><pre><code>Answer Structure:\n\n1. TECH STACK:\n   "I built a Playwright Java framework with TestNG, Maven,\n   Log4j2, and Jackson. We use Rest Assured for API testing\n   and integrate with CI/CD via GitHub Actions."\n\n2. DESIGN PATTERNS:\n   - Page Object Model (BasePage → specific pages)\n   - Factory Pattern (BrowserFactory, DriverFactory)\n   - Singleton (ConfigManager)\n   - Builder Pattern (test data construction)\n\n3. THREAD SAFETY:\n   "I use ThreadLocal for Playwright, Browser, Context, and Page.\n   This allows TestNG parallel execution without shared state."\n\n4. CONFIGURATION:\n   "ConfigManager loads properties with 3-level priority:\n   System property → Environment variable → Config file.\n   This lets CI override values without code changes."\n\n5. TEST DATA:\n   "JSON files per module per environment. A TestDataReader\n   utility loads the correct file based on active environment.\n   For dynamic data, we use API helpers."\n\n6. REPORTING:\n   "Screenshots auto-captured on failure via TestNG listener.\n   Playwright Trace Viewer for deep debugging. Reports uploaded\n   as CI artifacts."\n\n7. CI/CD:\n   "GitHub Actions runs on push/PR with caching.\n   Nightly regression via cron schedule.\n   Docker for consistent execution environment."</code></pre><h4>📋 Common Interview Questions + Answers</h4><table><tr><th>Question</th><th>Key Points</th></tr><tr><td>Why Playwright over Selenium?</td><td>Auto-waiting, built-in assertions, network interception, trace viewer, multi-browser from single API, faster execution</td></tr><tr><td>How do you handle dynamic elements?</td><td>Playwright auto-waits. For complex cases: waitForSelector, waitForResponse, custom polling with assertThat timeout</td></tr><tr><td>How do you handle authentication?</td><td>Login once → save storageState to JSON → reuse in all tests (skip login)</td></tr><tr><td>How do you handle test data?</td><td>JSON files per env, API helpers for dynamic data, DataProvider for parameterized tests</td></tr><tr><td>How do you debug failures?</td><td>Trace Viewer (time-travel), auto-screenshots, video recording, Log4j structured logs</td></tr><tr><td>How do you run cross-browser?</td><td>Parameterized testng.xml with browser parameter, parallel=tests, thread-count=3</td></tr><tr><td>How do you handle flaky tests?</td><td>RetryAnalyzer (max 2 retries), proper waits (never Thread.sleep), network mocking for external deps</td></tr><tr><td>POM vs Page Factory?</td><td>POM with composition. Playwright does not need PageFactory like Selenium because locators are lazy (resolved on action)</td></tr></table>'},
{id:820,part:"Z",level:"Senior",category:"Cheatsheet",q:"Playwright Java Cheatsheet — Quick reference for all commonly used methods and patterns",a:'<h4>📋 Playwright Java Quick Reference</h4><table><tr><th>Category</th><th>Method</th><th>Example</th></tr><tr><td>Navigate</td><td>page.navigate(url)</td><td>page.navigate("https://app.com")</td></tr><tr><td>Click</td><td>page.click(sel) / locator.click()</td><td>page.click("button#submit")</td></tr><tr><td>Fill</td><td>page.fill(sel, text)</td><td>page.fill("#email", "a@b.com")</td></tr><tr><td>Type</td><td>page.type(sel, text)</td><td>page.type("#search", "query")</td></tr><tr><td>Press</td><td>page.press(sel, key)</td><td>page.press("#search", "Enter")</td></tr><tr><td>Text</td><td>locator.textContent()</td><td>page.locator("h1").textContent()</td></tr><tr><td>Value</td><td>locator.inputValue()</td><td>page.locator("#email").inputValue()</td></tr><tr><td>Attr</td><td>locator.getAttribute(a)</td><td>locator.getAttribute("href")</td></tr><tr><td>Check</td><td>page.check(sel)</td><td>page.check("#agree")</td></tr><tr><td>Select</td><td>page.selectOption(sel, val)</td><td>page.selectOption("#country", "IN")</td></tr><tr><td>Upload</td><td>page.setInputFiles(sel, path)</td><td>page.setInputFiles("#file", Path.of("x.pdf"))</td></tr><tr><td>Hover</td><td>page.hover(sel)</td><td>page.hover("nav.menu")</td></tr><tr><td>Screenshot</td><td>page.screenshot(opts)</td><td>.setPath(Paths.get("s.png")).setFullPage(true)</td></tr></table><h4>🎯 Locator Strategy Cheatsheet</h4><table><tr><th>Strategy</th><th>Syntax</th><th>Best For</th></tr><tr><td>getByRole</td><td>page.getByRole(BUTTON, name("Submit"))</td><td>Accessible elements ✅</td></tr><tr><td>getByTestId</td><td>page.getByTestId("login-btn")</td><td>Automation IDs ✅</td></tr><tr><td>getByText</td><td>page.getByText("Sign In")</td><td>Visible text</td></tr><tr><td>getByLabel</td><td>page.getByLabel("Email")</td><td>Form fields</td></tr><tr><td>getByPlaceholder</td><td>page.getByPlaceholder("Enter phone")</td><td>Input fields</td></tr><tr><td>CSS selector</td><td>page.locator("button.primary")</td><td>CSS patterns</td></tr><tr><td>XPath</td><td>page.locator("xpath=//div[@id]")</td><td>Complex DOM</td></tr></table><h4>✅ Assertion Cheatsheet</h4><pre><code>import static com.microsoft.playwright.assertions\n    .PlaywrightAssertions.assertThat;\n\n// Page assertions\nassertThat(page).hasTitle("Dashboard");\nassertThat(page).hasURL(Pattern.compile(".*/dashboard"));\n\n// Locator assertions (auto-retry!)\nassertThat(locator).isVisible();\nassertThat(locator).isHidden();\nassertThat(locator).isEnabled();\nassertThat(locator).isDisabled();\nassertThat(locator).hasText("Welcome");\nassertThat(locator).containsText("Hello");\nassertThat(locator).hasAttribute("href", "/home");\nassertThat(locator).hasClass("active");\nassertThat(locator).hasValue("email@test.com");\nassertThat(locator).hasCount(5);\nassertThat(locator).isEmpty();\nassertThat(locator).not().isVisible();  // negation</code></pre><h4>🌐 Network Cheatsheet</h4><pre><code>// Wait for API during UI action\nResponse r = page.waitForResponse(\n    r -&gt; r.url().contains("/api/data"), () -&gt; page.click("#load"));\n\n// Mock API\npage.route("**/api/**", route -&gt;\n    route.fulfill(new Route.FulfillOptions()\n        .setStatus(200).setBody("[]")));\n\n// Block resources\npage.route("**/*.{png,jpg}", Route::abort);</code></pre>'}
);

{id:821,part:"PW",level:"Senior",category:"Browser",q:"Browser & Navigation (Q1-Q6) — Launch browser, navigate, refresh, back, forward, verify title/URL",a:'<h4>Q1. Launch browser and open a website</h4><pre><code>Playwright playwright = Playwright.create();\nBrowser browser = playwright.chromium().launch(\n    new BrowserType.LaunchOptions().setHeadless(false));\nBrowserContext context = browser.newContext();\nPage page = context.newPage();\n\npage.navigate("https://app.onsurity.com");\nSystem.out.println("Page loaded: " + page.title());</code></pre><h4>Q2. Navigate to another URL</h4><pre><code>page.navigate("https://app.onsurity.com/login");\n\n// With wait option\npage.navigate("https://app.onsurity.com/dashboard",\n    new Page.NavigateOptions()\n        .setWaitUntil(WaitUntilState.NETWORKIDLE));</code></pre><h4>Q3. Refresh the page</h4><pre><code>page.reload();\n\n// With wait\npage.reload(new Page.ReloadOptions()\n    .setWaitUntil(WaitUntilState.DOMCONTENTLOADED));</code></pre><h4>Q4. Navigate back and forward</h4><pre><code>page.navigate("https://google.com");\npage.navigate("https://github.com");\n\npage.goBack();     // goes to google.com\npage.goForward();  // goes back to github.com</code></pre><h4>Q5. Verify page title</h4><pre><code>// Using TestNG assertion\nString title = page.title();\nAssert.assertEquals(title, "Onsurity - Dashboard");\n\n// Using Playwright auto-retry assertion ✅\nimport static com.microsoft.playwright.assertions.PlaywrightAssertions.assertThat;\nassertThat(page).hasTitle("Onsurity - Dashboard");\nassertThat(page).hasTitle(Pattern.compile(".*Dashboard.*")); // regex</code></pre><h4>Q6. Verify current URL</h4><pre><code>String url = page.url();\nAssert.assertTrue(url.contains("/dashboard"));\n\n// Playwright assertion (auto-retry) ✅\nassertThat(page).hasURL("https://app.onsurity.com/dashboard");\nassertThat(page).hasURL(Pattern.compile(".*/dashboard.*"));</code></pre>'},
{id:822,part:"PW",level:"Senior",category:"Forms",q:"Login & Forms (Q7-Q10) — Login, logout, registration form, clear and type",a:'<h4>Q7. Login to an application</h4><pre><code>page.navigate("https://app.onsurity.com/login");\n\n// Enter phone number\npage.fill("input[type=&apos;tel&apos;]", "9876543210");\npage.click("button:has-text(&apos;Continue&apos;)");\n\n// Enter OTP (digit by digit)\nList&lt;Locator&gt; otpInputs = page.locator("input[maxlength=&apos;1&apos;]").all();\nString otp = "3548";\nfor (int i = 0; i &lt; otp.length(); i++) {\n    otpInputs.get(i).fill(String.valueOf(otp.charAt(i)));\n}\npage.click("button:has-text(&apos;Verify&apos;)");\n\n// Verify login success\nassertThat(page).hasURL(Pattern.compile(".*/dashboard.*"));</code></pre><h4>Q8. Logout from the application</h4><pre><code>page.click("button.profile-menu");    // open profile dropdown\npage.click("text=Logout");            // click logout\n\n// Verify redirected to login\nassertThat(page).hasURL(Pattern.compile(".*/login.*"));</code></pre><h4>Q9. Fill a registration form</h4><pre><code>page.fill("#firstName", "Boobalakrishnan");\npage.fill("#lastName", "Test");\npage.fill("#email", "qa@onsurity.com");\npage.fill("input[type=&apos;tel&apos;]", "9876543210");\npage.fill("#password", "SecurePass@123");\npage.fill("#confirmPassword", "SecurePass@123");\n\n// Select dropdown\npage.selectOption("#gender", "Male");\n\n// Date of birth\npage.fill("#dob", "1990-01-15");\n\n// Accept terms checkbox\npage.check("#terms");\n\n// Submit\npage.click("button[type=&apos;submit&apos;]");\nassertThat(page.locator(".success-message")).isVisible();</code></pre><h4>Q10. Clear and enter text in a textbox</h4><pre><code>// Method 1: fill() auto-clears before typing ✅\npage.fill("#search", "new search text");\n\n// Method 2: Manual clear + type (keystroke simulation)\npage.locator("#search").clear();\npage.locator("#search").pressSequentially("new text",\n    new Locator.PressSequentiallyOptions().setDelay(50));\n\n// Method 3: Select all + type (replaces content)\npage.click("#search");\npage.press("#search", "Control+a");\npage.press("#search", "Delete");\npage.fill("#search", "replacement text");</code></pre>'},
{id:823,part:"PW",level:"Senior",category:"Alerts",q:"Alerts & Popups (Q11-Q15) — Accept, dismiss, prompt, permissions, popup window",a:'<h4>Q11. Accept an alert</h4><pre><code>// Register handler BEFORE triggering alert\npage.onDialog(dialog -> {\n    System.out.println("Alert text: " + dialog.message());\n    dialog.accept();  // clicks OK\n});\n\n// Now trigger the alert\npage.click("button#showAlert");</code></pre><h4>Q12. Dismiss a confirmation alert</h4><pre><code>page.onDialog(dialog -> {\n    System.out.println("Confirm: " + dialog.message());\n    dialog.dismiss();  // clicks Cancel\n});\npage.click("button#showConfirm");</code></pre><h4>Q13. Handle a prompt alert</h4><pre><code>page.onDialog(dialog -> {\n    System.out.println("Prompt: " + dialog.message());\n    dialog.accept("My Input Text");  // enter text + OK\n});\npage.click("button#showPrompt");</code></pre><h4>Q14. Handle browser permission popup</h4><pre><code>// Grant permissions at context level\nBrowserContext context = browser.newContext(\n    new Browser.NewContextOptions()\n        .setPermissions(List.of("geolocation", "notifications"))\n        .setGeolocation(new Geolocation(19.076, 72.877)));\n\n// Or grant specific permissions\ncontext.grantPermissions(List.of("camera", "microphone"),\n    new BrowserContext.GrantPermissionsOptions()\n        .setOrigin("https://app.onsurity.com"));</code></pre><h4>Q15. Handle a new popup window</h4><pre><code>// Wait for popup BEFORE triggering it\nPage popup = page.waitForPopup(() -> {\n    page.click("a[target=&apos;_blank&apos;]");  // triggers popup\n});\n\n// Now interact with popup\npopup.waitForLoadState();\nSystem.out.println("Popup URL: " + popup.url());\nSystem.out.println("Popup title: " + popup.title());\npopup.fill("#name", "Test User");\npopup.click("button#submit");\n\n// Close popup and return to main page\npopup.close();\npage.bringToFront();</code></pre>'},
{id:824,part:"PW",level:"Senior",category:"Tabs",q:"Tabs, Windows & Dropdowns (Q16-Q20) — Multiple tabs, windows, select dropdown, auto-suggest",a:'<h4>Q16. Handle multiple browser tabs</h4><pre><code>// Open new tab and wait for it\nPage newTab = context.waitForPage(() -> {\n    page.click("a[target=&apos;_blank&apos;]");\n});\nnewTab.waitForLoadState();\nSystem.out.println("New tab URL: " + newTab.url());\n\n// Work on new tab\nnewTab.fill("#search", "Playwright");\n\n// Switch back to original tab\npage.bringToFront();\n\n// Close new tab\nnewTab.close();</code></pre><h4>Q17. Handle multiple browser windows</h4><pre><code>// Get all pages in context\nList&lt;Page&gt; allPages = context.pages();\nSystem.out.println("Total windows: " + allPages.size());\n\n// Iterate and find specific window\nfor (Page p : allPages) {\n    if (p.url().contains("checkout")) {\n        p.bringToFront();\n        p.fill("#card", "5506900480000008");\n        break;\n    }\n}\n\n// Close all except main\nfor (Page p : context.pages()) {\n    if (p != page) p.close();\n}</code></pre><h4>Q18. Select dropdown by visible text</h4><pre><code>// Native HTML &lt;select&gt; dropdown\npage.selectOption("select#country",\n    new SelectOption().setLabel("India"));  // by visible text\n\n// Verify selected value\nString selected = page.locator("select#country").inputValue();\nAssert.assertEquals(selected, "IN");</code></pre><h4>Q19. Select dropdown by value</h4><pre><code>// By value attribute\npage.selectOption("select#country", "IN");\n\n// By index\npage.selectOption("select#country",\n    new SelectOption().setIndex(3));  // 4th option (0-based)\n\n// Multiple select\npage.selectOption("select#skills",\n    new String[]{"java", "python", "playwright"});</code></pre><h4>Q20. Handle auto-suggestion dropdown</h4><pre><code>// Type to trigger suggestions\npage.fill("input#city", "Mum");\n\n// Wait for suggestion list to appear\npage.waitForSelector("ul.suggestions li");\n\n// Click specific suggestion\npage.locator("ul.suggestions li")\n    .filter(new Locator.FilterOptions().setHasText("Mumbai"))\n    .click();\n\n// Verify selection\nassertThat(page.locator("input#city")).hasValue("Mumbai, Maharashtra");</code></pre>'},
{id:825,part:"PW",level:"Senior",category:"Checkbox",q:"Checkboxes & Radio Buttons (Q21-Q24) — Select, uncheck, verify state",a:'<h4>Q21. Select multiple checkboxes</h4><pre><code>page.check("input#java");      // check Java\npage.check("input#python");    // check Python\npage.check("input#playwright"); // check Playwright\n\n// Or check by label text\npage.getByLabel("Java").check();\npage.getByLabel("Python").check();\n\n// Verify all checked\nassertThat(page.locator("input#java")).isChecked();\nassertThat(page.locator("input#python")).isChecked();</code></pre><h4>Q22. Uncheck a checkbox</h4><pre><code>// Uncheck\npage.uncheck("input#newsletter");\nassertThat(page.locator("input#newsletter")).not().isChecked();\n\n// Toggle: uncheck only if checked\nif (page.isChecked("input#newsletter")) {\n    page.uncheck("input#newsletter");\n}</code></pre><h4>Q23. Select a radio button</h4><pre><code>// By selector\npage.check("input[value=&apos;male&apos;]");\n\n// By label\npage.getByLabel("Male").check();\n\n// Verify selection\nassertThat(page.locator("input[value=&apos;male&apos;]")).isChecked();\nassertThat(page.locator("input[value=&apos;female&apos;]")).not().isChecked();</code></pre><h4>Q24. Verify checkbox/radio button is selected</h4><pre><code>// isChecked() — instant check (no auto-wait)\nboolean isSelected = page.isChecked("input#agree");\nSystem.out.println("Terms accepted: " + isSelected);\n\n// assertThat — auto-retry assertion ✅\nassertThat(page.locator("input#agree")).isChecked();\nassertThat(page.locator("input#agree")).not().isChecked();\n\n// Count checked checkboxes\nint checkedCount = page.locator("input[type=&apos;checkbox&apos;]:checked").count();\nSystem.out.println("Checked: " + checkedCount + " checkboxes");</code></pre>'},
{id:826,part:"PW",level:"Senior",category:"Mouse",q:"Mouse & Keyboard Actions (Q25-Q30) — Hover, double-click, right-click, drag-drop, keyboard shortcuts",a:'<h4>Q25. Hover over an element</h4><pre><code>page.hover("nav.main-menu");  // hover over menu\n\n// Hover then click sub-item\npage.hover("li.dropdown-menu");\npage.click("a.sub-item:has-text(&apos;Settings&apos;)");</code></pre><h4>Q26. Double-click an element</h4><pre><code>page.dblclick("td.editable-cell");\n\n// Verify edit mode activated\nassertThat(page.locator("td.editable-cell input")).isVisible();</code></pre><h4>Q27. Right-click an element</h4><pre><code>page.click("div.file-item", new Page.ClickOptions()\n    .setButton(MouseButton.RIGHT));\n\n// Click context menu option\npage.click("div.context-menu >> text=Delete");</code></pre><h4>Q28. Drag and drop an element</h4><pre><code>// Method 1: drag and drop locators\nLocator source = page.locator("#draggable");\nLocator target = page.locator("#droppable");\nsource.dragTo(target);\n\n// Method 2: Manual drag with mouse\npage.locator("#draggable").hover();\npage.mouse().down();\npage.locator("#droppable").hover();\npage.mouse().up();\n\n// Verify\nassertThat(page.locator("#droppable")).hasText("Dropped!");</code></pre><h4>Q29. Keyboard actions (Ctrl+A, Ctrl+C, Ctrl+V)</h4><pre><code>// Select All\npage.press("#source", "Control+a");\n\n// Copy\npage.press("#source", "Control+c");\n\n// Click target field\npage.click("#target");\n\n// Paste\npage.press("#target", "Control+v");\n\n// Undo\npage.press("#target", "Control+z");\n\n// Mac: use "Meta" instead of "Control"\npage.press("#source", "Meta+a");  // Cmd+A on Mac</code></pre><h4>Q30. Press Enter, Tab, Escape, Arrow keys</h4><pre><code>page.press("#search", "Enter");       // submit search\npage.press("#email", "Tab");          // move to next field\npage.press("body", "Escape");         // close modal/overlay\npage.press("#slider", "ArrowRight");  // move slider right\npage.press("#slider", "ArrowLeft");   // move slider left\npage.press("#list", "ArrowDown");     // navigate list down\npage.press("#list", "ArrowUp");       // navigate list up\n\n// Multiple key presses\npage.keyboard().press("Shift+Tab");   // reverse tab\npage.keyboard().press("Alt+F4");      // close window\n\n// Type special keys in sequence\npage.keyboard().type("Hello World");  // types letter by letter\npage.keyboard().press("Home");        // go to line start\npage.keyboard().press("End");         // go to line end</code></pre>'},
{id:827,part:"PW",level:"Senior",category:"Frames",q:"Frames & iFrames (Q31-Q33) — Handle iframe, nested iframes, switch back to main",a:'<h4>Q31. Handle an iframe</h4><pre><code>// Method 1: frameLocator (recommended ✅)\npage.frameLocator("#payment-iframe")\n    .locator("input#cardNumber")\n    .fill("5506900480000008");\n\npage.frameLocator("#payment-iframe")\n    .locator("input#expiry")\n    .fill("05/30");\n\npage.frameLocator("#payment-iframe")\n    .locator("input#cvv")\n    .fill("123");\n\npage.frameLocator("#payment-iframe")\n    .locator("button#pay")\n    .click();\n\n// Method 2: frame() by name or URL\nFrame frame = page.frame("paymentFrame");\nif (frame != null) {\n    frame.fill("input#cardNumber", "5506900480000008");\n    frame.click("button#pay");\n}</code></pre><h4>Q32. Handle nested iframes</h4><pre><code>// Outer iframe → Inner iframe → Element\npage.frameLocator("#outer-frame")\n    .frameLocator("#inner-frame")\n    .locator("button#submit")\n    .click();\n\n// Verify text inside nested iframe\nassertThat(\n    page.frameLocator("#outer-frame")\n        .frameLocator("#inner-frame")\n        .locator("h1")\n).hasText("Nested Content");</code></pre><h4>Q33. Switch back to the main page</h4><pre><code>// With frameLocator — NO need to switch back!\n// frameLocator is scoped, not a context switch\n\n// Work inside iframe\npage.frameLocator("#myFrame").locator("#name").fill("Test");\n\n// Immediately work on main page — no switching needed!\npage.locator("button#mainPageButton").click();\n\n// ⚠️ In Selenium you need driver.switchTo().defaultContent()\n// ✅ In Playwright, frameLocator is scoped — no switching!</code></pre>'},
{id:828,part:"PW",level:"Senior",category:"Files",q:"File Handling & Web Tables (Q34-Q39) — Upload, download, read table, find row, count rows",a:'<h4>Q34. Upload a file</h4><pre><code>// Standard file input\npage.setInputFiles("input[type=&apos;file&apos;]",\n    Paths.get("src/test/resources/testdata/report.pdf"));\n\n// Multiple files\npage.setInputFiles("input[type=&apos;file&apos;]", new Path[]{\n    Paths.get("file1.pdf"),\n    Paths.get("file2.pdf")\n});\n\n// Clear file selection\npage.setInputFiles("input[type=&apos;file&apos;]", new Path[]{});\n\n// Handle non-input file dialog\npage.onFileChooser(fileChooser -> {\n    fileChooser.setFiles(Paths.get("report.pdf"));\n});\npage.click("button#uploadBtn");</code></pre><h4>Q35. Download a file</h4><pre><code>// Wait for download event\nDownload download = page.waitForDownload(() -> {\n    page.click("a#downloadLink");\n});\n\n// Save to specific path\ndownload.saveAs(Paths.get("target/downloads/" + download.suggestedFilename()));\n\n// Verify download\nSystem.out.println("Downloaded: " + download.suggestedFilename());\nSystem.out.println("URL: " + download.url());\n\n// Read download as stream\ntry (InputStream is = download.createReadStream()) {\n    byte[] content = is.readAllBytes();\n    System.out.println("File size: " + content.length + " bytes");\n}</code></pre><h4>Q36. Read data from a web table</h4><pre><code>// Read all rows\nList&lt;Locator&gt; rows = page.locator("table#data tbody tr").all();\n\nfor (Locator row : rows) {\n    String name = row.locator("td").nth(0).textContent();\n    String email = row.locator("td").nth(1).textContent();\n    String status = row.locator("td").nth(2).textContent();\n    System.out.println(name + " | " + email + " | " + status);\n}</code></pre><h4>Q37. Find a specific row in a table</h4><pre><code>// Find row containing specific text\nLocator targetRow = page.locator("table#data tbody tr")\n    .filter(new Locator.FilterOptions().setHasText("OSHP-12345"));\n\nString status = targetRow.locator("td").nth(2).textContent();\nSystem.out.println("Status: " + status);</code></pre><h4>Q38. Click a button inside a table row</h4><pre><code>// Find row → click its action button\npage.locator("table#data tbody tr")\n    .filter(new Locator.FilterOptions().setHasText("OSHP-12345"))\n    .locator("button.edit")\n    .click();</code></pre><h4>Q39. Count rows and columns</h4><pre><code>int rowCount = page.locator("table#data tbody tr").count();\nint colCount = page.locator("table#data thead th").count();\nSystem.out.println("Rows: " + rowCount + ", Columns: " + colCount);\n\nAssert.assertTrue(rowCount > 0, "Table should have data");</code></pre>'},
{id:829,part:"PW",level:"Senior",category:"Scroll",q:"Scrolling (Q40-Q42) — Scroll to element, infinite scroll, horizontal scroll",a:'<h4>Q40. Scroll to an element</h4><pre><code>// Method 1: scrollIntoViewIfNeeded (recommended ✅)\npage.locator("div#footer").scrollIntoViewIfNeeded();\n\n// Method 2: JavaScript scroll\npage.evaluate("window.scrollTo(0, document.body.scrollHeight)");\n\n// Scroll to specific position\npage.evaluate("window.scrollTo(0, 500)");  // scroll to 500px\n\n// Scroll by amount\npage.evaluate("window.scrollBy(0, 300)");  // scroll down 300px\n\n// Scroll element into center of viewport\npage.locator("#target").evaluate(\n    "el => el.scrollIntoView({block: &apos;center&apos;})");</code></pre><h4>Q41. Perform infinite scrolling</h4><pre><code>int previousHeight = 0;\nint maxScrolls = 10;  // safety limit\nint scrollCount = 0;\n\nwhile (scrollCount &lt; maxScrolls) {\n    // Get current scroll height\n    int currentHeight = (int) page.evaluate(\n        "document.body.scrollHeight");\n\n    // Scroll to bottom\n    page.evaluate("window.scrollTo(0, document.body.scrollHeight)");\n    page.waitForTimeout(1000);  // wait for content to load\n\n    // Check if we reached the end\n    int newHeight = (int) page.evaluate(\n        "document.body.scrollHeight");\n    if (newHeight == currentHeight) {\n        System.out.println("Reached bottom after " + scrollCount + " scrolls");\n        break;\n    }\n    scrollCount++;\n}\n\n// Count loaded items\nint totalItems = page.locator(".feed-item").count();\nSystem.out.println("Total items loaded: " + totalItems);</code></pre><h4>Q42. Scroll horizontally</h4><pre><code>// Scroll element horizontally\npage.evaluate(\n    "document.querySelector(&apos;.horizontal-container&apos;).scrollLeft += 300");\n\n// Scroll to end of horizontal container\npage.evaluate(\n    "el => el.scrollLeft = el.scrollWidth",\n    page.locator(".horizontal-container").elementHandle());\n\n// Using mouse wheel\npage.locator(".horizontal-container").hover();\npage.mouse().wheel(300, 0);  // deltaX=300, deltaY=0</code></pre>'},
{id:830,part:"PW",level:"Senior",category:"Waits",q:"Validations & Waits (Q43-Q48) — Visible, enabled, text, count, wait for element, wait for API",a:'<h4>Q43. Verify an element is visible</h4><pre><code>// Instant check (no auto-wait)\nboolean visible = page.isVisible("div.modal");\n\n// Auto-retry assertion ✅ (waits up to 5s)\nassertThat(page.locator("div.modal")).isVisible();\nassertThat(page.locator("div.modal")).isHidden();  // opposite\nassertThat(page.locator("div.modal")).not().isVisible(); // negation</code></pre><h4>Q44. Verify an element is enabled/disabled</h4><pre><code>// Check enabled state\nassertThat(page.locator("button#submit")).isEnabled();\nassertThat(page.locator("button#submit")).isDisabled();\n\n// Conditional logic\nif (page.isEnabled("button#submit")) {\n    page.click("button#submit");\n} else {\n    System.out.println("Button is disabled — fill required fields first");\n}</code></pre><h4>Q45. Verify element text</h4><pre><code>// Exact text match\nassertThat(page.locator("h1")).hasText("Welcome to Onsurity");\n\n// Partial text match\nassertThat(page.locator("h1")).containsText("Welcome");\n\n// Regex match\nassertThat(page.locator("h1")).hasText(Pattern.compile("Welcome.*"));\n\n// Read text value\nString text = page.locator("h1").textContent();\nString innerText = page.locator("h1").innerText(); // visible only\nString inputVal = page.locator("input#email").inputValue();</code></pre><h4>Q46. Count matching elements</h4><pre><code>// Count\nint count = page.locator("ul.items li").count();\nAssert.assertEquals(count, 10, "Should have 10 items");\n\n// Playwright assertion\nassertThat(page.locator("ul.items li")).hasCount(10);\n\n// Get all text values\nList&lt;String&gt; allTexts = page.locator("ul.items li").allTextContents();\nSystem.out.println("Items: " + allTexts);</code></pre><h4>Q47. Wait for an element to appear</h4><pre><code>// Method 1: waitFor on locator ✅\npage.locator("div.loading-spinner").waitFor(\n    new Locator.WaitForOptions()\n        .setState(WaitForSelectorState.HIDDEN)\n        .setTimeout(15000));  // wait for spinner to disappear\n\npage.locator("div.results").waitFor(\n    new Locator.WaitForOptions()\n        .setState(WaitForSelectorState.VISIBLE)\n        .setTimeout(10000));  // wait for results to appear\n\n// Method 2: waitForSelector on page\npage.waitForSelector("div.results",\n    new Page.WaitForSelectorOptions()\n        .setState(WaitForSelectorState.VISIBLE));\n\n// Method 3: wait for URL change\npage.waitForURL("**/dashboard");\n\n// Method 4: wait for page load state\npage.waitForLoadState(LoadState.NETWORKIDLE);</code></pre><h4>Q48. Wait for an API response</h4><pre><code>// Wait for specific API call during UI action\nResponse apiResponse = page.waitForResponse(\n    response -> response.url().contains("/api/members")\n                && response.status() == 200,\n    () -> page.click("button#loadData")  // action that triggers API\n);\n\n// Read response\nString body = apiResponse.text();\nint status = apiResponse.status();\nSystem.out.println("API Status: " + status);\nSystem.out.println("Body: " + body);\n\n// Wait for request to be sent\nRequest apiRequest = page.waitForRequest(\n    request -> request.url().contains("/api/order"),\n    () -> page.click("button#placeOrder")\n);\nSystem.out.println("Request URL: " + apiRequest.url());\nSystem.out.println("Method: " + apiRequest.method());</code></pre>'},
{id:831,part:"PW",level:"Senior",category:"Screenshots",q:"Screenshots (Q49-Q50) — Full page screenshot, element screenshot, with path and Base64",a:'<h4>Q49. Capture a full-page screenshot</h4><pre><code>// Save to file\npage.screenshot(new Page.ScreenshotOptions()\n    .setPath(Paths.get("target/screenshots/full-page.png"))\n    .setFullPage(true));  // captures entire scrollable page\n\n// Save with timestamp (unique per test run)\nString filename = "screenshot_" + System.currentTimeMillis() + ".png";\npage.screenshot(new Page.ScreenshotOptions()\n    .setPath(Paths.get("target/screenshots/" + filename))\n    .setFullPage(true));\n\n// As byte array (for embedding in reports)\nbyte[] screenshotBytes = page.screenshot(\n    new Page.ScreenshotOptions().setFullPage(true));\n\n// Viewport only (not full page)\npage.screenshot(new Page.ScreenshotOptions()\n    .setPath(Paths.get("viewport.png"))\n    .setFullPage(false));  // only visible area\n\n// With quality (JPEG only)\npage.screenshot(new Page.ScreenshotOptions()\n    .setPath(Paths.get("screenshot.jpg"))\n    .setType(ScreenshotType.JPEG)\n    .setQuality(80));  // 0-100</code></pre><h4>Q50. Capture a screenshot of a specific element</h4><pre><code>// Screenshot of a single element\npage.locator("div.chart-container").screenshot(\n    new Locator.ScreenshotOptions()\n        .setPath(Paths.get("target/screenshots/chart.png")));\n\n// Screenshot of header section\nbyte[] headerShot = page.locator("header.main-nav").screenshot(\n    new Locator.ScreenshotOptions());\n\n// Screenshot of table for reporting\npage.locator("table#results").screenshot(\n    new Locator.ScreenshotOptions()\n        .setPath(Paths.get("target/screenshots/results-table.png")));\n\n// ═══ BONUS: Screenshot on Test Failure Pattern ═══\n// In BaseTest or TestListener:\n@AfterMethod\npublic void afterMethod(ITestResult result) {\n    if (result.getStatus() == ITestResult.FAILURE) {\n        String path = "target/screenshots/" + result.getName()\n                + "_" + System.currentTimeMillis() + ".png";\n        page.screenshot(new Page.ScreenshotOptions()\n                .setPath(Paths.get(path)).setFullPage(true));\n        System.out.println("Failure screenshot: " + path);\n    }\n}</code></pre>'}
);

function renderCard(q, i) {
    const level = q.level || 'Senior';
    const levelClass = level.toLowerCase();
    const levelIcon = level === 'Senior' ? '🔥' : '🌱';
    return `<div class="qa-card part-${q.part.toLowerCase()}" id="q${q.id}" style="--i:${i}" data-part="${q.part}" data-level="${level}">
        <div class="qa-header" onclick="toggleCard(this)">
            <div class="qa-number">Q${q.id}</div>
            <div class="qa-question">${q.q}</div>
            <span class="qa-level ${levelClass}">${levelIcon} ${level}</span>
            <span class="qa-category">${q.category}</span>
            <div class="qa-toggle">▼</div>
        </div>
        <div class="qa-body"><div class="qa-content">${q.a}</div></div>
    </div>`;
}

// ============================================================
// INTERACTIONS
// ============================================================
function toggleCard(header) {
    const card = header.closest('.qa-card');
    card.classList.toggle('open');
    updateActiveNav();
}

function expandAll() {
    document.querySelectorAll('.qa-card:not([style*="display: none"])').forEach(c => c.classList.add('open'));
}

function collapseAll() {
    document.querySelectorAll('.qa-card').forEach(c => c.classList.remove('open'));
}

function filterPart(part) {
    const level = document.getElementById('levelFilter').value;
    applyFilters(part, level);
}

function filterLevel(lvl) {
    const part = document.getElementById('partFilter').value;
    applyFilters(part, lvl);
}

function applyFilters(part, level) {
    let visibleCount = 0;
    document.querySelectorAll('.qa-card').forEach(c => {
        const matchPart = part === 'all' || c.dataset.part === part;
        const matchLevel = level === 'all' || c.dataset.level === level;
        const show = matchPart && matchLevel;
        c.style.display = show ? '' : 'none';
        if (show) visibleCount++;
    });
    document.querySelectorAll('.section-header').forEach(h => {
        if (part === 'all') h.style.display = '';
        else {
            h.style.display = h.classList.contains('part-' + part.toLowerCase()) ? '' : 'none';
        }
    });
    const counter = document.getElementById('filterCount');
    if (counter) counter.textContent = 'Showing ' + visibleCount + ' questions';
}

function searchQuestions(query) {
    const q = query.toLowerCase().trim();
    const countEl = document.getElementById('searchCount');
    if (!q) {
        document.querySelectorAll('.qa-card').forEach(c => { c.style.display = ''; c.classList.remove('open'); });
        document.querySelectorAll('.section-header').forEach(h => h.style.display = '');
        countEl.textContent = '';
        return;
    }
    let count = 0;
    document.querySelectorAll('.qa-card').forEach(c => {
        const text = c.textContent.toLowerCase();
        if (text.includes(q)) { c.style.display = ''; c.classList.add('open'); count++; }
        else { c.style.display = 'none'; c.classList.remove('open'); }
    });
    countEl.textContent = count + ' found';
}

function toggleTheme() {
    const html = document.documentElement;
    const btn = document.getElementById('themeBtn');
    if (html.dataset.theme === 'dark') { html.dataset.theme = 'light'; btn.textContent = '☀️ Light'; }
    else { html.dataset.theme = 'dark'; btn.textContent = '🌙 Dark'; }
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}

// Scroll progress & back-to-top
window.addEventListener('scroll', () => {
    const h = document.documentElement;
    const pct = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('backToTop').classList.toggle('visible', h.scrollTop > 500);
    updateActiveNav();
});

function updateActiveNav() {
    const cards = document.querySelectorAll('.qa-card');
    let activeId = null;
    cards.forEach(c => {
        const rect = c.getBoundingClientRect();
        if (rect.top < 200) activeId = c.id;
    });
    document.querySelectorAll('.nav-link').forEach(l => {
        l.classList.toggle('active', l.getAttribute('href') === '#' + activeId);
    });
}

// Keyboard shortcut
document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
    }
});

// Init
renderSidebar();
renderMain();
