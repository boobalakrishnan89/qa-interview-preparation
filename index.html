    for (int num : nums) {
        maxHeap.offer(num);
        if (maxHeap.size() &gt; k) maxHeap.poll();
    }
    return maxHeap.peek();
}</code></pre><table><tr><th>Operation</th><th>Time</th></tr><tr><td>offer (insert)</td><td>O(log n)</td></tr><tr><td>poll (remove top)</td><td>O(log n)</td></tr><tr><td>peek (view top)</td><td>O(1)</td></tr><tr><td>Build heap from array</td><td>O(n)</td></tr></table>`},
{id:753,part:"T",level:"Senior",category:"Trie",q:"Trie (Prefix Tree) — Autocomplete, word search, and prefix matching",a:`<h4>Trie = Tree for Strings (each node = one character)</h4><pre><code>class TrieNode {
    TrieNode[] children = new TrieNode[26];
    boolean isEndOfWord = false;
}

public class Trie {
    private final TrieNode root = new TrieNode();

    // Insert word — O(m) where m = word length
    public void insert(String word) {
        TrieNode node = root;
        for (char c : word.toCharArray()) {
            int idx = c - 'a';
            if (node.children[idx] == null) node.children[idx] = new TrieNode();
            node = node.children[idx];
        }
        node.isEndOfWord = true;
    }

    // Search exact word — O(m)
    public boolean search(String word) {
        TrieNode node = findNode(word);
        return node != null &amp;&amp; node.isEndOfWord;
    }

    // Check prefix exists — O(m)
    public boolean startsWith(String prefix) {
        return findNode(prefix) != null;
    }

    private TrieNode findNode(String s) {
        TrieNode node = root;
        for (char c : s.toCharArray()) {
            node = node.children[c - 'a'];
            if (node == null) return null;
        }
        return node;
    }

    // Autocomplete — all words with given prefix
    public List&lt;String&gt; autocomplete(String prefix) {
        List&lt;String&gt; results = new ArrayList&lt;&gt;();
        TrieNode node = findNode(prefix);
        if (node != null) collectWords(node, new StringBuilder(prefix), results);
        return results;
    }
    private void collectWords(TrieNode node, StringBuilder sb, List&lt;String&gt; results) {
        if (node.isEndOfWord) results.add(sb.toString());
        for (int i = 0; i &lt; 26; i++) {
            if (node.children[i] != null) {
                sb.append((char)('a' + i));
                collectWords(node.children[i], sb, results);
                sb.deleteCharAt(sb.length() - 1);
            }
        }
    }
}</code></pre><h4>SDET Use: Test Data Autocomplete / API Endpoint Matching</h4><p>Tries are used in search boxes, URL routers, and spell checkers. Understanding them helps when testing autocomplete features or building smart test data lookups.</p>`},
{id:754,part:"T",level:"Senior",category:"Sorting",q:"Sorting Algorithms Comparison — Bubble, Selection, Insertion, Merge, Quick, and when to use each",a:`<h4>Sorting Comparison Table</h4><table><tr><th>Algorithm</th><th>Best</th><th>Average</th><th>Worst</th><th>Space</th><th>Stable?</th><th>When to Use</th></tr><tr><td>Bubble Sort</td><td>O(n)</td><td>O(n²)</td><td>O(n²)</td><td>O(1)</td><td>Yes</td><td>Never (educational only)</td></tr><tr><td>Selection Sort</td><td>O(n²)</td><td>O(n²)</td><td>O(n²)</td><td>O(1)</td><td>No</td><td>Minimum swaps needed</td></tr><tr><td>Insertion Sort</td><td>O(n)</td><td>O(n²)</td><td>O(n²)</td><td>O(1)</td><td>Yes</td><td>Nearly sorted, small data</td></tr><tr><td>Merge Sort</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n)</td><td>Yes ✅</td><td>Guaranteed O(n log n), linked lists</td></tr><tr><td>Quick Sort</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n²)</td><td>O(log n)</td><td>No</td><td>General purpose, in-place ✅</td></tr><tr><td>Tim Sort</td><td>O(n)</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n)</td><td>Yes ✅</td><td>Java Arrays.sort(), real-world data</td></tr></table><h4>Java Built-in Sorting</h4><pre><code>// Arrays.sort() — uses Dual-Pivot Quicksort for primitives
int[] arr = {5, 2, 8, 1, 9};
Arrays.sort(arr);  // [1, 2, 5, 8, 9]

// Collections.sort() — uses TimSort for objects (stable)
List&lt;String&gt; names = Arrays.asList("Zebra", "Apple", "Mango");
Collections.sort(names);  // [Apple, Mango, Zebra]

// Custom comparator
names.sort(Comparator.comparingInt(String::length));  // by length
names.sort(Comparator.comparingInt(String::length).reversed());  // desc</code></pre><h4>Key Insight for Interviews</h4><p><strong>Java uses TimSort</strong> (hybrid of Merge Sort + Insertion Sort) for object arrays — stable, O(n log n), optimized for real-world partially sorted data. <strong>Always mention this</strong> when asked about sorting in Java.</p>`},
{id:755,part:"T",level:"Senior",category:"Searching",q:"Binary Search — Iterative, recursive, and variations (lower/upper bound, rotated array)",a:`<h4>Standard Binary Search — O(log n)</h4><pre><code>// Iterative (preferred — no stack overflow risk)
public int binarySearch(int[] arr, int target) {
    int lo = 0, hi = arr.length - 1;
    while (lo &lt;= hi) {
        int mid = lo + (hi - lo) / 2;  // avoid overflow
        if (arr[mid] == target) return mid;
        else if (arr[mid] &lt; target) lo = mid + 1;
        else hi = mid - 1;
    }
    return -1;  // not found
}

// Lower Bound: first index where arr[i] &gt;= target
public int lowerBound(int[] arr, int target) {
    int lo = 0, hi = arr.length;
    while (lo &lt; hi) {
        int mid = lo + (hi - lo) / 2;
        if (arr[mid] &lt; target) lo = mid + 1;
        else hi = mid;
    }
    return lo;
}

// Search in Rotated Sorted Array — O(log n)
public int searchRotated(int[] nums, int target) {
    int lo = 0, hi = nums.length - 1;
    while (lo &lt;= hi) {
        int mid = lo + (hi - lo) / 2;
        if (nums[mid] == target) return mid;
        if (nums[lo] &lt;= nums[mid]) {  // left half sorted
            if (target &gt;= nums[lo] &amp;&amp; target &lt; nums[mid]) hi = mid - 1;
            else lo = mid + 1;
        } else {  // right half sorted
            if (target &gt; nums[mid] &amp;&amp; target &lt;= nums[hi]) lo = mid + 1;
            else hi = mid - 1;
        }
    }
    return -1;
}</code></pre><table><tr><th>Variation</th><th>Time</th><th>Use Case</th></tr><tr><td>Standard binary search</td><td>O(log n)</td><td>Find exact value</td></tr><tr><td>Lower bound</td><td>O(log n)</td><td>First occurrence / insertion point</td></tr><tr><td>Upper bound</td><td>O(log n)</td><td>Last occurrence + 1</td></tr><tr><td>Rotated array search</td><td>O(log n)</td><td>Search in sorted-then-rotated array</td></tr></table>`},
{id:756,part:"T",level:"Senior",category:"Recursion",q:"Recursion vs Iteration — When to use each, and how to convert recursive to iterative",a:`<h4>Recursion = Function calls itself | Iteration = Loops</h4><pre><code>// Recursive Factorial — O(n) time, O(n) space (call stack)
public int factRecursive(int n) {
    if (n &lt;= 1) return 1;         // base case
    return n * factRecursive(n - 1);  // recursive case
}

// Iterative Factorial — O(n) time, O(1) space ✅
public int factIterative(int n) {
    int result = 1;
    for (int i = 2; i &lt;= n; i++) result *= i;
    return result;
}</code></pre><h4>When to Use Each</h4><table><tr><th>Use Recursion When</th><th>Use Iteration When</th></tr><tr><td>Tree/Graph traversals</td><td>Simple loops (arrays, lists)</td></tr><tr><td>Divide and conquer (merge sort)</td><td>Performance-critical code</td></tr><tr><td>Problem naturally recursive (Tower of Hanoi)</td><td>Risk of StackOverflow (deep recursion)</td></tr><tr><td>Backtracking (N-Queens, permutations)</td><td>Tail recursion can be loop</td></tr></table><h4>Converting Recursion to Iteration (using Stack)</h4><pre><code>// Recursive DFS
public void dfsRecursive(TreeNode node) {
    if (node == null) return;
    process(node);
    dfsRecursive(node.left);
    dfsRecursive(node.right);
}

// Same logic, iterative with explicit stack
public void dfsIterative(TreeNode root) {
    Deque&lt;TreeNode&gt; stack = new ArrayDeque&lt;&gt;();
    if (root != null) stack.push(root);
    while (!stack.isEmpty()) {
        TreeNode node = stack.pop();
        process(node);
        if (node.right != null) stack.push(node.right);
        if (node.left != null) stack.push(node.left);
    }
}</code></pre><h4>Key Interview Point</h4><p>Every recursive solution can be converted to iterative using an explicit stack. Iterative is preferred in production test frameworks because it avoids <code>StackOverflowError</code> on large inputs.</p>`},
{id:757,part:"T",level:"Senior",category:"DP",q:"Dynamic Programming — Memoization vs Tabulation, with Fibonacci and Climbing Stairs examples",a:`<h4>DP = Break problem into overlapping subproblems + store results</h4><pre><code>// 1. Naive Recursive Fibonacci — O(2ⁿ) ❌ Exponential!
public int fibNaive(int n) {
    if (n &lt;= 1) return n;
    return fibNaive(n-1) + fibNaive(n-2);  // recalculates same values
}

// 2. Top-Down DP (Memoization) — O(n) time, O(n) space
public int fibMemo(int n, int[] memo) {
    if (n &lt;= 1) return n;
    if (memo[n] != 0) return memo[n];  // cached!
    memo[n] = fibMemo(n-1, memo) + fibMemo(n-2, memo);
    return memo[n];
}

// 3. Bottom-Up DP (Tabulation) — O(n) time, O(n) space
public int fibTab(int n) {
    if (n &lt;= 1) return n;
    int[] dp = new int[n + 1];
    dp[0] = 0; dp[1] = 1;
    for (int i = 2; i &lt;= n; i++) dp[i] = dp[i-1] + dp[i-2];
    return dp[n];
}

// 4. Space-Optimized — O(n) time, O(1) space ✅
public int fibOptimal(int n) {
    if (n &lt;= 1) return n;
    int a = 0, b = 1;
    for (int i = 2; i &lt;= n; i++) { int t = a + b; a = b; b = t; }
    return b;
}</code></pre><h4>Climbing Stairs (same pattern as Fibonacci)</h4><pre><code>// How many ways to climb n stairs (1 or 2 steps at a time)?
// climbStairs(4) = 5: [1111, 112, 121, 211, 22]
public int climbStairs(int n) {
    if (n &lt;= 2) return n;
    int a = 1, b = 2;
    for (int i = 3; i &lt;= n; i++) { int t = a + b; a = b; b = t; }
    return b;
}</code></pre><table><tr><th>Approach</th><th>Time</th><th>Space</th><th>Direction</th></tr><tr><td>Naive recursion</td><td>O(2ⁿ)</td><td>O(n)</td><td>—</td></tr><tr><td>Memoization</td><td>O(n)</td><td>O(n)</td><td>Top-down</td></tr><tr><td>Tabulation</td><td>O(n)</td><td>O(n)</td><td>Bottom-up</td></tr><tr><td>Space-optimized</td><td>O(n)</td><td>O(1)</td><td>Bottom-up</td></tr></table>`},
{id:758,part:"T",level:"Senior",category:"DP",q:"Coin Change Problem — Classic DP problem with tabulation approach",a:`<h4>Problem: Minimum coins to make amount</h4><pre><code>// Given coins [1, 5, 10, 25], make amount 30
// Answer: 2 coins (5 + 25)

public int coinChange(int[] coins, int amount) {
    int[] dp = new int[amount + 1];
    Arrays.fill(dp, amount + 1);  // fill with impossible value
    dp[0] = 0;  // 0 coins to make 0

    for (int i = 1; i &lt;= amount; i++) {
        for (int coin : coins) {
            if (coin &lt;= i) {
                dp[i] = Math.min(dp[i], dp[i - coin] + 1);
            }
        }
    }
    return dp[amount] &gt; amount ? -1 : dp[amount];
}

// dp table for coins=[1,5,10], amount=12:
// dp[0]=0, dp[1]=1, dp[2]=2, dp[3]=3, dp[4]=4,
// dp[5]=1, dp[6]=2, dp[7]=3, dp[8]=4, dp[9]=5,
// dp[10]=1, dp[11]=2, dp[12]=3  → answer: 3 (10+1+1)</code></pre><h4>Variation: Count number of ways to make change</h4><pre><code>public int coinChangeWays(int[] coins, int amount) {
    int[] dp = new int[amount + 1];
    dp[0] = 1;  // 1 way to make 0
    for (int coin : coins) {
        for (int i = coin; i &lt;= amount; i++) {
            dp[i] += dp[i - coin];
        }
    }
    return dp[amount];
}</code></pre><table><tr><th>Variant</th><th>Time</th><th>Space</th></tr><tr><td>Min coins</td><td>O(amount × coins)</td><td>O(amount)</td></tr><tr><td>Count ways</td><td>O(amount × coins)</td><td>O(amount)</td></tr></table>`},
{id:759,part:"T",level:"Senior",category:"Greedy",q:"Greedy Algorithms — Activity Selection, Interval Scheduling, and when Greedy works",a:`<h4>Greedy = Make locally optimal choice at each step</h4><pre><code>// Activity Selection: Max non-overlapping intervals
// Sort by end time, greedily pick earliest-ending activities
public int maxActivities(int[][] intervals) {
    Arrays.sort(intervals, Comparator.comparingInt(a -&gt; a[1]));  // sort by end
    int count = 1;
    int lastEnd = intervals[0][1];
    for (int i = 1; i &lt; intervals.length; i++) {
        if (intervals[i][0] &gt;= lastEnd) {  // no overlap
            count++;
            lastEnd = intervals[i][1];
        }
    }
    return count;
}
// [[1,3],[2,4],[3,5],[0,6],[5,7],[8,9],[5,9]]
// Sorted by end: [1,3],[2,4],[3,5],[0,6],[5,7],[5,9],[8,9]
// Pick: [1,3], [3,5], [5,7], [8,9] → 4 activities</code></pre><h4>Merge Intervals (Related Problem)</h4><pre><code>public int[][] mergeIntervals(int[][] intervals) {
    Arrays.sort(intervals, Comparator.comparingInt(a -&gt; a[0]));
    List&lt;int[]&gt; merged = new ArrayList&lt;&gt;();
    for (int[] interval : intervals) {
        if (merged.isEmpty() || merged.get(merged.size()-1)[1] &lt; interval[0]) {
            merged.add(interval);
        } else {
        merged.get(merged.size()-1)[1] = Math.max(merged.get(merged.size()-1)[1], interval[1]);
        }
    }
    return merged.toArray(new int[0][]);
}</code></pre><h4>When Does Greedy Work?</h4><table><tr><th>Works ✅</th><th>Doesn't Work ❌ (Use DP)</th></tr><tr><td>Activity selection</td><td>0/1 Knapsack</td></tr><tr><td>Huffman coding</td><td>Coin change (general)</td></tr><tr><td>Fractional knapsack</td><td>Longest common subsequence</td></tr><tr><td>Minimum spanning tree (Kruskal/Prim)</td><td>Edit distance</td></tr></table>`},
{id:760,part:"T",level:"Senior",category:"Patterns",q:"Two Pointer Technique — Solving array problems efficiently in O(n)",a:`<h4>Two Pointers = Two indices moving towards each other or in same direction</h4><pre><code>// Pattern 1: Opposite ends (sorted array)
// Two Sum on sorted array — O(n)
public int[] twoSumSorted(int[] nums, int target) {
    int left = 0, right = nums.length - 1;
    while (left &lt; right) {
        int sum = nums[left] + nums[right];
        if (sum == target) return new int[]{left, right};
        else if (sum &lt; target) left++;
        else right--;
    }
    return new int[]{-1, -1};
}

// Pattern 2: Same direction (slow/fast pointer)
// Remove duplicates in-place — O(n)
public int removeDuplicates(int[] nums) {
    if (nums.length == 0) return 0;
    int slow = 0;
    for (int fast = 1; fast &lt; nums.length; fast++) {
        if (nums[fast] != nums[slow]) {
            nums[++slow] = nums[fast];
        }
    }
    return slow + 1;
}

// Pattern 3: Container With Most Water — O(n)
public int maxArea(int[] height) {
    int left = 0, right = height.length - 1;
    int maxWater = 0;
    while (left &lt; right) {
        int area = Math.min(height[left], height[right]) * (right - left);
        maxWater = Math.max(maxWater, area);
        if (height[left] &lt; height[right]) left++;
        else right--;
    }
    return maxWater;
}</code></pre><table><tr><th>Problem</th><th>Brute Force</th><th>Two Pointer</th></tr><tr><td>Two Sum (sorted)</td><td>O(n²)</td><td>O(n)</td></tr><tr><td>Remove duplicates</td><td>O(n²)</td><td>O(n)</td></tr><tr><td>Container water</td><td>O(n²)</td><td>O(n)</td></tr><tr><td>Palindrome check</td><td>O(n)</td><td>O(n)</td></tr></table>`},
{id:761,part:"T",level:"Senior",category:"Patterns",q:"Sliding Window Technique — Fixed and variable window problems",a:`<h4>Sliding Window = Maintain a window [left, right] and slide it across the array</h4><pre><code>// Fixed Window: Maximum sum subarray of size K — O(n)
public int maxSumSubarray(int[] arr, int k) {
    int windowSum = 0;
    for (int i = 0; i &lt; k; i++) windowSum += arr[i];  // first window
    int maxSum = windowSum;
    for (int i = k; i &lt; arr.length; i++) {
        windowSum += arr[i] - arr[i - k];  // slide: add right, remove left
        maxSum = Math.max(maxSum, windowSum);
    }
    return maxSum;
}

// Variable Window: Smallest subarray with sum &gt;= target — O(n)
public int minSubArrayLen(int target, int[] nums) {
    int left = 0, sum = 0, minLen = Integer.MAX_VALUE;
    for (int right = 0; right &lt; nums.length; right++) {
        sum += nums[right];
        while (sum &gt;= target) {
            minLen = Math.min(minLen, right - left + 1);
            sum -= nums[left++];  // shrink window
        }
    }
    return minLen == Integer.MAX_VALUE ? 0 : minLen;
}

// Variable Window: Longest substring without repeating chars — O(n)
public int lengthOfLongestSubstring(String s) {
    Map&lt;Character, Integer&gt; lastSeen = new HashMap&lt;&gt;();
    int maxLen = 0, left = 0;
    for (int right = 0; right &lt; s.length(); right++) {
        char c = s.charAt(right);
        if (lastSeen.containsKey(c) &amp;&amp; lastSeen.get(c) &gt;= left)
            left = lastSeen.get(c) + 1;
        lastSeen.put(c, right);
        maxLen = Math.max(maxLen, right - left + 1);
    }
    return maxLen;
}</code></pre><table><tr><th>Window Type</th><th>When to Use</th><th>Example</th></tr><tr><td>Fixed</td><td>Exact window size given</td><td>Max sum of K elements</td></tr><tr><td>Variable (grow)</td><td>Find minimum/longest that satisfies condition</td><td>Min subarray &gt;= target</td></tr><tr><td>Variable (shrink)</td><td>Longest valid window</td><td>Longest unique substring</td></tr></table>`},
{id:762,part:"T",level:"Mid",category:"Complexity",q:"What is the difference between O(n), O(n²), and O(log n)? Explain with simple examples",a:`<h4>Visual Comparison</h4><table><tr><th>n</th><th>O(log n)</th><th>O(n)</th><th>O(n log n)</th><th>O(n²)</th></tr><tr><td>10</td><td>3</td><td>10</td><td>33</td><td>100</td></tr><tr><td>100</td><td>7</td><td>100</td><td>664</td><td>10,000</td></tr><tr><td>1,000</td><td>10</td><td>1,000</td><td>9,966</td><td>1,000,000</td></tr><tr><td>1,000,000</td><td>20</td><td>1M</td><td>20M</td><td>1,000,000,000,000</td></tr></table><pre><code>// O(log n) — Binary search: halves the search space each step
public int search(int[] sorted, int target) {
    int lo = 0, hi = sorted.length - 1;
    while (lo &lt;= hi) {
        int mid = (lo + hi) / 2;
        if (sorted[mid] == target) return mid;
        if (sorted[mid] &lt; target) lo = mid + 1;
        else hi = mid - 1;
    }
    return -1;
}

// O(n) — Single loop through array
public int findMax(int[] arr) {
    int max = arr[0];
    for (int num : arr) if (num &gt; max) max = num;
    return max;
}

// O(n²) — Nested loops (compare every pair)
public boolean hasDuplicate(int[] arr) {
    for (int i = 0; i &lt; arr.length; i++)
        for (int j = i + 1; j &lt; arr.length; j++)
            if (arr[i] == arr[j]) return true;
    return false;
}
// Better: use HashSet → O(n)</code></pre><h4>Rule of Thumb for Interviews</h4><p>If n = 10⁶, your solution must be O(n) or O(n log n). O(n²) will time out. If n = 10⁴, O(n²) is OK but O(n³) is not.</p>`},
{id:763,part:"T",level:"Mid",category:"Arrays",q:"Common Array Operations — Rotate, prefix sum, Kadane's algorithm",a:`<h4>Rotate Array by K positions — O(n) time, O(1) space</h4><pre><code>public void rotate(int[] nums, int k) {
    k %= nums.length;
    reverse(nums, 0, nums.length - 1);  // reverse all
    reverse(nums, 0, k - 1);             // reverse first k
    reverse(nums, k, nums.length - 1);   // reverse rest
}
private void reverse(int[] a, int l, int r) {
    while (l &lt; r) { int t = a[l]; a[l++] = a[r]; a[r--] = t; }
}
// [1,2,3,4,5,6,7], k=3 → [5,6,7,1,2,3,4]</code></pre><h4>Prefix Sum — Range sum queries in O(1)</h4><pre><code>int[] nums = {2, 4, 6, 8, 10};
int[] prefix = new int[nums.length + 1];
for (int i = 0; i &lt; nums.length; i++) prefix[i+1] = prefix[i] + nums[i];
// prefix = [0, 2, 6, 12, 20, 30]

// Sum of range [1, 3] = prefix[4] - prefix[1] = 20 - 2 = 18
int rangeSum = prefix[4] - prefix[1];  // O(1) per query!</code></pre><h4>Kadane's Algorithm — Maximum subarray sum O(n)</h4><pre><code>public int maxSubarraySum(int[] nums) {
    int currentMax = nums[0], globalMax = nums[0];
    for (int i = 1; i &lt; nums.length; i++) {
        currentMax = Math.max(nums[i], currentMax + nums[i]);
        globalMax = Math.max(globalMax, currentMax);
    }
    return globalMax;
}
// [-2,1,-3,4,-1,2,1,-5,4] → 6 (subarray [4,-1,2,1])</code></pre>`},
{id:764,part:"T",level:"Mid",category:"Patterns",q:"How do you choose the right data structure? Decision flowchart for common problems",a:`<h4>Data Structure Decision Guide</h4><table><tr><th>Need</th><th>Use</th><th>Why</th></tr><tr><td>Fast lookup by key</td><td>HashMap</td><td>O(1) get/put</td></tr><tr><td>Unique elements</td><td>HashSet</td><td>O(1) add/contains, no dups</td></tr><tr><td>Sorted order + fast lookup</td><td>TreeMap / TreeSet</td><td>O(log n), sorted iteration</td></tr><tr><td>FIFO processing</td><td>Queue (LinkedList)</td><td>BFS, task queues</td></tr><tr><td>LIFO / undo</td><td>Stack (ArrayDeque)</td><td>DFS, bracket matching</td></tr><tr><td>Top K / min-max</td><td>PriorityQueue (Heap)</td><td>O(log n) insert, O(1) peek</td></tr><tr><td>Frequent insert/delete at ends</td><td>LinkedList / Deque</td><td>O(1) at head/tail</td></tr><tr><td>Random access by index</td><td>ArrayList / Array</td><td>O(1) get by index</td></tr><tr><td>Prefix matching / autocomplete</td><td>Trie</td><td>O(m) per word</td></tr><tr><td>Shortest path (unweighted)</td><td>BFS + Queue</td><td>Level-order guarantees shortest</td></tr></table><h4>Problem Pattern → Algorithm Map</h4><table><tr><th>Pattern</th><th>Technique</th><th>Example Problems</th></tr><tr><td>"Find pair that..."</td><td>Two Pointer / HashMap</td><td>Two Sum, 3Sum</td></tr><tr><td>"Subarray/substring of size K"</td><td>Sliding Window</td><td>Max sum, longest unique</td></tr><tr><td>"Sorted input, find target"</td><td>Binary Search</td><td>Search rotated, find peak</td></tr><tr><td>"All permutations/combinations"</td><td>Backtracking</td><td>N-Queens, subsets</td></tr><tr><td>"Optimal substructure"</td><td>Dynamic Programming</td><td>Coin change, knapsack</td></tr><tr><td>"Locally optimal → global"</td><td>Greedy</td><td>Activity selection, intervals</td></tr></table>`},
{id:765,part:"T",level:"Mid",category:"Complexity",q:"Space Complexity — How to analyze memory usage of your algorithm",a:`<h4>Space Complexity = Extra memory used (excluding input)</h4><pre><code>// O(1) Space — in-place, no extra data structures
public void reverseArray(int[] arr) {
    int l = 0, r = arr.length - 1;
    while (l &lt; r) { int t = arr[l]; arr[l++] = arr[r]; arr[r--] = t; }
}

// O(n) Space — new array/list of size n
public int[] copyArray(int[] arr) {
    int[] copy = new int[arr.length];  // O(n) extra
    System.arraycopy(arr, 0, copy, 0, arr.length);
    return copy;
}

// O(n) Space — HashMap
public boolean hasDuplicate(int[] arr) {
    Set&lt;Integer&gt; seen = new HashSet&lt;&gt;();  // worst case n elements
    for (int num : arr) {
        if (!seen.add(num)) return true;
    }
    return false;
}

// O(log n) Space — recursive call stack (binary search)
public int binarySearch(int[] arr, int lo, int hi, int target) {
    if (lo &gt; hi) return -1;
    int mid = (lo + hi) / 2;
    if (arr[mid] == target) return mid;
    if (arr[mid] &lt; target) return binarySearch(arr, mid+1, hi, target);
    return binarySearch(arr, lo, mid-1, target);
    // Each call adds a frame to call stack → O(log n) frames
}

// O(n) Space — recursive call stack (linear recursion)
public int factorial(int n) {
    if (n &lt;= 1) return 1;
    return n * factorial(n - 1);  // n frames on call stack
}</code></pre><table><tr><th>Space</th><th>Example</th></tr><tr><td>O(1)</td><td>In-place swap, two pointers, variables</td></tr><tr><td>O(log n)</td><td>Recursive binary search call stack</td></tr><tr><td>O(n)</td><td>HashMap, new array, linear recursion stack</td></tr><tr><td>O(n²)</td><td>2D matrix, adjacency matrix</td></tr></table><h4>Interview Tip</h4><p>Always mention <strong>both time AND space complexity</strong> when analyzing your solution. Interviewers specifically check if you consider the tradeoff — e.g., HashSet gives O(n) time but costs O(n) space vs. sorting gives O(n log n) time but O(1) space.</p>`}
