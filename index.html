{id:524,part:"K",level:"Senior",category:"Estimation",q:"How do you estimate testing effort for a sprint? Walk through your process.",a:`<h4>Test Estimation Process</h4><ol><li><strong>Understand scope:</strong> Read user stories, acceptance criteria, tech design docs</li><li><strong>Break down tasks:</strong><pre><code>Test Design:     2-4 hrs per story\nTest Data Setup: 1-2 hrs\nExecution:       4-8 hrs per story\nBug Verification: 2-3 hrs (buffer)\nRegression:      4-6 hrs (automated suite)\nReporting:       1 hr</code></pre></li><li><strong>Apply complexity factor:</strong><table><tr><th>Complexity</th><th>Multiplier</th></tr><tr><td>Simple (UI change)</td><td>1x</td></tr><tr><td>Medium (new feature)</td><td>1.5x</td></tr><tr><td>Complex (payment/integration)</td><td>2x</td></tr></table></li><li><strong>Add risk buffer:</strong> 15-20% for unknowns</li></ol><h4>3-Point Estimate</h4><pre><code>Estimate = (Optimistic + 4×MostLikely + Pessimistic) / 6\nExample = (8 + 4×12 + 20) / 6 = 12.7 hrs ≈ 13 hrs</code></pre>`},
{id:525,part:"K",level:"Senior",category:"Velocity",q:"How do you calculate and use team velocity for QA planning?",a:`<h4>QA Velocity Calculation</h4><pre><code>Sprint 1: 28 story points tested\nSprint 2: 32 story points tested\nSprint 3: 30 story points tested\n\nAverage Velocity = (28 + 32 + 30) / 3 = 30 pts/sprint\n\nNext Sprint Planning:\n- Team capacity: 4 QA engineers × 8 hrs × 10 days = 320 hrs\n- Minus meetings/overhead: 320 × 0.7 = 224 productive hrs\n- Can commit to ~30 story points</code></pre><h4>Velocity Factors</h4><table><tr><th>Factor</th><th>Impact</th></tr><tr><td>New team member</td><td>-20% for 2-3 sprints</td></tr><tr><td>Team member on leave</td><td>-25% per person</td></tr><tr><td>New technology/tool</td><td>-15% learning curve</td></tr><tr><td>Regression suite growing</td><td>-5-10% per quarter</td></tr><tr><td>Tech debt cleanup</td><td>-10-15% if allocated</td></tr></table>`},
{id:526,part:"K",level:"Senior",category:"Bandwidth",q:"How do you allocate QA bandwidth across multiple projects/modules?",a:`<h4>Bandwidth Allocation Framework</h4><table><tr><th>Activity</th><th>% of Sprint</th></tr><tr><td>Feature testing (new stories)</td><td>40%</td></tr><tr><td>Regression testing</td><td>20%</td></tr><tr><td>Automation development</td><td>20%</td></tr><tr><td>Bug verification + retesting</td><td>10%</td></tr><tr><td>Meetings + planning + reporting</td><td>10%</td></tr></table><h4>Multi-Project Allocation</h4><pre><code>Team: 5 QA Engineers\n\nProject A (critical release): 2.5 engineers (50%)\nProject B (maintenance):      1.5 engineers (30%)\nAutomation/Tech debt:          1 engineer   (20%)\n\nRotation: Swap every 2 sprints to avoid\nknowledge silos and burnout</code></pre><p><strong>Key rule:</strong> Never allocate a person across more than 2 projects — context switching kills productivity.</p>`},
{id:527,part:"K",level:"Senior",category:"Leadership",q:"How do you build and lead a high-performing QA team?",a:`<h4>QA Team Building Framework</h4><table><tr><th>Pillar</th><th>Actions</th></tr><tr><td><strong>Hire right</strong></td><td>Mix of automation + manual + domain experts</td></tr><tr><td><strong>Skill matrix</strong></td><td>Map each member's strengths, identify gaps</td></tr><tr><td><strong>Clear ownership</strong></td><td>Each module has a primary + backup QA</td></tr><tr><td><strong>Code reviews</strong></td><td>Peer review all automation code</td></tr><tr><td><strong>Knowledge sharing</strong></td><td>Weekly tech talks, pair testing sessions</td></tr><tr><td><strong>Career growth</strong></td><td>Individual development plans, certifications</td></tr><tr><td><strong>Psychological safety</strong></td><td>OK to report bad news early, ask questions</td></tr></table><h4>Team Structure (5-person team)</h4><pre><code>QA Lead (you)\n├── Senior QA (automation lead)\n├── QA Engineer (feature testing + automation)\n├── QA Engineer (API + DB testing)\n└── Junior QA (manual + learning automation)</code></pre>`},
{id:528,part:"K",level:"Senior",category:"Mentorship",q:"How do you mentor junior QA engineers? What's your approach?",a:`<h4>90-Day Mentorship Plan</h4><table><tr><th>Phase</th><th>Duration</th><th>Goals</th></tr><tr><td><strong>Onboarding</strong></td><td>Week 1-2</td><td>Product walkthrough, tool setup, read existing tests, shadow senior QA</td></tr><tr><td><strong>Guided work</strong></td><td>Week 3-6</td><td>Assign simple test cases, pair on automation, review their work daily</td></tr><tr><td><strong>Independent</strong></td><td>Week 7-10</td><td>Own a small module, write tests independently, review becomes weekly</td></tr><tr><td><strong>Contributing</strong></td><td>Week 11-12</td><td>Present at team meeting, suggest improvements, mentor newer members</td></tr></table><h4>Mentorship Techniques</h4><ul><li><strong>Pair testing:</strong> You explore together, share thinking process</li><li><strong>Code review:</strong> Review their first 20 PRs with detailed comments</li><li><strong>Bug triage:</strong> Walk through how you investigate a production issue</li><li><strong>Safe failures:</strong> Let them make mistakes in QA environment, debrief after</li><li><strong>Stretch goals:</strong> "Can you automate this tricky flow?" with support</li></ul>`},
{id:529,part:"K",level:"Senior",category:"Estimation",q:"How do you handle it when sprint scope changes mid-sprint? Impact on QA?",a:`<h4>Mid-Sprint Scope Change Protocol</h4><ol><li><strong>Assess impact immediately:</strong><pre><code>New story added: +8 hrs testing effort\nCurrent remaining capacity: 12 hrs\nNet: Possible but tight</code></pre></li><li><strong>Communicate trade-offs:</strong><table><tr><th>Option</th><th>Impact</th></tr><tr><td>Accept + reduce regression</td><td>Risk: bugs in existing features</td></tr><tr><td>Accept + drop a lower-priority story</td><td>Negotiate with PO</td></tr><tr><td>Accept + extend sprint by 1 day</td><td>Rarely recommended</td></tr><tr><td>Defer to next sprint</td><td>Safest for quality</td></tr></table></li><li><strong>Document the decision:</strong> Email/Slack with who decided what</li><li><strong>Update estimates:</strong> Adjust velocity tracking for retrospective</li></ol><p><strong>Golden rule:</strong> QA is the last line of defense. Never compromise test coverage silently — always raise the flag.</p>`},
{id:530,part:"K",level:"Senior",category:"Velocity",q:"How do you track and report QA metrics to stakeholders?",a:`<h4>QA Dashboard Metrics</h4><table><tr><th>Metric</th><th>Target</th><th>How to Track</th></tr><tr><td>Test case pass rate</td><td>>95%</td><td>TestNG reports</td></tr><tr><td>Automation coverage</td><td>>70% regression</td><td>Code coverage tools</td></tr><tr><td>Bug escape rate</td><td><2 per release</td><td>Prod incidents tagged by QA</td></tr><tr><td>Avg bug fix turnaround</td><td><2 days</td><td>JIRA workflow time</td></tr><tr><td>Test execution time</td><td><30 min (smoke)</td><td>CI/CD pipeline metrics</td></tr><tr><td>Flaky test rate</td><td><5%</td><td>CI failure analysis</td></tr><tr><td>Sprint velocity (QA)</td><td>Stable ±10%</td><td>JIRA story points</td></tr></table><h4>Reporting Cadence</h4><pre><code>Daily:   Test execution status in standup\nSprint:  QA summary in sprint review\nMonthly: Quality trends dashboard to leadership\nQuarterly: QA strategy + roadmap presentation</code></pre>`},
{id:531,part:"K",level:"Senior",category:"Leadership",q:"How do you handle conflicts between QA and development teams?",a:`<h4>Common QA-Dev Conflicts</h4><table><tr><th>Conflict</th><th>Resolution</th></tr><tr><td>"This is not a bug"</td><td>Show requirements doc, get PO to clarify</td></tr><tr><td>"Works on my machine"</td><td>Reproduce together, document environment diff</td></tr><tr><td>"No time to fix before release"</td><td>Risk assessment → PO decides priority</td></tr><tr><td>"Tests are too slow"</td><td>Optimize together, parallelize, share ownership</td></tr><tr><td>"Why wasn't this caught in QA?"</td><td>Blameless post-mortem, add test gap to backlog</td></tr></table><h4>Resolution Framework</h4><ol><li><strong>Data over opinions:</strong> Screenshots, logs, reproduction steps</li><li><strong>Shared goals:</strong> "We both want a quality product"</li><li><strong>Escalate with context:</strong> If blocked >1 day, involve lead/PM</li><li><strong>Retrospective:</strong> Discuss patterns, not individual incidents</li></ol>`},
{id:532,part:"K",level:"Senior",category:"Bandwidth",q:"How do you plan QA capacity for a release with hard deadlines?",a:`<h4>Release Planning — QA Capacity</h4><pre><code>Release Date: Dec 15\nFeatures: 8 stories (total 45 story points)\nQA Team: 3 engineers\n\nStep 1: Calculate available hours\n  3 engineers × 8 hrs × 20 working days = 480 hrs\n  Minus overhead (25%): 480 × 0.75 = 360 hrs\n\nStep 2: Estimate testing effort\n  Feature testing:   8 stories × 20 hrs = 160 hrs\n  Regression:        40 hrs\n  Bug verification:  30 hrs\n  Automation update: 40 hrs\n  UAT support:       20 hrs\n  Buffer (15%):      43 hrs\n  Total needed:      333 hrs\n\nStep 3: Compare\n  Available: 360 hrs | Needed: 333 hrs\n  Buffer: 27 hrs ✅ (safe to commit)\n\nStep 4: Risk plan\n  If 2 critical bugs found in week 3:\n  → De-scope 1 low-priority feature\n  → Or: borrow 1 QA from another team</code></pre>`},
{id:533,part:"K",level:"Senior",category:"Mentorship",q:"How do you create a skills matrix for your QA team?",a:`<h4>QA Team Skills Matrix</h4><table><tr><th>Skill</th><th>Boobala</th><th>Priya</th><th>Raj</th><th>Neha</th></tr><tr><td>Playwright</td><td>⭐⭐⭐</td><td>⭐⭐</td><td>⭐</td><td>⭐⭐⭐</td></tr><tr><td>REST Assured</td><td>⭐⭐⭐</td><td>⭐⭐⭐</td><td>⭐⭐</td><td>⭐</td></tr><tr><td>SQL/MongoDB</td><td>⭐⭐⭐</td><td>⭐</td><td>⭐⭐⭐</td><td>⭐⭐</td></tr><tr><td>CI/CD</td><td>⭐⭐⭐</td><td>⭐⭐</td><td>⭐⭐</td><td>⭐</td></tr><tr><td>Performance</td><td>⭐⭐</td><td>⭐</td><td>⭐⭐⭐</td><td>⭐</td></tr><tr><td>Security</td><td>⭐⭐</td><td>⭐</td><td>⭐</td><td>⭐⭐</td></tr><tr><td>Domain (Insurance)</td><td>⭐⭐⭐</td><td>⭐⭐⭐</td><td>⭐</td><td>⭐⭐</td></tr></table><p>⭐ = Basic | ⭐⭐ = Proficient | ⭐⭐⭐ = Expert</p><h4>Action Plan</h4><ul><li>Pair Raj (SQL expert) with Priya (SQL gap)</li><li>Neha to lead Playwright training for team</li><li>Raj needs domain onboarding → shadow Priya for 2 sprints</li></ul>`},
{id:534,part:"K",level:"Senior",category:"Leadership",q:"How do you ensure quality when the team is under time pressure?",a:`<h4>Quality Under Pressure — Risk-Based Approach</h4><table><tr><th>Time Available</th><th>Testing Strategy</th></tr><tr><td><strong>Full sprint</strong></td><td>Complete test execution + regression + exploratory</td></tr><tr><td><strong>50% less time</strong></td><td>Risk-based: test critical paths + smoke suite</td></tr><tr><td><strong>Emergency hotfix</strong></td><td>Fix verification + impacted smoke tests only</td></tr></table><h4>Priority Matrix</h4><pre><code>MUST test:  Payment, Login, Core business flow\nSHOULD test: Profile, Settings, Reports\nCOULD test: Help pages, Notifications, Analytics\nWON'T test: UI polish, Tooltips, Footer links</code></pre><h4>Communication</h4><p>Always send a <strong>"Test Coverage Note"</strong> before release:</p><pre><code>"Release v2.5 — QA Coverage:\n✅ Fully tested: Payment, Login, Member onboarding\n⚠️ Partially tested: Reports (only CSV export)\n❌ Not tested: Notification preferences\nRisk: Medium — Notifications had no code changes"</code></pre>`},
{id:535,part:"K",level:"Senior",category:"Estimation",q:"How do you estimate automation ROI and present it to management?",a:`<h4>Automation ROI Calculation</h4><pre><code>Manual regression: 3 engineers × 16 hrs × 2/month = 96 hrs/month\nAutomation cost:   1 engineer × 80 hrs (one-time build)\nAutomation run:    CI runs in 45 min, no manual effort\n\nBreakeven = Build Cost / Time Saved per Run\n         = 80 hrs / (96 hrs/month - 2 hrs maintenance)\n         = 80 / 94 ≈ 0.85 months\n\nYear 1 savings = (96 hrs × 12) - 80 - (2 × 12)\n              = 1152 - 80 - 24 = 1048 hrs saved\n              = 1048 × $30/hr = $31,440/year</code></pre><h4>Presentation to Leadership</h4><table><tr><th>Metric</th><th>Before</th><th>After</th></tr><tr><td>Regression time</td><td>2 days</td><td>45 minutes</td></tr><tr><td>Release frequency</td><td>Bi-weekly</td><td>Weekly</td></tr><tr><td>Bug escape rate</td><td>5 per release</td><td>1 per release</td></tr><tr><td>QA team utilization</td><td>60% manual regression</td><td>80% feature testing</td></tr></table>`},
{id:536,part:"K",level:"Senior",category:"Velocity",q:"How do you handle a consistently underperforming QA team member?",a:`<h4>Performance Improvement Framework</h4><ol><li><strong>Identify root cause (1-on-1):</strong><ul><li>Skill gap? → Training plan</li><li>Motivation? → Align to interests</li><li>Personal issues? → Support + flexibility</li><li>Wrong role? → Discuss career pivot</li></ul></li><li><strong>Set clear expectations:</strong><pre><code>PIP (Performance Improvement Plan):\n- Goal: Complete 3 test automation scripts per sprint\n- Current: 1 script per sprint\n- Support: Pair programming with senior QA\n- Timeline: 4 weeks\n- Check-ins: Weekly Friday 1-on-1</code></pre></li><li><strong>Document everything:</strong> Meeting notes, goals, feedback</li><li><strong>Review at 4 weeks:</strong> Improved → celebrate. Not improved → escalate to HR</li></ol><p><strong>Key:</strong> Be empathetic but honest. Late feedback is unfair to the person.</p>`},
{id:537,part:"K",level:"Senior",category:"Leadership",q:"How do you run effective sprint retrospectives for QA?",a:`<h4>QA Retro Format (60 min)</h4><table><tr><th>Phase</th><th>Duration</th><th>Activity</th></tr><tr><td>🟢 What went well</td><td>15 min</td><td>Each person shares 1-2 wins</td></tr><tr><td>🔴 What didn't go well</td><td>15 min</td><td>Pain points, blockers, missed bugs</td></tr><tr><td>🔵 Action items</td><td>20 min</td><td>Vote on top 3 → assign owners</td></tr><tr><td>📊 Metrics review</td><td>10 min</td><td>Velocity, bug escape, coverage trends</td></tr></table><h4>Example Action Items</h4><pre><code>Sprint 14 Retro Actions:\n1. [Boobala] Add API contract tests for Payment\n   service — caused 3 bugs this sprint\n2. [Priya] Create shared test data factory\n   to reduce setup time\n3. [Team] Start reviewing PRs within 4 hrs\n   (was averaging 12 hrs)</code></pre><p><strong>Rule:</strong> Max 3 action items per retro. Complete before creating new ones.</p>`},
{id:538,part:"K",level:"Senior",category:"Bandwidth",q:"How do you balance automation development vs feature testing?",a:`<h4>The 70/30 Rule</h4><pre><code>Sprint capacity: 320 hrs (4 engineers)\n\nAllocation:\n├── Feature testing:      224 hrs (70%)\n│   ├── New stories:      160 hrs\n│   ├── Bug verification:  32 hrs\n│   └── Exploratory:       32 hrs\n│\n└── Automation:            96 hrs (30%)\n    ├── New test scripts:  48 hrs\n    ├── Maintenance:       24 hrs\n    └── Framework improvements: 24 hrs</code></pre><h4>When to Shift Ratio</h4><table><tr><th>Situation</th><th>Feature</th><th>Automation</th></tr><tr><td>Major release (deadline)</td><td>85%</td><td>15%</td></tr><tr><td>Stable phase (maintenance)</td><td>50%</td><td>50%</td></tr><tr><td>New project kickoff</td><td>60%</td><td>40% (invest early)</td></tr><tr><td>Post-release stabilization</td><td>40%</td><td>60% (catch up)</td></tr></table>`},
{id:539,part:"K",level:"Senior",category:"Leadership",q:"How do you define a QA strategy for a new product from scratch?",a:`<h4>QA Strategy Document — Template</h4><pre><code>1. SCOPE\n   - Modules: Auth, Payments, Dashboard, Reports\n   - Platforms: Web (Chrome, Safari), Mobile (iOS, Android)\n   - Environments: Dev → QA → Staging → Prod\n\n2. TESTING TYPES\n   - Functional: Manual + Automated (Playwright)\n   - API: REST Assured + Postman\n   - Performance: k6 for API load testing\n   - Security: OWASP Top 10 checklist\n   - Visual: Applitools for UI regression\n\n3. AUTOMATION STRATEGY\n   - Phase 1 (Sprint 1-3): Smoke suite (20 tests)\n   - Phase 2 (Sprint 4-6): Regression suite (100 tests)\n   - Phase 3 (Sprint 7+): Full E2E (200+ tests)\n   - Framework: Java + TestNG + Playwright\n\n4. CI/CD INTEGRATION\n   - Smoke: On every PR merge\n   - Regression: Nightly\n   - Full suite: Before release\n\n5. TEAM & BANDWIDTH\n   - 3 QA engineers\n   - 1:3 QA-to-Dev ratio</code></pre>`},
{id:540,part:"K",level:"Senior",category:"Estimation",q:"How do you estimate effort for QA in an Agile sprint planning meeting?",a:`<h4>QA Story Point Estimation</h4><table><tr><th>Story Points</th><th>QA Effort</th><th>Example</th></tr><tr><td>1-2</td><td>2-4 hrs</td><td>Text change, config update</td></tr><tr><td>3-5</td><td>4-12 hrs</td><td>New form, API integration</td></tr><tr><td>8</td><td>12-20 hrs</td><td>New payment flow, complex feature</td></tr><tr><td>13+</td><td>20+ hrs</td><td>Full module, needs splitting</td></tr></table><h4>Sprint Planning Checklist for QA</h4><ol><li>Are acceptance criteria testable and clear?</li><li>Is test data available or do we need to create it?</li><li>Are there API dependencies (mocking needed)?</li><li>Does this need automation or is manual enough?</li><li>Is there regression risk to existing features?</li><li>Do we need performance/security testing?</li></ol><p><strong>Tip:</strong> If QA can't estimate a story, it's probably not refined enough. Push back.</p>`},
{id:541,part:"K",level:"Senior",category:"Mentorship",q:"How do you create a knowledge transfer plan when a QA member leaves?",a:`<h4>QA Knowledge Transfer — 2 Week Plan</h4><table><tr><th>Day</th><th>Activity</th><th>Output</th></tr><tr><td>1-2</td><td>Document all owned modules + test suites</td><td>Module ownership doc</td></tr><tr><td>3-4</td><td>Record walkthrough videos of complex flows</td><td>Loom/video library</td></tr><tr><td>5-6</td><td>Pair with replacement on daily tasks</td><td>Shadow notes</td></tr><tr><td>7-8</td><td>Hand over automation framework knowledge</td><td>Framework README</td></tr><tr><td>9-10</td><td>Transfer all access, credentials, test accounts</td><td>Access checklist</td></tr></table><h4>Documentation Checklist</h4><ul><li>Test environment setup guide</li><li>Test data creation process</li><li>Known issues + workarounds</li><li>Automation framework architecture</li><li>CI/CD pipeline configuration</li><li>Stakeholder contacts + escalation paths</li></ul>`},
{id:542,part:"K",level:"Senior",category:"Leadership",q:"How do you interview and hire QA engineers? What do you look for?",a:`<h4>QA Hiring Framework</h4><table><tr><th>Round</th><th>Duration</th><th>Focus</th></tr><tr><td>Resume screening</td><td>5 min</td><td>Relevant tools, projects, growth trajectory</td></tr><tr><td>Phone screen</td><td>30 min</td><td>Testing fundamentals, scenario-based thinking</td></tr><tr><td>Technical round</td><td>60 min</td><td>Live coding: write test for a given feature</td></tr><tr><td>System design</td><td>45 min</td><td>Design test strategy for a product</td></tr><tr><td>Culture fit</td><td>30 min</td><td>Collaboration, communication, learning mindset</td></tr></table><h4>Must-Have vs Nice-to-Have</h4><table><tr><th>Must-Have</th><th>Nice-to-Have</th></tr><tr><td>Testing fundamentals</td><td>Specific tool experience</td></tr><tr><td>Automation mindset</td><td>CI/CD expertise</td></tr><tr><td>Scenario-based thinking</td><td>Performance testing</td></tr><tr><td>Curiosity + attention to detail</td><td>Domain knowledge</td></tr><tr><td>Communication skills</td><td>Leadership experience</td></tr></table>`},
{id:543,part:"K",level:"Senior",category:"Velocity",q:"How do you handle scope creep in testing? What's your escalation path?",a:`<h4>Scope Creep Detection & Response</h4><table><tr><th>Signal</th><th>Response</th></tr><tr><td>"Can you also test this small change?"</td><td>Add to sprint only if capacity exists</td></tr><tr><td>Story acceptance criteria changed after QA started</td><td>Re-estimate, communicate delay</td></tr><tr><td>3 new bugs found blocking other testing</td><td>Prioritize with PO, defer lower-priority stories</td></tr><tr><td>Marketing wants to add a feature before release</td><td>Formal change request + impact analysis</td></tr></table><h4>Escalation Path</h4><pre><code>Level 1: Discuss with PO in daily standup\n         → "This new requirement adds 8 hrs"\n\nLevel 2: Sprint planning renegotiation\n         → "We need to drop Story X to fit this"\n\nLevel 3: Escalate to Engineering Manager\n         → "Quality will be compromised if we don't\n            extend timeline by 2 days"\n\nLevel 4: Release risk email to stakeholders\n         → Document what's tested vs not tested</code></pre>`},
{id:544,part:"K",level:"Senior",category:"Bandwidth",q:"How do you handle QA for multiple parallel releases?",a:`<h4>Parallel Release QA Strategy</h4><pre><code>Release A (v2.5) — Dec 1    | Release B (v3.0) — Dec 15\n─────────────────────────────┼─────────────────────────────\nFeature freeze: Nov 20       | Feature freeze: Dec 5\nQA: Priya + Raj (dedicated)  | QA: Neha + Boobala\nEnv: staging-a               | Env: staging-b\nBranch: release/2.5           | Branch: release/3.0\n─────────────────────────────┼─────────────────────────────\nRegression: Nov 25-28        | Regression: Dec 8-12\nSign-off: Nov 29             | Sign-off: Dec 13</code></pre><h4>Rules for Parallel Releases</h4><ol><li><strong>Dedicated QA per release:</strong> No context switching</li><li><strong>Separate environments:</strong> Independent deployments</li><li><strong>Shared regression suite:</strong> Automated, runs on both branches</li><li><strong>Daily sync:</strong> 15-min cross-release standup</li><li><strong>Merge conflicts:</strong> QA validates after release branch merges</li></ol>`},
{id:545,part:"K",level:"Senior",category:"Estimation",q:"How do you estimate QA effort for a complete product migration?",a:`<h4>Migration Testing Estimation</h4><pre><code>Migration Scope: Monolith → Microservices\n\nPhase 1: Test Planning (2 weeks)\n  - Map all existing test cases to new services\n  - Identify gaps: what's not covered\n  - Define acceptance criteria for migration\n\nPhase 2: Environment Setup (1 week)\n  - Configure test environments per service\n  - Setup test data migration scripts\n  - Configure CI/CD for each microservice\n\nPhase 3: Parallel Testing (4 weeks)\n  - Run same tests on old + new system\n  - Compare results: response parity check\n  - Performance benchmarking: new ≥ old\n\nPhase 4: Regression + Go-Live (2 weeks)\n  - Full regression on new system\n  - Canary deployment testing\n  - Rollback plan testing\n\nTotal QA effort: 9 weeks × 3 engineers = 27 person-weeks</code></pre>`},
{id:546,part:"K",level:"Senior",category:"Leadership",q:"How do you build a quality culture across the entire organization?",a:`<h4>Quality Culture Initiatives</h4><table><tr><th>Initiative</th><th>Who</th><th>Frequency</th></tr><tr><td><strong>Bug bash</strong></td><td>Entire team (devs + QA + PO)</td><td>Before major release</td></tr><tr><td><strong>Quality gate reviews</strong></td><td>QA Lead + Tech Lead</td><td>Every PR merge</td></tr><tr><td><strong>Shift-left testing</strong></td><td>Devs write unit tests</td><td>Every story</td></tr><tr><td><strong>Production monitoring</strong></td><td>QA + DevOps</td><td>Daily</td></tr><tr><td><strong>Blameless post-mortems</strong></td><td>Entire team</td><td>After every prod incident</td></tr><tr><td><strong>QA metrics dashboard</strong></td><td>QA Lead</td><td>Visible to all, always-on</td></tr></table><h4>Key Message to Team</h4><p><em>"Quality is not just QA's job. QA is quality's last line of defense, not its only one."</em></p>`},
{id:547,part:"K",level:"Senior",category:"Mentorship",q:"How do you create career growth paths for QA engineers?",a:`<h4>QA Career Ladder</h4><pre><code>Junior QA (0-2 yr)\n  → Write manual test cases\n  → Learn automation basics\n  → Execute regression\n\nQA Engineer (2-5 yr)\n  → Own module testing\n  → Write automation scripts\n  → API + DB testing\n\nSenior QA (5-8 yr)\n  → Design test architecture\n  → Mentor juniors\n  → Drive automation strategy\n\nQA Lead (8-12 yr)\n  → Team management\n  → Sprint planning\n  → Stakeholder communication\n\nQA Manager / Head of QA (12+ yr)\n  → Organization-wide quality strategy\n  → Hiring + budget\n  → Cross-team coordination</code></pre><h4>Growth Tracks</h4><table><tr><th>IC Track</th><th>Management Track</th></tr><tr><td>Staff QA Engineer</td><td>QA Manager</td></tr><tr><td>Principal QA Architect</td><td>Head of QA</td></tr><tr><td>Distinguished Engineer</td><td>VP Engineering</td></tr></table>`},
{id:548,part:"K",level:"Senior",category:"Velocity",q:"How do you measure individual QA productivity without micromanaging?",a:`<h4>QA Productivity Metrics (Team-Level)</h4><table><tr><th>Metric</th><th>What It Shows</th><th>⚠️ Don't Misuse</th></tr><tr><td>Stories tested per sprint</td><td>Throughput</td><td>Complexity varies</td></tr><tr><td>Automation scripts added</td><td>Automation growth</td><td>Quality > quantity</td></tr><tr><td>Bugs found vs escaped</td><td>Effectiveness</td><td>Not a competition</td></tr><tr><td>Test case reviews</td><td>Collaboration</td><td>Don't gate on count</td></tr><tr><td>Cycle time (story ready → QA signed off)</td><td>Speed</td><td>Depends on dev quality</td></tr></table><h4>Better Approach: OKRs</h4><pre><code>Quarterly OKR for each QA engineer:\n\nObjective: Improve checkout test reliability\nKR1: Reduce flaky tests from 12 to 3\nKR2: Add 15 new E2E tests for payment flow\nKR3: Zero critical bugs escaped to prod</code></pre><p><strong>Key:</strong> Measure outcomes (bugs escaped, quality), not activity (hours worked, tests written).</p>`},

// ═══════ MID LEVEL (5-7 yr) ═══════
{id:549,part:"K",level:"Mid",category:"Estimation",q:"How do you estimate testing time for a user story?",a:`<h4>Simple Estimation Template</h4><pre><code>User Story: "User can reset password via email"\n\nBreakdown:\n1. Understand requirements:     30 min\n2. Write test cases:            1 hr\n3. Test data setup:             30 min\n4. Functional testing:          2 hrs\n5. Cross-browser check:         1 hr\n6. Bug reporting + retest:      1 hr\n─────────────────────────────────────\nTotal estimate:                 6 hrs\nWith buffer (+20%):             ~7 hrs</code></pre><h4>Estimation Tips</h4><ul><li>Break every story into subtasks</li><li>Add 20% buffer for unknowns</li><li>Don't forget test data setup time</li><li>Account for bug verification cycles</li><li>Ask: "What can go wrong?" → add time for that</li></ul>`},
{id:550,part:"K",level:"Mid",category:"Velocity",q:"What is sprint velocity? How does QA use it?",a:`<h4>Sprint Velocity Explained</h4><pre><code>Sprint 1: Team completed 25 story points\nSprint 2: Team completed 30 story points\nSprint 3: Team completed 28 story points\n\nAverage velocity = (25 + 30 + 28) / 3 = 27.7 ≈ 28 pts</code></pre><table><tr><th></th><th>What</th><th>Why It Matters for QA</th></tr><tr><td>📊</td><td>Predictability</td><td>"We can test ~28 points per sprint"</td></tr><tr><td>📋</td><td>Planning</td><td>"Don't commit to 40 points if velocity is 28"</td></tr><tr><td>⚠️</td><td>Warning</td><td>Velocity dropping? Team is overloaded or has blockers</td></tr></table><p><strong>For QA:</strong> Track QA-specific velocity separately — how many points can your QA team test per sprint? Use this to flag capacity issues early.</p>`},
{id:551,part:"K",level:"Mid",category:"Bandwidth",q:"How do you prioritize what to test when you don't have enough time?",a:`<h4>Test Prioritization Matrix</h4><table><tr><th>Priority</th><th>What to Test</th><th>Example</th></tr><tr><td>🔴 P1 (Must)</td><td>Revenue-critical flows</td><td>Payment, Checkout, Login</td></tr><tr><td>🟡 P2 (Should)</td><td>Core features</td><td>Dashboard, Profile, Search</td></tr><tr><td>🔵 P3 (Could)</td><td>Supporting features</td><td>Settings, Notifications</td></tr><tr><td>⚪ P4 (Won't)</td><td>Low impact, no changes</td><td>Static pages, Footer</td></tr></table><h4>Quick Decision Framework</h4><pre><code>For each feature, ask:\n1. Was code changed? → Yes = test it\n2. Is it revenue-critical? → Yes = always test\n3. Has it had bugs before? → Yes = priority test\n4. Is it customer-facing? → Yes = higher priority\n5. Any of the above = No? → Skip this sprint</code></pre>`},
{id:552,part:"K",level:"Mid",category:"Basics",q:"What is the role of a QA Lead vs QA Engineer?",a:`<table><tr><th></th><th>QA Engineer</th><th>QA Lead</th></tr><tr><td>Focus</td><td>Testing features, writing automation</td><td>Planning, coordination, team management</td></tr><tr><td>Scope</td><td>1-2 modules</td><td>Entire product</td></tr><tr><td>Reports to</td><td>QA Lead</td><td>Engineering Manager</td></tr><tr><td>Sprint role</td><td>Execute test cases</td><td>Plan testing, assign work, report</td></tr><tr><td>Meetings</td><td>Standup, sprint planning</td><td>All of above + stakeholder, retro, release</td></tr><tr><td>Skills</td><td>Technical depth</td><td>Technical breadth + people skills</td></tr></table><h4>QA Lead Responsibilities</h4><ul><li>Sprint test planning + estimation</li><li>Test assignment based on skills</li><li>Blocker resolution + escalation</li><li>Quality metrics reporting</li><li>Team mentoring + growth</li><li>Release sign-off decision</li></ul>`},
{id:553,part:"K",level:"Mid",category:"Estimation",q:"What is story point estimation? How does QA participate?",a:`<h4>Story Points — QA Perspective</h4><table><tr><th>Points</th><th>Dev Effort</th><th>QA Consideration</th></tr><tr><td>1</td><td>Small config change</td><td>Quick smoke test, 1 hr</td></tr><tr><td>3</td><td>New API endpoint</td><td>API tests + integration, 4-6 hrs</td></tr><tr><td>5</td><td>New UI feature</td><td>Full E2E + cross-browser, 8-12 hrs</td></tr><tr><td>8</td><td>Complex feature</td><td>Multiple scenarios + regression, 16-20 hrs</td></tr><tr><td>13</td><td>Too large</td><td>Should be split into smaller stories</td></tr></table><h4>QA's Role in Estimation</h4><ol><li><strong>Challenge assumptions:</strong> "This looks like a 3, but the payment integration makes it a 5"</li><li><strong>Ask clarifying questions:</strong> "What happens when payment fails?"</li><li><strong>Raise test data needs:</strong> "We need 5 test accounts with different plans"</li><li><strong>Flag dependencies:</strong> "This needs API from Team B — when will it be ready?"</li></ol>`},
{id:554,part:"K",level:"Mid",category:"Basics",q:"How do you handle a situation where devs deploy without QA sign-off?",a:`<h4>Handling Bypass of QA</h4><ol><li><strong>Stay calm:</strong> Don't react emotionally in public channels</li><li><strong>Document:</strong> Note what was deployed, when, without QA verification</li><li><strong>Assess risk:</strong> Is it a minor copy change or a critical payment flow?</li><li><strong>Test immediately:</strong> Run smoke tests on the deployed changes</li><li><strong>Report:</strong> Send a factual summary to team lead:<pre><code>"FYI: v2.3.1 was deployed to production at 3 PM\nwithout QA verification.\nI've run smoke tests — 2 issues found:\n- Login button misaligned on mobile\n- API returns 500 for expired sessions"</code></pre></li><li><strong>Prevent recurrence:</strong> Propose CI/CD gate that requires QA approval</li></ol><p><strong>Key:</strong> Focus on process improvement, not blame.</p>`},
{id:555,part:"K",level:"Mid",category:"Bandwidth",q:"How do you manage your time as a QA engineer across multiple tasks?",a:`<h4>QA Time Management</h4><table><tr><th>Time Block</th><th>Activity</th></tr><tr><td><strong>9:00-9:30</strong></td><td>Check overnight CI results, failing tests</td></tr><tr><td><strong>9:30-10:00</strong></td><td>Daily standup</td></tr><tr><td><strong>10:00-12:00</strong></td><td>Deep work: feature testing or automation</td></tr><tr><td><strong>12:00-1:00</strong></td><td>Lunch break</td></tr><tr><td><strong>1:00-3:00</strong></td><td>Bug verification, retesting, PR reviews</td></tr><tr><td><strong>3:00-4:00</strong></td><td>Test case design for next sprint stories</td></tr><tr><td><strong>4:00-5:00</strong></td><td>Update test reports, respond to queries</td></tr></table><h4>Productivity Tips</h4><ul><li>Block 2-hr "deep work" slots for automation — no meetings</li><li>Batch bug verification — don't check one by one</li><li>Use templates for test reports and bug reports</li><li>Automate repetitive setup with scripts</li></ul>`},
{id:556,part:"K",level:"Mid",category:"Basics",q:"What is a QA test plan? What should it contain?",a:`<h4>Test Plan Template</h4><table><tr><th>Section</th><th>Content</th></tr><tr><td><strong>Objective</strong></td><td>What are we testing and why?</td></tr><tr><td><strong>Scope</strong></td><td>In-scope and out-of-scope features</td></tr><tr><td><strong>Test types</strong></td><td>Functional, regression, smoke, API, performance</td></tr><tr><td><strong>Environment</strong></td><td>QA server URL, browser versions, devices</td></tr><tr><td><strong>Test data</strong></td><td>Test accounts, sample data, API keys</td></tr><tr><td><strong>Entry criteria</strong></td><td>Dev complete, code reviewed, deployed to QA</td></tr><tr><td><strong>Exit criteria</strong></td><td>95% pass rate, 0 critical bugs, sign-off</td></tr><tr><td><strong>Schedule</strong></td><td>Start date, end date, milestones</td></tr><tr><td><strong>Risks</strong></td><td>Dependencies, resource constraints</td></tr><tr><td><strong>Sign-off</strong></td><td>QA Lead + PO approval required</td></tr></table>`},
{id:557,part:"K",level:"Mid",category:"Estimation",q:"How do you break down a large testing task into smaller estimates?",a:`<h4>Work Breakdown Example</h4><pre><code>Feature: "User can purchase insurance plan"\n\n1. Login/Auth testing          — 3 hrs\n2. Plan selection UI           — 4 hrs\n3. Member selection            — 3 hrs\n4. Payment flow (card)         — 6 hrs\n5. Payment flow (UPI)          — 4 hrs\n6. Confirmation/receipt page   — 2 hrs\n7. Email notification check    — 1 hr\n8. DB validation               — 2 hrs\n9. Negative scenarios          — 4 hrs\n10. Cross-browser (3 browsers) — 3 hrs\n────────────────────────────────────\nTotal: 32 hrs → ~4 days for 1 QA\n\nWith 2 QA (parallel): ~2.5 days\n+ Buffer (20%): 3 days</code></pre><p><strong>Tip:</strong> Always estimate at the scenario level, never at the feature level.</p>`},
{id:558,part:"K",level:"Mid",category:"Basics",q:"What is the difference between severity and priority in bugs?",a:`<table><tr><th></th><th>Severity</th><th>Priority</th></tr><tr><td>Definition</td><td>Impact on the system</td><td>Urgency to fix</td></tr><tr><td>Set by</td><td>QA / Tester</td><td>Product Owner / Manager</td></tr><tr><td>Based on</td><td>Technical impact</td><td>Business impact</td></tr></table><h4>Examples</h4><table><tr><th>Bug</th><th>Severity</th><th>Priority</th></tr><tr><td>Payment fails for all users</td><td>Critical</td><td>P1 (fix NOW)</td></tr><tr><td>Logo is wrong on landing page</td><td>Low</td><td>P1 (brand-critical for launch)</td></tr><tr><td>Admin report crashes</td><td>High</td><td>P3 (only 2 admins use it)</td></tr><tr><td>Typo on 404 page</td><td>Low</td><td>P4 (fix when free)</td></tr></table><p><strong>Key insight:</strong> High severity ≠ high priority. Business decides what to fix first.</p>`},
{id:559,part:"K",level:"Mid",category:"Velocity",q:"What should you include in a daily standup update as QA?",a:`<h4>QA Standup Template</h4><pre><code>Yesterday:\n- Completed testing for Story #234 (Login flow) — 2 bugs found\n- Automated 3 test cases for checkout regression\n\nToday:\n- Start testing Story #236 (Member onboarding)\n- Verify bug fixes from yesterday's findings\n\nBlockers:\n- Story #235 not yet deployed to QA environment\n- Need test account with admin role (asked DevOps)</code></pre><h4>Do's and Don'ts</h4><table><tr><th>Do ✅</th><th>Don't ❌</th></tr><tr><td>Mention specific story numbers</td><td>"I was testing stuff"</td></tr><tr><td>Report bugs found</td><td>Long technical details</td></tr><tr><td>Flag blockers early</td><td>Wait until sprint end</td></tr><tr><td>Keep it under 2 minutes</td><td>Give a lecture</td></tr></table>`},
{id:560,part:"K",level:"Mid",category:"Bandwidth",q:"How do you say 'no' to additional testing requests professionally?",a:`<h4>Professional Pushback Template</h4><pre><code>"I'd love to take this on, but here's the situation:\n\nCurrent sprint commitment:\n- 5 stories in testing (32 hrs remaining)\n- Regression suite to run Thursday\n\nNew request:\n- Additional 12 hrs of testing needed\n\nOptions:\n1. I can start this next sprint (recommended)\n2. I can do it now, but Story #240 will slip\n3. We can bring in [team member] to help\n\nWhich would you prefer?"</code></pre><h4>Key Principles</h4><ul><li>Never say just "no" — offer alternatives</li><li>Use data (hours, capacity) not emotions</li><li>Let the PO/Manager make the trade-off decision</li><li>Document the decision for transparency</li></ul>`},
{id:561,part:"K",level:"Mid",category:"Basics",q:"What is a release sign-off checklist for QA?",a:`<h4>QA Release Sign-Off Checklist</h4><table><tr><th>#</th><th>Check</th><th>Status</th></tr><tr><td>1</td><td>All test cases executed</td><td>✅ 98% executed</td></tr><tr><td>2</td><td>Pass rate ≥ 95%</td><td>✅ 96.5%</td></tr><tr><td>3</td><td>Zero critical bugs open</td><td>✅ 0 critical</td></tr><tr><td>4</td><td>Zero high bugs open</td><td>✅ 0 high</td></tr><tr><td>5</td><td>Regression suite passed</td><td>✅ All green</td></tr><tr><td>6</td><td>Smoke test on staging</td><td>✅ Passed</td></tr><tr><td>7</td><td>Performance benchmarks met</td><td>✅ p95 < 500ms</td></tr><tr><td>8</td><td>Known issues documented</td><td>✅ 2 low bugs deferred</td></tr><tr><td>9</td><td>Rollback plan tested</td><td>✅ Verified</td></tr><tr><td>10</td><td>QA Lead sign-off</td><td>✅ Signed</td></tr></table>`},
{id:562,part:"K",level:"Mid",category:"Estimation",q:"How do you track your testing progress during a sprint?",a:`<h4>Sprint Testing Progress Tracker</h4><table><tr><th>Story</th><th>Status</th><th>Test Cases</th><th>Bugs</th></tr><tr><td>#234 Login</td><td>✅ Done</td><td>12/12 passed</td><td>2 (fixed)</td></tr><tr><td>#235 Dashboard</td><td>🔄 In Progress</td><td>8/15 done</td><td>1 (open)</td></tr><tr><td>#236 Onboarding</td><td>⏳ Not Started</td><td>0/20</td><td>—</td></tr><tr><td>#237 Reports</td><td>🚫 Blocked</td><td>0/10</td><td>—</td></tr></table><h4>Daily Updates</h4><pre><code>Sprint Progress (Day 6 of 10):\n━━━━━━━━━━━━━━━━━━━━ 60%\n\nCompleted: 2/4 stories\nIn Progress: 1/4 stories\nBlocked: 1/4 (waiting for API from backend)\nBugs found: 5 (3 fixed, 2 open)\n\nRisk: Story #237 blocked → may slip to next sprint</code></pre>`},
{id:563,part:"K",level:"Mid",category:"Basics",q:"How do you write a test summary report after a sprint?",a:`<h4>Sprint Test Summary Report</h4><pre><code>Sprint 14 — QA Summary\n════════════════════════\n\n📊 Test Execution:\n  Total test cases: 57\n  Passed: 54 (94.7%)\n  Failed: 2 (3.5%)\n  Blocked: 1 (1.8%)\n\n🐛 Bugs:\n  Found: 8\n  Fixed & verified: 6\n  Open (deferred to Sprint 15): 2\n  Critical: 0 | High: 1 | Medium: 5 | Low: 2\n\n🤖 Automation:\n  New scripts added: 7\n  Total automated tests: 142\n  Regression suite: 100% pass\n\n📋 Stories Tested:\n  ✅ #234 Login — Signed off\n  ✅ #235 Dashboard — Signed off\n  ⚠️ #236 Onboarding — 1 high bug open\n  🚫 #237 Reports — Blocked (deferred)\n\n🎯 Release: CONDITIONAL GO\n  Condition: Fix high bug in #236</code></pre>`},
{id:564,part:"K",level:"Mid",category:"Velocity",q:"What is capacity planning for a QA team?",a:`<h4>QA Capacity Planning</h4><pre><code>Team: 3 QA Engineers\nSprint: 2 weeks (10 working days)\n\nStep 1: Calculate raw capacity\n  3 people × 8 hrs × 10 days = 240 hrs\n\nStep 2: Subtract non-productive time\n  Meetings: 3 × 5 hrs = 15 hrs\n  Breaks/admin: 3 × 3 hrs = 9 hrs\n  Planned leaves: 1 person × 2 days = 16 hrs\n  Total subtract: 40 hrs\n\nStep 3: Available capacity\n  240 - 40 = 200 hrs\n\nStep 4: Effective capacity (80% factor)\n  200 × 0.8 = 160 productive hrs\n\nStep 5: Allocate\n  Feature testing: 100 hrs (62%)\n  Automation:       30 hrs (19%)\n  Regression:       20 hrs (13%)\n  Buffer:           10 hrs (6%)</code></pre>`},
{id:565,part:"K",level:"Mid",category:"Bandwidth",q:"How do you onboard a new QA team member quickly?",a:`<h4>QA Onboarding — First 2 Weeks</h4><table><tr><th>Day</th><th>Activity</th></tr><tr><td><strong>Day 1</strong></td><td>Laptop setup, tool access, meet the team</td></tr><tr><td><strong>Day 2</strong></td><td>Product walkthrough (demo by senior QA)</td></tr><tr><td><strong>Day 3</strong></td><td>Read test documentation, explore test suite</td></tr><tr><td><strong>Day 4-5</strong></td><td>Set up local environment, run existing tests</td></tr><tr><td><strong>Day 6-7</strong></td><td>Pair test with buddy on a simple story</td></tr><tr><td><strong>Day 8-9</strong></td><td>Write first test case independently (with review)</td></tr><tr><td><strong>Day 10</strong></td><td>Attend sprint planning, ask questions</td></tr></table><h4>Onboarding Kit</h4><ul><li>Architecture diagram + tech stack overview</li><li>Test environment URLs + credentials</li><li>Automation framework README</li><li>Team norms: PR review process, coding standards</li><li>Buddy assignment (go-to person for questions)</li></ul>`},
{id:566,part:"K",level:"Mid",category:"Basics",q:"How do you communicate QA status to stakeholders?",a:`<h4>Stakeholder Communication</h4><table><tr><th>Audience</th><th>Format</th><th>Frequency</th><th>Content</th></tr><tr><td>Dev team</td><td>Slack + standup</td><td>Daily</td><td>Bugs found, blockers, progress</td></tr><tr><td>Product Owner</td><td>JIRA dashboard</td><td>2x/week</td><td>Story status, risk flags</td></tr><tr><td>Engineering Manager</td><td>Email/report</td><td>End of sprint</td><td>Test summary, metrics, risks</td></tr><tr><td>Leadership</td><td>Slide/dashboard</td><td>Monthly</td><td>Quality trends, ROI, KPIs</td></tr></table><h4>Red Flag Communication</h4><pre><code>Subject: ⚠️ Quality Risk — Sprint 14\n\n"2 stories are blocked by backend API.\nIf not unblocked by Wednesday,\nwe will miss testing for Thursday's release.\n\nOptions:\n1. Unblock API by Tuesday EOD\n2. Release without Stories #236 and #237\n\nAwaiting your decision."</code></pre>`},
{id:567,part:"K",level:"Mid",category:"Velocity",q:"What are JIRA workflows and statuses a QA should know?",a:`<h4>Typical JIRA Workflow for QA</h4><pre><code>Story Workflow:\nTo Do → In Dev → Code Review → Ready for QA\n  → In QA → QA Passed → Done\n  → QA Failed → Back to Dev\n\nBug Workflow:\nNew → Open → In Progress → Fixed\n  → Ready for Retest → Verified → Closed\n  → Reopen (if not fixed)</code></pre><table><tr><th>Status</th><th>QA Action</th></tr><tr><td>Ready for QA</td><td>Pick up and start testing</td></tr><tr><td>In QA</td><td>Currently testing</td></tr><tr><td>QA Passed</td><td>All test cases passed, ready for PO review</td></tr><tr><td>QA Failed</td><td>Bugs found, moved back to dev</td></tr><tr><td>Ready for Retest</td><td>Bug fixed, needs verification</td></tr><tr><td>Verified</td><td>Bug fix confirmed working</td></tr></table>`},
{id:568,part:"K",level:"Mid",category:"Estimation",q:"How do you handle unrealistic deadlines from management?",a:`<h4>Responding to Unrealistic Deadlines</h4><pre><code>Manager: "We need this tested by Friday"\nReality: You need 5 days, today is Wednesday\n\nResponse:\n"I understand the urgency. Here's the situation:\n\nFull testing needs: 40 hrs (5 days)\nAvailable time: 16 hrs (2 days)\n\nWhat I CAN do by Friday:\n✅ Smoke test all critical flows (4 hrs)\n✅ Test the 2 highest-risk stories (8 hrs)\n✅ Run automated regression (2 hrs)\n\nWhat will NOT be done by Friday:\n❌ Exploratory testing\n❌ Cross-browser testing\n❌ Performance validation\n\nRisk level: Medium\nRecommendation: Release with partial testing\nor extend by 2 days for full coverage."</code></pre><p><strong>Rule:</strong> Always present options with clear trade-offs. Let the decision-maker decide.</p>`}
);

{id:569,part:"L",level:"Senior",category:"Strategy",q:"How do you design a performance testing strategy from scratch?",a:`<h4>Performance Testing Strategy</h4><pre><code>1. DEFINE OBJECTIVES\n   - Response time SLA: p95 < 500ms\n   - Throughput: 1000 requests/sec\n   - Concurrent users: 5000\n   - Error rate: < 0.1%\n\n2. IDENTIFY SCENARIOS\n   - Login flow (auth + token)\n   - Search with filters\n   - Payment processing\n   - Report generation\n\n3. ENVIRONMENT\n   - Production-like staging\n   - Same DB size (anonymized data)\n   - Same infrastructure (or scaled)\n\n4. TOOL SELECTION\n   - API load: k6 or JMeter\n   - Browser: Lighthouse + WebPageTest\n   - APM: Datadog / New Relic\n\n5. TEST TYPES\n   - Smoke: 1-5 users (baseline)\n   - Load: Expected traffic\n   - Stress: 2-3x expected\n   - Spike: Sudden burst\n   - Soak: 4-8 hours sustained</code></pre>`},
{id:570,part:"L",level:"Senior",category:"Tools",q:"Compare JMeter vs k6 vs Gatling. When would you use each?",a:`<table><tr><th></th><th>JMeter</th><th>k6</th><th>Gatling</th></tr><tr><td><strong>Language</strong></td><td>GUI + XML</td><td>JavaScript</td><td>Scala/Java</td></tr><tr><td><strong>Protocol</strong></td><td>HTTP, JDBC, JMS, LDAP</td><td>HTTP, WebSocket, gRPC</td><td>HTTP, WebSocket</td></tr><tr><td><strong>CI/CD</strong></td><td>Good (CLI mode)</td><td>Excellent (native CLI)</td><td>Good (Maven/Gradle)</td></tr><tr><td><strong>Scripting</strong></td><td>GUI-heavy, complex</td><td>Developer-friendly JS</td><td>DSL-based</td></tr><tr><td><strong>Resource usage</strong></td><td>Heavy (JVM)</td><td>Light (Go binary)</td><td>Medium (JVM)</td></tr><tr><td><strong>Cloud</strong></td><td>BlazeMeter</td><td>Grafana Cloud k6</td><td>Gatling Enterprise</td></tr><tr><td><strong>Best for</strong></td><td>Protocol-level, legacy</td><td>Modern APIs, DevOps</td><td>Java/Scala teams</td></tr></table><p><strong>Recommendation:</strong> k6 for API-first teams, JMeter for complex protocols, Gatling for Java shops.</p>`},
{id:571,part:"L",level:"Senior",category:"Metrics",q:"What performance metrics should a Senior QA track and report?",a:`<h4>Key Performance Metrics</h4><table><tr><th>Metric</th><th>What It Measures</th><th>Target</th></tr><tr><td><strong>Response time (p50/p95/p99)</strong></td><td>User experience</td><td>p95 < 500ms</td></tr><tr><td><strong>Throughput (RPS)</strong></td><td>System capacity</td><td>Depends on SLA</td></tr><tr><td><strong>Error rate</strong></td><td>Reliability</td><td>< 0.1%</td></tr><tr><td><strong>Concurrent users</strong></td><td>Scalability</td><td>Peak × 2</td></tr><tr><td><strong>TTFB</strong></td><td>Server processing</td><td>< 200ms</td></tr><tr><td><strong>Apdex score</strong></td><td>User satisfaction</td><td>> 0.9</td></tr><tr><td><strong>CPU/Memory</strong></td><td>Resource utilization</td><td>< 70% under load</td></tr><tr><td><strong>DB query time</strong></td><td>Backend bottleneck</td><td>< 100ms avg</td></tr><tr><td><strong>GC pauses</strong></td><td>JVM health</td><td>< 200ms</td></tr></table>`},
{id:572,part:"L",level:"Senior",category:"Analysis",q:"How do you identify and resolve performance bottlenecks?",a:`<h4>Bottleneck Analysis Framework</h4><pre><code>Layer 1: NETWORK\n  Symptom: High TTFB, timeout errors\n  Tools: Wireshark, Chrome DevTools Network tab\n  Fix: CDN, compression, connection pooling\n\nLayer 2: APPLICATION\n  Symptom: High CPU, slow response\n  Tools: APM (Datadog, New Relic), profilers\n  Fix: Code optimization, caching, async processing\n\nLayer 3: DATABASE\n  Symptom: Slow queries, connection pool exhaustion\n  Tools: EXPLAIN ANALYZE, slow query log\n  Fix: Indexes, query optimization, read replicas\n\nLayer 4: INFRASTRUCTURE\n  Symptom: CPU/Memory saturation\n  Tools: Grafana, CloudWatch, Prometheus\n  Fix: Horizontal scaling, auto-scaling, resource limits</code></pre><h4>Process</h4><ol><li>Reproduce with load test</li><li>Identify slowest component (APM traces)</li><li>Drill into that layer</li><li>Fix → retest → compare metrics</li></ol>`},
{id:573,part:"L",level:"Senior",category:"Tools",q:"Write a k6 load test script for an API endpoint with SLA assertions.",a:`<pre><code>import http from 'k6/http';\nimport { check, sleep } from 'k6';\nimport { Rate, Trend } from 'k6/metrics';\n\nconst errorRate = new Rate('errors');\nconst responseTime = new Trend('response_time');\n\nexport const options = {\n  stages: [\n    { duration: '2m', target: 50 },   // Ramp up\n    { duration: '5m', target: 100 },  // Sustain\n    { duration: '2m', target: 200 },  // Stress\n    { duration: '1m', target: 0 },    // Ramp down\n  ],\n  thresholds: {\n    http_req_duration: ['p(95)<500', 'p(99)<1000'],\n    errors: ['rate<0.01'],\n    http_req_failed: ['rate<0.01'],\n  },\n};\n\nexport default function () {\n  const res = http.get('https://api.example.com/products', {\n    headers: { Authorization: 'Bearer token123' },\n  });\n\n  check(res, {\n    'status 200': (r) => r.status === 200,\n    'response < 500ms': (r) => r.timings.duration < 500,\n    'body has data': (r) => r.json().length > 0,\n  });\n\n  errorRate.add(res.status !== 200);\n  responseTime.add(res.timings.duration);\n  sleep(1);\n}</code></pre>`},
{id:574,part:"L",level:"Senior",category:"Strategy",q:"Explain load testing vs stress testing vs spike testing vs soak testing.",a:`<table><tr><th>Type</th><th>Purpose</th><th>Load Pattern</th><th>Duration</th></tr><tr><td><strong>Load</strong></td><td>Validate expected traffic</td><td>Gradual ramp to target</td><td>30-60 min</td></tr><tr><td><strong>Stress</strong></td><td>Find breaking point</td><td>Ramp beyond capacity</td><td>Until failure</td></tr><tr><td><strong>Spike</strong></td><td>Test sudden burst</td><td>0 → max → 0 instantly</td><td>5-10 min</td></tr><tr><td><strong>Soak/Endurance</strong></td><td>Find memory leaks</td><td>Steady moderate load</td><td>4-24 hours</td></tr><tr><td><strong>Breakpoint</strong></td><td>Find max capacity</td><td>Incremental increase</td><td>Until SLA breach</td></tr><tr><td><strong>Scalability</strong></td><td>Test auto-scaling</td><td>Step-up pattern</td><td>1-2 hours</td></tr></table><h4>When to Use Each</h4><pre><code>Before release:     Load + Stress\nFlash sale/launch:  Spike\nMemory leak suspect: Soak\nCapacity planning:  Breakpoint + Scalability</code></pre>`},
{id:575,part:"L",level:"Senior",category:"Metrics",q:"What is Apdex score? How do you calculate and interpret it?",a:`<h4>Apdex (Application Performance Index)</h4><pre><code>Apdex = (Satisfied + Tolerating/2) / Total\n\nThreshold (T) = 500ms\n\nSatisfied:  response < T (< 500ms)\nTolerating: response < 4T (< 2000ms)\nFrustrated: response > 4T (> 2000ms)\n\nExample:\n  1000 requests total\n  800 satisfied (< 500ms)\n  150 tolerating (500ms-2s)\n  50 frustrated (> 2s)\n\n  Apdex = (800 + 150/2) / 1000\n        = (800 + 75) / 1000\n        = 0.875</code></pre><table><tr><th>Apdex Score</th><th>Rating</th></tr><tr><td>0.94 - 1.0</td><td>Excellent</td></tr><tr><td>0.85 - 0.93</td><td>Good</td></tr><tr><td>0.70 - 0.84</td><td>Fair</td></tr><tr><td>0.50 - 0.69</td><td>Poor</td></tr><tr><td>< 0.50</td><td>Unacceptable</td></tr></table>`},
{id:576,part:"L",level:"Senior",category:"Analysis",q:"How do you performance test a database-heavy application?",a:`<h4>Database Performance Testing</h4><pre><code>1. IDENTIFY HEAVY QUERIES\n   SELECT * FROM slow_log\n   WHERE query_time > 1;\n\n2. EXPLAIN ANALYZE\n   EXPLAIN ANALYZE\n   SELECT o.*, p.name\n   FROM orders o\n   JOIN products p ON o.product_id = p.id\n   WHERE o.created_at > '2025-01-01';\n\n3. CONNECTION POOL TEST\n   - Start with 20 connections\n   - Ramp to 100, then 200\n   - Monitor: pool exhaustion, wait time\n\n4. INDEX EFFECTIVENESS\n   - Run queries with/without indexes\n   - Compare: full scan vs index scan\n\n5. CONCURRENT WRITE TEST\n   - 100 concurrent inserts\n   - Check: deadlocks, lock wait time\n   - Monitor: replication lag</code></pre><table><tr><th>Metric</th><th>Target</th></tr><tr><td>Query time (p95)</td><td>< 100ms</td></tr><tr><td>Connection pool usage</td><td>< 80%</td></tr><tr><td>Lock wait time</td><td>< 50ms</td></tr><tr><td>Replication lag</td><td>< 1 second</td></tr></table>`},
{id:577,part:"L",level:"Senior",category:"Strategy",q:"How do you integrate performance testing into CI/CD pipelines?",a:`<h4>CI/CD Performance Testing Pipeline</h4><pre><code>name: Performance Tests\non:\n  pull_request:\n    branches: [main]\n  schedule:\n    - cron: '0 2 * * *'  # Nightly\n\njobs:\n  smoke-perf:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Run k6 smoke test\n        uses: grafana/k6-action@v0.3\n        with:\n          filename: tests/perf/smoke.js\n          flags: --out json=results.json\n      - name: Check thresholds\n        run: |\n          if grep -q '"fail":1' results.json; then\n            echo "Performance thresholds FAILED"\n            exit 1\n          fi\n      - name: Upload results\n        uses: actions/upload-artifact@v4\n        with:\n          name: perf-results\n          path: results.json</code></pre><h4>Testing Levels</h4><table><tr><th>Trigger</th><th>Test Type</th><th>Duration</th></tr><tr><td>PR merge</td><td>Smoke (5 users)</td><td>2 min</td></tr><tr><td>Nightly</td><td>Load (100 users)</td><td>30 min</td></tr><tr><td>Pre-release</td><td>Stress + Soak</td><td>4+ hours</td></tr></table>`},
{id:578,part:"L",level:"Senior",category:"Tools",q:"How do you use JMeter for API load testing? Key components?",a:`<h4>JMeter Test Plan Components</h4><pre><code>Test Plan\n├── Thread Group\n│   ├── Threads: 100 (concurrent users)\n│   ├── Ramp-up: 60 seconds\n│   └── Loop count: 10\n├── HTTP Request Defaults\n│   └── Server: api.onsurity.com\n├── HTTP Header Manager\n│   └── Authorization: Bearer $\\{token}\n├── HTTP Request (Login)\n│   ├── POST /api/auth/login\n│   └── JSON Extractor → token\n├── HTTP Request (Get Plans)\n│   └── GET /api/plans\n├── Assertions\n│   ├── Response Code: 200\n│   ├── Duration: < 500ms\n│   └── JSON Path: $.data.length > 0\n├── Listeners\n│   ├── Summary Report\n│   ├── Aggregate Report\n│   └── Response Time Graph\n└── CSV Data Set Config\n    └── users.csv (test credentials)</code></pre><p><strong>CLI mode for CI:</strong> <code>jmeter -n -t test.jmx -l results.jtl -e -o report/</code></p>`},
{id:579,part:"L",level:"Senior",category:"Analysis",q:"How do you analyze response time percentiles (p50, p95, p99)?",a:`<h4>Percentile Analysis</h4><pre><code>1000 requests sorted by response time:\n\np50 (median): 500th request  = 120ms\np90:          900th request  = 350ms\np95:          950th request  = 480ms\np99:          990th request  = 1200ms\nMax:          1000th request = 5000ms</code></pre><h4>Why Percentiles Matter</h4><table><tr><th>Metric</th><th>Shows</th><th>Use For</th></tr><tr><td>Average</td><td>Misleading (hides outliers)</td><td>Rough baseline only</td></tr><tr><td>p50 (median)</td><td>Typical user experience</td><td>General health check</td></tr><tr><td>p95</td><td>Worst case for 95% of users</td><td>SLA definition</td></tr><tr><td>p99</td><td>Tail latency (edge cases)</td><td>Infrastructure issues</td></tr></table><p><strong>Rule:</strong> Always report p95 and p99. If p99 is 10x p50, you have a tail latency problem (usually GC pauses, DB locks, or cold cache).</p>`},
{id:580,part:"L",level:"Senior",category:"Strategy",q:"How do you establish performance baselines and SLAs?",a:`<h4>Baseline Process</h4><pre><code>Step 1: Run baseline test (current production traffic)\n  - 50 concurrent users, 30 min\n  - Record all metrics\n\nStep 2: Document baseline\n  API          p50    p95    p99    RPS\n  GET /plans   85ms   180ms  350ms  200\n  POST /login  120ms  250ms  500ms  100\n  GET /claims  200ms  450ms  900ms  50\n\nStep 3: Define SLAs (with business)\n  - p95 response time < 500ms\n  - Availability: 99.9% (8.7 hrs downtime/yr)\n  - Error rate: < 0.1%\n  - Throughput: > 500 RPS\n\nStep 4: Alert thresholds\n  WARNING: p95 > 400ms (80% of SLA)\n  CRITICAL: p95 > 500ms (SLA breach)\n\nStep 5: Review quarterly\n  - Compare current vs baseline\n  - Update SLAs if business grows</code></pre>`},
{id:581,part:"L",level:"Senior",category:"Metrics",q:"What is Little's Law and how does it apply to performance testing?",a:`<h4>Little's Law</h4><pre><code>L = λ × W\n\nL = Number of requests in system (concurrency)\nλ = Arrival rate (requests per second)\nW = Average response time (seconds)\n\nExample:\n  λ = 100 requests/sec\n  W = 0.5 sec (500ms avg response)\n  L = 100 × 0.5 = 50 concurrent requests\n\nPlanning:\n  "We expect 200 RPS with 300ms response time"\n  L = 200 × 0.3 = 60 concurrent connections\n  → Need connection pool ≥ 60\n  → Thread pool ≥ 60\n  → DB connections ≥ 60</code></pre><p><strong>Use in QA:</strong> Calculate required infrastructure from expected traffic. If actual concurrency exceeds calculated L, either response time will increase or requests will queue.</p>`},
{id:582,part:"L",level:"Senior",category:"Analysis",q:"How do you test the performance impact of a new feature before release?",a:`<h4>A/B Performance Testing</h4><pre><code>1. BASELINE (before feature)\n   Run load test → record metrics\n   p95: 180ms | RPS: 500 | CPU: 45%\n\n2. FEATURE BRANCH (after feature)\n   Deploy to perf environment\n   Run same load test → record metrics\n   p95: 220ms | RPS: 480 | CPU: 52%\n\n3. COMPARE\n   p95 delta: +40ms (+22%) ⚠️\n   RPS delta: -20 (-4%)\n   CPU delta: +7%\n\n4. DECISION MATRIX\n   Delta < 10%:  ✅ Auto-approve\n   Delta 10-25%: ⚠️ Review with team\n   Delta > 25%:  ❌ Block release\n\n5. REPORT\n   "Feature X increases p95 by 22%.\n    Root cause: New DB query without index.\n    Fix: Add composite index on (user_id, date).\n    After fix: p95 delta drops to +5%"</code></pre>`},
{id:583,part:"L",level:"Senior",category:"Tools",q:"How do you monitor application performance in production? APM tools?",a:`<h4>APM Tool Comparison</h4><table><tr><th>Tool</th><th>Strengths</th><th>Best For</th></tr><tr><td><strong>Datadog</strong></td><td>Full stack, AI alerts, distributed traces</td><td>Enterprise, microservices</td></tr><tr><td><strong>New Relic</strong></td><td>Auto-instrumentation, free tier</td><td>Startups, full-stack monitoring</td></tr><tr><td><strong>Grafana + Prometheus</strong></td><td>Open source, customizable dashboards</td><td>Cost-conscious, Kubernetes</td></tr><tr><td><strong>Dynatrace</strong></td><td>AI-powered root cause, auto-discovery</td><td>Large enterprise</td></tr><tr><td><strong>Elastic APM</strong></td><td>Integrates with ELK stack</td><td>Teams already using Elasticsearch</td></tr></table><h4>Key Dashboards</h4><pre><code>1. Service health:  RPS, error rate, latency\n2. Infrastructure:  CPU, memory, disk I/O\n3. Database:        Query time, connections, slow queries\n4. User experience: Apdex, page load, Core Web Vitals\n5. Alerts:          PagerDuty/Slack integration</code></pre>`},
// Mid Level
{id:584,part:"L",level:"Mid",category:"Basics",q:"What is performance testing? Why is it important?",a:`<h4>Performance Testing Overview</h4><table><tr><th>Aspect</th><th>Description</th></tr><tr><td><strong>What</strong></td><td>Testing how a system performs under expected and peak load</td></tr><tr><td><strong>Why</strong></td><td>Prevent crashes, slow pages, and bad user experience</td></tr><tr><td><strong>When</strong></td><td>Before major releases, after infrastructure changes</td></tr><tr><td><strong>Who</strong></td><td>QA + DevOps collaboration</td></tr></table><h4>Real-World Impact</h4><pre><code>Amazon: 100ms delay = 1% revenue loss\nGoogle: 500ms delay = 20% fewer searches\nWalmart: 1 second improvement = 2% more conversions</code></pre>`},
{id:585,part:"L",level:"Mid",category:"Basics",q:"What are the different types of performance testing?",a:`<table><tr><th>Type</th><th>What You Do</th><th>Example</th></tr><tr><td><strong>Load</strong></td><td>Test with expected users</td><td>100 users browsing products</td></tr><tr><td><strong>Stress</strong></td><td>Push beyond limits</td><td>500 users until system breaks</td></tr><tr><td><strong>Spike</strong></td><td>Sudden traffic burst</td><td>0 → 1000 users in 10 seconds</td></tr><tr><td><strong>Soak</strong></td><td>Sustained load for hours</td><td>50 users for 8 hours</td></tr><tr><td><strong>Volume</strong></td><td>Large data amounts</td><td>Import 1 million records</td></tr><tr><td><strong>Scalability</strong></td><td>Test auto-scaling</td><td>Gradually increase from 10 to 1000 users</td></tr></table>`},
{id:586,part:"L",level:"Mid",category:"Basics",q:"What is response time, throughput, and concurrent users?",a:`<table><tr><th>Metric</th><th>Definition</th><th>Example</th></tr><tr><td><strong>Response time</strong></td><td>Time from request to response</td><td>Login takes 200ms</td></tr><tr><td><strong>Throughput</strong></td><td>Requests processed per second (RPS)</td><td>Server handles 500 RPS</td></tr><tr><td><strong>Concurrent users</strong></td><td>Users active at the same time</td><td>200 users browsing simultaneously</td></tr><tr><td><strong>Latency</strong></td><td>Network delay before response starts</td><td>50ms before first byte</td></tr><tr><td><strong>TTFB</strong></td><td>Time to First Byte</td><td>Server starts responding in 100ms</td></tr></table><h4>Relationship</h4><pre><code>If response time increases → throughput decreases\nIf concurrent users increase → response time increases\nGoal: Keep response time low as users scale up</code></pre>`},
{id:587,part:"L",level:"Mid",category:"Tools",q:"What is JMeter? How do you create a basic load test?",a:`<h4>JMeter Basics</h4><pre><code>Step 1: Create Test Plan\n  → Add Thread Group\n     - Threads (users): 50\n     - Ramp-up period: 30 seconds\n     - Loop count: 5\n\nStep 2: Add HTTP Request\n  → Server: api.onsurity.com\n  → Method: GET\n  → Path: /api/plans\n\nStep 3: Add Assertions\n  → Response Code: 200\n  → Duration Assertion: < 500ms\n\nStep 4: Add Listeners\n  → View Results Tree (debugging)\n  → Summary Report (final results)\n  → Aggregate Report (percentiles)\n\nStep 5: Run\n  → Click green play button\n  → Watch results in real-time</code></pre><p><strong>Tip:</strong> Always use CLI mode for actual tests: <code>jmeter -n -t test.jmx -l results.csv</code></p>`},
{id:588,part:"L",level:"Mid",category:"Tools",q:"What is k6? How is it different from JMeter?",a:`<table><tr><th></th><th>k6</th><th>JMeter</th></tr><tr><td>Language</td><td>JavaScript</td><td>GUI (XML)</td></tr><tr><td>Learning curve</td><td>Easy for developers</td><td>Easy for non-coders</td></tr><tr><td>Resource usage</td><td>Very lightweight</td><td>Heavy (needs lots of RAM)</td></tr><tr><td>CI/CD</td><td>Native (CLI-first)</td><td>Possible (CLI mode)</td></tr><tr><td>Protocol</td><td>HTTP, WS, gRPC</td><td>HTTP, JDBC, FTP, JMS</td></tr><tr><td>Cost</td><td>Free + cloud option</td><td>Free</td></tr></table><h4>Simple k6 Script</h4><pre><code>import http from 'k6/http';\nimport { check } from 'k6';\n\nexport const options = {\n  vus: 50,\n  duration: '2m',\n};\n\nexport default function () {\n  const res = http.get('https://api.example.com/products');\n  check(res, { 'status 200': (r) => r.status === 200 });\n}</code></pre>`},
{id:589,part:"L",level:"Mid",category:"Basics",q:"What are performance testing SLAs? Give examples.",a:`<h4>Common SLAs</h4><table><tr><th>Metric</th><th>SLA</th><th>Measurement</th></tr><tr><td>Page load time</td><td>< 3 seconds</td><td>Lighthouse, WebPageTest</td></tr><tr><td>API response time</td><td>p95 < 500ms</td><td>k6, JMeter</td></tr><tr><td>Availability</td><td>99.9% uptime</td><td>Monitoring (Datadog)</td></tr><tr><td>Error rate</td><td>< 0.1%</td><td>APM tools</td></tr><tr><td>Throughput</td><td>> 500 RPS</td><td>Load testing tools</td></tr></table><h4>Availability in Real Numbers</h4><pre><code>99%    = 3.65 days downtime/year\n99.9%  = 8.7 hours downtime/year\n99.95% = 4.4 hours downtime/year\n99.99% = 52 minutes downtime/year</code></pre>`},
{id:590,part:"L",level:"Mid",category:"Analysis",q:"What is a performance test report? What should it include?",a:`<h4>Performance Test Report Template</h4><pre><code>Performance Test Report — Sprint 14\n═══════════════════════════════════\n\nTest Configuration:\n  Tool: k6 v0.47\n  Environment: staging.onsurity.com\n  Duration: 30 minutes\n  Virtual Users: 100 (ramped)\n\nResults Summary:\n  ┌────────────┬────────┬────────┬────────┐\n  │ Endpoint   │ p50    │ p95    │ p99    │\n  ├────────────┼────────┼────────┼────────┤\n  │ GET /plans │ 85ms   │ 180ms  │ 350ms  │\n  │ POST /login│ 120ms  │ 250ms  │ 500ms  │\n  │ GET /claims│ 200ms  │ 450ms  │ 900ms ⚠│\n  └────────────┴────────┴────────┴────────┘\n\n  Total requests: 45,000\n  Error rate: 0.02%\n  Throughput: 500 RPS\n\nIssues Found:\n  ⚠ GET /claims p99 (900ms) exceeds SLA (500ms)\n  Root cause: Missing index on claims.user_id\n\nRecommendation: Add index before release</code></pre>`},
{id:591,part:"L",level:"Mid",category:"Basics",q:"What is the difference between client-side and server-side performance?",a:`<table><tr><th></th><th>Client-Side</th><th>Server-Side</th></tr><tr><td>Where</td><td>Browser/Device</td><td>Server/Backend</td></tr><tr><td>Measures</td><td>Page load, rendering, JS execution</td><td>API response, DB queries, processing</td></tr><tr><td>Tools</td><td>Lighthouse, Chrome DevTools, WebPageTest</td><td>JMeter, k6, APM</td></tr><tr><td>Metrics</td><td>FCP, LCP, CLS, TTI</td><td>TTFB, p95 response time, RPS</td></tr><tr><td>Optimizations</td><td>Minify JS/CSS, lazy load, image optimization</td><td>Caching, query optimization, scaling</td></tr></table><h4>Core Web Vitals</h4><pre><code>LCP (Largest Contentful Paint): < 2.5s\nFID (First Input Delay):        < 100ms\nCLS (Cumulative Layout Shift):  < 0.1\nINP (Interaction to Next Paint): < 200ms</code></pre>`},
{id:592,part:"L",level:"Mid",category:"Tools",q:"How do you use Chrome DevTools for performance analysis?",a:`<h4>Chrome DevTools Performance Steps</h4><ol><li><strong>Network tab:</strong> Check request waterfall, slow resources</li><li><strong>Performance tab:</strong> Record page load, analyze flame chart</li><li><strong>Lighthouse:</strong> Run audit for Performance score</li></ol><h4>Key Things to Check</h4><table><tr><th>Check</th><th>Where</th><th>Action</th></tr><tr><td>Slow API calls</td><td>Network tab → sort by time</td><td>Optimize backend</td></tr><tr><td>Large images</td><td>Network tab → filter Img</td><td>Compress, use WebP</td></tr><tr><td>Render blocking CSS</td><td>Performance → Main thread</td><td>Defer/async load</td></tr><tr><td>Memory leaks</td><td>Memory tab → Heap snapshot</td><td>Fix detached DOM nodes</td></tr><tr><td>Layout shifts</td><td>Performance → Experience</td><td>Set image dimensions</td></tr></table>`},
{id:593,part:"L",level:"Mid",category:"Analysis",q:"What causes slow page load times? How do you diagnose?",a:`<h4>Common Causes of Slow Pages</h4><table><tr><th>Cause</th><th>Impact</th><th>Fix</th></tr><tr><td>Large images</td><td>Slow download</td><td>Compress, lazy load, use CDN</td></tr><tr><td>Too many HTTP requests</td><td>Network congestion</td><td>Bundle files, use HTTP/2</td></tr><tr><td>Unoptimized JS</td><td>Main thread blocking</td><td>Code split, tree shake, defer</td></tr><tr><td>No caching</td><td>Re-download every visit</td><td>Set Cache-Control headers</td></tr><tr><td>Slow API responses</td><td>Waiting for data</td><td>Backend optimization</td></tr><tr><td>No CDN</td><td>High latency for distant users</td><td>CloudFront, Cloudflare</td></tr><tr><td>Render-blocking CSS</td><td>Delayed first paint</td><td>Inline critical CSS</td></tr></table>`},
{id:594,part:"L",level:"Mid",category:"Basics",q:"What is caching? How does it improve performance?",a:`<h4>Caching Layers</h4><pre><code>User → Browser Cache → CDN Cache → App Cache → DB Cache → Database\n       (fastest)                                       (slowest)</code></pre><table><tr><th>Cache Type</th><th>Where</th><th>Example</th></tr><tr><td>Browser</td><td>User's browser</td><td>Cache-Control: max-age=3600</td></tr><tr><td>CDN</td><td>Edge servers worldwide</td><td>CloudFront caches static files</td></tr><tr><td>Application</td><td>App server memory</td><td>Redis caches user sessions</td></tr><tr><td>Database</td><td>DB query cache</td><td>MySQL query cache</td></tr></table><h4>Cache Headers</h4><pre><code>Cache-Control: public, max-age=86400\n→ Browser caches for 24 hours\n\nCache-Control: no-cache\n→ Must revalidate with server\n\nCache-Control: no-store\n→ Never cache (sensitive data)</code></pre>`},
{id:595,part:"L",level:"Mid",category:"Analysis",q:"How do you identify if a performance issue is in the frontend or backend?",a:`<h4>Frontend vs Backend Diagnosis</h4><pre><code>Step 1: Open Chrome DevTools → Network tab\nStep 2: Load the page\nStep 3: Check the API call:\n\n  TTFB (Time to First Byte): 2000ms ← Backend!\n  Content Download: 50ms ← Network OK\n  DOM Processing: 100ms ← Frontend OK\n\n  If TTFB is high → Backend issue\n  If Download is high → Large response/Network\n  If DOM Processing is high → Frontend issue</code></pre><table><tr><th>Symptom</th><th>Likely Cause</th><th>Check</th></tr><tr><td>TTFB > 1 second</td><td>Backend (slow query, no cache)</td><td>APM, slow query log</td></tr><tr><td>Large bundle size</td><td>Frontend (unoptimized JS)</td><td>Webpack analyzer</td></tr><tr><td>Many HTTP requests</td><td>Frontend (not bundled)</td><td>Network waterfall</td></tr><tr><td>High CPU on page</td><td>Frontend (JS execution)</td><td>Performance tab</td></tr></table>`},
{id:596,part:"L",level:"Mid",category:"Tools",q:"What is Lighthouse? How do you use it for performance testing?",a:`<h4>Lighthouse Performance Audit</h4><pre><code>How to run:\n1. Chrome DevTools → Lighthouse tab\n2. Select: Performance, Accessibility\n3. Click "Analyze page load"\n\nOR via CLI:\nnpx lighthouse https://onsurity.com --output html\n  --output-path report.html</code></pre><h4>Lighthouse Metrics</h4><table><tr><th>Metric</th><th>Good</th><th>Needs Work</th><th>Poor</th></tr><tr><td>FCP (First Contentful Paint)</td><td>< 1.8s</td><td>1.8-3s</td><td>> 3s</td></tr><tr><td>LCP (Largest Contentful Paint)</td><td>< 2.5s</td><td>2.5-4s</td><td>> 4s</td></tr><tr><td>TBT (Total Blocking Time)</td><td>< 200ms</td><td>200-600ms</td><td>> 600ms</td></tr><tr><td>CLS (Cumulative Layout Shift)</td><td>< 0.1</td><td>0.1-0.25</td><td>> 0.25</td></tr><tr><td>Speed Index</td><td>< 3.4s</td><td>3.4-5.8s</td><td>> 5.8s</td></tr></table>`},
{id:597,part:"L",level:"Mid",category:"Basics",q:"What is a performance budget? How do you set one?",a:`<h4>Performance Budget</h4><pre><code>Performance Budget for onsurity.com:\n\n Page Weight:\n   Total: < 2 MB\n   JavaScript: < 300 KB\n   CSS: < 100 KB\n   Images: < 1 MB\n   Fonts: < 100 KB\n\n Timing:\n   FCP: < 1.5 seconds\n   LCP: < 2.5 seconds\n   TTI: < 3.5 seconds\n\n Requests:\n   Total: < 50 HTTP requests\n   Third-party: < 10\n\n Lighthouse:\n   Performance score: > 90</code></pre><h4>Enforcing Budgets</h4><ul><li>Webpack Bundle Analyzer for JS size</li><li>Lighthouse CI in GitHub Actions</li><li>Image optimization in build pipeline</li></ul>`},
{id:598,part:"L",level:"Mid",category:"Analysis",q:"What is connection pooling? Why is it important for performance?",a:`<h4>Connection Pooling</h4><pre><code>WITHOUT pool:\n  Request 1 → Open connection → Query → Close ← 100ms overhead\n  Request 2 → Open connection → Query → Close ← 100ms overhead\n  Request 3 → Open connection → Query → Close ← 100ms overhead\n\nWITH pool:\n  Pool created at startup with 20 connections\n  Request 1 → Borrow connection → Query → Return ← 5ms\n  Request 2 → Borrow connection → Query → Return ← 5ms\n  Request 3 → Borrow connection → Query → Return ← 5ms</code></pre><table><tr><th>Setting</th><th>Value</th><th>Why</th></tr><tr><td>Min pool size</td><td>10</td><td>Always ready for requests</td></tr><tr><td>Max pool size</td><td>50</td><td>Limit DB connections</td></tr><tr><td>Connection timeout</td><td>5 seconds</td><td>Fail fast if pool exhausted</td></tr><tr><td>Idle timeout</td><td>10 minutes</td><td>Release unused connections</td></tr></table>`},
{id:599,part:"L",level:"Mid",category:"Tools",q:"How do you performance test APIs using Postman?",a:`<h4>Postman Performance Testing</h4><ol><li><strong>Collection Runner:</strong> Run a collection with iterations<pre><code>Iterations: 100\nDelay: 0ms\nData file: test_users.csv</code></pre></li><li><strong>Postman Monitors:</strong> Schedule API checks<pre><code>Frequency: Every 5 minutes\nRegions: US, EU, Asia\nAlert: If response > 500ms</code></pre></li><li><strong>Newman (CLI):</strong><pre><code>newman run collection.json\n  --iteration-count 100\n  --reporters cli,htmlextra\n  --reporter-htmlextra-export report.html</code></pre></li></ol><p><strong>Limitation:</strong> Postman is NOT a load testing tool. For real load testing (100+ concurrent users), use k6 or JMeter.</p>`},
{id:600,part:"L",level:"Mid",category:"Basics",q:"What is CDN and how does it improve web performance?",a:`<h4>CDN (Content Delivery Network)</h4><pre><code>WITHOUT CDN:\n  User in India → Server in US → 200ms latency\n\nWITH CDN:\n  User in India → CDN edge in Mumbai → 20ms latency</code></pre><table><tr><th>CDN Provider</th><th>Best For</th></tr><tr><td>CloudFront (AWS)</td><td>AWS infrastructure</td></tr><tr><td>Cloudflare</td><td>Free tier, DDoS protection</td></tr><tr><td>Akamai</td><td>Enterprise, streaming</td></tr><tr><td>Fastly</td><td>Edge computing</td></tr></table><h4>What CDN Caches</h4><ul><li>Static files: JS, CSS, images, fonts</li><li>API responses (with proper cache headers)</li><li>HTML pages (for static sites)</li></ul>`},
{id:601,part:"L",level:"Mid",category:"Analysis",q:"How do you create a performance test plan?",a:`<h4>Performance Test Plan Template</h4><pre><code>1. OBJECTIVE\n   Validate login API handles 200 concurrent users\n   with p95 response time < 500ms\n\n2. SCOPE\n   In scope: Login, Dashboard, Plans API\n   Out of scope: Admin panel, Reports\n\n3. ENVIRONMENT\n   URL: staging.onsurity.com\n   Data: 10,000 test users preloaded\n\n4. TOOL\n   k6 (API testing)\n   Lighthouse (frontend)\n\n5. SCENARIOS\n   Smoke:  5 users × 2 min\n   Load:   200 users × 30 min\n   Stress: 500 users × 15 min\n\n6. PASS CRITERIA\n   ✅ p95 < 500ms\n   ✅ Error rate < 0.1%\n   ✅ CPU < 70%\n\n7. SCHEDULE\n   Start: Monday | Complete: Wednesday\n   Report: Thursday</code></pre>`},
{id:602,part:"L",level:"Mid",category:"Tools",q:"How do you run performance tests in CI/CD?",a:`<h4>GitHub Actions + k6</h4><pre><code>name: Performance Test\non:\n  schedule:\n    - cron: '0 2 * * *'  # Nightly at 2 AM\n\njobs:\n  perf-test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Install k6\n        run: |\n          curl https://github.com/grafana/k6/releases/\n          download/v0.47.0/k6-v0.47.0-linux-amd64.tar.gz\n          -L | tar xvz\n\n      - name: Run load test\n        run: ./k6 run tests/load-test.js\n\n      - name: Upload results\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: k6-results\n          path: results/</code></pre><p><strong>Key:</strong> Run performance tests nightly or before releases, not on every PR (too slow).</p>`},
{id:603,part:"L",level:"Mid",category:"Basics",q:"What is the difference between load testing and stress testing?",a:`<table><tr><th></th><th>Load Testing</th><th>Stress Testing</th></tr><tr><td><strong>Purpose</strong></td><td>Can system handle expected traffic?</td><td>At what point does system break?</td></tr><tr><td><strong>Load</strong></td><td>Expected user count (e.g., 100)</td><td>Beyond capacity (e.g., 500+)</td></tr><tr><td><strong>Duration</strong></td><td>30-60 minutes</td><td>Until failure</td></tr><tr><td><strong>Expected result</strong></td><td>All metrics within SLA</td><td>Identify breaking point</td></tr><tr><td><strong>When to use</strong></td><td>Every release</td><td>Capacity planning, new features</td></tr></table><h4>Example</h4><pre><code>Load test: "With 100 users, login takes 200ms ✅"\nStress test: "At 500 users, login takes 3s.\n             At 700 users, server returns 503.\n             Breaking point: ~600 concurrent users"</code></pre>`}
