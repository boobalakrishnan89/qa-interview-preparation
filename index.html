{id:604,part:"M",level:"Senior",category:"OWASP",q:"Explain the OWASP Top 10. How do you test for each?",a:`<h4>OWASP Top 10 (2021)</h4><table><tr><th>#</th><th>Vulnerability</th><th>How to Test</th></tr><tr><td>A01</td><td><strong>Broken Access Control</strong></td><td>Try accessing other user's data by changing IDs</td></tr><tr><td>A02</td><td><strong>Cryptographic Failures</strong></td><td>Check for HTTP (not HTTPS), weak encryption</td></tr><tr><td>A03</td><td><strong>Injection</strong></td><td>SQL injection, XSS in input fields</td></tr><tr><td>A04</td><td><strong>Insecure Design</strong></td><td>Review business logic for abuse scenarios</td></tr><tr><td>A05</td><td><strong>Security Misconfiguration</strong></td><td>Default credentials, exposed debug endpoints</td></tr><tr><td>A06</td><td><strong>Vulnerable Components</strong></td><td>npm audit, OWASP Dependency-Check</td></tr><tr><td>A07</td><td><strong>Auth Failures</strong></td><td>Brute force, session fixation, weak passwords</td></tr><tr><td>A08</td><td><strong>Data Integrity Failures</strong></td><td>Insecure deserialization, CI/CD pipeline security</td></tr><tr><td>A09</td><td><strong>Logging Failures</strong></td><td>Check if security events are logged</td></tr><tr><td>A10</td><td><strong>SSRF</strong></td><td>Try internal URLs in user-supplied fields</td></tr></table>`},
{id:605,part:"M",level:"Senior",category:"Injection",q:"How do you test for SQL injection? Give practical examples.",a:`<h4>SQL Injection Testing</h4><pre><code>Target: Login form with username/password\n\n1. BASIC TEST\n   Username: admin' --\n   Password: anything\n   → If login succeeds: VULNERABLE!\n\n2. UNION-BASED\n   Input: ' UNION SELECT username, password\n          FROM users --\n   → If data leaks: CRITICAL!\n\n3. BLIND SQL INJECTION\n   Input: admin' AND 1=1 --  (returns data)\n   Input: admin' AND 1=2 --  (no data)\n   → Different responses = vulnerable\n\n4. TIME-BASED BLIND\n   Input: admin' AND SLEEP(5) --\n   → If response delayed 5 seconds: vulnerable\n\n5. API TESTING\n   GET /api/users?id=1 OR 1=1\n   GET /api/users?id=1; DROP TABLE users--</code></pre><h4>Prevention</h4><ul><li>Use parameterized queries / prepared statements</li><li>Input validation + sanitization</li><li>Use ORM (Hibernate, Sequelize)</li></ul>`},
{id:606,part:"M",level:"Senior",category:"XSS",q:"What is XSS (Cross-Site Scripting)? How do you test for it?",a:`<h4>XSS Types</h4><table><tr><th>Type</th><th>Where</th><th>Example</th></tr><tr><td><strong>Reflected</strong></td><td>URL parameters</td><td><code>?search=&lt;script&gt;alert('XSS')&lt;/script&gt;</code></td></tr><tr><td><strong>Stored</strong></td><td>Database (comments, profiles)</td><td>Save malicious script in comment, all visitors affected</td></tr><tr><td><strong>DOM-based</strong></td><td>Client-side JS</td><td><code>document.innerHTML = location.hash</code></td></tr></table><h4>Test Payloads</h4><pre><code>Basic:       &lt;script&gt;alert('XSS')&lt;/script&gt;\nImage:       &lt;img src=x onerror=alert('XSS')&gt;\nSVG:         &lt;svg onload=alert('XSS')&gt;\nEvent:       &lt;body onload=alert('XSS')&gt;\nEncoded:     &lt;script&gt;alert(String.fromCharCode(88,83,83))&lt;/script&gt;</code></pre><h4>Prevention</h4><ul><li>Output encoding (escape HTML entities)</li><li>Content Security Policy (CSP) headers</li><li>Input validation</li><li>Use frameworks with auto-escaping (React, Angular)</li></ul>`},
{id:607,part:"M",level:"Senior",category:"API Security",q:"How do you test API security? Authentication and authorization?",a:`<h4>API Security Testing Checklist</h4><table><tr><th>Test</th><th>How</th><th>Expected</th></tr><tr><td>No auth</td><td>Call API without token</td><td>401 Unauthorized</td></tr><tr><td>Expired token</td><td>Use old JWT</td><td>401 Unauthorized</td></tr><tr><td>Other user's data</td><td>Change user_id in request</td><td>403 Forbidden</td></tr><tr><td>Admin endpoint</td><td>Call admin API as regular user</td><td>403 Forbidden</td></tr><tr><td>Rate limiting</td><td>Send 1000 requests/min</td><td>429 Too Many Requests</td></tr><tr><td>SQL injection</td><td>Send SQL in parameters</td><td>400 Bad Request</td></tr><tr><td>IDOR</td><td>GET /api/users/123 (not your ID)</td><td>403 Forbidden</td></tr></table><h4>JWT Security Checks</h4><pre><code>1. Decode JWT → check payload (no sensitive data)\n2. Try modifying claims → should fail validation\n3. Try algorithm: none → should be rejected\n4. Check expiration time → should be short (15-60 min)\n5. Check refresh token rotation</code></pre>`},
{id:608,part:"M",level:"Senior",category:"Tools",q:"Compare SAST vs DAST vs IAST security testing tools.",a:`<table><tr><th></th><th>SAST</th><th>DAST</th><th>IAST</th></tr><tr><td><strong>Full name</strong></td><td>Static Application Security Testing</td><td>Dynamic Application Security Testing</td><td>Interactive AST</td></tr><tr><td><strong>When</strong></td><td>Code review / CI build</td><td>Running application</td><td>During testing</td></tr><tr><td><strong>How</strong></td><td>Scans source code</td><td>Attacks running app</td><td>Agent inside app</td></tr><tr><td><strong>Finds</strong></td><td>Code-level vulnerabilities</td><td>Runtime vulnerabilities</td><td>Both</td></tr><tr><td><strong>False positives</strong></td><td>High</td><td>Low</td><td>Low</td></tr><tr><td><strong>Tools</strong></td><td>SonarQube, Checkmarx, Snyk</td><td>OWASP ZAP, Burp Suite</td><td>Contrast Security</td></tr></table><h4>When to Use</h4><pre><code>SAST: Every PR (fast, shift-left)\nDAST: Nightly on staging\nIAST: During QA testing cycles\n\nRecommended: SAST in CI + DAST before release</code></pre>`},
{id:609,part:"M",level:"Senior",category:"OWASP",q:"What is CSRF? How do you test and prevent it?",a:`<h4>CSRF (Cross-Site Request Forgery)</h4><pre><code>Attack scenario:\n1. User logs into bank.com (session cookie set)\n2. User visits evil.com\n3. evil.com has: &lt;img src="bank.com/transfer?to=hacker&amount=10000"&gt;\n4. Browser sends request WITH user's cookie\n5. Bank processes transfer thinking it's the user!</code></pre><h4>Testing for CSRF</h4><ol><li>Submit a form/API request without CSRF token → should fail</li><li>Use a CSRF token from a different session → should fail</li><li>Replay the same CSRF token → should fail (one-time use)</li><li>Check if sensitive APIs require POST (not GET)</li></ol><h4>Prevention</h4><table><tr><th>Method</th><th>How</th></tr><tr><td>CSRF tokens</td><td>Unique token per form/session</td></tr><tr><td>SameSite cookies</td><td>Set-Cookie: SameSite=Strict</td></tr><tr><td>Origin header check</td><td>Validate Referer/Origin header</td></tr><tr><td>Double-submit cookie</td><td>Token in cookie + header must match</td></tr></table>`},
{id:610,part:"M",level:"Senior",category:"API Security",q:"How do you test for IDOR (Insecure Direct Object Reference)?",a:`<h4>IDOR Testing</h4><pre><code>Scenario: User A (id: 101) tries to access User B's data\n\nTest 1: Horizontal privilege escalation\n  GET /api/users/102/profile\n  → Expected: 403 Forbidden\n  → Vulnerable if: Returns User B's data\n\nTest 2: Parameter manipulation\n  GET /api/orders?user_id=102\n  → Expected: Only User A's orders\n  → Vulnerable if: Returns User B's orders\n\nTest 3: File access\n  GET /api/documents/invoice_102.pdf\n  → Expected: 403 Forbidden\n  → Vulnerable if: Downloads User B's invoice\n\nTest 4: API with predictable IDs\n  POST /api/claims/1001 → 1002 → 1003\n  → Try incrementing IDs to access others' claims</code></pre><h4>Prevention</h4><ul><li>Always verify resource ownership server-side</li><li>Use UUIDs instead of sequential IDs</li><li>Implement row-level security in database</li></ul>`},
{id:611,part:"M",level:"Senior",category:"Tools",q:"How do you use OWASP ZAP for security testing?",a:`<h4>OWASP ZAP — Step by Step</h4><pre><code>1. SPIDER\n   Target: https://staging.onsurity.com\n   → ZAP crawls all pages, finds endpoints\n\n2. ACTIVE SCAN\n   → ZAP automatically tests for:\n     - SQL Injection\n     - XSS (reflected + stored)\n     - CSRF\n     - Path traversal\n     - Command injection\n\n3. REVIEW ALERTS\n   High:   SQL Injection in /api/search\n   Medium: Missing CSP header\n   Low:    Cookie without HttpOnly flag\n   Info:   Server version disclosed\n\n4. API SCAN (OpenAPI)\n   Import swagger.json → scan all endpoints\n   → Checks auth bypass, injection, etc.\n\n5. CI INTEGRATION\n   docker run owasp/zap2docker-stable zap-api-scan.py\n     -t https://staging.onsurity.com/swagger.json\n     -f openapi</code></pre>`},
{id:612,part:"M",level:"Senior",category:"Compliance",q:"What PII/HIPAA considerations apply to InsurTech security testing?",a:`<h4>InsurTech Security Requirements</h4><table><tr><th>Regulation</th><th>Requirement</th><th>QA Test</th></tr><tr><td><strong>PII Protection</strong></td><td>Encrypt personal data</td><td>Check DB encryption at rest</td></tr><tr><td><strong>Data masking</strong></td><td>Mask Aadhaar, PAN in logs</td><td>Grep logs for unmasked PII</td></tr><tr><td><strong>Access control</strong></td><td>Role-based access</td><td>Test admin vs user permissions</td></tr><tr><td><strong>Audit trail</strong></td><td>Log all data access</td><td>Verify audit logs exist</td></tr><tr><td><strong>Data retention</strong></td><td>Delete after policy period</td><td>Test data deletion APIs</td></tr><tr><td><strong>Consent</strong></td><td>User consent for data use</td><td>Check consent flow in UI</td></tr></table><h4>Security Test Data Rules</h4><pre><code>NEVER use real customer data in QA!\n\nUse:\n- Anonymized data (real structure, fake values)\n- Generated test data (Faker.js)\n- Data masking for production-clone DBs</code></pre>`},
{id:613,part:"M",level:"Senior",category:"XSS",q:"What is Content Security Policy (CSP)? How do you test it?",a:`<h4>Content Security Policy</h4><pre><code>Response Header:\nContent-Security-Policy:\n  default-src 'self';\n  script-src 'self' https://cdn.example.com;\n  style-src 'self' 'unsafe-inline';\n  img-src 'self' data: https:;\n  connect-src 'self' https://api.example.com;\n  frame-ancestors 'none';\n  form-action 'self';</code></pre><h4>Testing CSP</h4><table><tr><th>Test</th><th>How</th><th>Expected</th></tr><tr><td>Inline script blocked</td><td>Add &lt;script&gt; in page</td><td>CSP violation in console</td></tr><tr><td>External script blocked</td><td>Load script from unknown CDN</td><td>Blocked by CSP</td></tr><tr><td>Report URI works</td><td>Trigger violation</td><td>Report sent to server</td></tr><tr><td>frame-ancestors</td><td>Try embedding in iframe</td><td>Refused by CSP</td></tr></table>`},
{id:614,part:"M",level:"Senior",category:"Injection",q:"How do you integrate security testing into the SDLC (DevSecOps)?",a:`<h4>DevSecOps Pipeline</h4><pre><code>CODE → BUILD → TEST → DEPLOY → MONITOR\n  │       │       │       │        │\n  ▼       ▼       ▼       ▼        ▼\nSAST   Dep Scan  DAST   Config   WAF/IDS\nLint   npm audit  ZAP   Secrets   SIEM\nReview Snyk      Burp   TLS      Alerts</code></pre><table><tr><th>Phase</th><th>Tool</th><th>Frequency</th></tr><tr><td>Pre-commit</td><td>git-secrets, Husky hooks</td><td>Every commit</td></tr><tr><td>CI Build</td><td>SonarQube SAST, npm audit</td><td>Every PR</td></tr><tr><td>QA Testing</td><td>OWASP ZAP, manual security tests</td><td>Every sprint</td></tr><tr><td>Pre-release</td><td>Penetration testing</td><td>Every major release</td></tr><tr><td>Production</td><td>WAF, runtime monitoring</td><td>Continuous</td></tr></table>`},
{id:615,part:"M",level:"Senior",category:"API Security",q:"How do you test for broken authentication vulnerabilities?",a:`<h4>Authentication Testing Checklist</h4><table><tr><th>Test</th><th>Attack</th><th>Expected Defense</th></tr><tr><td>Brute force</td><td>Try 1000 passwords</td><td>Account lockout after 5 attempts</td></tr><tr><td>Credential stuffing</td><td>Use leaked password list</td><td>Rate limiting + CAPTCHA</td></tr><tr><td>Session fixation</td><td>Set session before login</td><td>New session after auth</td></tr><tr><td>Token theft</td><td>Steal JWT from URL/log</td><td>Token in header only, short expiry</td></tr><tr><td>Password reset</td><td>Guess reset token</td><td>Random token, short expiry</td></tr><tr><td>2FA bypass</td><td>Skip OTP step</td><td>Server enforces 2FA</td></tr><tr><td>Session timeout</td><td>Use old session</td><td>Expire after 30 min inactive</td></tr></table>`},
{id:616,part:"M",level:"Senior",category:"Tools",q:"How do you scan for vulnerable dependencies in your test framework?",a:`<h4>Dependency Scanning</h4><pre><code># Node.js\nnpm audit\nnpm audit fix\n\n# Java (Maven)\nmvn org.owasp:dependency-check-maven:check\n\n# Python\npip-audit\nsafety check\n\n# Multi-language\nsnyk test\nsnyk monitor</code></pre><h4>CI Integration</h4><pre><code>- name: Security audit\n  run: |\n    npm audit --audit-level=high\n    if [ $? -ne 0 ]; then\n      echo "High severity vulnerabilities found!"\n      exit 1\n    fi</code></pre><table><tr><th>Tool</th><th>Languages</th><th>Free?</th></tr><tr><td>npm audit</td><td>Node.js</td><td>Yes</td></tr><tr><td>Snyk</td><td>All major</td><td>Free tier</td></tr><tr><td>OWASP Dep-Check</td><td>Java, .NET</td><td>Yes</td></tr><tr><td>Dependabot</td><td>All (GitHub)</td><td>Yes</td></tr></table>`},
// Mid Level
{id:617,part:"M",level:"Mid",category:"Basics",q:"What is security testing? Why should QA care about it?",a:`<h4>Security Testing for QA</h4><table><tr><th>Aspect</th><th>Description</th></tr><tr><td><strong>What</strong></td><td>Finding vulnerabilities before hackers do</td></tr><tr><td><strong>Why QA cares</strong></td><td>QA already tests edge cases — security is an edge case mindset</td></tr><tr><td><strong>When</strong></td><td>During functional testing — add security checks</td></tr></table><h4>Quick Wins for QA</h4><pre><code>During regular testing, always check:\n1. Can I access pages without logging in?\n2. Can I see other users' data?\n3. Are passwords visible in URLs or logs?\n4. Do error messages reveal system info?\n5. Are sensitive fields masked (password, SSN)?</code></pre>`},
{id:618,part:"M",level:"Mid",category:"Basics",q:"What is SQL injection? How can you spot it during testing?",a:`<h4>SQL Injection — QA Guide</h4><pre><code>What to type in input fields:\n\n1. Single quote test:  '\n   → If error message shows SQL → vulnerable!\n\n2. OR test: ' OR '1'='1\n   → If it bypasses logic → vulnerable!\n\n3. Comment test: admin' --\n   → If it logs in without password → vulnerable!\n\nWhere to test:\n- Login forms (username, password)\n- Search boxes\n- URL parameters (?id=1)\n- Filter dropdowns\n- Any input that reaches the database</code></pre><p><strong>Key:</strong> If you see a database error message in the UI, that's already a bug — it should show a generic error, never SQL details.</p>`},
{id:619,part:"M",level:"Mid",category:"Basics",q:"What is XSS? How do you test for it as a QA?",a:`<h4>XSS Testing for QA</h4><pre><code>Type this in any text input field:\n  &lt;script&gt;alert('XSS')&lt;/script&gt;\n\nIf an alert box pops up → CRITICAL BUG!\n\nWhere to test:\n- Comment boxes\n- Profile name/bio fields\n- Search bars\n- URL parameters\n- Chat messages\n- File upload names</code></pre><h4>Other Payloads to Try</h4><pre><code>&lt;img src=x onerror=alert('XSS')&gt;\n&lt;svg onload=alert('XSS')&gt;\njavascript:alert('XSS')</code></pre><p><strong>Expected behavior:</strong> Input should be displayed as plain text, NOT executed as HTML/JavaScript.</p>`},
{id:620,part:"M",level:"Mid",category:"Basics",q:"What are common security headers? How do you check them?",a:`<h4>Security Headers Checklist</h4><table><tr><th>Header</th><th>Purpose</th><th>Expected Value</th></tr><tr><td>Content-Security-Policy</td><td>Prevent XSS</td><td>Present with restrictions</td></tr><tr><td>X-Content-Type-Options</td><td>Prevent MIME sniffing</td><td>nosniff</td></tr><tr><td>X-Frame-Options</td><td>Prevent clickjacking</td><td>DENY or SAMEORIGIN</td></tr><tr><td>Strict-Transport-Security</td><td>Force HTTPS</td><td>max-age=31536000</td></tr><tr><td>X-XSS-Protection</td><td>Browser XSS filter</td><td>1; mode=block</td></tr></table><h4>How to Check</h4><pre><code>Chrome DevTools → Network tab → Click any request\n→ Response Headers → Look for security headers\n\nOR use: securityheaders.com\nOR curl: curl -I https://onsurity.com</code></pre>`},
{id:621,part:"M",level:"Mid",category:"Authentication",q:"What security tests should you do on a login page?",a:`<h4>Login Page Security Tests</h4><table><tr><th>#</th><th>Test</th><th>Expected</th></tr><tr><td>1</td><td>Wrong password 5 times</td><td>Account locked/CAPTCHA shown</td></tr><tr><td>2</td><td>SQL injection in username</td><td>Generic error, no SQL details</td></tr><tr><td>3</td><td>Password visible in URL</td><td>Never (use POST, not GET)</td></tr><tr><td>4</td><td>Password field autocomplete</td><td>autocomplete="off" or "new-password"</td></tr><tr><td>5</td><td>HTTPS enforced</td><td>HTTP redirects to HTTPS</td></tr><tr><td>6</td><td>Error message</td><td>"Invalid credentials" (not "Wrong password")</td></tr><tr><td>7</td><td>Session after logout</td><td>Old session invalid</td></tr><tr><td>8</td><td>Remember me token</td><td>Secure, HttpOnly cookie</td></tr></table>`},
{id:622,part:"M",level:"Mid",category:"Authentication",q:"What is the difference between authentication and authorization?",a:`<table><tr><th></th><th>Authentication</th><th>Authorization</th></tr><tr><td>Question</td><td>"Who are you?"</td><td>"What can you do?"</td></tr><tr><td>Verifies</td><td>Identity</td><td>Permissions</td></tr><tr><td>How</td><td>Username/password, OTP, biometric</td><td>Roles, permissions, policies</td></tr><tr><td>HTTP code</td><td>401 Unauthorized</td><td>403 Forbidden</td></tr><tr><td>Example</td><td>Login with email + OTP</td><td>Admin can delete users, regular user cannot</td></tr></table><h4>QA Testing</h4><pre><code>Authentication test:\n  → Login with valid creds → success\n  → Login with invalid creds → 401\n\nAuthorization test:\n  → Regular user calls /admin/users → 403\n  → Regular user accesses own data → 200\n  → Regular user accesses other's data → 403</code></pre>`},
{id:623,part:"M",level:"Mid",category:"Basics",q:"What is HTTPS? Why is it important for security?",a:`<h4>HTTP vs HTTPS</h4><table><tr><th></th><th>HTTP</th><th>HTTPS</th></tr><tr><td>Encryption</td><td>None (plain text)</td><td>TLS/SSL encrypted</td></tr><tr><td>Port</td><td>80</td><td>443</td></tr><tr><td>URL</td><td>http://</td><td>https:// (🔒 in browser)</td></tr><tr><td>Security</td><td>Anyone can read traffic</td><td>Only sender/receiver can read</td></tr></table><h4>QA Checks</h4><ul><li>All pages load over HTTPS</li><li>HTTP automatically redirects to HTTPS</li><li>No mixed content (HTTP resources on HTTPS page)</li><li>SSL certificate is valid and not expired</li><li>API calls use HTTPS</li></ul>`},
{id:624,part:"M",level:"Mid",category:"Basics",q:"What are cookies? What security flags should they have?",a:`<h4>Cookie Security Flags</h4><table><tr><th>Flag</th><th>Purpose</th><th>Example</th></tr><tr><td><strong>HttpOnly</strong></td><td>Can't access via JavaScript</td><td>Prevents XSS cookie theft</td></tr><tr><td><strong>Secure</strong></td><td>Only sent over HTTPS</td><td>Prevents network sniffing</td></tr><tr><td><strong>SameSite</strong></td><td>Prevents CSRF</td><td>Strict, Lax, or None</td></tr><tr><td><strong>Max-Age/Expires</strong></td><td>Cookie lifetime</td><td>Session or specific time</td></tr><tr><td><strong>Domain</strong></td><td>Which domain can read it</td><td>.onsurity.com</td></tr><tr><td><strong>Path</strong></td><td>Which path can access it</td><td>/api</td></tr></table><h4>How to Check</h4><pre><code>Chrome DevTools → Application tab → Cookies\nCheck each cookie has:\n✅ HttpOnly = true (for session cookies)\n✅ Secure = true\n✅ SameSite = Strict or Lax</code></pre>`},
{id:625,part:"M",level:"Mid",category:"Authentication",q:"What is JWT? How do you test JWT-based authentication?",a:`<h4>JWT (JSON Web Token)</h4><pre><code>Structure: header.payload.signature\n\nHeader:  {"alg":"HS256","typ":"JWT"}\nPayload: {"user_id":101,"role":"user","exp":1704067200}\nSignature: HMACSHA256(header + payload, secret)\n\nDecode at: jwt.io</code></pre><h4>QA Tests for JWT</h4><table><tr><th>Test</th><th>How</th><th>Expected</th></tr><tr><td>Expired token</td><td>Wait for expiry, try API</td><td>401 error</td></tr><tr><td>Modified token</td><td>Change payload, resend</td><td>401 (signature invalid)</td></tr><tr><td>No token</td><td>API call without Authorization</td><td>401 error</td></tr><tr><td>Sensitive data</td><td>Decode token at jwt.io</td><td>No passwords/PII in payload</td></tr></table>`},
{id:626,part:"M",level:"Mid",category:"Tools",q:"What is OWASP ZAP? How does a QA engineer use it?",a:`<h4>OWASP ZAP for QA</h4><pre><code>Step 1: Download and install OWASP ZAP\nStep 2: Enter target URL (staging only!)\nStep 3: Click "Automated Scan"\nStep 4: Wait for results (10-30 minutes)\nStep 5: Review alerts:\n\n  🔴 High: SQL Injection found in /search\n  🟠 Medium: Missing CSP header\n  🟡 Low: Cookie without Secure flag\n  🔵 Info: Server version disclosed\n\nStep 6: Report findings to dev team</code></pre><p><strong>Rule:</strong> NEVER run security scans on production! Always use staging/QA environment.</p>`},
{id:627,part:"M",level:"Mid",category:"Basics",q:"What is a security test case? Give examples.",a:`<h4>Security Test Cases</h4><table><tr><th>ID</th><th>Test</th><th>Input</th><th>Expected</th></tr><tr><td>SEC-01</td><td>SQL injection in login</td><td>admin' OR 1=1 --</td><td>Login fails, no SQL error</td></tr><tr><td>SEC-02</td><td>XSS in search</td><td>&lt;script&gt;alert(1)&lt;/script&gt;</td><td>Input escaped, no popup</td></tr><tr><td>SEC-03</td><td>Access without login</td><td>Direct URL to dashboard</td><td>Redirect to login page</td></tr><tr><td>SEC-04</td><td>View other user's data</td><td>Change user_id in URL</td><td>403 Forbidden</td></tr><tr><td>SEC-05</td><td>HTTPS enforcement</td><td>http://site.com</td><td>Redirects to https://</td></tr><tr><td>SEC-06</td><td>Password in URL</td><td>Check login form method</td><td>POST method used</td></tr><tr><td>SEC-07</td><td>Brute force protection</td><td>5 wrong passwords</td><td>Account locked</td></tr></table>`},
{id:628,part:"M",level:"Mid",category:"Authentication",q:"What is rate limiting? How do you test it?",a:`<h4>Rate Limiting</h4><pre><code>Purpose: Prevent abuse (brute force, DDoS)\n\nCommon limits:\n- Login: 5 attempts per minute\n- API: 100 requests per minute\n- Search: 30 requests per minute\n- Password reset: 3 per hour</code></pre><h4>How to Test</h4><pre><code>1. Send requests rapidly:\n   for i in {1..20}; do\n     curl -X POST https://api.example.com/login\n       -d '{"phone":"9999999999","otp":"0000"}'\n   done\n\n2. Check responses:\n   Request 1-5:  200 OK (or 401 Invalid)\n   Request 6:    429 Too Many Requests\n\n3. Verify headers:\n   X-RateLimit-Limit: 100\n   X-RateLimit-Remaining: 94\n   Retry-After: 60</code></pre>`},
{id:629,part:"M",level:"Mid",category:"Tools",q:"How do you check for sensitive data exposure?",a:`<h4>Sensitive Data Checklist</h4><table><tr><th>Check</th><th>Where</th><th>How</th></tr><tr><td>Passwords in plain text</td><td>Database</td><td>Query users table → should be hashed</td></tr><tr><td>PII in logs</td><td>Server logs</td><td>grep for phone numbers, emails</td></tr><tr><td>Tokens in URL</td><td>Browser URL bar</td><td>Check after login/payment</td></tr><tr><td>API response</td><td>Network tab</td><td>Check response doesn't include passwords</td></tr><tr><td>Error messages</td><td>UI</td><td>Should not show stack traces</td></tr><tr><td>Source code</td><td>Browser View Source</td><td>No API keys, secrets in JS</td></tr></table><pre><code># Check server logs for PII\ngrep -E '[0-9]{10}' /var/log/app.log  # phone numbers\ngrep -E '[A-Z]{5}[0-9]{4}[A-Z]' /var/log/app.log  # PAN</code></pre>`},
{id:630,part:"M",level:"Mid",category:"Basics",q:"What is the principle of least privilege? How do you test it?",a:`<h4>Least Privilege Principle</h4><p><em>"Give users only the minimum permissions they need to do their job."</em></p><table><tr><th>Role</th><th>Should Access</th><th>Should NOT Access</th></tr><tr><td>Regular user</td><td>Own profile, own claims</td><td>Other users' data, admin panel</td></tr><tr><td>HR admin</td><td>Company members, plans</td><td>Payment details, system config</td></tr><tr><td>Super admin</td><td>Everything</td><td>—</td></tr></table><h4>How to Test</h4><pre><code>Login as each role and try:\n1. Access admin URLs directly\n2. Call API endpoints for other roles\n3. Modify request to change role claim\n4. Access restricted menu items via URL\n\nEach test should return 403 Forbidden\nfor unauthorized access.</code></pre>`},
{id:631,part:"M",level:"Mid",category:"Tools",q:"What tools can QA use for basic security testing?",a:`<h4>Security Tools for QA Engineers</h4><table><tr><th>Tool</th><th>Purpose</th><th>Difficulty</th><th>Free?</th></tr><tr><td><strong>OWASP ZAP</strong></td><td>Automated vulnerability scan</td><td>Easy</td><td>Yes</td></tr><tr><td><strong>Burp Suite</strong></td><td>Manual + auto security testing</td><td>Medium</td><td>Community</td></tr><tr><td><strong>Browser DevTools</strong></td><td>Check headers, cookies, network</td><td>Easy</td><td>Yes</td></tr><tr><td><strong>securityheaders.com</strong></td><td>Check security headers</td><td>Easy</td><td>Yes</td></tr><tr><td><strong>jwt.io</strong></td><td>Decode and inspect JWTs</td><td>Easy</td><td>Yes</td></tr><tr><td><strong>npm audit</strong></td><td>Check dependency vulnerabilities</td><td>Easy</td><td>Yes</td></tr><tr><td><strong>Postman</strong></td><td>API security testing</td><td>Easy</td><td>Yes</td></tr></table>`},
{id:632,part:"M",level:"Mid",category:"Authentication",q:"What is two-factor authentication (2FA)? How do you test it?",a:`<h4>2FA Testing</h4><table><tr><th>Test</th><th>Steps</th><th>Expected</th></tr><tr><td>Happy path</td><td>Login → Enter OTP → Verify</td><td>Access granted</td></tr><tr><td>Wrong OTP</td><td>Enter incorrect OTP</td><td>Rejected, retry allowed</td></tr><tr><td>Expired OTP</td><td>Wait 5 min, use old OTP</td><td>OTP expired message</td></tr><tr><td>Skip OTP</td><td>Try accessing dashboard without OTP step</td><td>Redirected back to OTP</td></tr><tr><td>Brute force OTP</td><td>Try many OTP values rapidly</td><td>Locked after N attempts</td></tr><tr><td>Resend OTP</td><td>Click resend multiple times</td><td>Rate limited (e.g., 3 per 5 min)</td></tr><tr><td>OTP reuse</td><td>Use same OTP twice</td><td>Rejected on second use</td></tr></table>`},
{id:633,part:"M",level:"Mid",category:"Basics",q:"What is file upload security? What should you test?",a:`<h4>File Upload Security Tests</h4><table><tr><th>Test</th><th>Upload</th><th>Expected</th></tr><tr><td>Malicious file</td><td>evil.php, shell.jsp</td><td>Rejected (only allow jpg, pdf, etc.)</td></tr><tr><td>Double extension</td><td>image.jpg.php</td><td>Rejected</td></tr><tr><td>Large file</td><td>500MB file</td><td>Rejected with size limit error</td></tr><tr><td>Renamed file</td><td>Rename .exe to .jpg</td><td>Validate MIME type, not just extension</td></tr><tr><td>Path traversal</td><td>Filename: ../../etc/passwd</td><td>Sanitize filename</td></tr><tr><td>Script in name</td><td>Filename: &lt;script&gt;.jpg</td><td>Sanitize filename display</td></tr></table>`}
);

{id:634,part:"N",level:"Senior",category:"Automation",q:"How do you architect a mobile test automation framework with Appium?",a:`<h4>Appium Framework Architecture</h4><pre><code>mobile-test-framework/\n├── src/test/java/\n│   ├── base/\n│   │   ├── BaseTest.java          (driver setup/teardown)\n│   │   └── AppiumDriverFactory.java (Android/iOS factory)\n│   ├── pages/\n│   │   ├── LoginPage.java          (POM with MobileElement)\n│   │   ├── DashboardPage.java\n│   │   └── BasePage.java           (common gestures)\n│   ├── tests/\n│   │   ├── LoginTest.java\n│   │   └── PurchaseFlowTest.java\n│   └── utils/\n│       ├── GestureHelper.java      (swipe, scroll, tap)\n│       ├── DeviceHelper.java       (toggle wifi, rotate)\n│       └── ScreenshotHelper.java\n├── appium-config/\n│   ├── android-caps.json\n│   └── ios-caps.json\n└── pom.xml (Appium Java Client + TestNG)</code></pre><h4>Key Capabilities</h4><pre><code>// Android\nUiAutomator2Options options = new UiAutomator2Options();\noptions.setDeviceName("Pixel_7");\noptions.setApp("/path/to/app.apk");\noptions.setAutomationName("UiAutomator2");\n\n// iOS\nXCUITestOptions options = new XCUITestOptions();\noptions.setDeviceName("iPhone 15");\noptions.setApp("/path/to/app.ipa");\noptions.setAutomationName("XCUITest");</code></pre>`},
{id:635,part:"N",level:"Senior",category:"Automation",q:"How do you test React Native apps? Appium vs Detox vs Maestro?",a:`<table><tr><th></th><th>Appium</th><th>Detox</th><th>Maestro</th></tr><tr><td><strong>Type</strong></td><td>Black-box</td><td>Gray-box (E2E)</td><td>Black-box</td></tr><tr><td><strong>Language</strong></td><td>Java, JS, Python</td><td>JavaScript</td><td>YAML</td></tr><tr><td><strong>RN support</strong></td><td>Good (accessibility IDs)</td><td>Excellent (native RN)</td><td>Good</td></tr><tr><td><strong>Speed</strong></td><td>Slow (WebDriver protocol)</td><td>Fast (sync with app)</td><td>Medium</td></tr><tr><td><strong>Flakiness</strong></td><td>Medium-High</td><td>Low (auto-sync)</td><td>Low</td></tr><tr><td><strong>CI/CD</strong></td><td>Good</td><td>Excellent</td><td>Good (cloud)</td></tr><tr><td><strong>Real devices</strong></td><td>Yes</td><td>Simulators/Emulators</td><td>Yes</td></tr><tr><td><strong>Best for</strong></td><td>Cross-platform, legacy</td><td>RN-specific projects</td><td>Quick E2E, non-devs</td></tr></table><h4>Recommendation for Onsurity RN App</h4><pre><code>Detox: E2E tests during development\nAppium: Cross-platform regression on device farms\nMaestro: Quick smoke tests (YAML-based)</code></pre>`},
{id:636,part:"N",level:"Senior",category:"Automation",q:"How do you handle gestures in mobile automation? Swipe, scroll, pinch?",a:`<h4>Gesture Automation</h4><pre><code>// SWIPE (Appium W3C Actions)\nPointerInput finger = new PointerInput(PointerInput.Kind.TOUCH, "finger");\nSequence swipe = new Sequence(finger, 1);\nswipe.addAction(finger.createPointerMove(Duration.ZERO,\n    PointerInput.Origin.viewport(), startX, startY));\nswipe.addAction(finger.createPointerDown(PointerInput.MouseButton.LEFT.asArg()));\nswipe.addAction(finger.createPointerMove(Duration.ofMillis(800),\n    PointerInput.Origin.viewport(), endX, endY));\nswipe.addAction(finger.createPointerUp(PointerInput.MouseButton.LEFT.asArg()));\ndriver.perform(Arrays.asList(swipe));\n\n// SCROLL TO ELEMENT (Android)\ndriver.findElement(AppiumBy.androidUIAutomator(\n    "new UiScrollable(new UiSelector().scrollable(true))" +\n    ".scrollIntoView(new UiSelector().text(\\"Submit\\"))"));\n\n// iOS SCROLL\nMap&lt;String, Object&gt; scrollObject = new HashMap&lt;&gt;();\nscrollObject.put("direction", "down");\nscrollObject.put("predicateString", "label == 'Submit'");\ndriver.executeScript("mobile: scroll", scrollObject);</code></pre>`},
{id:637,part:"N",level:"Senior",category:"Strategy",q:"How do you set up mobile testing on device farms (BrowserStack, Sauce Labs)?",a:`<h4>Device Farm Configuration</h4><pre><code>// BrowserStack Appium Capabilities\n{\n  "platformName": "Android",\n  "appium:platformVersion": "14.0",\n  "appium:deviceName": "Google Pixel 8",\n  "appium:app": "bs://app-hash-from-upload",\n  "bstack:options": {\n    "projectName": "Onsurity Mobile",\n    "buildName": "Sprint-14",\n    "sessionName": "Login Flow",\n    "debug": true,\n    "networkLogs": true\n  }\n}\n\n// Upload app\ncurl -u "user:key" -X POST \\\n  https://api-cloud.browserstack.com/app-automate/upload \\\n  -F "file=@/path/to/app.apk"</code></pre><table><tr><th>Farm</th><th>Real Devices</th><th>Pricing</th><th>Best For</th></tr><tr><td>BrowserStack</td><td>3000+</td><td>From $199/mo</td><td>Cross-platform, CI/CD</td></tr><tr><td>Sauce Labs</td><td>2000+</td><td>Enterprise</td><td>Large teams, analytics</td></tr><tr><td>AWS Device Farm</td><td>1000+</td><td>Pay per minute</td><td>AWS ecosystem</td></tr><tr><td>Firebase Test Lab</td><td>Robo + Instrumented</td><td>Free tier</td><td>Android-first teams</td></tr></table>`},
{id:638,part:"N",level:"Senior",category:"Strategy",q:"How do you test mobile app deep links and push notifications?",a:`<h4>Deep Link Testing</h4><pre><code>// Android - test deep link via ADB\nadb shell am start -W -a android.intent.action.VIEW \\\n  -d "onsurity://super-top-up/checkout" \\\n  com.onsurity.app\n\n// iOS - test via xcrun\nxcrun simctl openurl booted "onsurity://personal-purchase"\n\n// Appium test\ndriver.get("onsurity://dashboard/claims");\nassertTrue(dashboardPage.isClaimsTabActive());</code></pre><h4>Push Notification Testing</h4><table><tr><th>Test</th><th>How</th><th>Verify</th></tr><tr><td>Notification received</td><td>Trigger from backend</td><td>Check notification tray</td></tr><tr><td>Tap action</td><td>Tap notification</td><td>Opens correct screen</td></tr><tr><td>App in background</td><td>Send while backgrounded</td><td>Notification appears</td></tr><tr><td>App killed</td><td>Send while app is killed</td><td>Cold start to correct screen</td></tr><tr><td>Permission denied</td><td>Deny notification permission</td><td>No notification, graceful handling</td></tr></table>`},
{id:639,part:"N",level:"Senior",category:"Automation",q:"How do you handle flaky mobile tests? Strategies for stability?",a:`<h4>Mobile Test Stability Strategies</h4><table><tr><th>Issue</th><th>Cause</th><th>Fix</th></tr><tr><td>Element not found</td><td>Animation/loading delay</td><td>Explicit waits, retry mechanism</td></tr><tr><td>Stale element</td><td>Screen re-rendered</td><td>Re-locate element before action</td></tr><tr><td>Touch not registered</td><td>Keyboard overlay</td><td>Hide keyboard before interaction</td></tr><tr><td>Different screen sizes</td><td>Hardcoded coordinates</td><td>Use relative positioning</td></tr><tr><td>Slow emulator</td><td>Resource constraints</td><td>Use real devices or cloud farms</td></tr></table><h4>Retry Pattern</h4><pre><code>public void tapWithRetry(MobileElement element, int maxRetries) {\n    for (int i = 0; i < maxRetries; i++) {\n        try {\n            element.click();\n            return;\n        } catch (Exception e) {\n            Thread.sleep(1000);\n            // Re-locate if stale\n        }\n    }\n    throw new RuntimeException("Tap failed after " + maxRetries + " retries");\n}</code></pre>`},
{id:640,part:"N",level:"Senior",category:"Strategy",q:"How do you test app performance on mobile? CPU, memory, battery?",a:`<h4>Mobile Performance Metrics</h4><table><tr><th>Metric</th><th>Tool</th><th>Target</th></tr><tr><td>App launch time</td><td>ADB / Xcode Instruments</td><td>Cold: < 3s, Warm: < 1s</td></tr><tr><td>Memory usage</td><td>Android Profiler / Xcode</td><td>< 150MB typical</td></tr><tr><td>CPU usage</td><td>Android Studio / Instruments</td><td>< 30% idle, < 80% active</td></tr><tr><td>Battery drain</td><td>Battery Historian / Energy</td><td>< 5% per hour</td></tr><tr><td>Network usage</td><td>Network Profiler</td><td>Minimize background data</td></tr><tr><td>Frame rate</td><td>GPU Profiler / systrace</td><td>60 fps (no jank)</td></tr></table><pre><code># Android - measure app launch time\nadb shell am start -W com.onsurity.app/.MainActivity\n# Output: TotalTime: 1250ms\n\n# Memory usage\nadb shell dumpsys meminfo com.onsurity.app\n# Output: TOTAL PSS: 85,432 KB</code></pre>`},
{id:641,part:"N",level:"Senior",category:"Automation",q:"How do you set up Appium for parallel mobile testing across Android and iOS?",a:`<h4>Parallel Appium Testing</h4><pre><code>// TestNG parallel config\n&lt;suite name="Mobile" parallel="tests" thread-count="4"&gt;\n  &lt;test name="Android-Login"&gt;\n    &lt;parameter name="platform" value="Android"/&gt;\n    &lt;parameter name="device" value="Pixel_7"/&gt;\n    &lt;parameter name="port" value="4723"/&gt;\n    &lt;classes&gt;&lt;class name="LoginTest"/&gt;&lt;/classes&gt;\n  &lt;/test&gt;\n  &lt;test name="iOS-Login"&gt;\n    &lt;parameter name="platform" value="iOS"/&gt;\n    &lt;parameter name="device" value="iPhone_15"/&gt;\n    &lt;parameter name="port" value="4724"/&gt;\n    &lt;classes&gt;&lt;class name="LoginTest"/&gt;&lt;/classes&gt;\n  &lt;/test&gt;\n&lt;/suite&gt;</code></pre><h4>Appium Server per Device</h4><pre><code># Terminal 1: Android\nappium -p 4723 --use-drivers=uiautomator2\n\n# Terminal 2: iOS\nappium -p 4724 --use-drivers=xcuitest</code></pre>`},

{id:642,part:"N",level:"Mid",category:"Basics",q:"What is mobile testing? What types of mobile testing exist?",a:`<table><tr><th>Type</th><th>What It Tests</th><th>Example</th></tr><tr><td><strong>Functional</strong></td><td>Features work as expected</td><td>Login, payment, search</td></tr><tr><td><strong>Usability</strong></td><td>User experience, navigation</td><td>Button sizes, font readability</td></tr><tr><td><strong>Compatibility</strong></td><td>Different devices/OS</td><td>Android 12 vs 14, iPhone 13 vs 15</td></tr><tr><td><strong>Performance</strong></td><td>Speed, memory, battery</td><td>App launch < 3 seconds</td></tr><tr><td><strong>Security</strong></td><td>Data protection</td><td>Encrypted local storage</td></tr><tr><td><strong>Network</strong></td><td>Different connections</td><td>WiFi, 4G, 3G, offline</td></tr><tr><td><strong>Installation</strong></td><td>Install/update/uninstall</td><td>Fresh install, upgrade from v2 to v3</td></tr><tr><td><strong>Interruption</strong></td><td>Calls, notifications, low battery</td><td>Incoming call during payment</td></tr></table>`},
{id:643,part:"N",level:"Mid",category:"Basics",q:"What is the difference between emulator, simulator, and real device testing?",a:`<table><tr><th></th><th>Emulator (Android)</th><th>Simulator (iOS)</th><th>Real Device</th></tr><tr><td>What</td><td>Software mimics device hardware</td><td>Software mimics iOS environment</td><td>Actual phone/tablet</td></tr><tr><td>Speed</td><td>Slower</td><td>Faster</td><td>Real-world speed</td></tr><tr><td>Cost</td><td>Free</td><td>Free (Mac only)</td><td>Expensive</td></tr><tr><td>Camera/GPS</td><td>Simulated</td><td>Simulated</td><td>Real</td></tr><tr><td>Push notifications</td><td>Limited</td><td>Limited</td><td>Full support</td></tr><tr><td>Performance testing</td><td>Not accurate</td><td>Not accurate</td><td>Accurate</td></tr><tr><td>Best for</td><td>Development, quick tests</td><td>UI testing, fast iteration</td><td>Final validation, perf testing</td></tr></table>`},
{id:644,part:"N",level:"Mid",category:"Manual",q:"How do you test a mobile app for interruptions?",a:`<h4>Interruption Testing Checklist</h4><table><tr><th>Interruption</th><th>Test During</th><th>Expected Behavior</th></tr><tr><td>Incoming call</td><td>Payment flow</td><td>App pauses, resumes after call</td></tr><tr><td>SMS notification</td><td>Form filling</td><td>Data preserved, no crash</td></tr><tr><td>Low battery warning</td><td>File upload</td><td>Upload continues or saves progress</td></tr><tr><td>Alarm</td><td>Video playback</td><td>Pause, resume smoothly</td></tr><tr><td>App switch</td><td>Login flow</td><td>Session maintained</td></tr><tr><td>Airplane mode toggle</td><td>Data sync</td><td>Queue sync, retry when connected</td></tr><tr><td>Screen rotation</td><td>Form with data</td><td>Data preserved across rotation</td></tr><tr><td>Split screen</td><td>Regular usage</td><td>App adapts to smaller window</td></tr></table>`},
{id:645,part:"N",level:"Mid",category:"Manual",q:"How do you test network conditions on mobile?",a:`<h4>Network Condition Testing</h4><table><tr><th>Condition</th><th>How to Simulate</th><th>What to Check</th></tr><tr><td>WiFi → 4G</td><td>Toggle WiFi off</td><td>App recovers, no data loss</td></tr><tr><td>Slow 3G</td><td>Network Link Conditioner / Throttle</td><td>Loading indicators, timeout handling</td></tr><tr><td>No internet</td><td>Airplane mode</td><td>Offline message, cached content</td></tr><tr><td>Intermittent</td><td>Flaky network profile</td><td>Retry mechanism works</td></tr><tr><td>VPN connection</td><td>Connect to VPN</td><td>App works behind VPN</td></tr></table><h4>Network Simulation Tools</h4><pre><code>Android: Settings → Developer → Network speed emulation\niOS: Network Link Conditioner (Settings → Developer)\nCharles Proxy: Throttle specific endpoints\nBrowserStack: Network simulation in device farm</code></pre>`},
{id:646,part:"N",level:"Mid",category:"Manual",q:"What is the mobile app testing checklist before release?",a:`<h4>Pre-Release Mobile Checklist</h4><table><tr><th>Category</th><th>Check</th><th>Status</th></tr><tr><td>Functional</td><td>All user stories tested</td><td>☐</td></tr><tr><td>UI/UX</td><td>UI matches design specs</td><td>☐</td></tr><tr><td>Performance</td><td>App launch < 3 seconds</td><td>☐</td></tr><tr><td>Compatibility</td><td>Top 5 Android + iOS devices</td><td>☐</td></tr><tr><td>Network</td><td>Works on WiFi, 4G, offline</td><td>☐</td></tr><tr><td>Interruptions</td><td>Handles calls, notifications</td><td>☐</td></tr><tr><td>Security</td><td>No sensitive data in logs</td><td>☐</td></tr><tr><td>Permissions</td><td>Camera, location prompts correct</td><td>☐</td></tr><tr><td>Install/Update</td><td>Fresh install + upgrade tested</td><td>☐</td></tr><tr><td>Accessibility</td><td>Screen reader compatible</td><td>☐</td></tr><tr><td>Localization</td><td>RTL languages, date formats</td><td>☐</td></tr><tr><td>Crash logs</td><td>No crashes in Crashlytics</td><td>☐</td></tr></table>`},
{id:647,part:"N",level:"Mid",category:"Basics",q:"What is Appium? How does it work?",a:`<h4>Appium Overview</h4><pre><code>Architecture:\nTest Script → Appium Server → Device Driver → App\n   (Java)      (Node.js)      (UiAutomator2   (APK/IPA)\n                               or XCUITest)</code></pre><table><tr><th>Feature</th><th>Description</th></tr><tr><td>Cross-platform</td><td>Same API for Android + iOS</td></tr><tr><td>No app modification</td><td>Tests the app as-is</td></tr><tr><td>Language support</td><td>Java, Python, JS, Ruby, C#</td></tr><tr><td>Web + Native + Hybrid</td><td>Tests all app types</td></tr><tr><td>Open source</td><td>Free to use</td></tr></table><h4>Simple Appium Test</h4><pre><code>AndroidDriver driver = new AndroidDriver(serverUrl, capabilities);\nMobileElement loginBtn = driver.findElement(By.id("login_button"));\nloginBtn.click();\nassertTrue(driver.findElement(By.id("dashboard")).isDisplayed());</code></pre>`},
{id:648,part:"N",level:"Mid",category:"Automation",q:"How do you locate elements in mobile apps?",a:`<table><tr><th>Strategy</th><th>Android</th><th>iOS</th></tr><tr><td><strong>ID</strong></td><td>resource-id</td><td>accessibilityIdentifier</td></tr><tr><td><strong>Accessibility ID</strong></td><td>content-desc</td><td>accessibilityIdentifier</td></tr><tr><td><strong>XPath</strong></td><td>//android.widget.Button[@text='Login']</td><td>//XCUIElementTypeButton[@name='Login']</td></tr><tr><td><strong>Class name</strong></td><td>android.widget.EditText</td><td>XCUIElementTypeTextField</td></tr><tr><td><strong>Android UIAutomator</strong></td><td>new UiSelector().text("Login")</td><td>N/A</td></tr><tr><td><strong>iOS predicate</strong></td><td>N/A</td><td>label == 'Login'</td></tr></table><h4>Best Practice Priority</h4><pre><code>1. Accessibility ID (best — cross-platform)\n2. ID / resource-id\n3. Class name + text\n4. XPath (last resort — slow, fragile)</code></pre>`},
{id:649,part:"N",level:"Mid",category:"Manual",q:"How do you test app install, update, and uninstall?",a:`<h4>Installation Testing</h4><table><tr><th>Scenario</th><th>Steps</th><th>Verify</th></tr><tr><td>Fresh install</td><td>Install APK/IPA from scratch</td><td>App opens, onboarding works</td></tr><tr><td>Update (minor)</td><td>Install v2.0 over v1.9</td><td>Data preserved, no migration errors</td></tr><tr><td>Update (major)</td><td>Install v3.0 over v1.0</td><td>DB migration works, UI updates</td></tr><tr><td>Downgrade</td><td>Install older version</td><td>Usually blocked (expected behavior)</td></tr><tr><td>Uninstall</td><td>Remove app</td><td>All data cleared, no orphan files</td></tr><tr><td>Reinstall</td><td>Uninstall → Install again</td><td>Clean state, login required</td></tr><tr><td>Low storage</td><td>Fill device → try install</td><td>Clear error message</td></tr></table>`},
{id:650,part:"N",level:"Mid",category:"Manual",q:"How do you test mobile app permissions (camera, location, storage)?",a:`<h4>Permission Testing</h4><table><tr><th>Permission</th><th>Grant</th><th>Deny</th><th>Revoke After</th></tr><tr><td>Camera</td><td>Camera works</td><td>Fallback UI, no crash</td><td>Re-prompt on next use</td></tr><tr><td>Location</td><td>GPS features work</td><td>Manual address entry</td><td>Feature degrades gracefully</td></tr><tr><td>Storage</td><td>File upload works</td><td>Error message, no crash</td><td>Re-prompt when needed</td></tr><tr><td>Notifications</td><td>Push notifications work</td><td>App works without push</td><td>No notifications sent</td></tr><tr><td>Contacts</td><td>Referral feature works</td><td>Manual entry option</td><td>Feature disabled</td></tr></table><h4>Testing Steps</h4><pre><code>1. First launch → verify permission dialog appears\n2. Grant → verify feature works\n3. Deny → verify graceful degradation\n4. Settings → revoke permission → return to app\n5. Verify app re-requests or handles gracefully</code></pre>`},
{id:651,part:"N",level:"Mid",category:"Automation",q:"What is the Page Object Model for mobile testing?",a:`<h4>Mobile POM Pattern</h4><pre><code>public class LoginPage extends BasePage {\n    @AndroidFindBy(accessibility = "phone_input")\n    @iOSXCUITFindBy(accessibility = "phone_input")\n    private MobileElement phoneInput;\n\n    @AndroidFindBy(accessibility = "submit_btn")\n    @iOSXCUITFindBy(accessibility = "submit_btn")\n    private MobileElement submitButton;\n\n    public LoginPage(AppiumDriver driver) {\n        super(driver);\n        PageFactory.initElements(\n            new AppiumFieldDecorator(driver), this);\n    }\n\n    public OtpPage enterPhone(String phone) {\n        phoneInput.sendKeys(phone);\n        submitButton.click();\n        return new OtpPage(driver);\n    }\n}</code></pre><p><strong>Key:</strong> Use <code>@AndroidFindBy</code> and <code>@iOSXCUITFindBy</code> together for cross-platform tests with one Page Object.</p>`},
{id:652,part:"N",level:"Mid",category:"Manual",q:"How do you test mobile app screen rotation?",a:`<h4>Screen Rotation Testing</h4><table><tr><th>Scenario</th><th>Test</th><th>Expected</th></tr><tr><td>Portrait → Landscape</td><td>Rotate during form fill</td><td>Data preserved, layout adapts</td></tr><tr><td>Landscape → Portrait</td><td>Rotate during video play</td><td>Video continues, controls visible</td></tr><tr><td>Lock rotation</td><td>Lock to portrait in settings</td><td>App respects system setting</td></tr><tr><td>Rotation during load</td><td>Rotate while page loading</td><td>Loading continues, no crash</td></tr><tr><td>Modal/popup open</td><td>Rotate with dialog visible</td><td>Dialog resizes correctly</td></tr></table><pre><code>// Appium rotation test\ndriver.rotate(ScreenOrientation.LANDSCAPE);\nassertTrue(dashboardPage.isDisplayedCorrectly());\ndriver.rotate(ScreenOrientation.PORTRAIT);</code></pre>`},
{id:653,part:"N",level:"Mid",category:"Basics",q:"What is the difference between native, hybrid, and web mobile apps?",a:`<table><tr><th></th><th>Native</th><th>Hybrid</th><th>Web App</th></tr><tr><td>Built with</td><td>Swift/Kotlin/React Native</td><td>HTML/CSS in WebView</td><td>HTML/CSS/JS in browser</td></tr><tr><td>Install</td><td>App Store / Play Store</td><td>App Store / Play Store</td><td>No install (URL)</td></tr><tr><td>Performance</td><td>Best</td><td>Good</td><td>Depends on browser</td></tr><tr><td>Device access</td><td>Full (camera, GPS, etc.)</td><td>Via plugins</td><td>Limited</td></tr><tr><td>Testing tool</td><td>Appium, XCUITest, Espresso</td><td>Appium (context switching)</td><td>Selenium, Playwright</td></tr><tr><td>Example</td><td>Instagram, Onsurity</td><td>Ionic apps</td><td>m.facebook.com</td></tr></table>`},
{id:654,part:"N",level:"Mid",category:"Manual",q:"How do you report mobile-specific bugs effectively?",a:`<h4>Mobile Bug Report Template</h4><pre><code>Title: [Android][Pixel 7] Payment form loses data on rotation\n\nEnvironment:\n  Device: Google Pixel 7\n  OS: Android 14\n  App Version: 3.2.1 (build 456)\n  Network: WiFi\n\nSteps to Reproduce:\n  1. Open Onsurity app\n  2. Navigate to Super Top-Up → Checkout\n  3. Fill card number: 5506 9004 8000 0008\n  4. Rotate phone to landscape\n\nExpected: Card number preserved after rotation\nActual: Card number field is empty after rotation\n\nSeverity: High\nPriority: P1 (payment flow affected)\n\nAttachments:\n  - Screenshot before rotation\n  - Screenshot after rotation\n  - Video recording (screen_recording.mp4)\n  - Device logs (adb logcat output)</code></pre>`},
{id:655,part:"N",level:"Mid",category:"Automation",q:"How do you handle mobile app context switching (native vs webview)?",a:`<h4>Context Switching in Hybrid Apps</h4><pre><code>// List available contexts\nSet&lt;String&gt; contexts = driver.getContextHandles();\n// Output: [NATIVE_APP, WEBVIEW_com.onsurity.app]\n\n// Switch to WebView\ndriver.context("WEBVIEW_com.onsurity.app");\n// Now use Selenium-like locators\ndriver.findElement(By.cssSelector(".payment-form")).click();\n\n// Switch back to Native\ndriver.context("NATIVE_APP");\n// Now use Appium locators\ndriver.findElement(By.accessibilityId("back_button")).click();</code></pre><p><strong>When to switch:</strong> When your app loads web content (payment pages, forms, webviews). The native context uses Appium locators; the webview context uses CSS/XPath like Selenium.</p>`}
);

{id:656,part:"O",level:"Senior",category:"Strategy",q:"How do you design a testing strategy for microservices architecture?",a:`<h4>Microservices Testing Pyramid</h4><pre><code>         ╱  E2E Tests  ╲         (few, slow, expensive)\n        ╱───────────────╲\n       ╱ Contract Tests  ╲       (API boundaries)\n      ╱───────────────────╲\n     ╱ Integration Tests   ╲     (service + DB/queue)\n    ╱───────────────────────╲\n   ╱    Component Tests      ╲   (single service)\n  ╱───────────────────────────╲\n ╱       Unit Tests            ╲ (most, fast, cheap)</code></pre><table><tr><th>Layer</th><th>Scope</th><th>Tools</th></tr><tr><td>Unit</td><td>Single function/class</td><td>JUnit, Mockito</td></tr><tr><td>Component</td><td>Single service isolated</td><td>Testcontainers, WireMock</td></tr><tr><td>Integration</td><td>Service + dependencies</td><td>Docker Compose, Testcontainers</td></tr><tr><td>Contract</td><td>API agreements between services</td><td>Pact, Spring Cloud Contract</td></tr><tr><td>E2E</td><td>Full user journey across services</td><td>Playwright, REST Assured</td></tr></table>`},
{id:657,part:"O",level:"Senior",category:"Contract",q:"What is contract testing with Pact? How does it work?",a:`<h4>Pact Contract Testing</h4><pre><code>Consumer-Driven Contract Flow:\n\n1. CONSUMER defines expectations\n   "When I call GET /users/101,\n    I expect { name: string, email: string }"\n\n2. Pact generates contract file (pact.json)\n\n3. PROVIDER verifies against contract\n   "My API does return { name, email } for GET /users/101"\n\n4. If provider breaks contract → test FAILS\n   before consumer deploys</code></pre><table><tr><th>Benefit</th><th>Description</th></tr><tr><td>No integration environment needed</td><td>Tests run independently</td></tr><tr><td>Fast feedback</td><td>Each service tests its contracts in CI</td></tr><tr><td>Prevents breaking changes</td><td>Provider can't remove fields consumers depend on</td></tr><tr><td>Documentation</td><td>Contracts serve as API documentation</td></tr></table>`},
{id:658,part:"O",level:"Senior",category:"Strategy",q:"How do you test event-driven systems (Kafka, RabbitMQ)?",a:`<h4>Event-Driven Testing Strategy</h4><pre><code>Producer Test:\n  1. Trigger action (e.g., member signup)\n  2. Verify message published to topic\n  3. Assert message schema and content\n\nConsumer Test:\n  1. Publish test message to topic\n  2. Verify consumer processes it\n  3. Assert side effects (DB update, API call)\n\nE2E Event Flow:\n  User Action → API → Kafka Topic → Consumer → DB\n  Verify: Each step completes within SLA</code></pre><table><tr><th>Test Type</th><th>Tool</th><th>What to Verify</th></tr><tr><td>Schema validation</td><td>Avro, JSON Schema</td><td>Message format correct</td></tr><tr><td>Consumer test</td><td>Testcontainers + Kafka</td><td>Consumer processes messages</td></tr><tr><td>Idempotency</td><td>Send duplicate messages</td><td>No duplicate processing</td></tr><tr><td>Dead letter queue</td><td>Send malformed message</td><td>Routed to DLQ, not lost</td></tr><tr><td>Ordering</td><td>Send ordered events</td><td>Processed in order</td></tr></table>`},
{id:659,part:"O",level:"Senior",category:"Tools",q:"How do you use Testcontainers for integration testing?",a:`<h4>Testcontainers for Microservices</h4><pre><code>@Testcontainers\npublic class UserServiceTest {\n\n    @Container\n    static PostgreSQLContainer postgres =\n        new PostgreSQLContainer("postgres:16")\n            .withDatabaseName("users_db")\n            .withUsername("test")\n            .withPassword("test");\n\n    @Container\n    static KafkaContainer kafka =\n        new KafkaContainer("confluentinc/cp-kafka:7.5.0");\n\n    @Container\n    static GenericContainer redis =\n        new GenericContainer("redis:7")\n            .withExposedPorts(6379);\n\n    @BeforeAll\n    static void setup() {\n        // Wire containers to app config\n        System.setProperty("DB_URL", postgres.getJdbcUrl());\n        System.setProperty("KAFKA_BROKER", kafka.getBootstrapServers());\n        System.setProperty("REDIS_HOST", redis.getHost());\n    }\n\n    @Test\n    void testUserCreation() {\n        // Test with real DB, Kafka, Redis\n        UserService service = new UserService();\n        User user = service.createUser("test@onsurity.com");\n        assertNotNull(user.getId());\n    }\n}</code></pre>`},
{id:660,part:"O",level:"Senior",category:"Strategy",q:"How do you test circuit breakers and fault tolerance?",a:`<h4>Circuit Breaker Testing</h4><pre><code>Circuit breaker states:\n  CLOSED → normal operation\n  OPEN   → failing, reject requests immediately\n  HALF-OPEN → testing recovery\n\nTest scenarios:\n\n1. Normal flow (CLOSED)\n   All requests succeed → circuit stays CLOSED\n\n2. Failure threshold (CLOSED → OPEN)\n   5 consecutive failures → circuit OPENS\n   → Next request gets fallback response\n\n3. Recovery (OPEN → HALF-OPEN → CLOSED)\n   After timeout → circuit goes HALF-OPEN\n   → If next request succeeds → CLOSED\n   → If fails → back to OPEN</code></pre><table><tr><th>Tool</th><th>Implementation</th></tr><tr><td>Resilience4j</td><td>Java circuit breaker library</td></tr><tr><td>Hystrix</td><td>Netflix (deprecated but common)</td></tr><tr><td>Envoy</td><td>Service mesh circuit breaking</td></tr></table>`},
{id:661,part:"O",level:"Senior",category:"Tools",q:"How do you use WireMock for service virtualization?",a:`<h4>WireMock — Mock External Services</h4><pre><code>// Start WireMock server\nWireMockServer wireMock = new WireMockServer(8089);\nwireMock.start();\n\n// Stub external payment API\nwireMock.stubFor(post(urlEqualTo("/api/payment/process"))\n    .withRequestBody(matchingJsonPath("$.amount"))\n    .willReturn(aResponse()\n        .withStatus(200)\n        .withBody("{\\"status\\":\\"success\\",\\"txn_id\\":\\"TXN123\\"}")\n        .withHeader("Content-Type", "application/json")));\n\n// Stub failure scenario\nwireMock.stubFor(post(urlEqualTo("/api/payment/process"))\n    .withRequestBody(matchingJsonPath("$.amount",\n        equalTo("0")))\n    .willReturn(aResponse()\n        .withStatus(400)\n        .withBody("{\\"error\\":\\"Invalid amount\\"}")));\n\n// Stub timeout\nwireMock.stubFor(get(urlEqualTo("/api/slow-service"))\n    .willReturn(aResponse()\n        .withFixedDelay(5000)  // 5 second delay\n        .withStatus(200)));</code></pre>`},
{id:662,part:"O",level:"Senior",category:"Strategy",q:"How do you test distributed transactions and saga patterns?",a:`<h4>Saga Pattern Testing</h4><pre><code>E-commerce Saga:\n  Order Service → Payment Service → Inventory Service\n\nHappy Path:\n  1. Create order (PENDING)\n  2. Process payment (SUCCESS)\n  3. Reserve inventory (SUCCESS)\n  4. Order → CONFIRMED\n\nCompensation (Payment fails):\n  1. Create order (PENDING)\n  2. Process payment (FAILED)\n  3. → Compensate: Cancel order\n  4. Order → CANCELLED\n\nCompensation (Inventory fails):\n  1. Create order (PENDING)\n  2. Process payment (SUCCESS)\n  3. Reserve inventory (FAILED)\n  4. → Compensate: Refund payment\n  5. → Compensate: Cancel order\n  6. Order → CANCELLED</code></pre><h4>Test Cases</h4><table><tr><th>Scenario</th><th>Verify</th></tr><tr><td>All steps succeed</td><td>Final state is CONFIRMED</td></tr><tr><td>Step 2 fails</td><td>Step 1 compensated</td></tr><tr><td>Step 3 fails</td><td>Steps 1+2 compensated</td></tr><tr><td>Compensation fails</td><td>Alert raised, manual intervention</td></tr></table>`},
// Mid Level
{id:663,part:"O",level:"Mid",category:"Basics",q:"What are microservices? How are they different from monoliths?",a:`<table><tr><th></th><th>Monolith</th><th>Microservices</th></tr><tr><td>Structure</td><td>One big application</td><td>Many small, independent services</td></tr><tr><td>Deployment</td><td>Deploy entire app</td><td>Deploy individual services</td></tr><tr><td>Database</td><td>Single shared database</td><td>Each service has its own DB</td></tr><tr><td>Scaling</td><td>Scale entire app</td><td>Scale individual services</td></tr><tr><td>Testing</td><td>One test suite</td><td>Test each service + integration</td></tr><tr><td>Failure</td><td>One bug can crash everything</td><td>Failure is isolated</td></tr></table><h4>Onsurity Example</h4><pre><code>Microservices:\n  User Service → manages profiles\n  Payment Service → handles payments\n  Insurance Service → manages plans\n  Notification Service → sends SMS/email</code></pre>`},
{id:664,part:"O",level:"Mid",category:"Basics",q:"What challenges does microservices architecture create for testing?",a:`<h4>Microservices Testing Challenges</h4><table><tr><th>Challenge</th><th>Why It's Hard</th><th>Solution</th></tr><tr><td>Service dependencies</td><td>Service A needs B, C running</td><td>Mocking, WireMock, Testcontainers</td></tr><tr><td>Data consistency</td><td>Each service has own DB</td><td>Event-driven sync, saga pattern</td></tr><tr><td>Network failures</td><td>Services communicate over network</td><td>Circuit breakers, retry logic</td></tr><tr><td>Environment setup</td><td>Running 10+ services locally</td><td>Docker Compose, Kubernetes</td></tr><tr><td>Distributed tracing</td><td>Request spans multiple services</td><td>Jaeger, Zipkin, correlation IDs</td></tr><tr><td>Version management</td><td>Service A v2 breaks Service B</td><td>Contract testing (Pact)</td></tr></table>`},
{id:665,part:"O",level:"Mid",category:"Basics",q:"What is an API gateway? How do you test it?",a:`<h4>API Gateway Testing</h4><pre><code>API Gateway sits in front of all microservices:\n\nClient → API Gateway → Service A\n                     → Service B\n                     → Service C</code></pre><table><tr><th>Test</th><th>What to Verify</th></tr><tr><td>Routing</td><td>/users → User Service, /payments → Payment Service</td></tr><tr><td>Authentication</td><td>Invalid token returns 401</td></tr><tr><td>Rate limiting</td><td>Exceeding limit returns 429</td></tr><tr><td>Load balancing</td><td>Requests distributed across instances</td></tr><tr><td>CORS</td><td>Cross-origin requests handled</td></tr><tr><td>Request transformation</td><td>Headers/body modified correctly</td></tr><tr><td>Caching</td><td>Cached responses returned for GET</td></tr></table>`},
{id:666,part:"O",level:"Mid",category:"Tools",q:"What is Docker Compose? How do you use it for testing?",a:`<h4>Docker Compose for Test Environment</h4><pre><code>version: '3.8'\nservices:\n  user-service:\n    image: onsurity/user-service:latest\n    ports: ["8081:8080"]\n    depends_on: [postgres, redis]\n\n  payment-service:\n    image: onsurity/payment-service:latest\n    ports: ["8082:8080"]\n    depends_on: [postgres, kafka]\n\n  postgres:\n    image: postgres:16\n    environment:\n      POSTGRES_DB: testdb\n      POSTGRES_USER: test\n      POSTGRES_PASSWORD: test\n\n  kafka:\n    image: confluentinc/cp-kafka:7.5.0\n\n  redis:\n    image: redis:7</code></pre><pre><code># Start all services\ndocker-compose up -d\n\n# Run tests\nmvn test -Dspring.profiles.active=docker\n\n# Cleanup\ndocker-compose down -v</code></pre>`},
{id:667,part:"O",level:"Mid",category:"Basics",q:"What is service virtualization? When do you need it?",a:`<h4>Service Virtualization</h4><pre><code>Problem:\n  Your service depends on Payment Gateway API.\n  The real Payment Gateway:\n  - Is slow to respond\n  - Has rate limits\n  - Costs money per call\n  - Is unstable in test env\n\nSolution: Mock it!\n  Your Service → Mock Payment API (WireMock)\n  - Instant responses\n  - Free\n  - Always available\n  - Can simulate errors</code></pre><table><tr><th>When to Mock</th><th>When to Use Real</th></tr><tr><td>Unit / Component tests</td><td>E2E / Staging tests</td></tr><tr><td>External services (payment, SMS)</td><td>Your own internal services</td></tr><tr><td>Testing error scenarios</td><td>Final pre-release validation</td></tr><tr><td>CI/CD pipeline (speed)</td><td>Performance testing</td></tr></table>`},
{id:668,part:"O",level:"Mid",category:"Basics",q:"What is distributed tracing? Why is it important for QA?",a:`<h4>Distributed Tracing</h4><pre><code>User clicks "Buy Plan":\n\nAPI Gateway → User Service → Payment Service → Insurance Service\n  trace-id: abc-123      abc-123         abc-123         abc-123\n  span-1: 10ms          span-2: 50ms    span-3: 200ms   span-4: 30ms\n\nTotal time: 290ms\nBottleneck: Payment Service (200ms)</code></pre><table><tr><th>Tool</th><th>Best For</th></tr><tr><td>Jaeger</td><td>Open source, Kubernetes</td></tr><tr><td>Zipkin</td><td>Simple, lightweight</td></tr><tr><td>Datadog APM</td><td>Enterprise, full monitoring</td></tr><tr><td>AWS X-Ray</td><td>AWS services</td></tr></table><p><strong>QA Value:</strong> When a test fails, use trace ID to find exactly which service caused the failure and how long each step took.</p>`}
);

{id:669,part:"P",level:"Senior",category:"Strategy",q:"Compare GitFlow vs Trunk-Based Development. Which is better for QA?",a:`<table><tr><th></th><th>GitFlow</th><th>Trunk-Based</th></tr><tr><td>Branches</td><td>main, develop, feature/*, release/*, hotfix/*</td><td>main + short-lived feature branches</td></tr><tr><td>Release</td><td>Via release branch</td><td>Directly from main</td></tr><tr><td>Feature flags</td><td>Not needed</td><td>Essential</td></tr><tr><td>CI/CD</td><td>Complex pipeline per branch</td><td>Simple pipeline, main always deployable</td></tr><tr><td>QA involvement</td><td>Test on release branch</td><td>Test on main continuously</td></tr><tr><td>Best for</td><td>Large teams, scheduled releases</td><td>Small teams, continuous deployment</td></tr></table><h4>QA Perspective</h4><pre><code>GitFlow: QA tests release branch before prod\n  PRO: Stable test environment\n  CON: Late bug discovery, merge conflicts\n\nTrunk-Based: QA tests main continuously\n  PRO: Early bug discovery, fast feedback\n  CON: Requires feature flags, more automation</code></pre>`},
{id:670,part:"P",level:"Senior",category:"Strategy",q:"How do you handle merge conflicts in test automation code?",a:`<h4>Preventing & Resolving Merge Conflicts in Test Code</h4><pre><code>Common conflict areas:\n1. Page Objects (multiple people editing same file)\n2. Test data files (adding entries at same location)\n3. Configuration files\n4. Shared utility methods\n\nPrevention strategies:\n1. One Page Object per feature/page\n2. Separate test data files per module\n3. Small, frequent PRs (< 200 lines)\n4. Communicate before editing shared utilities\n5. Use feature branches < 2 days old\n\nResolving conflicts:\n  git fetch origin\n  git rebase origin/main\n  # Fix conflicts in each file\n  git add resolved_file.java\n  git rebase --continue\n  # Run tests to verify\n  mvn test -pl module-name</code></pre>`},
{id:671,part:"P",level:"Senior",category:"Tools",q:"How do you use git bisect to find regression bugs?",a:`<h4>Git Bisect — Find the Bug-Introducing Commit</h4><pre><code># Start bisect\ngit bisect start\n\n# Mark current (broken) as bad\ngit bisect bad\n\n# Mark a known good commit\ngit bisect good v2.0.0  # or commit hash\n\n# Git checks out middle commit\n# Run your test:\nmvn test -Dtest=LoginTest\n\n# If test passes:\ngit bisect good\n\n# If test fails:\ngit bisect bad\n\n# Repeat until Git finds the exact commit:\n# "abc123 is the first bad commit"\n\n# Reset\ngit bisect reset</code></pre><h4>Automated Bisect</h4><pre><code># Fully automated!\ngit bisect start HEAD v2.0.0\ngit bisect run mvn test -Dtest=LoginTest\n# Git finds the exact commit automatically!</code></pre>`},
{id:672,part:"P",level:"Senior",category:"Strategy",q:"How do you set up git hooks for test quality gates?",a:`<h4>Git Hooks for QA</h4><pre><code># .husky/pre-commit\n#!/bin/sh\necho "Running lint check..."\nnpx eslint src/ --quiet\n\necho "Running unit tests..."\nnpm test -- --watchAll=false\n\necho "Checking test coverage..."\nnpm test -- --coverage --watchAll=false\nMIN_COVERAGE=80\nCOVERAGE=$(cat coverage/coverage-summary.json |\n  jq '.total.lines.pct')\nif (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then\n  echo "Coverage $COVERAGE% is below $MIN_COVERAGE%"\n  exit 1\nfi</code></pre><table><tr><th>Hook</th><th>When</th><th>Use For</th></tr><tr><td>pre-commit</td><td>Before commit</td><td>Lint, format, unit tests</td></tr><tr><td>pre-push</td><td>Before push</td><td>Full test suite, coverage</td></tr><tr><td>commit-msg</td><td>After writing message</td><td>Enforce commit message format</td></tr><tr><td>post-merge</td><td>After merge</td><td>Run npm install if package.json changed</td></tr></table>`},
{id:673,part:"P",level:"Senior",category:"Strategy",q:"How do you manage test code in a monorepo vs polyrepo?",a:`<table><tr><th></th><th>Monorepo</th><th>Polyrepo</th></tr><tr><td>Structure</td><td>All services + tests in one repo</td><td>Each service has its own repo</td></tr><tr><td>Test sharing</td><td>Easy (shared libraries)</td><td>Hard (need packages/submodules)</td></tr><tr><td>CI/CD</td><td>Complex (build only changed)</td><td>Simple (each repo independent)</td></tr><tr><td>Dependencies</td><td>Managed centrally</td><td>Each repo manages its own</td></tr><tr><td>Code review</td><td>Can see full picture</td><td>Isolated to one service</td></tr><tr><td>Tools</td><td>Nx, Bazel, Turborepo</td><td>Standard Git</td></tr></table><h4>QA in Monorepo</h4><pre><code>monorepo/\n├── services/\n│   ├── user-service/\n│   ├── payment-service/\n│   └── notification-service/\n├── test-common/    ← shared test utilities\n│   ├── helpers/\n│   ├── fixtures/\n│   └── base-test.java\n└── e2e-tests/      ← cross-service E2E\n    ├── login-flow/\n    └── purchase-flow/</code></pre>`},
{id:674,part:"P",level:"Senior",category:"Tools",q:"How do you use git for effective code review of test PRs?",a:`<h4>Test PR Code Review Checklist</h4><table><tr><th>Check</th><th>Question</th></tr><tr><td>Naming</td><td>Are test names descriptive? (testLoginWithInvalidOTP)</td></tr><tr><td>Coverage</td><td>Are positive, negative, and edge cases covered?</td></tr><tr><td>Data</td><td>Is test data parameterized, not hardcoded?</td></tr><tr><td>Independence</td><td>Can tests run in any order?</td></tr><tr><td>Cleanup</td><td>Does test clean up after itself?</td></tr><tr><td>Assertions</td><td>Are assertions specific and meaningful?</td></tr><tr><td>DRY</td><td>Is there code duplication that should be extracted?</td></tr><tr><td>Flakiness</td><td>Any race conditions or timing dependencies?</td></tr></table><h4>Git Commands for Review</h4><pre><code># Review specific file changes\ngit diff main..feature/add-login-tests -- src/test/\n\n# See all test files changed\ngit diff main..feature/add-login-tests --name-only | grep Test\n\n# Check commit history of a test\ngit log --oneline -10 src/test/LoginTest.java</code></pre>`},
// Mid Level
{id:675,part:"P",level:"Mid",category:"Basics",q:"What are the essential Git commands every QA engineer should know?",a:`<h4>Git Commands for QA</h4><table><tr><th>Command</th><th>What It Does</th><th>When to Use</th></tr><tr><td><code>git clone</code></td><td>Download repo</td><td>First time setup</td></tr><tr><td><code>git checkout -b branch-name</code></td><td>Create new branch</td><td>Start new work</td></tr><tr><td><code>git status</code></td><td>See changed files</td><td>Before committing</td></tr><tr><td><code>git add .</code></td><td>Stage all changes</td><td>Preparing to commit</td></tr><tr><td><code>git commit -m "msg"</code></td><td>Save changes</td><td>After completing a task</td></tr><tr><td><code>git push</code></td><td>Upload to remote</td><td>Share your work</td></tr><tr><td><code>git pull</code></td><td>Download latest</td><td>Start of day</td></tr><tr><td><code>git log --oneline</code></td><td>View commit history</td><td>Finding a specific change</td></tr><tr><td><code>git diff</code></td><td>See changes</td><td>Review before commit</td></tr><tr><td><code>git stash</code></td><td>Save work temporarily</td><td>Need to switch branches</td></tr></table>`},
{id:676,part:"P",level:"Mid",category:"Basics",q:"What is branching? How do QA engineers work with branches?",a:`<h4>Branching for QA</h4><pre><code>Common workflow:\n\nmain (production)\n│\n├── develop (integration)\n│   │\n│   ├── feature/login-tests (your work)\n│   │   └── Add 5 new login test cases\n│   │\n│   ├── feature/payment-tests (colleague)\n│   │   └── Add payment flow tests\n│   │\n│   └── bugfix/fix-flaky-test\n│       └── Fix timing issue in search test\n│\n└── release/v3.0 (QA testing before release)</code></pre><h4>QA Branch Naming Convention</h4><pre><code>feature/QA-123-add-login-tests\nbugfix/QA-456-fix-flaky-search-test\nchore/update-test-dependencies</code></pre>`},
{id:677,part:"P",level:"Mid",category:"Basics",q:"What is a merge conflict? How do you resolve it?",a:`<h4>Merge Conflict Resolution</h4><pre><code>Scenario:\nYou and a colleague both edited LoginTest.java\n\nConflict markers in file:\n&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD (your changes)\n    assertEquals("Login successful", result);\n=======\n    assertEquals("Welcome back!", result);\n&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/colleague-changes\n\nSteps to resolve:\n1. Open conflicted file\n2. Decide which change to keep (or combine)\n3. Remove conflict markers (&lt;&lt;&lt;, ===, &gt;&gt;&gt;)\n4. Save file\n5. git add LoginTest.java\n6. git commit -m "Resolve merge conflict in LoginTest"\n7. Run tests to make sure nothing broke!</code></pre>`},
{id:678,part:"P",level:"Mid",category:"Basics",q:"What is the difference between git merge and git rebase?",a:`<table><tr><th></th><th>Merge</th><th>Rebase</th></tr><tr><td>What it does</td><td>Creates a merge commit</td><td>Replays your commits on top of latest</td></tr><tr><td>History</td><td>Preserves all commits (messy)</td><td>Linear history (clean)</td></tr><tr><td>Safety</td><td>Safe (non-destructive)</td><td>Rewrites history (avoid on shared branches)</td></tr><tr><td>Best for</td><td>Merging feature → main</td><td>Updating feature with latest main</td></tr></table><pre><code># Merge workflow\ngit checkout main\ngit merge feature/login-tests\n\n# Rebase workflow\ngit checkout feature/login-tests\ngit rebase main\n# Fix any conflicts\ngit push --force-with-lease  # needed after rebase</code></pre><p><strong>Rule:</strong> Never rebase shared branches (main, develop). Only rebase your own feature branches.</p>`},
{id:679,part:"P",level:"Mid",category:"Tools",q:"What is .gitignore? What should QA projects ignore?",a:`<h4>.gitignore for Test Automation Projects</h4><pre><code># IDE files\n.idea/\n*.iml\n.vscode/\n\n# Build output\ntarget/\nbuild/\nout/\n\n# Test reports (generated, not source)\ntest-output/\nallure-results/\nallure-report/\nextent-reports/\nscreenshots/\nvideos/\n\n# Dependencies\nnode_modules/\n\n# Environment files\n.env\n.env.local\ntestdata-*-prod.json  # production test data\n\n# OS files\n.DS_Store\nThumbs.db\n\n# Logs\n*.log</code></pre><p><strong>Key:</strong> Never commit credentials, API keys, or production test data to Git!</p>`},
{id:680,part:"P",level:"Mid",category:"Basics",q:"What is a Pull Request (PR)? How does QA create and review PRs?",a:`<h4>PR Workflow for QA</h4><pre><code>Creating a PR:\n1. Create branch: git checkout -b feature/add-checkout-tests\n2. Write tests, commit, push\n3. Open PR on GitHub\n4. Fill in PR template:\n   - What tests were added?\n   - What scenarios are covered?\n   - How to run the tests?\n5. Request review from team\n6. Address review comments\n7. PR approved → Merge</code></pre><h4>PR Template for Test Code</h4><pre><code>## What\nAdded 10 test cases for checkout flow\n\n## Test Coverage\n- Happy path: card payment ✅\n- UPI payment ✅\n- Invalid card number ✅\n- Expired card ✅\n\n## How to Run\nmvn test -Dtest=CheckoutTest\n\n## Checklist\n- [ ] Tests pass locally\n- [ ] No hardcoded test data\n- [ ] Tests are independent</code></pre>`},
{id:681,part:"P",level:"Mid",category:"Tools",q:"How do you cherry-pick commits? When is it useful for QA?",a:`<h4>Git Cherry-Pick</h4><pre><code># Pick a specific commit from another branch\ngit cherry-pick abc123\n\n# Pick multiple commits\ngit cherry-pick abc123 def456\n\n# Pick without committing (stage only)\ngit cherry-pick --no-commit abc123</code></pre><h4>QA Use Cases</h4><table><tr><th>Scenario</th><th>Use</th></tr><tr><td>Hotfix needs a specific test</td><td>Cherry-pick test from develop to hotfix branch</td></tr><tr><td>Test fix on wrong branch</td><td>Cherry-pick to correct branch</td></tr><tr><td>Backport test to old release</td><td>Cherry-pick from main to release/v2.0</td></tr></table>`},
{id:682,part:"P",level:"Mid",category:"Basics",q:"What is git stash? How do you use it?",a:`<h4>Git Stash — Save Work Temporarily</h4><pre><code># You're working on test A, but need to fix test B urgently\n\n# Save current work\ngit stash save "WIP: checkout test"\n\n# Switch to fix urgent issue\ngit checkout hotfix/fix-login-test\n# ... fix the issue, commit, push ...\n\n# Come back to your work\ngit checkout feature/checkout-test\ngit stash pop  # restore saved work\n\n# List all stashes\ngit stash list\n\n# Apply specific stash\ngit stash apply stash@{1}\n\n# Clear all stashes\ngit stash clear</code></pre><p><strong>Tip:</strong> Always name your stashes! <code>git stash save "description"</code> makes it easy to find later.</p>`}
);
